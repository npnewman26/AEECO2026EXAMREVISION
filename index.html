<body>
<title>Year 11 Economics Class Edition</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: class edition. Forest-green topic index on the left, one topic at a time on the right (Learn / Practise). Forest, emerald, mint and copper. Collapses to a green top bar on phones. */
:root {
  --navy: #0f3d2e; --royal: #1e7b5a; --sky: #3fae84; --gold: #c26a2e; --mint: #8fd3b6; --copper-hi: #f0a46a; --on-accent: #ffffff;
  --paper: #f6f5f0; --card: #ffffff; --ink: #17261f; --muted: #5b6a62; --rule: #dfe3dc; --rule-strong: #bcc5bb;
  --accent: #1e7b5a; --accent-ink: #ffffff; --accent-soft: #e4f2ea; --head: #0f3d2e; --eyebrow: #a4521c;
  --side-bg: #0f3d2e; --side-ink: #ffffff; --side-muted: #a9c4b6; --side-hover: rgba(255, 255, 255, .08); --side-on: #8fd3b6; --side-on-ink: #0f3d2e;
  --good: #1f7a4a; --good-soft: #e3f3ea; --bad: #b3402c; --bad-soft: #f9e6e2;
  --fig-axis: #9aa69e; --fig-muted: #c6cfc8; --fig-tint: #eef3ee; --shadow: 0 1px 2px rgba(15, 61, 46, .06), 0 4px 14px rgba(15, 61, 46, .07);
  --display: "EB Garamond", Garamond, "Times New Roman", serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Source Code Pro", ui-monospace, Menlo, monospace;
  --cds-text-primary: var(--ink); --cds-text-secondary: var(--muted); --cds-chart-axis: var(--fig-axis);
  --cds-chart-categorical-1: var(--royal); --cds-chart-muted: var(--fig-muted); --cds-chart-grid: var(--rule);
  --cds-chart-reference: var(--muted); --cds-chart-reference-tint: var(--fig-tint);
  --cds-chart-status-good: var(--good); --cds-chart-status-critical: var(--bad);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0c1712; --card: #12211a; --ink: #e5eee8; --muted: #9db0a5; --rule: #22382d; --rule-strong: #345242;
  --accent: #6fcf9f; --accent-ink: #08251a; --accent-soft: #163428; --head: #ffffff; --eyebrow: #e59a5f;
  --side-bg: #07120d; --side-muted: #8fae9e; --side-hover: rgba(255, 255, 255, .06);
  --good: #5cc48b; --good-soft: #143425; --bad: #f08a76; --bad-soft: #3a1e1a; --gold: #e08a4c;
  --fig-axis: #6c8478; --fig-muted: #3a5446; --fig-tint: #18301f; --shadow: none; --royal: #5cc293; --on-accent: #08251a; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0c1712; --card: #12211a; --ink: #e5eee8; --muted: #9db0a5; --rule: #22382d; --rule-strong: #345242;
  --accent: #6fcf9f; --accent-ink: #08251a; --accent-soft: #163428; --head: #ffffff; --eyebrow: #e59a5f;
  --side-bg: #07120d; --side-muted: #8fae9e; --side-hover: rgba(255, 255, 255, .06);
  --good: #5cc48b; --good-soft: #143425; --bad: #f08a76; --bad-soft: #3a1e1a; --gold: #e08a4c;
  --fig-axis: #6c8478; --fig-muted: #3a5446; --fig-tint: #18301f; --shadow: none; --royal: #5cc293; --on-accent: #08251a; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16.5px; line-height: 1.6 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--side-bg) }
a { color: var(--accent) }
a:hover { color: var(--sky) }
button { font: inherit; color: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px }
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; line-height: 1.12; margin: 0; color: var(--head) }
h4 { font-family: var(--body); font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--eyebrow); margin: 24px 0 8px }
.shell { display: grid; grid-template-columns: 282px minmax(0, 1fr); min-height: 100vh }
nav.side { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; background: var(--side-bg); color: var(--side-ink); padding-block: 26px 32px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 18px }
.brand { display: grid; gap: 4px; margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px solid rgba(255, 255, 255, .14); text-decoration: none; color: var(--side-ink) }
.brand:hover { color: var(--side-ink) }
.brand b { font-family: var(--display); font-size: 25px; font-weight: 600; line-height: 1.05 }
.brand span { font-size: 12.5px; color: var(--side-muted); letter-spacing: .02em }
.brand::after { content: ""; width: 34px; height: 3px; background: var(--gold); border-radius: 2px; margin-top: 8px }
.navgroup { margin-top: 18px }
.navgroup > div { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--side-muted); margin: 0 10px 6px }
.navlink { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 6px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: .3em; text-decoration: none; color: var(--side-ink); font-size: 14.5px; line-height: 1.3 }
.navlink:hover { background: var(--side-hover); color: var(--side-ink) }
.navlink[aria-current="page"] { background: var(--side-on); color: var(--side-on-ink); font-weight: 600 }
.navlink .num { font-family: var(--mono); font-size: 12px; opacity: .7 }
.navlink .pct { font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--gold) }
.navlink[aria-current="page"] .pct { color: var(--side-on-ink) }
.picker { display: none }
main { min-width: 0; padding-block: 0 80px; padding-left: max(16px, 4vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 4vw) }
.wrap { max-width: 880px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; padding-top: 34px }
.hero { background: var(--navy); color: #fff; border-radius: 10px; padding: 30px 30px 28px; display: grid; gap: 10px; position: relative; overflow: hidden }
.hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; border: 28px solid rgba(143, 211, 182, .16) }
.hero h1 { color: #fff; font-size: clamp(34px, 5vw, 46px) }
.hero .eyebrow { color: var(--copper-hi) }
.hero p { margin: 0; color: #d3e6dc; max-width: 60ch; font-size: 17px; position: relative; z-index: 1 }
.eyebrow { font-family: var(--body); font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--eyebrow) }
.pagehead { display: grid; gap: 8px; padding-bottom: 18px; border-bottom: 1px solid var(--rule) }
.pagehead h1 { font-size: clamp(32px, 4.4vw, 42px) }
.lead { font-size: 18px; color: var(--muted); max-width: 66ch; margin: 0 }
.tabs { display: flex; gap: 6px }
.tabs button { border: 1px solid var(--rule-strong); background: var(--card); padding: 8px 18px; border-radius: 99px; color: var(--muted); font-weight: 600; font-size: 15px }
.tabs button:hover { border-color: var(--accent); color: var(--accent) }
.tabs button[aria-selected="true"] { background: var(--navy); border-color: var(--navy); color: #fff }
.tabs button[aria-selected="true"] .score { color: var(--copper-hi) }
.prose { max-width: 70ch }
.prose ul, .prose ol { padding-left: 22px; margin: 8px 0 }
.prose li { margin: 6px 0 }
.prose li::marker { color: var(--royal) }
.formula { font-family: var(--mono); font-size: 14.5px; background: var(--accent-soft); border-radius: .3em; padding: 12px 16px; overflow-x: auto; color: var(--ink) }
.tw { overflow-x: auto; margin: 12px 0; background: var(--card); border-radius: 8px; box-shadow: var(--shadow); border: 1px solid var(--rule) }
table { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule); vertical-align: top }
tr:last-child td { border-bottom: 0 }
th { font-weight: 700; font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--head); background: var(--accent-soft); border-bottom: 0 }
figure { margin: 8px 0; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 18px; box-shadow: var(--shadow) }
figure .fig { overflow-x: auto }
figure svg { display: block; width: 100%; min-width: 520px; height: auto }
figcaption { font-size: 13px; color: var(--muted); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--rule) }
.worked { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 4px 22px 16px; box-shadow: var(--shadow); max-width: none }
.worked h4 { color: var(--royal) }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-top: 14px }
.sec-head h3 { font-size: 26px }
.score { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums }
.q { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 20px; display: grid; gap: 14px; min-width: 0; box-shadow: var(--shadow) }
.q .stem { display: flex; gap: 12px; justify-content: space-between; align-items: baseline }
.q .stem p { margin: 0 }
.q .stem b { color: var(--head); font-weight: 700 }
.marks { font-family: var(--mono); font-size: 12px; color: var(--eyebrow); white-space: nowrap; font-weight: 600 }
.opts { display: grid; gap: 8px }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: start; text-align: left; border: 1px solid var(--rule); background: var(--paper); border-radius: .3em; padding: 10px 12px }
.opt:hover:not([disabled]) { border-color: var(--sky); background: var(--accent-soft) }
.opt .l { font-family: var(--mono); font-weight: 600; color: var(--royal) }
.opt[disabled] { cursor: default }
.opt.right { border-color: var(--good); background: var(--good-soft) }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft) }
.opt.chosen { border-color: var(--royal); background: var(--accent-soft) }
.fb { font-size: 15px; padding: 11px 14px; border-radius: .3em }
.fb.good { background: var(--good-soft); color: var(--ink); border-left: 3px solid var(--good) }
.fb.bad { background: var(--bad-soft); color: var(--ink); border-left: 3px solid var(--bad) }
.fb.info { background: var(--accent-soft); color: var(--ink) }
.stim { background: var(--accent-soft); border-radius: 10px; padding: 14px 18px; min-width: 0 }
.stim > b { font-family: var(--display); font-size: 19px; color: var(--head) }
.stim p { margin: 6px 0 }
.stim .tw { box-shadow: none }
textarea { width: 100%; min-height: 120px; resize: vertical; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--rule-strong); border-radius: .3em; padding: 11px 12px }
textarea:focus, .calc-row input:focus { border-color: var(--sky); outline: none; box-shadow: 0 0 0 3px rgba(63, 174, 132, .25) }
.calc-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end }
.calc-row label { display: grid; gap: 4px; font-size: 13.5px; color: var(--muted) }
.calc-row input { font-family: var(--mono); font-size: 15px; width: 180px; max-width: 100%; padding: 9px 11px; border: 1px solid var(--rule-strong); border-radius: .3em; background: var(--paper); color: var(--ink) }
.calc-row input.ok { border-color: var(--good); background: var(--good-soft) }
.calc-row input.no { border-color: var(--bad); background: var(--bad-soft) }
.btn { border: 1px solid var(--rule-strong); background: var(--card); border-radius: .3em; padding: 9px 16px; font-weight: 700; font-size: 15px }
.btn:hover { border-color: var(--sky); color: var(--accent) }
.btn.primary { background: var(--navy); color: #fff; border-color: var(--navy) }
.btn.primary:hover { background: var(--sky); border-color: var(--sky); color: var(--navy) }
.btn.quiet { border-color: transparent; background: none; color: var(--muted); padding-inline: 6px; font-weight: 600 }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.key { display: grid; gap: 8px; border-top: 1px solid var(--rule); padding-top: 14px }
.key label { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: start; font-size: 15px; cursor: pointer }
.key input { margin-top: 4px; accent-color: var(--royal); width: 16px; height: 16px }
.key .m { font-family: var(--mono); font-size: 12px; color: var(--eyebrow); font-weight: 600 }
.key .tot { font-family: var(--mono); font-size: 14px; text-align: right; color: var(--head) }
.note { font-size: 14px; color: var(--muted) }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px }
.tcard { display: grid; gap: 8px; align-content: start; text-decoration: none; color: inherit; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; box-shadow: var(--shadow) }
.tcard:hover { border-color: var(--sky); color: inherit }
.tcard .num { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--eyebrow) }
.tcard b { font-family: var(--display); font-size: 21px; font-weight: 600; line-height: 1.15; color: var(--head) }
.tcard.exam { background: var(--navy); border-color: var(--navy) }
.tcard.exam b { color: #fff }
.tcard.exam .num { color: var(--copper-hi) }
.tcard.exam .meta { color: #bcd6c9 }
.bar { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--royal), var(--sky)) }
.tcard .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.examtable td:last-child, .examtable th:last-child { text-align: right }
.timer { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--navy); color: #fff; border-radius: 10px; padding: 12px 18px; box-shadow: var(--shadow) }
.timer .clock { font-family: var(--mono); font-size: 22px; font-variant-numeric: tabular-nums; color: var(--copper-hi) }
.timer .btn { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .4) }
.timer .btn:hover { background: var(--sky); color: var(--navy); border-color: var(--sky) }
.choice { display: flex; gap: 8px; flex-wrap: wrap }
.choice button[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy) }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.summary div { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; box-shadow: var(--shadow) }
.summary div:last-child { background: var(--navy); border-color: var(--navy) }
.summary div:last-child span { color: #bcd6c9 }
.summary div:last-child b { color: var(--copper-hi) }
.summary span { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.summary b { font-family: var(--mono); font-size: 22px; font-variant-numeric: tabular-nums; color: var(--head) }
footer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 14px }
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr) }
  nav.side { display: none }
  .picker { display: flex; gap: 10px; align-items: center; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--side-bg); color: #fff; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .picker b { font-family: var(--display); font-size: 20px; white-space: nowrap }
  .picker select { flex: 1; min-width: 0; font: inherit; padding: 8px; border-radius: .3em; border: 0; background: #fff; color: #0f3d2e }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .wrap { padding-top: 20px }
  .hero { padding: 24px 20px }
}
@media (prefers-reduced-motion: no-preference) { .q, .tcard, .btn, .opt { transition: border-color .15s, background-color .15s, color .15s } }

.prose h5 { font-family: var(--display); font-size: 20px; font-weight: 600; color: var(--head); margin: 22px 0 6px }
.prose h5:first-child { margin-top: 0 }
/* deep dives */
.dd-head { align-items: center; flex-wrap: wrap; gap: 8px }
.dd-tools { display: flex; gap: 6px }
.btn.small { padding: 5px 11px; font-size: 13px }
.dd-intro { color: var(--muted); margin: -4px 0 4px; max-width: 65ch }
details.dd { min-width: 0; max-width: 100%; background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--sky); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden }
details.dd[open] { border-left-color: var(--gold) }
details.dd > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 14px 16px; font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--head) }
details.dd > summary::-webkit-details-marker { display: none }
details.dd > summary:hover { background: var(--accent-soft) }
details.dd > summary:focus-visible { outline: 2px solid var(--sky); outline-offset: -2px }
.dd-n { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--eyebrow); min-width: 2.6em }
.dd-t { flex: 1; min-width: 0; text-wrap: balance }
.dd-ic { color: var(--muted); font-size: 15px }
.dd-done { color: var(--good); font-weight: 700; font-size: 16px }
.dd-done.miss { color: var(--muted) }
.dd-chev { width: 10px; height: 10px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: -4px 4px 0 }
details.dd[open] .dd-chev { transform: rotate(-135deg); margin-top: 4px }
.dd-body { padding: 4px 18px 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; border-top: 1px solid var(--rule) }
.dd-body > .prose { max-width: 70ch }
.dd-body figure { box-shadow: none; margin: 0 }
.dd-lab { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--eyebrow); margin-bottom: 4px }
.dd-box { border-radius: .4em; padding: 12px 16px; max-width: 70ch }
.dd-box p { margin: 0 }
.dd-box ul { margin: 0; padding-left: 1.2em }
.dd-box.case { background: var(--accent-soft); border-left: 3px solid var(--royal) }
.dd-box.warn { background: color-mix(in srgb, var(--gold) 12%, var(--card)); border-left: 3px solid var(--gold) }
.dd-check .q { box-shadow: none; margin: 0 }
.dd-src { font-size: 14px; color: var(--muted) }
.dd-src ul { margin: 2px 0 0; padding-left: 1.2em }
.dd-src a { color: var(--accent) }
@media (max-width: 520px) { .dd-body { padding: 4px 12px 14px } details.dd > summary { font-size: 17px; padding: 12px } }

<script>
const DATA = {"topics":[{"id":"t1","unit":1,"n":1,"title":"Introduction to economics","lead":"Scarcity forces choice, and every choice has an opportunity cost. The PPF is the model that shows this.","notes":"<ul><li><b>Economics</b> studies how society allocates scarce resources to satisfy unlimited wants.</li><li><b>Microeconomics</b> studies individual markets, firms and consumers. <b>Macroeconomics</b> studies the whole economy: growth, inflation, unemployment.</li><li><b>The economic problem:</b> wants are unlimited but resources are scarce. Every society must decide what to produce, how to produce it and for whom.</li><li><b>Factors of production:</b> land (rent), labour (wages), capital (interest) and enterprise (profit).</li><li><b>Opportunity cost:</b> the value of the next best alternative forgone when a choice is made.</li><li><b>Economic decision-making:</b> identify the problem, gather information, list alternatives, weigh costs and benefits, decide, then review. At the margin, keep doing an activity while marginal benefit (MB) ≥ marginal cost (MC).</li><li><b>Economic models</b> simplify reality so one relationship can be studied. They assume <i>ceteris paribus</i> (all other things held constant).</li><li><b>Market economy:</b> private ownership of resources, the price mechanism allocates resources, the profit motive, consumer sovereignty, competition and a limited role for government. Australia is a <i>modified</i> (mixed) market economy.</li></ul><h5>Resources and enterprise</h5><ul><li>For something to count as a usable resource it must be <b>known</b> (we know it exists), <b>accessible</b> (we can realistically reach it now), have <b>capacity</b> (it can be used in production) and <b>usefulness</b> (it helps satisfy a want).</li><li><b>Enterprise</b> is a special kind of labour. Entrepreneurs make the <b>decisions</b>, drive <b>innovation</b> (new products, better methods) and <b>bear the risk</b>. Risk-bearing is the key difference from ordinary labour.</li></ul><h5>Economics as a social science</h5><ul><li>Economists observe, form hypotheses and test them, like scientists. But people change their behaviour, so testing is hard. That is why models rely on <i>ceteris paribus</i>.</li><li><b>Positive statements</b> can be tested against facts: \"Unemployment was 4.4% in June 2026.\"</li><li><b>Normative statements</b> are value judgements that can’t be tested: \"Unemployment benefits should be higher.\" Look for words like <i>should</i>, <i>ought</i>, <i>fair</i>, <i>too high</i>.</li></ul>","figs":[["ppf","Figure 1.1 · Production Possibility Frontier","<ul><li><b>On the curve (A, B):</b> efficient.</li><li><b>Inside (C):</b> resources unemployed or underused.</li><li><b>Outside (D):</b> unattainable with current resources and technology.</li><li><b>Concave shape:</b> resources are not equally suited to both goods, so opportunity cost rises.</li><li><b>Outward shift:</b> more resources, better technology or higher productivity. This is economic growth.</li></ul>"],["c_hospitals","Thinking at the margin with a government decision.",""],["c_ppfpoints","Reading points on a PPF.",""],["c_ppfcap","Why investment today means growth tomorrow.",""]],"worked":"<p>A WA farm can produce these combinations of wheat and canola.</p><div class=\"tw\"><table><thead><tr><th>Combination</th><th>Wheat (t)</th><th>Canola (t)</th></tr></thead><tbody><tr><td>A</td><td>0</td><td>100</td></tr><tr><td>B</td><td>20</td><td>95</td></tr><tr><td>C</td><td>40</td><td>85</td></tr><tr><td>D</td><td>60</td><td>65</td></tr><tr><td>E</td><td>80</td><td>35</td></tr><tr><td>F</td><td>100</td><td>0</td></tr></tbody></table></div><p><b>Question:</b> Calculate the opportunity cost of moving from C to D.</p><ol><li>Wheat gained = 60 − 40 = 20 tonnes.</li><li>Canola forgone = 85 − 65 = 20 tonnes.</li><li>Opportunity cost per tonne of wheat = 20 ÷ 20 = <b>1 tonne of canola</b>.</li></ol><p>From A to B each tonne of wheat cost only 0.25 t of canola; from E to F it costs 1.75 t. Rising opportunity cost is why the PPF bows outward.</p>","mcq":[{"q":"Opportunity cost is best defined as:","o":["the money price paid for a good.","the total cost of all alternatives available.","the value of the next best alternative forgone.","the cost of producing one more unit of a good."],"a":2,"why":"Opportunity cost is only the single next best alternative given up, not every alternative or the money price."},{"q":"Which of the following is a macroeconomic issue?","o":["The price of avocados falls after a strong harvest.","Australia's unemployment rate rises over a year.","A café raises the price of coffee.","A mining firm hires 50 more workers."],"a":1,"why":"The national unemployment rate describes the whole economy. The other options are individual markets or firms."},{"q":"A point inside an economy's PPF shows that:","o":["the economy is producing at maximum efficiency.","the combination cannot be produced.","some resources are unemployed or used inefficiently.","opportunity cost is zero for both goods."],"a":2,"why":"Inside the frontier, more of both goods could be made, so some resources are idle or misused."},{"q":"Which of the following would shift Australia's PPF outward?","o":["A fall in the unemployment rate.","An improvement in production technology.","A rise in the price of consumer goods.","A shift of workers from manufacturing to services."],"a":1,"why":"Better technology raises maximum possible output. Lower unemployment moves the economy towards the existing PPF, not beyond it."},{"q":"Which of the following is <b>not</b> a characteristic of a market economy?","o":["Private ownership of resources.","The profit motive.","A central agency sets prices and output.","Consumer sovereignty."],"a":2,"why":"Central planning of prices and output describes a command economy."},{"q":"A resource that exists but cannot yet be reached economically fails which test?","o":["Known","Accessible","Useful","Capacity"],"a":1,"why":"It cannot realistically be reached now, so it is not accessible."}],"di":{"stim":"<p>An economy produces two goods using all of its resources.</p><div class=\"tw\"><table><thead><tr><th>Combination</th><th>Solar panels ('000)</th><th>Batteries ('000)</th></tr></thead><tbody><tr><td>V</td><td>0</td><td>60</td></tr><tr><td>W</td><td>10</td><td>56</td></tr><tr><td>X</td><td>20</td><td>48</td></tr><tr><td>Y</td><td>30</td><td>34</td></tr><tr><td>Z</td><td>40</td><td>0</td></tr></tbody></table></div>","items":[{"t":"calc","q":"Calculate the opportunity cost of increasing solar panel output from 10 000 to 20 000 units.","marks":2,"inputs":[{"label":"Batteries forgone per panel","ans":0.8,"tol":0.01}],"work":"Panels rise by 10 000; batteries fall from 56 000 to 48 000 (8000). 8000 ÷ 10 000 = 0.8 batteries per panel."},{"t":"text","q":"Explain why the opportunity cost of solar panels rises as more are produced.","marks":3,"key":[["Resources are not equally suited to producing both goods",1],["As panel output rises, resources better suited to batteries are switched over",1],["So more batteries are given up per extra panel (0.4, 0.8, 1.4, 3.4), giving the PPF a concave shape",1]]},{"t":"text","q":"The economy produces 20 000 panels and 40 000 batteries. Identify where this point lies relative to the PPF and outline what it indicates.","marks":2,"key":[["Inside the PPF (it could make 48 000 batteries at 20 000 panels)",1],["Resources are unemployed or used inefficiently",1]]},{"t":"text","diagram":true,"q":"A breakthrough in battery technology raises battery output but not solar panel production. Using a PPF diagram, demonstrate the effect on the economy.","marks":4,"key":[["Axes labelled",1],["Original PPF drawn",1],["PPF pivots outward on the battery axis; the panel intercept (40 000) stays the same",1],["Explains that more batteries can be made at every level of panel output (economic growth)",1]]}]},"sa":[{"label":"Question 1","stim":"<p>A café owner is deciding how many extra hours to open after 5 pm.</p><div class=\"tw\"><table><thead><tr><th>Extra hour</th><th>Marginal benefit ($)</th><th>Marginal cost ($)</th></tr></thead><tbody><tr><td>1st</td><td>180</td><td>90</td></tr><tr><td>2nd</td><td>150</td><td>110</td></tr><tr><td>3rd</td><td>120</td><td>120</td></tr><tr><td>4th</td><td>90</td><td>140</td></tr></tbody></table></div>","items":[{"t":"calc","q":"How many extra hours should the café open?","marks":3,"inputs":[{"label":"Extra hours","ans":3,"tol":0}],"work":"Hours 1–3 have MB ≥ MC (hour 3: MB = MC = $120). Hour 4 has MC $140 > MB $90, so it would reduce net benefit. Net benefit peaks at $130 after 3 hours.","key":[["States 3 extra hours",1],["For hours 1–3, MB ≥ MC so each adds to net benefit",1],["The 4th hour has MC > MB, so net benefit falls",1]]},{"t":"text","q":"Outline the opportunity cost to the owner of opening for those extra hours.","marks":2,"key":[["Identifies the next best alternative forgone (e.g. leisure time, another business activity)",1],["Explains why it is given up",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Explain two characteristics of a market economy, using an Australian example for each.","marks":4,"key":[["First characteristic explained (private ownership, price mechanism, profit motive, consumer sovereignty, competition)",1],["Australian example for the first",1],["Second characteristic explained",1],["Australian example for the second",1]]}]},{"label":"Class review","items":[{"t":"text","q":"Define the economic problem and explain why it forces choices.","marks":3,"key":[["Defines it: limited resources, unlimited wants",1],["Links scarcity to having to choose",1],["Mentions opportunity cost of each choice",1]]},{"t":"text","q":"Distinguish between a positive and a normative statement, giving an example of each.","marks":4,"key":[["Positive: testable against facts",1],["Correct positive example",1],["Normative: a value judgement, not testable",1],["Correct normative example",1]]},{"t":"text","q":"Using a PPF, explain why an economy that produces more capital goods today can grow faster in future.","marks":4,"key":[["Draws or describes PPF with capital vs consumer goods",1],["Choosing more capital goods means fewer consumer goods now",1],["More capital raises future productive capacity",1],["PPF shifts out further in future",1]]}]}],"dd":[{"title":"Scarcity and the three economic questions","body":"<p>Scarcity is not the same as poverty. Even the richest country has limited land, workers, machines and time, but people’s wants keep growing. Because we cannot have everything, every society has to answer three questions:</p><ul><li><b>What to produce?</b> More hospitals or more roads? More iron ore or more tourism?</li><li><b>How to produce?</b> With lots of workers (labour-intensive) or lots of machines (capital-intensive)?</li><li><b>For whom?</b> Who gets the output: whoever can pay, or whoever needs it most?</li></ul><p>In a market economy, prices answer most of these questions. Governments step in where the market answer is unfair or inefficient, such as public schools and Medicare.</p>","case":"WA’s mining boom pulled workers, trucks and engineers into the Pilbara. That answered \"what to produce\" (more iron ore) but made it harder for Perth builders and farmers to find workers. Scarce labour had to be shared between industries.","mistakes":["Saying scarcity means \"a shortage\". A shortage is temporary and caused by price; scarcity is permanent.","Forgetting enterprise as the fourth factor of production."],"check":{"q":"Which question is answered when a farmer chooses robots instead of extra workers?","o":["What to produce","How to produce","For whom to produce"],"a":1,"why":"Choosing the method (capital versus labour) answers \"how\"."},"src":[["SCSA, Economics ATAR Year 11 syllabus (2026)","https://senior-secondary.scsa.wa.edu.au/__data/assets/word_doc/0009/1230678/Economics-ATAR-Year-11-Syllabus-for-teaching-from-2026.DOCX"],["RBA, Explainers for students","https://www.rba.gov.au/education/resources/explainers/"]]},{"title":"Opportunity cost in government budgets","body":"<p>Every dollar a government spends on one thing is a dollar it cannot spend on something else, or return as a tax cut. Economists measure the real cost of a choice as the <b>next best alternative given up</b>, not just the dollar price.</p><p>Opportunity cost also applies to time. The cost of studying tonight is the shift at work you could have done, or the time with friends, whichever you value most.</p>","case":"When the Commonwealth spends more on defence or the NDIS, the opportunity cost might be fewer tax cuts or less spending on schools. Budget papers list these choices each May.","mistakes":["Listing every alternative given up. Opportunity cost is only the single next best one.","Ignoring non-money costs such as time."],"check":{"q":"You choose to work a $120 shift instead of going to the beach (your next best option). The opportunity cost is:","o":["$120","The day at the beach","Nothing, because you earned money"],"a":1,"why":"The opportunity cost of working is the beach day you gave up."},"src":[["Australian Government, Budget 2026-27","https://budget.gov.au/"],["WA Government, State Budget","https://www.ourstatebudget.wa.gov.au/"]]},{"title":"Thinking at the margin","body":"<p>Most decisions are not all-or-nothing. They are about <b>one more</b>: one more hour of study, one more worker, one more hour open. Economists compare the <b>marginal benefit</b> (extra gain) with the <b>marginal cost</b> (extra cost) of that next unit.</p><p>The rule is simple: keep going while MB ≥ MC, and stop when the next unit would cost more than it is worth.</p>","fig":"marginal","case":"Many Perth cafés close mid-afternoon on weekdays. After the lunch rush, the extra revenue from staying open (MB) is often smaller than the cost of staff wages and power (MC).","mistakes":["Comparing total benefit with total cost instead of the extra (marginal) amounts.","Stopping when MB = MC is reached and then adding one more unit."],"check":{"q":"The 5th hour of tutoring brings $40 of benefit and costs $55. A rational tutor should:","o":["Work the 5th hour","Stop after 4 hours","Work extra hours to cover the loss"],"a":1,"why":"MC is greater than MB for the 5th hour, so it lowers net benefit."}},{"title":"Why economists use models","body":"<p>A model is a simplified picture of how part of the economy works, like a map. A map leaves out every tree so you can see the roads; a model leaves out detail so you can see one relationship clearly.</p><p>Models rely on <i>ceteris paribus</i> (other things held constant). When you draw a demand curve, you hold income, tastes and other prices fixed so you can see how price alone affects quantity demanded.</p><ul><li>Good models make clear predictions you can test against data.</li><li>All models are wrong in detail, but useful ones explain the main pattern.</li></ul>","mistakes":["Drawing a diagram without labelled axes, curves and equilibrium points.","Changing two things at once and forgetting to say which one moved first."],"check":{"q":"\"Ceteris paribus\" means:","o":["All else being equal","At equilibrium","In the long run"],"a":0,"why":"It is Latin for \"other things being equal\"."}},{"title":"PPF shapes and what shifts them","body":"<p>A straight-line PPF means opportunity cost is <b>constant</b>: resources are equally good at making both goods. Most real PPFs are <b>bowed out</b> (concave) because resources are specialised. Moving a mine engineer into teaching does not produce a great teacher, so each extra unit of one good costs more of the other.</p><ul><li><b>Outward shift (growth):</b> more workers through migration, more capital through investment, new technology, better skills.</li><li><b>Inward shift:</b> natural disasters, war, a falling population, resource depletion.</li><li><b>Pivot:</b> technology that only affects one good, such as faster battery production.</li></ul>","fig":"ppfshapes","mistakes":["Saying falling unemployment shifts the PPF outward. It moves the economy from inside the PPF towards it.","Drawing a pivot as a parallel shift when only one good is affected."],"check":{"q":"A cyclone destroys roads and ports in the Pilbara. The PPF:","o":["Shifts outward","Shifts inward","Does not move"],"a":1,"why":"Destroyed capital reduces the economy’s productive capacity."}},{"title":"Australia’s modified market economy","body":"<p>Australia is a <b>modified (mixed) market economy</b>. Most resources are privately owned and allocated by prices, but governments modify outcomes where markets fail or produce results society sees as unfair.</p><div class=\"tw\"><table><thead><tr><th>Market features</th><th>Government modifications</th></tr></thead><tbody><tr><td>Private businesses and property</td><td>Public schools, hospitals and roads</td></tr><tr><td>Prices set by demand and supply</td><td>Minimum wage, regulated electricity network prices</td></tr><tr><td>Profit motive</td><td>Taxes to fund services; rules against anti-competitive conduct</td></tr><tr><td>Consumer sovereignty</td><td>Consumer protection laws, product safety rules</td></tr></tbody></table></div>","case":"WA households pay electricity tariffs set by the State Government through Synergy, rather than a fully market price. This is a modification that shields households from price swings.","mistakes":["Calling Australia a \"pure\" market economy.","Listing features without explaining how each allocates resources."],"check":{"q":"Which is a government modification of the market?","o":["A café setting its own prices","A national minimum wage","Shareholders owning a mining company"],"a":1,"why":"A minimum wage overrides the market wage for the lowest-paid workers."},"src":[["SCSA, Economics ATAR Year 11 syllabus (2026)","https://senior-secondary.scsa.wa.edu.au/__data/assets/word_doc/0009/1230678/Economics-ATAR-Year-11-Syllabus-for-teaching-from-2026.DOCX"]]},{"title":"Positive vs normative statements","body":"<p>Exam questions often ask you to <b>identify</b> or <b>distinguish</b> these. The test: could you settle it by looking at data? If yes, it is positive, even if it turns out to be false. \"Raising the minimum wage cuts jobs\" is positive (it can be tested). \"The minimum wage is too low\" is normative.</p>","mistakes":["Thinking a positive statement must be true. \"Inflation is 10%\" is positive but false.","Missing the value word that makes a statement normative."],"check":{"q":"Which is a normative statement?","o":["GST is 10% of the price","The government should cut fuel excise","Petrol prices rose 13.5% over the year"],"a":1,"why":"“Should” signals a value judgement."}},{"title":"Is it a resource yet?","body":"<p>Lithium sat in WA rocks for millions of years, but it only became a valuable resource once it was <b>known</b>, <b>accessible</b> with modern mining, had the <b>capacity</b> to be processed, and was <b>useful</b> for batteries. Resources depend on knowledge and technology, not just nature.</p>","case":"Greenbushes in WA’s South West is one of the world’s largest hard-rock lithium mines. Demand for electric-vehicle batteries turned it into a major resource.","mistakes":["Listing only three factors of production. There are four, including enterprise."],"check":{"q":"Which factor of production is mainly about bearing risk?","o":["Labour","Capital","Enterprise"],"a":2,"why":"Entrepreneurs carry the risk of the business."}}]},{"id":"t2","unit":1,"n":2,"title":"Demand, supply and equilibrium","lead":"Price changes move you along a curve. Non-price factors shift the curve. Getting this right is worth marks in almost every market question.","notes":"<h4>Demand</h4><ul><li><b>Law of demand:</b> as price rises, quantity demanded falls, ceteris paribus.</li><li><b>Market demand</b> is the sum of all individual demand schedules at each price.</li><li>Own-price change = <b>movement along</b> the curve (change in <i>quantity demanded</i>). Non-price factors <b>shift</b> the curve (change in <i>demand</i>).</li></ul><div class=\"tw\"><table><thead><tr><th>Non-price factor</th><th>Increases demand when…</th></tr></thead><tbody><tr><td>Income</td><td>Income rises (normal good) or falls (inferior good)</td></tr><tr><td>Population</td><td>Population grows</td></tr><tr><td>Tastes and preferences</td><td>The good becomes more popular</td></tr><tr><td>Price of a substitute</td><td>The substitute’s price rises</td></tr><tr><td>Price of a complement</td><td>The complement’s price falls</td></tr><tr><td>Expected future prices</td><td>Buyers expect prices to rise soon</td></tr></tbody></table></div><h4>Supply</h4><ul><li><b>Law of supply:</b> as price rises, quantity supplied rises, ceteris paribus.</li><li><b>Market supply</b> is the sum of all individual supply schedules.</li></ul><div class=\"tw\"><table><thead><tr><th>Non-price factor</th><th>Increases supply when…</th></tr></thead><tbody><tr><td>Costs of production</td><td>Costs fall</td></tr><tr><td>Expected future prices</td><td>Sellers expect prices to fall soon</td></tr><tr><td>Number of suppliers</td><td>More firms enter</td></tr><tr><td>Technology</td><td>Technology improves productivity</td></tr><tr><td>Resource and supply-chain events</td><td>Conditions improve. Droughts, floods, pandemics and port disruptions decrease supply.</td></tr></tbody></table></div><h4>Market equilibrium</h4><ul><li><b>Equilibrium:</b> quantity demanded = quantity supplied. The market clears.</li><li><b>Shortage:</b> price below equilibrium; buyers bid price up.</li><li><b>Surplus:</b> price above equilibrium; sellers cut prices.</li></ul><div class=\"tw\"><table><thead><tr><th>Change</th><th>Equilibrium price</th><th>Equilibrium quantity</th></tr></thead><tbody><tr><td>Demand increases</td><td>Rises</td><td>Rises</td></tr><tr><td>Demand decreases</td><td>Falls</td><td>Falls</td></tr><tr><td>Supply increases</td><td>Falls</td><td>Rises</td></tr><tr><td>Supply decreases</td><td>Rises</td><td>Falls</td></tr><tr><td>Demand and supply both increase</td><td>Indeterminate</td><td>Rises</td></tr><tr><td>Demand increases, supply decreases</td><td>Rises</td><td>Indeterminate</td></tr><tr><td>Demand and supply both decrease</td><td>Indeterminate</td><td>Falls</td></tr><tr><td>Demand decreases, supply increases</td><td>Falls</td><td>Indeterminate</td></tr></tbody></table></div><p>\"Indeterminate\" means the result depends on which shift is larger. Say so in exam answers.</p><h5>Markets and competition</h5><ul><li>A market needs <b>buyers</b>, <b>sellers</b> and something to exchange. <b>Product markets</b> trade goods and services; <b>factor markets</b> trade land, labour, capital and enterprise.</li><li><b>Competitive markets</b>: many buyers and sellers, similar products, easy entry, firms are <b>price takers</b> (e.g. fast food, electronics retailers).</li><li><b>Non-competitive markets</b>: one or a few firms, different products, hard to enter, firms are <b>price setters</b> (e.g. Water Corporation, domestic airlines).</li><li>Demand is not the same as a want. You only <b>demand</b> something if you are willing <i>and able</i> to buy it.</li></ul><h5>Non-price factors: class examples</h5><ul><li>Income: as incomes rise, people move from <b>inferior</b> goods (home brand) to <b>normal</b> goods and <b>luxury</b> goods (designer brands).</li><li>Tastes: streaming services cut demand for CDs and DVDs. Demographics: an ageing population wants more retirement living and less child care.</li><li>Supply: costs of production are the prices of the factors (memory aid: <b>CELL</b>, capital, enterprise, land, labour). Prices of other goods matter too: if wheat becomes more profitable than wool, farmers switch.</li><li>Vocabulary: a movement along a curve is an <b>expansion</b> or <b>contraction</b>; a shift is an <b>increase</b> or <b>decrease</b>.</li><li>The pressure that pushes a market back to equilibrium is the <b>price mechanism</b>, or Adam Smith’s <b>invisible hand</b>. Some markets adjust in minutes (shares), others daily (fresh produce).</li></ul>","figs":[["ds","Figure 2.1 · Increase in demand","<p>Demand shifts from D1 to D2. At P1 there is now a shortage, so price rises to P2 and quantity supplied extends to Q2.</p>"],["c_incomegoods","How rising incomes affect different goods.",""],["c_dsdis","Surplus and shortage with numbers.",""],["c_ds4","The four basic shifts with numbers.",""],["c_fourstage","Use this structure in every “explain the effect on the market” answer.",""]],"worked":"<p>The market for avocados in Perth (thousand kg per week):</p><div class=\"tw\"><table><thead><tr><th>Price ($/kg)</th><th>Qd</th><th>Qs</th></tr></thead><tbody><tr><td>2</td><td>80</td><td>30</td></tr><tr><td>3</td><td>70</td><td>45</td></tr><tr><td>4</td><td>60</td><td>60</td></tr><tr><td>5</td><td>50</td><td>75</td></tr><tr><td>6</td><td>40</td><td>90</td></tr></tbody></table></div><p><b>(a)</b> Equilibrium is $4/kg and 60 000 kg. At $3/kg there is a shortage of 70 000 − 45 000 = 25 000 kg, pushing price up.</p><p><b>(b)</b> Demand rises by 15 000 kg at every price. Old demand Qd = 100 − 10P; supply Qs = 15P. New demand Qd = 115 − 10P. Set equal: 115 − 10P = 15P, so <b>P = $4.60</b> and <b>Q = 69 000 kg</b>.</p>","mcq":[{"q":"A fall in the price of petrol, ceteris paribus, will cause in the petrol market:","o":["an increase in demand.","an increase in quantity demanded.","an increase in supply.","an increase in quantity supplied."],"a":1,"why":"An own-price change moves buyers along the demand curve: quantity demanded rises. Quantity supplied would fall."},{"q":"When incomes rise, demand for a good falls. The good is:","o":["an inferior good.","a normal good.","a complement.","a substitute."],"a":0,"why":"An inferior good is one people buy less of as their income rises."},{"q":"Which of the following would decrease the supply of WA wheat?","o":["A new drought-resistant seed variety.","A severe drought in the Wheatbelt.","A rise in the world price of wheat.","More farmers planting wheat."],"a":1,"why":"Drought reduces the resources available, shifting supply left. A higher price changes quantity supplied, not supply."},{"q":"If the market price is below equilibrium:","o":["there is a surplus and price will fall.","quantity supplied exceeds quantity demanded.","the market clears at that price.","there is a shortage and price will rise."],"a":3,"why":"Below equilibrium, quantity demanded exceeds quantity supplied. Buyers compete and price rises."},{"q":"Demand for electric vehicles rises while new battery technology lowers production costs. The new equilibrium will show:","o":["higher price and higher quantity.","lower price and lower quantity.","higher quantity, with the price change indeterminate.","higher price, with the quantity change indeterminate."],"a":2,"why":"Both shifts raise quantity. Demand pushes price up and supply pushes it down, so the price change depends on which shift is larger."},{"q":"At a price of $12, quantity supplied is 40 000 and quantity demanded is 20 000. The market has…","o":["A shortage of 20 000","A surplus of 20 000","Equilibrium","A shortage of 40 000"],"a":1,"why":"Supply exceeds demand by 20 000."},{"q":"Which would decrease the supply of wool?","o":["A fall in shearing costs","Wheat becomes more profitable to grow","New shearing technology","More sheep farmers enter"],"a":1,"why":"Farmers switch land to the more profitable alternative."}],"di":{"stim":"<p>Rental housing in a growing city (hypothetical data).</p><div class=\"tw\"><table><thead><tr><th>Year</th><th>Median weekly rent ($)</th><th>Vacancy rate (%)</th></tr></thead><tbody><tr><td>2022</td><td>480</td><td>1.0</td></tr><tr><td>2023</td><td>560</td><td>0.7</td></tr><tr><td>2024</td><td>640</td><td>0.6</td></tr><tr><td>2025</td><td>680</td><td>1.4</td></tr></tbody></table></div><p><i>Strong interstate and overseas migration has added to the population. Rising material costs and a shortage of tradespeople have slowed construction of new dwellings.</i></p>","items":[{"t":"text","q":"Describe the trend in median weekly rent from 2022 to 2025.","marks":2,"key":[["Rent rose every year, from $480 to $680",1],["Increases slowed in 2025 ($40 compared with $80 a year before)",1]]},{"t":"calc","q":"Calculate the percentage change in median weekly rent from 2022 to 2025.","marks":2,"inputs":[{"label":"Change (%)","ans":41.7,"tol":0.15}],"work":"(680 − 480) ÷ 480 × 100 = 41.7%"},{"t":"text","q":"Identify one non-price factor affecting demand and one affecting supply in this market.","marks":2,"key":[["Demand: population growth from migration",1],["Supply: rising building costs or a shortage of tradespeople",1]]},{"t":"text","diagram":true,"q":"Using a demand and supply diagram, demonstrate the combined effect of these two factors on equilibrium rent and quantity.","marks":5,"key":[["Axes labelled",1],["Demand shifts right D1 to D2",1],["Supply shifts left S1 to S2",1],["Equilibrium rent rises from P1 to P2",1],["Quantity change indeterminate, depending on the relative size of the shifts",1]]},{"t":"text","q":"Predict the effect on rent if many new apartments are completed in 2026, ceteris paribus. Justify your prediction.","marks":2,"key":[["Rent falls",1],["Supply increases, vacancies rise and landlords compete for tenants",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","q":"Distinguish between a change in quantity demanded and a change in demand. Use an example of each.","marks":4,"key":[["Change in quantity demanded: movement along the curve caused by the good’s own price",1],["Example given",1],["Change in demand: shift of the whole curve caused by a non-price factor",1],["Example given",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Explain the effect on the coffee bean market of a frost that destroys much of Brazil’s crop.","marks":3,"key":[["Supply decreases",1],["Supply shifts left, creating a shortage at the old price",1],["Price rises and quantity falls",1]]},{"t":"text","q":"Explain the effect on the coffee bean market of a major study linking coffee to better health.","marks":3,"key":[["Tastes change, so demand increases",1],["Demand shifts right",1],["Price and quantity both rise",1]]}]},{"label":"Class review","items":[{"t":"text","q":"Using the 4-stage model, explain the effect on the banana market of a cyclone destroying crops.","marks":4,"key":[["Supply decreases (shifts left)",1],["Shortage at the original price",1],["Price is bid up",1],["Demand contracts / supply extends to new equilibrium, higher P lower Q",1]]},{"t":"text","q":"Distinguish between a product market and a factor market, with an example of each.","marks":4,"key":[["Product market: goods and services for consumption",1],["Example (e.g. coffee)",1],["Factor market: land, labour, capital, enterprise",1],["Example (e.g. labour market)",1]]}]}],"dd":[{"title":"Why demand slopes down","body":"<p>The law of demand says people buy less when the price rises. Two effects explain why:</p><ul><li><b>Substitution effect:</b> when avocados rise in price, they become expensive compared with other foods, so people switch to tomatoes or cucumbers.</li><li><b>Income effect:</b> a higher price means your income buys less in total, so you buy less of many things.</li><li><b>Diminishing marginal utility:</b> each extra unit gives less satisfaction, so you will only buy more at a lower price.</li></ul>","mistakes":["Saying \"demand falls\" when price rises. Quantity demanded falls; demand (the whole curve) stays the same."],"check":{"q":"Petrol prices jump, and some people catch the train instead. This is mainly the:","o":["Income effect","Substitution effect","Supply effect"],"a":1,"why":"People switch to a substitute that is now relatively cheaper."}},{"title":"Movements versus shifts","body":"<p>This is the most common source of lost marks in market questions. Ask one question: <b>did the good’s own price change?</b></p><ul><li>Yes → a <b>movement along</b> the curve: a change in quantity demanded (or supplied).</li><li>No, something else changed → a <b>shift</b> of the curve: a change in demand (or supply).</li></ul><p>Use precise words in your answer: \"an extension of quantity demanded\" or \"an increase in demand\", never just \"demand goes up\".</p>","fig":"dmove","mistakes":["Shifting the demand curve when the good’s own price changes.","Shifting both curves when only one factor changed."],"check":{"q":"Netflix raises its price, and more people subscribe to Stan. In the Stan market:","o":["Demand for Stan increases","Quantity demanded of Stan increases","Supply of Stan increases"],"a":0,"why":"The price of a substitute changed, which shifts the whole demand curve for Stan."}},{"title":"Supply shocks and supply chains","body":"<p>A supply shock is a sudden event that changes the cost or availability of production. Recent shocks in Australia include:</p><ul><li><b>COVID-19 (2020–22):</b> factory closures overseas and shipping delays cut the supply of cars, electronics and building materials.</li><li><b>Floods (2022):</b> damaged crops in eastern Australia raised fruit and vegetable prices.</li><li><b>Oil price shock (2026):</b> disruption to global oil supply raised fuel prices. Automotive fuel was up 13.5% in the year to August 2026.</li></ul><p>A negative supply shock shifts supply left, raising price and lowering quantity.</p>","case":"In August 2026, fuel prices rose 14.8% in one month as world oil prices rose and temporary fuel excise relief ended (ABS).","mistakes":["Saying a supply shock shifts demand.","Forgetting to state the effect on both price and quantity."],"check":{"q":"A bird flu outbreak kills millions of laying hens. In the egg market:","o":["Price falls, quantity rises","Price rises, quantity falls","Price and quantity both rise"],"a":1,"why":"Supply shifts left: higher price, lower quantity."},"src":[["ABS, Consumer Price Index, Australia, August 2026","https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/aug-2026"]]},{"title":"Price as a signal","body":"<p>Prices carry information. A rising price tells producers that consumers want more, and gives them an incentive (higher profit) to supply it. It also tells consumers to economise. Economists call this the <b>price mechanism</b>, or Adam Smith’s \"invisible hand\".</p><ul><li><b>Signalling:</b> prices show where resources are wanted.</li><li><b>Incentive:</b> higher prices reward producers who respond.</li><li><b>Rationing:</b> higher prices limit who buys, so goods go to those who value them most.</li></ul>","case":"When Perth rents rose sharply from 2022, the higher price signalled a shortage. It encouraged more investors to build or rent out property, and some tenants to share or move to cheaper suburbs.","mistakes":["Describing the price change without explaining how buyers and sellers respond."],"check":{"q":"Which function of price makes producers want to supply more when price rises?","o":["Rationing","Incentive","Equity"],"a":1,"why":"Higher prices raise potential profit, an incentive to produce more."}},{"title":"Reading simultaneous shifts","body":"<p>When demand and supply both shift, one variable is certain and the other depends on the size of each shift. Always say which is <b>indeterminate</b> and why.</p><div class=\"tw\"><table><thead><tr><th>Demand</th><th>Supply</th><th>Price</th><th>Quantity</th></tr></thead><tbody><tr><td>↑</td><td>↑</td><td>?</td><td>↑</td></tr><tr><td>↑</td><td>↓</td><td>↑</td><td>?</td></tr><tr><td>↓</td><td>↓</td><td>?</td><td>↓</td></tr><tr><td>↓</td><td>↑</td><td>↓</td><td>?</td></tr></tbody></table></div>","fig":"simul","mistakes":["Giving a definite answer for the indeterminate variable without saying which shift is larger."],"check":{"q":"Demand for electric cars rises and battery costs fall. Which is certain?","o":["Price rises","Quantity rises","Price falls"],"a":1,"why":"Both shifts push quantity up; their effects on price offset."}},{"title":"The 4-stage explanation model","body":"<p>Full marks in market questions come from a complete chain of reasoning. Use four stages every time:</p><ul><li><b>1. Cause:</b> name the non-price factor and say which curve shifts, and which way.</li><li><b>2. Imbalance:</b> at the old price there is now a shortage or surplus.</li><li><b>3. Price:</b> say how price responds (bid up or cut).</li><li><b>4. Quantities:</b> describe the extension or contraction of demand and supply until a new equilibrium.</li></ul>","fig":"c_fourstage","case":"Cyclone Yasi (2011) destroyed much of the north Queensland banana crop. Supply decreased → shortage at the old price → prices rose by around 400% → quantity demanded contracted until a new, much higher equilibrium.","mistakes":["Jumping straight from cause to new equilibrium and skipping stages 2 and 3.","Saying “demand decreases” when price rises. It is quantity demanded that contracts."],"check":{"q":"In stage 2, an increase in demand creates…","o":["A surplus at the old price","A shortage at the old price","A new equilibrium immediately"],"a":1,"why":"At the old price, quantity demanded now exceeds quantity supplied."}},{"title":"Substitutes, complements and expectations","body":"<p><b>Substitutes</b> meet the same need (pizza vs fish and chips): when one rises in price, demand for the other increases. <b>Complements</b> are used together (cars and petrol, pizza and garlic bread): when one rises in price, demand for the other decreases.</p><p><b>Expectations</b> matter too. In Perth, petrol prices follow a weekly cycle and FuelWatch publishes tomorrow’s prices, so drivers fill up on the cheap day.</p>","case":"WA’s FuelWatch scheme requires stations to set their next-day price by 2 pm and hold it for 24 hours, making it easier for drivers to act on expectations.","mistakes":["Mixing up which way a complement’s demand moves."],"check":{"q":"The price of game consoles rises. Demand for games (a complement)…","o":["Increases","Decreases","Does not change"],"a":1,"why":"Fewer consoles bought means fewer games wanted."}}]},{"id":"t3","unit":1,"n":3,"title":"Elasticity","lead":"Elasticity measures how strongly quantity responds to a change in price. It decides who pays a tax and how a firm should set prices.","notes":"<p class=\"formula\">PED = %ΔQd ÷ %ΔP &nbsp;&nbsp;·&nbsp;&nbsp; PES = %ΔQs ÷ %ΔP</p><ul><li>Percentage change = (new − old) ÷ old × 100. Ignore the minus sign when interpreting PED.</li><li><b>Elastic (&gt; 1)</b>: quantity changes by a larger % than price. <b>Inelastic (&lt; 1)</b>: by a smaller %. <b>Unit elastic</b> = 1. Perfectly elastic = ∞; perfectly inelastic = 0.</li></ul><h4>Total revenue method</h4><div class=\"tw\"><table><thead><tr><th>Price change</th><th>TR rises</th><th>TR falls</th><th>TR unchanged</th></tr></thead><tbody><tr><td>Price rises</td><td>Inelastic</td><td>Elastic</td><td>Unit elastic</td></tr><tr><td>Price falls</td><td>Elastic</td><td>Inelastic</td><td>Unit elastic</td></tr></tbody></table></div><ul><li><b>Determinants of PED:</b> substitutes, necessity or luxury, share of income, time to adjust, habit-forming, how broadly the good is defined.</li><li><b>Determinants of PES:</b> time period, spare capacity, ability to store stock, mobility of factors, production lead time.</li><li><b>Business pricing:</b> inelastic demand → raise price to raise revenue; elastic → cut price.</li><li><b>Tax incidence:</b> the burden falls mostly on the more inelastic side. Governments tax tobacco and fuel because demand is inelastic.</li><li><b>Price discrimination:</b> different prices to different groups for the same good. Needs market power, separable groups with different PEDs and no resale. The inelastic group pays more.</li></ul><h5>Indirect taxes and elasticity</h5><ul><li><b>Indirect taxes</b> (GST, excise) are collected from sellers but passed on to buyers through higher prices. <b>Impact</b> is who the tax is levied on; <b>incidence</b> is who actually bears it.</li><li>GST is 10% on most goods and services, but basic food, most health and education are GST-free. <b>Excise</b> applies to fuel, alcohol and tobacco, which typically have inelastic demand.</li><li>Tax revenue = tax per unit × quantity sold. Because quantity falls less when demand is inelastic, governments raise more revenue taxing inelastic goods.</li></ul><h5>Price discrimination in practice</h5><ul><li>Hairdressers’ student and seniors’ rates, cinema concessions and early-bird airfares all charge more to the group with less elastic demand.</li></ul>","figs":[["tax","Figure 3.1 · Tax incidence with inelastic demand","<p>The tax shifts supply up from S1 to S2. With inelastic demand, the consumer price rises from P1 to Pc, close to the full tax, while producers keep Pp, only a little below P1.</p>"],["c_taxinc","The same $5 tax with inelastic and elastic demand.",""]],"worked":"<p><b>PED:</b> Ticket price rises from $80 to $100; tickets sold fall from 5000 to 4200.</p><ol><li>%ΔP = 25%.</li><li>%ΔQd = −16%.</li><li>PED = 16 ÷ 25 = <b>0.64</b>, so demand is inelastic.</li><li>Check: TR rises from $400 000 to $420 000, confirming inelastic demand.</li></ol><p><b>PES:</b> Wool rises from $10 to $12/kg; supply rises from 1000 to 1100 t. PES = 10% ÷ 20% = <b>0.5</b> (inelastic).</p>","mcq":[{"q":"When the price of a good falls by 10%, quantity demanded rises by 25%. Demand is:","o":["perfectly inelastic.","price inelastic.","unit elastic.","price elastic."],"a":3,"why":"PED = 25 ÷ 10 = 2.5, which is greater than 1."},{"q":"A firm raises its price and its total revenue falls. Demand for its product must be:","o":["price elastic.","price inelastic.","unit elastic.","perfectly inelastic."],"a":0,"why":"When price and total revenue move in opposite directions, demand is elastic."},{"q":"Which good is most likely to have price inelastic demand?","o":["A particular brand of soft drink.","Prescription insulin.","Overseas holidays.","Designer sunglasses."],"a":1,"why":"Insulin is a necessity with no close substitutes."},{"q":"Supply of fresh strawberries is likely to be price inelastic in the short run because:","o":["strawberries have many substitutes.","strawberries are a necessity.","they are perishable and output takes time to increase.","farmers have a large amount of spare capacity."],"a":2,"why":"Perishable goods cannot be stored, and new plants take time to grow."},{"q":"A tax is placed on a good with perfectly inelastic demand. The burden falls:","o":["entirely on consumers.","entirely on producers.","equally on consumers and producers.","entirely on the government."],"a":0,"why":"Consumers buy the same quantity at any price, so producers pass on the full tax."},{"q":"A $5 tax raises the price from $15 to $17 and quantity falls from 3000 to 2300. Tax revenue is…","o":["$15 000","$11 500","$14 000","$34 500"],"a":1,"why":"$5 × 2300 = $11 500."}],"di":{"stim":"<p>A Perth cinema trials new prices (hypothetical data).</p><div class=\"tw\"><table><thead><tr><th>Ticket type</th><th>Old price ($)</th><th>New price ($)</th><th>Weekly sales before</th><th>Weekly sales after</th></tr></thead><tbody><tr><td>Adult, Friday evening</td><td>20</td><td>24</td><td>1500</td><td>1410</td></tr><tr><td>Student, Tuesday afternoon</td><td>14</td><td>10</td><td>300</td><td>540</td></tr></tbody></table></div>","items":[{"t":"calc","q":"Calculate the price elasticity of demand for adult Friday evening tickets.","marks":3,"inputs":[{"label":"PED","ans":0.3,"tol":0.01}],"work":"%ΔP = 20%; %ΔQd = (1410 − 1500) ÷ 1500 = −6%. PED = 6 ÷ 20 = 0.3, so demand is price inelastic."},{"t":"calc","q":"Use the total revenue method for student Tuesday tickets. Calculate TR before and after.","marks":3,"inputs":[{"label":"TR before ($)","ans":4200,"tol":0},{"label":"TR after ($)","ans":5400,"tol":0}],"work":"Before: $14 × 300 = $4200. After: $10 × 540 = $5400. Price fell and TR rose, so demand is price elastic."},{"t":"text","q":"Identify the pricing strategy the cinema is using and outline two conditions needed for it to work.","marks":3,"key":[["Price discrimination",1],["First condition (market power; separable groups; different PEDs; no resale)",1],["Second condition",1]]},{"t":"text","q":"Explain one determinant that could account for the difference in elasticity between the two groups.","marks":2,"key":[["Identifies a determinant (e.g. share of income, availability of substitutes)",1],["Applies it to students versus Friday adults",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","diagram":true,"q":"The Australian Government places an excise on cigarettes. Using a demand and supply diagram, explain why most of the burden falls on consumers.","marks":5,"key":[["Diagram: steep demand, supply shifts up by the excise",1],["Labels Pc, P1, Pp, Q1, Q2",1],["Demand is inelastic: addictive, few substitutes",1],["Consumer price rises by most of the tax; quantity falls only slightly",1],["Producers’ price falls a little, so consumers bear most of the burden",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Explain two determinants of the price elasticity of supply, using the market for iron ore as an example.","marks":4,"key":[["First determinant identified (e.g. time period)",1],["Applied to iron ore (new mines take years)",1],["Second determinant identified (e.g. spare capacity, storage)",1],["Applied to iron ore",1]]}]},{"label":"Class review","items":[{"t":"calc","q":"A $5 tax raises the market price from $15 to $18 and quantity falls from 3000 to 2800. Calculate (i) the tax paid by consumers per unit and (ii) total tax revenue.","marks":3,"inputs":[{"label":"(i) consumers’ share ($)","ans":3,"tol":0},{"label":"(ii) revenue ($)","ans":14000,"tol":0}],"work":"Consumers: $18 − $15 = $3. Revenue: $5 × 2800 = $14 000."},{"t":"text","q":"Explain why governments often place excise taxes on goods with inelastic demand.","marks":3,"key":[["Quantity falls only a little when price rises",1],["So revenue remains high and reliable",1],["Smaller deadweight loss / may still reduce harmful consumption over time",1]]}]}],"dd":[{"title":"Calculating PED step by step","body":"<p>Follow four steps and show each one: these are where method marks are awarded.</p><ul><li>1. %Δ price = (new − old) ÷ old × 100</li><li>2. %Δ quantity = (new − old) ÷ old × 100</li><li>3. PED = %ΔQ ÷ %ΔP (ignore the minus sign)</li><li>4. Interpret: above 1 elastic, below 1 inelastic</li></ul><p>Some textbooks use the midpoint (average) method, which gives the same answer whichever way the price moves. If your teacher uses it, the % change uses the average of old and new as the base.</p>","mistakes":["Dividing price change by quantity change (upside down).","Forgetting to interpret the number."],"check":{"q":"Price rises from $10 to $12 and sales fall from 100 to 90. PED is:","o":["0.5","2.0","0.2"],"a":0,"why":"%ΔP = 20%, %ΔQ = −10%; 10 ÷ 20 = 0.5."}},{"title":"What makes demand elastic or inelastic","body":"<div class=\"tw\"><table><thead><tr><th>Determinant</th><th>More elastic when…</th><th>Example</th></tr></thead><tbody><tr><td>Substitutes</td><td>Many close substitutes</td><td>One brand of cola</td></tr><tr><td>Necessity</td><td>It is a luxury</td><td>Overseas holidays</td></tr><tr><td>Share of income</td><td>It takes a large share</td><td>New cars</td></tr><tr><td>Time</td><td>Buyers have time to adjust</td><td>Switching to an EV over years</td></tr><tr><td>Habit</td><td>It is not habit-forming</td><td>Movie tickets</td></tr><tr><td>Definition</td><td>The good is narrowly defined</td><td>\"Woolworths bread\" vs \"food\"</td></tr></tbody></table></div>","fig":"elastic","mistakes":["Listing a determinant without linking it to the good in the question."],"check":{"q":"Demand for \"Shell petrol\" is more elastic than demand for \"petrol\" because:","o":["It is a necessity","It has close substitutes (other brands)","It is a small share of income"],"a":1,"why":"Narrowly defined goods have more substitutes."}},{"title":"PES and the time period","body":"<p>How quickly producers can respond decides how elastic supply is.</p><ul><li><b>Immediate:</b> only stock on hand, so supply is close to perfectly inelastic.</li><li><b>Short run:</b> firms add shifts or overtime but cannot build new factories.</li><li><b>Long run:</b> new firms enter, mines open and farms expand, so supply is most elastic.</li></ul><p>Other determinants: spare capacity, ability to store goods, how easily resources can move between uses, and how long production takes.</p>","fig":"pestime","case":"A new iron ore mine in the Pilbara can take five years or more from approval to first shipment, so iron ore supply is inelastic in the short run even when prices soar.","mistakes":["Confusing determinants of PES with determinants of PED."],"check":{"q":"Supply of Margaret River wine is inelastic in the short run because:","o":["Vines take years to mature","Wine is a luxury","Demand is elastic"],"a":0,"why":"New vineyards take years to produce grapes."}},{"title":"Case study: tobacco excise","body":"<p>Australia has some of the highest tobacco taxes in the world: excise of about $1.55 per cigarette (from 1 September 2026), plus GST. Because demand is inelastic (addictive, few legal substitutes), most of the tax falls on smokers, and early increases raised a lot of revenue while also reducing smoking.</p><p>But very high prices create a black market. Tobacco excise revenue fell from a peak of $16.3 billion in 2019-20 to an expected $7.4 billion in 2025-26, as smokers quit, switched to vapes or bought illegal tobacco.</p>","case":"Daily smoking among Australians aged 14+ fell from almost 20% in 2001 to about 8%, a sign that the price is also changing behaviour over the long run, when demand is more elastic.","mistakes":["Saying the government pays the tax. Consumers and producers share the burden.","Forgetting that elasticity is higher in the long run."],"check":{"q":"Why does a tobacco tax raise revenue reliably in the short run?","o":["Demand is elastic","Demand is inelastic","Supply is perfectly elastic"],"a":1,"why":"Quantity falls only a little, so the tax is collected on most sales."},"src":[["University of Sydney, Tobacco excise revenue has tanked (April 2025)","https://www.sydney.edu.au/news-opinion/news/2025/04/02/tobacco-excise-revenue-has-tanked.html"]]},{"title":"Price discrimination in practice","body":"<p>Price discrimination is charging different prices to different groups for the same product, when the difference is not due to cost. It works when a firm can identify groups with different elasticities and stop resale.</p><ul><li><b>Airlines:</b> higher fares for last-minute business travellers (inelastic) than for leisure travellers who book early (elastic).</li><li><b>Cinemas and transport:</b> student, child and senior concessions.</li><li><b>Electricity:</b> cheaper off-peak rates.</li></ul>","mistakes":["Calling a price difference caused by higher costs (e.g. delivery to remote areas) price discrimination."],"check":{"q":"Which group pays the higher price under price discrimination?","o":["The group with elastic demand","The group with inelastic demand","The group that buys the most"],"a":1,"why":"Inelastic buyers do not cut back much when price rises."}},{"title":"Worked example: who pays a $5 tax?","body":"<div class=\"tw\"><table><thead><tr><th></th><th>Inelastic demand</th><th>Elastic demand</th></tr></thead><tbody><tr><td>Price before tax</td><td>$15</td><td>$15</td></tr><tr><td>Price buyers pay after</td><td>$18 (+$3)</td><td>$17 (+$2)</td></tr><tr><td>Price sellers keep</td><td>$13 (−$2)</td><td>$12 (−$3)</td></tr><tr><td>Quantity</td><td>3000 → 2800</td><td>3000 → 2300</td></tr><tr><td>Tax revenue</td><td>$5 × 2800 = $14 000</td><td>$5 × 2300 = $11 500</td></tr><tr><td>Bigger burden on</td><td>Consumers</td><td>Producers</td></tr></tbody></table></div>","fig":"c_taxinc","case":"From 1 September 2026, excise on a cigarette is about $1.55 a stick, indexed twice a year. Because smokers’ demand is inelastic in the short run, most of the tax is passed on in price.","mistakes":["Saying the producer “pays” the whole tax because they hand it to the government.","Calculating revenue with the old quantity instead of the new one."],"check":{"q":"With inelastic demand, a $5 tax raises the price buyers pay by…","o":["More than $2.50","Exactly $5","Less than $2.50"],"a":0,"why":"Consumers bear most of the tax when demand is inelastic."},"src":[["ATO, Excise duty rates for tobacco","https://www.ato.gov.au/businesses-and-organisations/gst-excise-and-indirect-taxes/tobacco-and-excise/excise-duty-rates-for-tobacco"]]}]},{"id":"t4","unit":1,"n":4,"title":"Market efficiency","lead":"A competitive market at equilibrium maximises total surplus. Pushing output above or below equilibrium creates a deadweight loss.","notes":"<ul><li><b>Perfect competition:</b> many buyers and sellers, identical products, perfect information, free entry and exit.</li><li><b>Consumer surplus (CS):</b> willingness to pay minus price paid. Area below demand, above price.</li><li><b>Producer surplus (PS):</b> price received minus the minimum producers would accept. Area above supply, below price.</li><li><b>Total surplus = CS + PS</b>, maximised at equilibrium (allocative efficiency).</li><li><b>Deadweight loss (DWL):</b> total surplus lost when output is not at equilibrium.</li></ul><div class=\"tw\"><table><thead><tr><th>Intervention</th><th>What happens</th><th>Efficiency</th></tr></thead><tbody><tr><td>Tax</td><td>Supply shifts up; consumers pay more, producers receive less, quantity falls</td><td>DWL from underproduction; government gains revenue</td></tr><tr><td>Subsidy</td><td>Supply shifts down; consumers pay less, producers receive more, quantity rises</td><td>DWL from overproduction; cost to government</td></tr><tr><td>Price ceiling (below eq.)</td><td>Quantity demanded > quantity supplied</td><td>Shortage, DWL, queues, black markets</td></tr><tr><td>Price floor (above eq.)</td><td>Quantity supplied > quantity demanded</td><td>Surplus, DWL</td></tr></tbody></table></div><p class=\"formula\">Area of a triangle = ½ × base × height</p><h5>Efficiency and equity</h5><ul><li>Market efficiency means producing at the lowest cost and in the quantities society values most, with no surplus or shortage.</li><li>The demand curve is a <b>willingness-to-pay</b> (marginal benefit) curve. The supply curve is a <b>willingness-to-accept</b> (marginal cost) curve.</li><li>At the competitive equilibrium total surplus is maximised: to the left MB > MC (worth producing more), to the right MC > MB (society makes a loss).</li><li>Golden rule: <b>if there is a deadweight loss, the market is inefficient</b>. A market can be efficient even when a shock reduces total surplus (e.g. Cyclone Yasi), as long as price is free to move.</li></ul><h5>Government policies that reduce efficiency</h5><ul><li><b>Market restrictions</b>, e.g. limited taxi licences, which pushed licence values to hundreds of thousands of dollars.</li><li>Price ceilings (rents, basic groceries) and floors (farm prices) are usually justified on <b>equity</b> grounds, but there is no guarantee the low-income people they target benefit.</li><li>Taxes: revenue is less than the surplus lost. Subsidies: the cost is more than the surplus gained.</li></ul><h5>Equity</h5><ul><li><b>Vertical equity</b>: treating people in different circumstances differently, e.g. progressive tax and welfare (the “Robin Hood” approach). It may weaken incentives.</li><li><b>Horizontal equity</b>: treating people in the same circumstances the same and giving everyone equal opportunity.</li><li>Efficiency grows the economic pie; equity is about how it is shared. Governments trade one off against the other.</li></ul>","figs":[["ceiling","Figure 4.1 · Price ceiling of $40","<p>At $40, firms supply only 20 000 units but consumers want 60 000. The units between 20 000 and 40 000 are lost, and their surplus is the DWL triangle.</p>"],["c_steps","John’s and Lauren’s pizza schedules.",""],["c_taxi","Market restriction: taxi licences.",""],["c_ceilfloor","Price ceiling and floor with numbers.",""],["c_subsidy","Why a subsidy creates a deadweight loss.",""],["c_pie","The efficiency–equity trade-off.",""]],"worked":"<p>Demand P = 100 − Q, supply P = 20 + Q (Q in thousands).</p><ul><li><b>Equilibrium:</b> Q = 40 000, P = $60.</li><li>CS = ½ × 40 000 × $40 = <b>$800 000</b>; PS = ½ × 40 000 × $40 = <b>$800 000</b>.</li><li><b>Ceiling $40:</b> Qs = 20 000, Qd = 60 000; shortage 40 000. DWL = ½ × 20 000 × ($80 − $40) = <b>$400 000</b>.</li><li><b>Tax $20:</b> (100 − Q) − (20 + Q) = 20 → Q = 30 000; consumers pay $70, producers keep $50. Revenue $600 000; DWL = ½ × 10 000 × $20 = <b>$100 000</b>.</li></ul>","mcq":[{"q":"Consumer surplus is the:","o":["total amount consumers spend on a good.","difference between what consumers are willing to pay and what they pay.","difference between price and the cost of production.","revenue a firm earns above its costs."],"a":1,"why":"Consumer surplus is the extra value buyers get above the price they pay."},{"q":"Total surplus in a competitive market is maximised when:","o":["the government sets a price floor.","price is as low as possible.","the market is at equilibrium.","producer surplus equals zero."],"a":2,"why":"At equilibrium every unit worth more to buyers than it costs to make is traded."},{"q":"A minimum wage set above the equilibrium wage is most likely to cause:","o":["a shortage of labour.","a surplus of labour (unemployment).","no change in employment.","a fall in the wage rate."],"a":1,"why":"A binding price floor makes quantity supplied (workers) exceed quantity demanded."},{"q":"A subsidy paid to producers in an otherwise efficient market will:","o":["reduce quantity and create a deadweight loss.","raise quantity above equilibrium and create a deadweight loss.","raise total surplus with no deadweight loss.","shift demand to the right."],"a":1,"why":"The subsidy shifts supply right, so units are produced that cost more than they are worth to buyers."},{"q":"A deadweight loss represents:","o":["tax revenue collected by the government.","surplus transferred from consumers to producers.","total surplus lost because output is not at the efficient level.","the cost of producing the equilibrium quantity."],"a":2,"why":"DWL is surplus that nobody receives."},{"q":"John is willing to pay $12, $11, $10, $9 and $8 for five pizzas and pays $8 each. His consumer surplus is…","o":["$50","$40","$10","$8"],"a":2,"why":"$50 total value − $40 paid = $10."},{"q":"A price ceiling of $1 on petrol where the equilibrium is $1.50 will cause…","o":["A surplus","A shortage","No change","Lower demand"],"a":1,"why":"A binding ceiling below equilibrium causes excess demand."}],"di":{"stim":"<p>Demand P = 120 − 2Q and supply P = 30 + Q, where P is in dollars and Q in thousands of units.</p>","items":[{"t":"calc","q":"Calculate the equilibrium price and quantity.","marks":2,"inputs":[{"label":"Price ($)","ans":60,"tol":0},{"label":"Quantity ('000)","ans":30,"tol":0}],"work":"120 − 2Q = 30 + Q → Q = 30 (30 000 units), P = $60."},{"t":"calc","q":"Calculate consumer surplus and producer surplus at equilibrium.","marks":4,"inputs":[{"label":"CS ($)","ans":900000,"tol":0},{"label":"PS ($)","ans":450000,"tol":0}],"work":"CS = ½ × 30 000 × ($120 − $60) = $900 000. PS = ½ × 30 000 × ($60 − $30) = $450 000."},{"t":"calc","q":"A price floor of $72 is set. Calculate the resulting surplus (units).","marks":2,"inputs":[{"label":"Surplus (units)","ans":18000,"tol":0}],"work":"Qd: 72 = 120 − 2Q → 24 000. Qs: 72 = 30 + Q → 42 000. Surplus = 18 000 units."},{"t":"calc","q":"Calculate the deadweight loss caused by the price floor.","marks":3,"inputs":[{"label":"DWL ($)","ans":54000,"tol":0}],"work":"Only 24 000 units trade. Supply price at 24 000 = $54. DWL = ½ × (30
