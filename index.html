.0%.","4.4%.","3.8%.","14.4%."],"a":0,"why":"4.4 ÷ 110 × 100 = 4.0%."},{"id":"p1m18","paper":1,"topic":"t11","unit":2,"q":"The labour force is 15 million and 600 000 are unemployed. The unemployment rate is:","o":["0.6%.","2.5%.","6.0%.","4.0%."],"a":3,"why":"0.6 ÷ 15 × 100 = 4.0%."},{"id":"p1m19","paper":1,"topic":"t12","unit":2,"q":"Which is a lagging indicator?","o":["Building approvals.","The unemployment rate.","Consumer confidence.","Share prices."],"a":1,"why":"Unemployment changes after the economy turns."},{"id":"p1m20","paper":1,"topic":"t14","unit":2,"q":"Which tax is regressive relative to income?","o":["Personal income tax.","Company tax.","The GST.","None of the above."],"a":2,"why":"Low-income households spend a larger share of income."},{"id":"p2m1","paper":2,"unit":1,"topic":"t1","q":"Which of the following is a normative statement?","o":["The government should raise the minimum wage.","The unemployment rate was 4.4% in June 2026.","GST is charged at 10% on most goods and services.","Real GDP grew 2.1% over the year to June 2026."],"a":0,"why":"“Should” signals a value judgement that cannot be tested."},{"id":"p2m2","paper":2,"unit":1,"topic":"t2","q":"The price of a good falls and buyers purchase more of it. This is:","o":["an increase in demand.","an increase in supply.","a contraction of quantity demanded.","an extension (expansion) of quantity demanded."],"a":3,"why":"An own-price change causes a movement along the demand curve."},{"id":"p2m3","paper":2,"unit":1,"topic":"t2","q":"Which would increase the supply of wheat?","o":["A rise in the price of fertiliser.","Improved seed technology that raises yields.","A drought in the wheatbelt.","An increase in consumer incomes."],"a":1,"why":"Better technology lowers costs per unit and shifts supply right."},{"id":"p2m4","paper":2,"unit":1,"topic":"t3","q":"The price of a good rises by 20% and quantity demanded falls by 10%. Demand is:","o":["price elastic, PED = 2.0.","price inelastic, PED = 0.5.","unit elastic, PED = 1.0.","perfectly inelastic, PED = 0."],"a":1,"why":"PED = 10 ÷ 20 = 0.5, which is less than 1."},{"id":"p2m5","paper":2,"unit":1,"topic":"t3","q":"The supply of fresh-cut flowers at a Saturday market, on the day, is most likely:","o":["highly elastic, because growers can quickly pick more.","unit elastic.","highly inelastic, because no more can be grown that day.","perfectly elastic."],"a":2,"why":"In the immediate period, supply is limited to stock on hand."},{"id":"p2m6","paper":2,"unit":1,"topic":"t4","q":"Consumer surplus is best defined as:","o":["the total amount consumers spend on a good.","the profit made by firms.","the amount of a good left unsold.","the difference between what consumers are willing to pay and what they actually pay."],"a":3,"why":"It is the extra value consumers receive above the price."},{"id":"p2m7","paper":2,"unit":1,"topic":"t5","q":"An oligopoly is a market with:","o":["a few large firms and high barriers to entry.","many small firms selling identical products.","one firm and no close substitutes.","no barriers to entry or exit."],"a":0,"why":"For example, Australian supermarkets or banks."},{"id":"p2m8","paper":2,"unit":1,"topic":"t5","q":"Rival firms secretly agreeing on the prices they will charge is called:","o":["a merger.","a cartel, which is illegal under the Competition and Consumer Act.","price discrimination.","resale price maintenance."],"a":1,"why":"Price fixing by competitors is cartel conduct."},{"id":"p2m9","paper":2,"unit":1,"topic":"t6","q":"With a negative production externality, the socially optimal output is where:","o":["marginal private benefit = marginal private cost.","price is lowest.","marginal social benefit = marginal social cost.","output is highest."],"a":2,"why":"The social optimum counts external costs."},{"id":"p2m10","paper":2,"unit":1,"topic":"t7","q":"Street lighting is usually provided by government because it is:","o":["rival and excludable.","rival and non-excludable.","non-rival and excludable.","non-rival and non-excludable, so people would free ride."],"a":3,"why":"Public goods are underprovided by markets."},{"id":"p2m11","paper":2,"unit":2,"topic":"t8","q":"Which of the following is an injection into the circular flow?","o":["Household saving.","Imports.","Income tax.","Exports."],"a":3,"why":"Spending by overseas buyers adds to the flow of income."},{"id":"p2m12","paper":2,"unit":2,"topic":"t9","q":"Nominal GDP grows by 6% while prices rise by 4%. Real GDP has grown by approximately:","o":["10%.","6%.","2%.","1.5%."],"a":2,"why":"Real growth ≈ nominal growth − inflation."},{"id":"p2m13","paper":2,"unit":2,"topic":"t9","q":"Capital deepening refers to:","o":["capital growing at the same rate as the workforce.","the wearing out of capital equipment.","an increase in the amount of capital per worker.","an increase in the number of workers."],"a":2,"why":"More capital per worker raises labour productivity."},{"id":"p2m14","paper":2,"unit":2,"topic":"t10","q":"Which is most likely to cause cost-push inflation?","o":["A rise in world oil prices.","A large increase in household spending.","A cut in the cash rate.","Strong population growth."],"a":0,"why":"Higher input costs are passed on as higher prices."},{"id":"p2m15","paper":2,"unit":2,"topic":"t10","q":"Inflation is 4% and your wage rises by 3%. Your real wage has:","o":["risen by about 7%.","risen by about 1%.","not changed.","fallen by about 1%."],"a":3,"why":"Real wage change ≈ 3% − 4% = −1%."},{"id":"p2m16","paper":2,"unit":2,"topic":"t11","q":"A bank teller loses her job because customers now use apps. This is:","o":["frictional unemployment.","structural unemployment.","seasonal unemployment.","cyclical unemployment."],"a":1,"why":"Technology has changed the skills the economy needs."},{"id":"p2m17","paper":2,"unit":2,"topic":"t11","q":"The participation rate is calculated as:","o":["labour force ÷ civilian population aged 15+ × 100.","unemployed ÷ labour force × 100.","employed ÷ population × 100.","underemployed ÷ employed × 100."],"a":0,"why":"It measures the share of working-age people in the labour force."},{"id":"p2m18","paper":2,"unit":2,"topic":"t12","q":"During a contraction in the business cycle we would expect:","o":["rising unemployment.","rising inflationary pressure.","rising business confidence.","rising job vacancies."],"a":0,"why":"Lower output means firms need fewer workers."},{"id":"p2m19","paper":2,"unit":2,"topic":"t13","q":"A Gini coefficient of 0 indicates:","o":["one household receives all income.","a high level of inequality.","perfect equality of income.","that no income was earned."],"a":2,"why":"0 = perfect equality; 1 = perfect inequality."},{"id":"p2m20","paper":2,"unit":2,"topic":"t14","q":"Bracket creep occurs when:","o":["the government raises tax rates.","inflation pushes taxpayers into higher brackets even though their real income has not risen.","company profits rise.","the GST rate increases."],"a":1,"why":"Average tax rates rise without any change in the law."},{"id":"p3m1","paper":3,"unit":1,"topic":"t1","q":"Which is an example of capital as a factor of production?","o":["The flour used to make bread.","The baker’s labour.","A delivery van used by a bakery.","The land the bakery sits on."],"a":2,"why":"Capital is a man-made resource used to produce other goods."},{"id":"p3m2","paper":3,"unit":1,"topic":"t2","q":"Demand for a good decreases while supply stays the same. The new equilibrium has:","o":["a higher price and higher quantity.","a lower price and higher quantity.","a higher price and lower quantity.","a lower price and lower quantity."],"a":3,"why":"Demand shifts left along an unchanged supply curve."},{"id":"p3m3","paper":3,"unit":1,"topic":"t2","q":"At a price below equilibrium there is:","o":["excess supply, so price tends to fall.","excess demand, so price tends to rise.","equilibrium.","a surplus that the government must buy."],"a":1,"why":"A shortage leads buyers to bid the price up."},{"id":"p3m4","paper":3,"unit":1,"topic":"t3","q":"A firm raises its price and its total revenue falls. Demand for its product is:","o":["price inelastic.","unit elastic.","perfectly inelastic.","price elastic."],"a":3,"why":"Quantity fell by a larger % than price rose."},{"id":"p3m5","paper":3,"unit":1,"topic":"t3","q":"If demand is perfectly inelastic, the burden of a per-unit tax falls:","o":["entirely on producers.","entirely on consumers.","equally on consumers and producers.","on the government."],"a":1,"why":"Quantity does not fall, so the whole tax is passed on in price."},{"id":"p3m6","paper":3,"unit":1,"topic":"t4","q":"A price ceiling set above the equilibrium price will:","o":["cause a shortage.","cause a surplus.","create a black market.","have no effect on the market."],"a":3,"why":"A ceiling only binds when it is below equilibrium."},{"id":"p3m7","paper":3,"unit":1,"topic":"t5","q":"Which is a barrier to entry?","o":["Many small sellers.","Low start-up costs.","Economies of scale enjoyed by existing firms.","Identical products."],"a":2,"why":"New firms cannot match the low unit costs of large incumbents."},{"id":"p3m8","paper":3,"unit":1,"topic":"t5","q":"Compared with a competitive market, a firm with market power will usually:","o":["charge a lower price and produce more.","charge the same price.","charge a higher price and produce less.","produce at the socially optimal output."],"a":2,"why":"Restricting output allows a higher price, creating a deadweight loss."},{"id":"p3m9","paper":3,"unit":1,"topic":"t6","q":"Free childhood vaccinations are an example of:","o":["a tax correcting a negative externality.","a price floor.","a subsidy correcting a positive externality.","a public good."],"a":2,"why":"Lowering the price raises consumption towards the social optimum."},{"id":"p3m10","paper":3,"unit":1,"topic":"t7","q":"The tragedy of the commons occurs with resources that are:","o":["non-rival and excludable.","rival and non-excludable.","non-rival and non-excludable.","rival and excludable."],"a":1,"why":"Each user takes more because others can’t be excluded."},{"id":"p3m11","paper":3,"unit":2,"topic":"t8","q":"If total leakages exceed total injections, the level of income will:","o":["fall.","rise.","stay the same.","rise, then stabilise at a higher level."],"a":0,"why":"More is leaving the circular flow than entering it."},{"id":"p3m12","paper":3,"unit":2,"topic":"t9","q":"Real GDP per capita rises when:","o":["real GDP grows faster than the population.","the population grows faster than real GDP.","prices rise.","nominal GDP falls."],"a":0,"why":"Output per person increases."},{"id":"p3m13","paper":3,"unit":2,"topic":"t9","q":"Which is NOT counted in GDP?","o":["A haircut at a salon.","A new car bought by a household.","Unpaid housework.","Exports of iron ore."],"a":2,"why":"Non-market production is excluded."},{"id":"p3m14","paper":3,"unit":2,"topic":"t10","q":"A price index rises from 100.0 to 103.5 over a year. Inflation is:","o":["103.5%.","3.5%.","0.35%.","35%."],"a":1,"why":"(103.5 − 100) ÷ 100 × 100 = 3.5%."},{"id":"p3m15","paper":3,"unit":2,"topic":"t10","q":"Which CPI group has the largest weight in the basket?","o":["Housing.","Food and non-alcoholic beverages.","Transport.","Recreation and culture."],"a":0,"why":"Housing is about 21% of the basket."},{"id":"p3m16","paper":3,"unit":2,"topic":"t11","q":"The labour force is 15.5 million and 0.62 million people are unemployed. The unemployment rate is:","o":["6.2%.","2.5%.","0.4%.","4.0%."],"a":3,"why":"0.62 ÷ 15.5 × 100 = 4.0%."},{"id":"p3m17","paper":3,"unit":2,"topic":"t11","q":"Which person is underemployed?","o":["A retiree who doesn’t want to work.","A full-time student not looking for work.","A person searching for their first job.","A part-time worker who wants more hours."],"a":3,"why":"Underemployed people are employed but want more hours."},{"id":"p3m18","paper":3,"unit":2,"topic":"t12","q":"Which is a leading indicator of economic activity?","o":["Building approvals.","The unemployment rate.","The inflation rate.","Wage growth."],"a":0,"why":"Approvals signal construction that will happen in future."},{"id":"p3m19","paper":3,"unit":2,"topic":"t13","q":"Which of the following is a government transfer payment?","o":["JobSeeker Payment.","Company tax.","Spending on new roads.","Teachers’ salaries."],"a":0,"why":"Money is paid to individuals with nothing produced in return."},{"id":"p3m20","paper":3,"unit":2,"topic":"t14","q":"The revenue from the GST is distributed to:","o":["the Commonwealth Government only.","the state and territory governments.","local councils.","businesses that collect it."],"a":1,"why":"The Commonwealth collects GST and passes it all to the states."},{"id":"p4m1","paper":4,"unit":1,"topic":"t1","q":"The next unit of an activity brings $50 of marginal benefit and costs $60. A rational decision-maker should:","o":["do the extra unit.","not do the extra unit.","do twice as much.","ignore marginal costs."],"a":1,"why":"MC > MB, so the extra unit reduces net benefit."},{"id":"p4m2","paper":4,"unit":1,"topic":"t2","q":"The price of petrol rises sharply. Demand for large four-wheel drives (a complement) will:","o":["increase.","stay the same.","decrease.","extend."],"a":2,"why":"Complements are used together, so demand falls."},{"id":"p4m3","paper":4,"unit":1,"topic":"t2","q":"Supply increases while demand decreases. The new equilibrium shows:","o":["a higher price; quantity indeterminate.","a lower price; higher quantity.","a lower price; quantity indeterminate.","a higher price and lower quantity."],"a":2,"why":"Both shifts lower price; their effects on quantity offset."},{"id":"p4m4","paper":4,"unit":1,"topic":"t3","q":"Which makes demand for a good more price elastic?","o":["It is a necessity.","It has many close substitutes.","It takes a very small share of income.","It is habit-forming."],"a":1,"why":"Buyers can easily switch when the price rises."},{"id":"p4m5","paper":4,"unit":1,"topic":"t3","q":"Producers bear most of the burden of a per-unit tax when:","o":["demand is perfectly inelastic.","supply is perfectly elastic.","the tax is small.","demand is relatively elastic."],"a":3,"why":"Buyers cut back sharply, so sellers absorb more of the tax."},{"id":"p4m6","paper":4,"unit":1,"topic":"t4","q":"Total surplus is maximised:","o":["where marginal benefit equals marginal cost at the competitive equilibrium.","where price is lowest.","where producer surplus is largest.","when the government sets a price ceiling."],"a":0,"why":"This is the allocatively efficient output."},{"id":"p4m7","paper":4,"unit":1,"topic":"t5","q":"The Competition and Consumer Act 2010 is enforced by the:","o":["ACCC.","RBA.","ATO.","ABS."],"a":0,"why":"The Australian Competition and Consumer Commission."},{"id":"p4m8","paper":4,"unit":1,"topic":"t5","q":"Natural monopolies such as water supply networks are usually:","o":["broken up into many small firms.","subject to price regulation.","left completely unregulated.","banned."],"a":1,"why":"Regulation pushes price and output closer to the efficient level."},{"id":"p4m9","paper":4,"unit":1,"topic":"t6","q":"When a good creates a positive externality, a free market will:","o":["overproduce it.","produce the socially optimal amount.","not produce it at all.","underproduce it."],"a":3,"why":"Buyers ignore the external benefit, so too little is consumed."},{"id":"p4m10","paper":4,"unit":1,"topic":"t7","q":"Individual transferable quotas (ITQs) in fisheries are:","o":["bans on all fishing.","subsidies to fishers.","taxes on fish sales.","tradeable shares of a total allowable catch."],"a":3,"why":"They give owners an incentive to protect the stock."},{"id":"p4m11","paper":4,"unit":2,"topic":"t8","q":"The marginal propensity to consume is 0.8. The multiplier is:","o":["5.","0.8.","1.25.","8."],"a":0,"why":"1 ÷ (1 − 0.8) = 5."},{"id":"p4m12","paper":4,"unit":2,"topic":"t9","q":"Using the rule of 70, an economy growing at 3.5% a year will double in about:","o":["10 years.","35 years.","70 years.","20 years."],"a":3,"why":"70 ÷ 3.5 = 20."},{"id":"p4m13","paper":4,"unit":2,"topic":"t9","q":"Which would shift Australia’s PPF outward?","o":["A fall in unemployment.","A rise in inflation.","An increase in skilled migration.","A recession."],"a":2,"why":"More labour increases productive capacity."},{"id":"p4m14","paper":4,"unit":2,"topic":"t10","q":"Demand-pull inflation is most likely when:","o":["the economy is in a trough.","oil prices rise.","unemployment is high.","spending grows faster than the economy’s capacity to produce."],"a":3,"why":"“Too much money chasing too few goods.”"},{"id":"p4m15","paper":4,"unit":2,"topic":"t10","q":"Unexpectedly high inflation tends to benefit:","o":["savers.","people on fixed incomes.","borrowers with fixed-rate loans.","lenders."],"a":2,"why":"They repay with money worth less than when they borrowed."},{"id":"p4m16","paper":4,"unit":2,"topic":"t11","q":"A university graduate spending a few weeks looking for a first job is an example of:","o":["frictional unemployment.","structural unemployment.","cyclical unemployment.","hidden unemployment."],"a":0,"why":"Short-term unemployment between jobs or entering work."},{"id":"p4m17","paper":4,"unit":2,"topic":"t11","q":"The NAIRU is:","o":["the highest possible unemployment rate.","the lowest unemployment rate consistent with stable inflation.","zero unemployment.","the unemployment rate during a recession."],"a":1,"why":"Below it, wage and price pressures build."},{"id":"p4m18","paper":4,"unit":2,"topic":"t12","q":"A recession is commonly defined as:","o":["one quarter of slower growth.","two consecutive quarters of negative real GDP growth.","unemployment above 5%.","inflation below 2%."],"a":1,"why":"This is the common “technical” definition."},{"id":"p4m19","paper":4,"unit":2,"topic":"t13","q":"Wealth is best defined as:","o":["the flow of income over a year.","wages and salaries.","the value of assets owned less liabilities.","disposable income."],"a":2,"why":"Wealth is a stock at a point in time."},{"id":"p4m20","paper":4,"unit":2,"topic":"t14","q":"A company tax of 30% on all profits is an example of a:","o":["proportional tax.","progressive tax.","regressive tax.","indirect tax."],"a":0,"why":"The same rate applies at every level of profit."}],"data":[{"id":"p1d1","paper":1,"unit":1,"title":"The market for petrol","stim":"<p><i>In August 2026 fuel prices rose 14.8% in one month, driven by higher world oil prices and the end of temporary fuel excise relief (ABS). A large retailer’s petrol sales fell 3% (hypothetical).</i></p>","items":[{"t":"calc","q":"Calculate the PED for petrol and state whether demand is elastic or inelastic.","marks":2,"inputs":[{"label":"PED","ans":0.2,"tol":0.01}],"work":"PED = 3 ÷ 14.8 = 0.20. Demand is price inelastic."},{"t":"text","q":"Explain two determinants that make the demand for petrol price inelastic.","marks":4,"key":[["First determinant (few substitutes, necessity, habit, little time to adjust)",1],["Applied to petrol",1],["Second determinant",1],["Applied to petrol",1]]},{"t":"text","diagram":true,"q":"Using a diagram, demonstrate the effect of the rise in world oil prices on the petrol market.","marks":5,"key":[["Axes labelled",1],["Supply shifts left as crude oil costs rise",1],["Price rises P1 to P2; quantity falls Q1 to Q2",1],["Curves and equilibria labelled",1],["Refers to the diagram; small fall in Q because demand is inelastic",1]]},{"t":"text","q":"Explain why most of the burden of fuel excise falls on consumers.","marks":4,"key":[["Excise shifts supply up by the tax",1],["Demand for petrol is inelastic",1],["Consumer price rises by most of the tax; quantity falls little",1],["Producers pass most of it on",1]]},{"t":"text","q":"Identify a negative externality of petrol use and explain one policy to correct it.","marks":5,"key":[["Externality identified (pollution, emissions, congestion)",1],["MSC > MPC so the market overproduces",1],["DWL results",1],["Policy recommended",1],["How it corrects the market",1]]}]},{"id":"p1d2","paper":1,"unit":1,"title":"Market efficiency and externalities","stim":"<p><i>Demand P = 150 − Q; private supply P = 30 + Q (Q in thousands). Production causes pollution costing $20 per unit.</i></p>","items":[{"t":"calc","q":"Calculate the market equilibrium price and quantity.","marks":2,"inputs":[{"label":"Price ($)","ans":90,"tol":0},{"label":"Quantity ('000)","ans":60,"tol":0}],"work":"150 − Q = 30 + Q → Q = 60 000; P = $90."},{"t":"calc","q":"Calculate CS and PS at the market equilibrium.","marks":4,"inputs":[{"label":"CS ($)","ans":1800000,"tol":0},{"label":"PS ($)","ans":1800000,"tol":0}],"work":"CS = ½ × 60 000 × $60 = $1 800 000. PS = ½ × 60 000 × $60 = $1 800 000."},{"t":"calc","q":"Calculate the socially optimal price and quantity.","marks":3,"inputs":[{"label":"Price ($)","ans":100,"tol":0},{"label":"Quantity ('000)","ans":50,"tol":0}],"work":"MSC = 50 + Q. 150 − Q = 50 + Q → Q = 50 000; P = $100."},{"t":"calc","q":"Calculate the deadweight loss caused by the externality.","marks":3,"inputs":[{"label":"DWL ($)","ans":100000,"tol":0}],"work":"½ × 10 000 × $20 = $100 000."},{"t":"text","diagram":true,"q":"Using a diagram, explain how a $20 per-unit tax corrects this market failure.","marks":5,"key":[["Diagram with D, MPC, MSC",1],["Tax shifts MPC up to MSC",1],["Output falls to 50 000; price rises to $100",1],["Producers now pay the external cost",1],["DWL removed",1]]},{"t":"text","q":"Outline one limitation of using a tax to correct a negative externality.","marks":3,"key":[["Limitation identified",1],["Explained",1],["Developed with an example or consequence",1]]}]},{"id":"p1d3","paper":1,"unit":2,"title":"Inflation and unemployment in Australia","stim":"<div class=\"tw\"><table><thead><tr><th>Period</th><th>Unemployment (%)</th><th>Headline inflation (%)</th></tr></thead><tbody><tr><td>Dec 2022</td><td>3.5</td><td>7.9</td></tr><tr><td>Jun 2023</td><td>3.5</td><td>6.0</td></tr><tr><td>Jun 2024</td><td>4.1</td><td>3.8</td></tr><tr><td>Jun 2025</td><td>4.3</td><td>1.9</td></tr><tr><td>Jun 2026</td><td>4.4</td><td>3.8</td></tr></tbody></table></div><p><i>In 2026 world oil prices rose sharply. Unemployment reached 4.7% in September 2026 and inflation was 4.0% to August 2026.</i></p>","items":[{"t":"calc","q":"Calculate the change in unemployment (percentage points) from Dec 2022 to Jun 2026.","marks":2,"inputs":[{"label":"Change (pp)","ans":0.9,"tol":0.01}],"work":"4.4 − 3.5 = 0.9 percentage points. Lowest inflation: June 2025 (1.9%)."},{"t":"text","q":"Using a Phillips Curve, describe the relationship from Dec 2022 to Jun 2025.","marks":4,"key":[["Unemployment rose 3.5% → 4.3% while inflation fell 7.9% → 1.9%",1],["Further data reference",1],["Inverse relationship: movement down the Phillips Curve",1],["Higher rates reduced demand",1]]},{"t":"text","q":"Explain why both unemployment and inflation rose in 2026.","marks":4,"key":[["Oil price rise was a supply shock",1],["Raised costs: cost-push inflation",1],["Higher rates and weaker demand raised unemployment",1],["The usual trade-off broke down",1]]},{"t":"calc","q":"The labour force was 15.5 million. Calculate the number unemployed at 4.7%.","marks":2,"inputs":[{"label":"Unemployed (people)","ans":728500,"tol":500}],"work":"0.047 × 15 500 000 = 728 500."},{"t":"text","q":"Explain two economic costs of rising unemployment, including the GDP gap.","marks":4,"key":[["GDP gap: output lost",1],["Explained",1],["Second cost identified",1],["Explained",1]]},{"t":"text","q":"Explain two effects of 4.0% inflation on the Australian economy.","marks":4,"key":[["First effect",1],["Explained",1],["Second effect",1],["Explained",1]]}]},{"id":"p1d4","paper":1,"unit":2,"title":"Economic growth and the role of government","stim":"<p><i>Hypothetical economy ($ billion, real). Real GDP last year was $2605b. Population 27.6 million.</i></p><div class=\"tw\"><table><thead><tr><th>Component</th><th>Value</th></tr></thead><tbody><tr><td>C</td><td>1390</td></tr><tr><td>I</td><td>600</td></tr><tr><td>G</td><td>640</td></tr><tr><td>X</td><td>620</td></tr><tr><td>M</td><td>590</td></tr></tbody></table></div>","items":[{"t":"calc","q":"Calculate GDP using the expenditure approach.","marks":2,"inputs":[{"label":"GDP ($b)","ans":2660,"tol":0}],"work":"1390 + 600 + 640 + (620 − 590) = $2660b."},{"t":"calc","q":"Calculate the rate of economic growth.","marks":2,"inputs":[{"label":"Growth (%)","ans":2.11,"tol":0.02}],"work":"(2660 − 2605) ÷ 2605 × 100 = 2.1%."},{"t":"calc","q":"Calculate real GDP per capita.","marks":2,"inputs":[{"label":"Per capita ($)","ans":96377,"tol":2}],"work":"$2660b ÷ 27.6m = $96 377."},{"t":"text","q":"Using the circular flow, explain the effect of a $20 billion rise in government spending.","marks":4,"key":[["G is an injection",1],["Injections now exceed leakages",1],["Output, income and employment rise through rounds of spending",1],["New higher equilibrium once leakages match",1]]},{"t":"text","q":"Growth is below trend and unemployment rising. Identify the phase and describe two other features.","marks":3,"key":[["Contraction",1],["First feature (falling confidence, easing inflation, falling investment, lower rates)",1],["Second feature",1]]},{"t":"text","diagram":true,"q":"Using a Lorenz curve, explain how progressive tax and transfers affect income distribution.","marks":4,"key":[["Lorenz diagram with line of equality",1],["Progressive tax lowers high incomes",1],["Transfers raise low incomes",1],["Curve moves towards the diagonal; Gini falls",1]]},{"t":"text","q":"Outline one limitation of real GDP per capita as a measure of living standards.","marks":3,"key":[["Limitation identified",1],["Explained",1],["Developed (e.g. averages hide inequality)",1]]}]},{"id":"p2d1","paper":2,"unit":1,"title":"Rent caps in the Perth rental market","stim":"<p><i>Perth rents rose strongly from 2022 as population growth outpaced new housing, and rental vacancy rates were very low. Some groups have called for a cap on rents. The schedule below is a hypothetical market for apartments.</i></p><div class=\"tw\"><table><thead><tr><th>Weekly rent ($)</th><th>Quantity demanded (000)</th><th>Quantity supplied (000)</th></tr></thead><tbody><tr><td>400</td><td>90</td><td>40</td></tr><tr><td>500</td><td>80</td><td>55</td></tr><tr><td>600</td><td>70</td><td>70</td></tr><tr><td>700</td><td>60</td><td>85</td></tr><tr><td>800</td><td>50</td><td>100</td></tr></tbody></table></div>","items":[{"t":"calc","q":"Calculate the equilibrium weekly rent and quantity of apartments.","marks":2,"inputs":[{"label":"Rent ($)","ans":600,"tol":0},{"label":"Quantity (000)","ans":70,"tol":0}],"work":"Quantity demanded = quantity supplied = 70 000 at $600."},{"t":"calc","q":"The government caps rents at $500 a week. Calculate the resulting shortage.","marks":2,"inputs":[{"label":"Shortage (000)","ans":25,"tol":0}],"work":"At $500: demanded 80 000, supplied 55 000. Shortage = 25 000."},{"t":"text","q":"Using a diagram, demonstrate the effect of the $500 rent cap on the market.","marks":5,"key":[["Correctly labelled axes, demand and supply",1],["Ceiling drawn below equilibrium at $500",1],["Shortage shown between Qs and Qd",1],["Deadweight loss shaded",1],["Refers to the diagram in explanation",1]],"diagram":true},{"t":"text","q":"Explain two likely consequences of the rent cap for tenants and landlords.","marks":4,"key":[["First consequence (e.g. shortage, waiting lists)",1],["Explained",1],["Second consequence (e.g. black market, poorer maintenance, fewer new rentals)",1],["Explained",1]]},{"t":"text","q":"Discuss an alternative policy that could improve rental affordability, and evaluate it against the rent cap.","marks":7,"key":[["Alternative policy identified (e.g. rent assistance, increasing housing supply)",1],["How it works in the market (shift of D or S)",2],["Advantage over a rent cap",1],["Disadvantage or cost",1],["Equity and efficiency considered",1],["Supported judgement",1]]}]},{"id":"p2d2","paper":2,"unit":1,"title":"Tobacco excise","stim":"<p><i>From 1 September 2026, excise on a cigarette is about $1.55 per stick (ATO). Tobacco excise revenue fell from $16.3 billion in 2019-20 to an expected $7.4 billion in 2025-26, as fewer people smoke and illegal tobacco has grown (University of Sydney).</i></p><p>Hypothetical market for packs of cigarettes:</p><div class=\"tw\"><table><thead><tr><th></th><th>Before excise rise</th><th>After a $5 per pack rise</th></tr></thead><tbody><tr><td>Price per pack</td><td>$50</td><td>$54</td></tr><tr><td>Packs sold (million per year)</td><td>100</td><td>96</td></tr></tbody></table></div><p class=\"note\">Source: ATO, Excise duty rates for tobacco; University of Sydney (2025).</p>","items":[{"t":"calc","q":"Calculate how much of the $5 increase is paid by consumers and how much by producers.","marks":2,"inputs":[{"label":"Consumers ($)","ans":4,"tol":0},{"label":"Producers ($)","ans":1,"tol":0}],"work":"Consumers: $54 − $50 = $4. Producers: $5 − $4 = $1."},{"t":"calc","q":"Calculate the price elasticity of demand.","marks":2,"inputs":[{"label":"PED","ans":0.5,"tol":0.01}],"work":"%ΔP = 4 ÷ 50 = 8%. %ΔQ = 4 ÷ 100 = 4%. PED = 4 ÷ 8 = 0.5 (inelastic)."},{"t":"calc","q":"Calculate the extra excise revenue raised by the $5 increase.","marks":2,"inputs":[{"label":"Extra revenue ($ million)","ans":480,"tol":0}],"work":"$5 × 96 million = $480 million."},{"t":"text","q":"Explain why consumers bear most of the burden of the tax.","marks":4,"key":[["Excise shifts supply up by the tax",1],["Demand for cigarettes is inelastic (addictive, few substitutes)",1],["Price rises by most of the tax; quantity falls little",1],["Uses the data ($4 of $5)",1]]},{"t":"text","q":"Explain why total tobacco excise revenue has fallen even though the excise rate keeps rising.","marks":4,"key":[["Demand more elastic in the long run (people quit)",1],["Growth of illegal tobacco and vapes (substitutes)",1],["Smaller quantity taxed outweighs higher rate",1],["Uses data ($16.3b to $7.4b)",1]]},{"t":"text","q":"Evaluate tobacco excise as a policy to correct the negative externality of smoking.","marks":6,"key":[["Identifies the externality (health costs, second-hand smoke)",1],["Tax internalises the external cost; output moves towards social optimum",1],["Strength (e.g. reduced smoking, revenue)",1],["Weakness (e.g. regressive, black market)",1],["Uses evidence from the stimulus",1],["Supported judgement",1]]}]},{"id":"p2d3","paper":2,"unit":2,"title":"The circular flow and the multiplier","stim":"<p><i>A hypothetical economy is in equilibrium with national income of $1000 billion.</i></p><div class=\"tw\"><table><thead><tr><th>Leakages</th><th>$b</th><th>Injections</th><th>$b</th></tr></thead><tbody><tr><td>Saving (S)</td><td>100</td><td>Investment (I)</td><td>120</td></tr><tr><td>Taxation (T)</td><td>150</td><td>Government spending (G)</td><td>160</td></tr><tr><td>Imports (M)</td><td>150</td><td>Exports (X)</td><td>120</td></tr></tbody></table></div><p><i>Of each extra dollar of income, 40 cents leaks out as saving, tax or imports.</i></p>","items":[{"t":"calc","q":"Calculate total leakages and total injections.","marks":2,"inputs":[{"label":"Leakages ($b)","ans":400,"tol":0},{"label":"Injections ($b)","ans":400,"tol":0}],"work":"S + T + M = 100 + 150 + 150 = 400. I + G + X = 120 + 160 + 120 = 400. The economy is in equilibrium."},{"t":"calc","q":"Calculate the value of the multiplier.","marks":2,"inputs":[{"label":"Multiplier","ans":2.5,"tol":0.01}],"work":"k = 1 ÷ 0.4 = 2.5."},{"t":"calc","q":"The government increases spending by $20 billion. Calculate the new equilibrium level of income.","marks":2,"inputs":[{"label":"New income ($b)","ans":1050,"tol":0}],"work":"ΔY = 2.5 × 20 = 50. New Y = 1000 + 50 = $1050b."},{"t":"text","q":"Explain the multiplier process that follows the increase in government spending.","marks":4,"key":[["Initial injection becomes income for households/firms",1],["Part of extra income is spent, creating further rounds",1],["Each round is smaller because of leakages",1],["Total rise in income exceeds the initial injection",1]]},{"t":"text","q":"Explain what would happen to national income if imports rose by $30 billion with no change in injections.","marks":4,"key":[["Leakages exceed injections",1],["Less spending on domestic output",1],["Firms cut production and employment",1],["Income falls (by a multiple of the change)",1]]},{"t":"text","q":"Discuss why an increase in household saving could reduce national income in the short run but benefit the economy in the long run.","marks":6,"key":[["Saving is a leakage; spending and income fall in the short run",2],["Falling income can mean total saving does not rise (paradox of thrift)",1],["Saving funds investment through the financial sector",1],["More capital raises future productive capacity",1],["Supported conclusion",1]]}]},{"id":"p2d4","paper":2,"unit":2,"title":"Building a consumer price index","stim":"<p><i>A simplified CPI basket. Group price changes for housing, food, transport and recreation are the ABS figures for the year to June 2026; “other” is hypothetical.</i></p><div class=\"tw\"><table><thead><tr><th>Group</th><th>Weight</th><th>Index, year 1</th><th>Index, year 2</th></tr></thead><tbody><tr><td>Housing</td><td>22</td><td>100.0</td><td>106.8</td></tr><tr><td>Food</td><td>17</td><td>100.0</td><td>103.3</td></tr><tr><td>Transport</td><td>12</td><td>100.0</td><td>100.1</td></tr><tr><td>Recreation</td><td>13</td><td>100.0</td><td>103.3</td></tr><tr><td>Other</td><td>36</td><td>100.0</td><td>103.0</td></tr></tbody></table></div><p><i>Headline CPI rose 3.8% and the trimmed mean 3.6% in the year to June 2026. Electricity prices rose 22.4% as government rebates ended.</i></p><p class=\"note\">Source: ABS, CPI rose 3.8% in the year to June 2026.</p>","items":[{"t":"calc","q":"Calculate the weighted price index for year 2 (one decimal place).","marks":3,"inputs":[{"label":"Index","ans":103.6,"tol":0.05}],"work":"(22×106.8 + 17×103.3 + 12×100.1 + 13×103.3 + 36×103.0) ÷ 100 = 10 357.8 ÷ 100 = 103.6."},{"t":"calc","q":"Calculate the inflation rate for this basket.","marks":1,"inputs":[{"label":"Inflation (%)","ans":3.6,"tol":0.05}],"work":"(103.6 − 100) ÷ 100 × 100 = 3.6%."},{"t":"calc","q":"Calculate how many percentage points of inflation came from housing.","marks":2,"inputs":[{"label":"Contribution (pp)","ans":1.5,"tol":0.05}],"work":"22 × 6.8 ÷ 100 = 1.5 percentage points."},{"t":"text","q":"Explain why the CPI is weighted and why the ABS updates the weights every year.","marks":4,"key":[["Items differ in importance in household budgets",1],["Weights reflect shares of spending",1],["Spending patterns change (new products, substitution)",1],["Annual updates keep the index representative",1]]},{"t":"text","q":"Explain two limitations of the CPI as a measure of the cost of living.","marks":4,"key":[["Limitation 1 (capital cities only / average household)",1],["Explained",1],["Limitation 2 (substitution, quality change)",1],["Explained",1]]},{"t":"text","q":"Distinguish between headline and underlying inflation and explain why the RBA focuses on the trimmed mean, using the stimulus.","marks":6,"key":[["Headline: change in all-groups CPI",1],["Underlying removes volatile/extreme price changes",1],["Trimmed mean drops top and bottom 15%",1],["Shows the trend, guides policy better",1],["Uses electricity/rebate example",1],["Headline 3.8% vs trimmed mean 3.6%",1]]}]},{"id":"p3d1","paper":3,"unit":1,"title":"Supermarket competition","stim":"<p><i>The ACCC’s supermarkets inquiry (final report, March 2025) found that Coles and Woolworths hold about 38% and 29% of national grocery sales, with ALDI the next largest competitor. It found barriers to entry are high and made 20 recommendations, including clearer unit pricing and changes to the Food and Grocery Code. The government did not support powers to break up the major chains.</i></p><p class=\"note\">Source: ACCC Supermarkets Inquiry, final report (2025).</p>","items":[{"t":"calc","q":"Calculate the combined share of grocery sales held by Coles and Woolworths.","marks":1,"inputs":[{"label":"Combined share (%)","ans":67,"tol":0}],"work":"38% + 29% = 67%."},{"t":"text","q":"Identify the market structure of Australian grocery retailing and outline two of its features.","marks":3,"key":[["Oligopoly identified",1],["Feature 1 (few dominant firms / interdependence)",1],["Feature 2 (high barriers to entry / differentiated products)",1]]},{"t":"text","q":"Using a diagram, demonstrate how market power can lead to a deadweight loss compared with a competitive market.","marks":6,"key":[["Labelled axes, demand and supply (costs)",1],["Competitive equilibrium Pc, Qc",1],["Higher price Pm and lower output Qm with market power",1],["Deadweight loss shaded",1],["Consumer surplus transferred to the firm",1],["Refers to the diagram",1]],"diagram":true},{"t":"text","q":"Explain two barriers to entry in the supermarket industry.","marks":4,"key":[["Barrier 1 (economies of scale, distribution networks)",1],["Explained",1],["Barrier 2 (access to sites/planning, brand loyalty, buying power)",1],["Explained",1]]},{"t":"text","q":"Evaluate one policy that could increase competition or protect consumers in grocery retailing.","marks":6,"key":[["Policy identified (e.g. unit pricing, mandatory Grocery Code, planning reform, divestiture)",1],["How it works",1],["Expected effect on price, output or efficiency",1],["Strength",1],["Limitation",1],["Supported judgement",1]]}]},{"id":"p3d2","paper":3,"unit":1,"title":"A cyclone and the banana market","stim":"<p><i>In 2011 Cyclone Yasi destroyed much of the north Queensland banana crop, and banana prices rose by around 400%. The schedule below is a hypothetical banana market before and after a cyclone.</i></p><div class=\"tw\"><table><thead><tr><th>Price ($/kg)</th><th>Quantity demanded (000 t)</th><th>Supply before (000 t)</th><th>Supply after (000 t)</th></tr></thead><tbody><tr><td>2</td><td>60</td><td>20</td><td>0</td></tr><tr><td>3</td><td>50</td><td>30</td><td>10</td></tr><tr><td>4</td><td>40</td><td>40</td><td>20</td></tr><tr><td>5</td><td>30</td><td>50</td><td>30</td></tr><tr><td>6</td><td>20</td><td>60</td><td>40</td></tr><tr><td>7</td><td>10</td><td>70</td><td>50</td></tr></tbody></table></div>","items":[{"t":"calc","q":"Calculate the equilibrium price and quantity before the cyclone.","marks":2,"inputs":[{"label":"Price ($/kg)","ans":4,"tol":0},{"label":"Quantity (000 t)","ans":40,"tol":0}],"work":"Quantity demanded = supplied = 40 at $4."},{"t":"calc","q":"Calculate the shortage at the original price immediately after the cyclone.","marks":2,"inputs":[{"label":"Shortage (000 t)","ans":20,"tol":0}],"work":"At $4: demanded 40, supplied 20. Shortage = 20."},{"t":"calc","q":"Calculate the new equilibrium price and quantity.","marks":2,"inputs":[{"label":"Price ($/kg)","ans":5,"tol":0},{"label":"Quantity (000 t)","ans":30,"tol":0}],"work":"At $5: demanded 30 = supplied 30."},{"t":"text","q":"Using the four-stage explanation model, explain how the market moves to its new equilibrium.","marks":5,"key":[["Cause: supply decreases (shifts left)",1],["Shortage at the old price",1],["Price is bid up",1],["Demand contracts and supply extends",1],["New equilibrium at higher P, lower Q (uses data)",1]]},{"t":"calc","q":"Calculate the price elasticity of demand between $4 and $5.","marks":2,"inputs":[{"label":"PED","ans":1,"tol":0.01}],"work":"%ΔP = 1 ÷ 4 = 25%. %ΔQ = 10 ÷ 40 = 25%. PED = 1.0 (unit elastic)."},{"t":"text","q":"Explain whether the banana market is still efficient after the cyclone.","marks":4,"key":[["Total surplus falls because of the supply shock",1],["Price is free to adjust; new equilibrium where MB = MC",1],["No deadweight loss from intervention",1],["So still efficient, though society is worse off",1]]},{"t":"text","q":"Explain why economists would advise against a price ceiling on bananas after the cyclone.","marks":3,"key":[["Ceiling below new equilibrium creates a shortage",1],["Price signal no longer encourages supply or rationing",1],["Deadweight loss / black markets",1]]}]},{"id":"p3d3","paper":3,"unit":2,"title":"Growth, population and productivity","stim":"<p><i>In the June quarter 2026, real GDP grew 0.4%, the same as population growth, so GDP per person was flat. Over the year, real GDP grew 2.1% and GDP per capita 0.7%. Labour productivity did not grow in the quarter (ABS).</i></p><p>Hypothetical data:</p><div class=\"tw\"><table><thead><tr><th></th><th>Year 1</th><th>Year 2</th></tr></thead><tbody><tr><td>Real GDP ($ billion)</td><td>2650</td><td>2705</td></tr><tr><td>Population (million)</td><td>27.5</td><td>28.0</td></tr></tbody></table></div><p class=\"note\">Source: ABS, Australian National Accounts, June quarter 2026.</p>","items":[{"t":"calc","q":"Calculate the rate of real GDP growth (one decimal place).","marks":2,"inputs":[{"label":"Growth (%)","ans":2.1,"tol":0.05}],"work":"(2705 − 2650) ÷ 2650 × 100 = 2.1%."},{"t":"calc","q":"Calculate real GDP per capita in Year 2 (to the nearest dollar).","marks":2,"inputs":[{"label":"GDP per capita ($)","ans":96607,"tol":5}],"work":"$2705b ÷ 28.0m = $96 607."},{"t":"calc","q":"Calculate the growth in real GDP per capita.","marks":2,"inputs":[{"label":"Growth (%)","ans":0.25,"tol":0.06}],"work":"Year 1: 2650 ÷ 27.5 = $96 364. Growth = (96 607 − 96 364) ÷ 96 364 × 100 = 0.25% (about 0.3%)."},{"t":"text","q":"Explain why real GDP per capita is a better guide to living standards than real GDP.","marks":4,"key":[["GDP can grow because population grows",1],["Per capita shows output per person",1],["Uses data: 2.1% growth but only ~0.25% per person",1],["Still limited (distribution, non-market activity)",1]]},{"t":"text","q":"Explain two ways productivity growth could be increased in Australia.","marks":4,"key":[["Way 1 (capital deepening, technology, skills, competition)",1],["Explained",1],["Way 2",1],["Explained",1]]},{"t":"text","q":"Discuss two costs of economic growth.","marks":6,"key":[["Cost 1 identified",1],["Explained with example",2],["Cost 2 identified",1],["Explained with example",2]]}]},{"id":"p3d4","paper":3,"unit":2,"title":"The labour market","stim":"<div class=\"tw\"><table><thead><tr><th>Labour force estimates (seasonally adjusted)</th><th>August 2026</th></tr></thead><tbody><tr><td>Employed</td><td>14 836 600</td></tr><tr><td>Unemployed</td><td>722 900</td></tr><tr><td>Participation rate</td><td>67.1%</td></tr></tbody></table></div><p><i>In September 2026 the unemployment rate was 4.7% and the underemployment rate was 6.3% (ABS).</i></p><p class=\"note\">Source: ABS, Labour Force, Australia, August and September 2026.</p>","items":[{"t":"calc","q":"Calculate the labour force in August 2026 (in millions, two decimal places).","marks":1,"inputs":[{"label":"Labour force (million)","ans":15.56,"tol":0.01}],"work":"14 836 600 + 722 900 = 15 559 500 ≈ 15.56 million."},{"t":"calc","q":"Calculate the unemployment rate in August 2026.","marks":2,"inputs":[{"label":"Unemployment rate (%)","ans":4.6,"tol":0.05}],"work":"722 900 ÷ 15 559 500 × 100 = 4.6%."},{"t":"calc","q":"Calculate the civilian population aged 15 and over (in millions, two decimal places).","marks":2,"inputs":[{"label":"Population 15+ (million)","ans":23.19,"tol":0.02}],"work":"15.5595 ÷ 0.671 = 23.19 million."},{"t":"calc","q":"Calculate the labour underutilisation rate for September 2026.","marks":1,"inputs":[{"label":"Underutilisation (%)","ans":11,"tol":0.05}],"work":"4.7% + 6.3% = 11.0%."},{"t":"text","q":"Explain why the unemployment rate may understate the amount of spare capacity in the labour market.","marks":4,"key":[["One hour of paid work counts as employed",1],["Underemployed want more hours",1],["Discouraged workers are not counted",1],["Underutilisation (11.0%) is more than double unemployment",1]]},{"t":"text","q":"Distinguish between cyclical and structural unemployment, using an example of each.","marks":4,"key":[["Cyclical: lack of demand in a downturn",1],["Example",1],["Structural: mismatch of skills/location",1],["Example",1]]},{"t":"text","q":"Discuss the costs of unemployment to individuals and to the economy.","marks":6,"key":[["Individual costs (income, skills, health)",2],["Economic costs (lost output/GDP gap, lower tax revenue, higher welfare)",2],["Social costs (inequality, crime, family stress)",1],["Supported discussion",1]]}]},{"id":"p4d1","paper":4,"unit":1,"title":"WA demersal fishing","stim":"<p><i>To help stocks of pink snapper and dhufish recover, the WA Government has banned boat-based recreational fishing for demersal scalefish in the West Coast bioregion until spring 2027. New bag and size limits apply in other regions (DPIRD).</i></p><p>Hypothetical fishing effort and total catch in a bioregion:</p><div class=\"tw\"><table><thead><tr><th>Boats fishing</th><th>100</th><th>200</th><th>300</th><th>400</th></tr></thead><tbody><tr><td>Total catch (tonnes)</td><td>500</td><td>900</td><td>1100</td><td>1000</td></tr></tbody></table></div><p class=\"note\">Source: DPIRD, West Coast demersal scalefish: information for recreational fishers.</p>","items":[{"t":"text","q":"Classify demersal fish stocks as a type of good and justify your answer.","marks":3,"key":[["Common resource",1],["Rival: fish caught by one are unavailable to others",1],["Non-excludable: hard to stop people fishing",1]]},{"t":"calc","q":"Calculate the catch per boat when 100 boats fish and when 400 boats fish.","marks":2,"inputs":[{"label":"100 boats (t per boat)","ans":5,"tol":0},{"label":"400 boats (t per boat)","ans":2.5,"tol":0.01}],"work":"500 ÷ 100 = 5 t. 1000 ÷ 400 = 2.5 t."},{"t":"text","q":"Using the data, explain the tragedy of the commons.","marks":4,"key":[["Each fisher gains the full benefit of extra catch",1],["Shares the cost of depletion with everyone",1],["So effort exceeds the sustainable level",1],["Data: total catch falls from 1100 t to 1000 t as boats rise to 400",1]]},{"t":"text","q":"Explain how the West Coast fishing closure aims to correct the market failure, and outline one weakness.","marks":5,"key":[["Closure reduces effort/catch to allow stocks to rebuild",2],["Moves use towards sustainable level for future users",1],["Weakness (e.g. cost to fishers and tourism, enforcement, displacement to other regions)",2]]},{"t":"text","q":"Discuss one alternative policy for managing the fishery.","marks":6,"key":[["Policy identified (quotas, ITQs, licences, fees, size/bag limits)",1],["How it works",2],["Strength",1],["Weakness",1],["Supported judgement",1]]}]},{"id":"p4d2","paper":4,"unit":1,"title":"The minimum wage","stim":"<p><i>From 1 July 2026 the Fair Work Commission raised the national minimum wage by 4.75% to $26.44 an hour, or $1004.90 for a 38-hour week. Annual CPI inflation was 3.8% in June 2026.</i></p><p class=\"note\">Source: Fair Work Commission Annual Wage Review 2026; ABS CPI June 2026.</p>","items":[{"t":"calc","q":"Calculate the annual earnings of a full-time minimum-wage worker (52 weeks).","marks":2,"inputs":[{"label":"Annual earnings ($)","ans":52254.8,"tol":1}],"work":"$1004.90 × 52 = $52 254.80."},{"t":"calc","q":"Calculate the approximate real increase in the minimum wage.","marks":2,"inputs":[{"label":"Real increase (%)","ans":0.95,"tol":0.06}],"work":"4.75% − 3.8% ≈ 0.95% (about 1%)."},{"t":"text","q":"Using a diagram, demonstrate the effect of a minimum wage set above the equilibrium wage in a labour market.","marks":5,"key":[["Axes: wage and quantity of labour",1],["Demand for labour (firms) and supply of labour (workers)",1],["Minimum wage above equilibrium",1],["Surplus of labour (unemployment) shown",1],["Refers to diagram",1]],"diagram":true},{"t":"text","q":"Explain why moderate minimum wage increases may have only small effects on employment.","marks":4,"key":[["Demand for low-paid labour may be inelastic",1],["Higher pay boosts spending/demand",1],["Lower staff turnover, higher productivity",1],["Increase is small in real terms",1]]},{"t":"text","q":"Discuss the minimum wage in terms of efficiency and equity.","marks":7,"key":[["Efficiency: price floor may create DWL/unemployment",2],["Equity: raises incomes of the lowest paid; vertical equity",2],["Considers who gains and who may lose",1],["Uses stimulus data",1],["Supported judgement",1]]}]},{"id":"p4d3","paper":4,"unit":2,"title":"Australia’s business cycle, 2020 to 2026","stim":"<div class=\"tw\"><table><thead><tr><th>Quarter</th><th>Real GDP growth (% over year)</th><th>Unemployment (%)</th></tr></thead><tbody><tr><td>Jun 2020</td><td>−5.8</td><td>7.4</td></tr><tr><td>Jun 2021</td><td>10.3</td><td>5.0</td></tr><tr><td>Dec 2022</td><td>3.1</td><td>3.5</td></tr><tr><td>Jun 2024</td><td>0.9</td><td>4.1</td></tr><tr><td>Dec 2025</td><td>2.6</td><td>4.1</td></tr><tr><td>Jun 2026</td><td>2.1</td><td>4.4</td></tr></tbody></table></div><p><i>Headline inflation peaked at 7.8% in the December quarter 2022, fell to 2.1% in June 2025 and rose to 3.8% in June 2026.</i></p><p class=\"note\">Source: ABS National Accounts and Labour Force; ABS CPI.</p>","items":[{"t":"text","q":"Identify the phase of the business cycle in the June quarter 2020 and give two pieces of evidence.","marks":3,"key":[["Recession / trough",1],["GDP fell 5.8% over the year",1],["Unemployment high at 7.4%",1]]},{"t":"calc","q":"Calculate the fall in the unemployment rate from June 2020 to December 2022 (percentage points).","marks":2,"inputs":[{"label":"Fall (pp)","ans":3.9,"tol":0.05}],"work":"7.4 − 3.5 = 3.9 percentage points."},{"t":"text","q":"Using the data, explain why unemployment is described as a lagging indicator.","marks":4,"key":[["Lagging indicators change after activity changes",1],["GDP growth peaked in 2021",1],["Unemployment kept falling until late 2022",1],["Firms hire/fire only once they are confident of the trend",1]]},{"t":"text","q":"Identify two leading indicators and explain why they are useful to policymakers.","marks":4,"key":[["Leading indicator 1 (building approvals, confidence, share prices, job ads)",1],["Leading indicator 2",1],["They turn before the economy",1],["Allow earlier policy responses",1]]},{"t":"text","q":"Using the data, discuss the relationship between unemployment and inflation in Australia from 2022 to 2026.","marks":7,"key":[["Short-run trade-off (Phillips curve) explained",2],["2022: low unemployment, high inflation",1],["2023–25: unemployment rose as inflation fell (movement along the curve)",1],["2026: both rose: a supply shock shifts the curve",2],["Supported conclusion",1]]}]},{"id":"p4d4","paper":4,"unit":2,"title":"The 2026-27 Budget and income tax","stim":"<p><i>In 2026-27 the Commonwealth expects revenue of $798.1 billion and expenses of $833.3 billion. Individuals’ income tax provides 48% of revenue.</i></p><div class=\"tw\"><table><thead><tr><th>Taxable income</th><th>Tax on this income (2026-27)</th></tr></thead><tbody><tr><td>$0 – $18 200</td><td>Nil</td></tr><tr><td>$18 201 – $45 000</td><td>15c for each $1 over $18 200</td></tr><tr><td>$45 001 – $135 000</td><td>$4020 + 30c for each $1 over $45 000</td></tr><tr><td>$135 001 – $190 000</td><td>$31 020 + 37c for each $1 over $135 000</td></tr><tr><td>$190 001 and over</td><td>$51 370 + 45c for each $1 over $190 000</td></tr></tbody></table></div><p class=\"note\">Source: ATO resident tax rates 2026-27; Budget 2026-27. Ignores the Medicare levy and offsets.</p>","items":[{"t":"calc","q":"Calculate the income tax payable on a taxable income of $85 000.","marks":2,"inputs":[{"label":"Tax ($)","ans":16020,"tol":0}],"work":"$4020 + 0.30 × ($85 000 − $45 000) = $4020 + $12 000 = $16 020."},{"t":"calc","q":"Calculate the average tax rate on $85 000 (one decimal place).","marks":1,"inputs":[{"label":"Average rate (%)","ans":18.8,"tol":0.1}],"work":"$16 020 ÷ $85 000 × 100 = 18.8%."},{"t":"calc","q":"State the marginal tax rate on $85 000.","marks":1,"inputs":[{"label":"Marginal rate (%)","ans":30,"tol":0}],"work":"The next dollar is taxed at 30c, so the marginal rate is 30%."},{"t":"calc","q":"Calculate the income tax payable on a taxable income of $150 000.","marks":2,"inputs":[{"label":"Tax ($)","ans":36570,"tol":0}],"work":"$31 020 + 0.37 × ($150 000 − $135 000) = $31 020 + $5550 = $36 570."},{"t":"text","q":"Using your calculations, explain why Australia’s income tax system is progressive.","marks":4,"key":[["Average rate rises as income rises",1],["$85 000: 18.8%",1],["$150 000: 24.4%",1],["Higher earners pay a larger share of income",1]]},{"t":"text","q":"Explain bracket creep and its effect on taxpayers.","marks":4,"key":[["Wages rise with inflation",1],["More income taxed at higher marginal rates",1],["Average tax rate rises with no rise in real income",1],["Real disposable income falls; government gains revenue",1]]},{"t":"text","q":"Discuss how the government can use the Budget to stabilise the business cycle.","marks":6,"key":[["Expansionary policy in a downturn (higher G, lower T)",2],["Contractionary policy in a boom",1],["Automatic stabilisers",1],["Limitation (time lags, debt, coordination with RBA)",1],["Uses 2026-27 Budget data",1]]}]}],"ext":[{"id":"p1a1","paper":1,"unit":1,"q":"<p>Markets are often described as an efficient way to allocate scarce resources.</p><p>(a) Using a demand and supply diagram, explain how the price mechanism allocates resources and maximises total surplus. (8 marks)</p><p>(b) Discuss two types of market failure, recommending a policy for each. (12 marks)</p>","key":[["(a) Labelled demand and supply diagram",2],["(a) Shortage pushes price up; surplus pushes it down",3],["(a) At equilibrium MB = MC; total surplus maximised",2],["(a) Australian example",1],["(b) Failure 1: cause, effect on efficiency (diagram/DWL), policy evaluated",6],["(b) Failure 2: cause, effect on efficiency, policy evaluated",6]]},{"id":"p1a2","paper":1,"unit":1,"q":"<p>Governments often intervene in markets to help consumers.</p><p>(a) Using a diagram, analyse a rent ceiling set below equilibrium. (8 marks)</p><p>(b) Using a diagram, analyse a per-unit subsidy for electric vehicles. Evaluate which policy better helps consumers. (12 marks)</p>","key":[["(a) Diagram with ceiling below equilibrium",2],["(a) Shortage = Qd − Qs",2],["(a) DWL and further effects (queues, quality, black markets)",3],["(a) Conclusion",1],["(b) Subsidy diagram; price falls, quantity rises, CS and PS rise",4],["(b) Cost to government; DWL unless an external benefit exists",2],["(b) EV emissions benefit: subsidy may correct a positive externality",2],["(b) Comparison and supported judgement",4]]},{"id":"p1b1","paper":1,"unit":2,"q":"<p>Using the business cycle model and data from the last five years, explain Australia's macroeconomic performance in terms of (a) economic growth (7 marks), (b) inflation (7 marks) and (c) unemployment (6 marks).</p>","key":[["(a) Business cycle diagram",2],["(a) Growth data 3.6%, 1.5%, 1.3%, 2.4%, slowing in 2026",3],["(a) Causes linked to phases",2],["(b) Peak 7.9% Dec 2022 with demand-pull and cost-push causes",3],["(b) Fall to 1.9% by June 2025",2],["(b) Rise to 4.0% by Aug 2026; trimmed mean 3.6%; target 2–3%",2],["(c) 4.9% → 3.5% → 4.4% → 4.7% with dates",3],["(c) Mainly cyclical; linked to rates and the cycle",2],["(c) Participation and underemployment noted",1]]},{"id":"p1b2","paper":1,"unit":2,"q":"<p>(a) Outline the four macroeconomic objectives of the Australian Government. (6 marks)</p><p>(b) Using the Phillips Curve and Australian data from 2022 to 2026, discuss the conflict between price stability and full employment. (14 marks)</p>","key":[["(a) Four objectives outlined",4],["(a) Targets or measures given",2],["(b) Accurate, labelled Phillips Curve",3],["(b) Trade-off explained",3],["(b) Australian evidence 2022, 2023–25 and 2026",5],["(b) Policy implications (RBA rate rises)",2],["(b) Supported judgement, short run vs long run",1]]},{"id":"p2x1","paper":2,"unit":1,"q":"<p>(a) Explain the determinants of the price elasticity of demand, using examples. (8 marks)</p><p>(b) Using diagrams, analyse how the incidence of an excise tax depends on the price elasticity of demand, and discuss why governments place excise on goods such as tobacco and fuel. (12 marks)</p>","key":[["(a) Defines PED with the formula",1],["(a) Explains at least four determinants (substitutes, necessity, share of income, time, habit, definition)",4],["(a) Relevant examples for each",2],["(a) Links each determinant to elastic or inelastic demand",1],["(b) Correct diagrams for inelastic and elastic demand with S + tax",3],["(b) Shows consumer and producer shares of the tax",2],["(b) Explains the incidence falls on the more inelastic side",2],["(b) Reasons for excise: revenue, reducing harm, correcting externalities",3],["(b) Evaluation (e.g. regressive, black markets) and judgement",2]]},{"id":"p2x2","paper":2,"unit":1,"q":"<p>(a) Explain how firms gain and use market power. (8 marks)</p><p>(b) Using a diagram, analyse the effect of market power on efficiency, and evaluate the role of the ACCC in promoting competition, referring to the supermarket industry. (12 marks)</p>","key":[["(a) Defines market power",1],["(a) Explains barriers to entry (at least three)",3],["(a) Explains other sources (mergers, collusion, differentiation)",2],["(a) Explains how power is used (raising price, restricting output)",2],["(b) Diagram comparing competitive and market power outcomes with DWL",3],["(b) Explains loss of total surplus and transfer from consumers",2],["(b) ACCC role: enforcing the Competition and Consumer Act, merger review",2],["(b) Supermarket inquiry findings and recommendations",3],["(b) Supported judgement on effectiveness",2]]},{"id":"p2x3","paper":2,"unit":2,"q":"<p>(a) Explain the determinants of economic growth in Australia. (8 marks)</p><p>(b) Discuss the benefits and costs of economic growth, including the importance of sustainability. (12 marks)</p>","key":[["(a) Defines economic growth (increase in real GDP / productive capacity)",1],["(a) Explains supply-side determinants (labour, capital, technology, resources, enterprise)",4],["(a) Explains the role of productivity",2],["(a) Australian or WA example",1],["(b) At least two benefits explained",4],["(b) At least two costs explained",4],["(b) Explains sustainable growth",2],["(b) Supported judgement",2]]},{"id":"p2x4","paper":2,"unit":2,"q":"<p>(a) Explain how inflation is measured in Australia and the limitations of this measure. (8 marks)</p><p>(b) Discuss the causes and consequences of Australia’s inflation since 2021. (12 marks)</p>","key":[["(a) Defines inflation",1],["(a) Explains the CPI: basket, weights, capital cities, monthly measure",3],["(a) Headline vs underlying (trimmed mean)",2],["(a) Two limitations of the CPI",2],["(b) Demand-pull causes after COVID with data",3],["(b) Cost-push causes (supply chains, energy, 2026 oil shock)",3],["(b) Consequences (real incomes, redistribution, interest rates, competitiveness)",4],["(b) Uses Australian data and reaches a judgement",2]]},{"id":"p3x1","paper":3,"unit":1,"q":"<p>(a) Using a diagram, explain why climate change is described as a market failure. (8 marks)</p><p>(b) Evaluate two policies Australia could use to reduce greenhouse gas emissions. (12 marks)</p>","key":[["(a) Defines a negative externality",1],["(a) Diagram: MPC, MSC, MSB with market and social optima",3],["(a) Explains overproduction and DWL",2],["(a) Global and long-term nature; free-rider problem",2],["(b) Policy 1 explained (e.g. carbon tax/price, Safeguard Mechanism)",2],["(b) Policy 1 strengths and weaknesses",2],["(b) Policy 2 explained (e.g. regulation, renewable subsidies, international agreements)",2],["(b) Policy 2 strengths and weaknesses",2],["(b) Australian examples and supported judgement",4]]},{"id":"p3x2","paper":3,"unit":1,"q":"<p>(a) Using examples, distinguish between private goods, public goods and common resources. (8 marks)</p><p>(b) Using a WA example, analyse the tragedy of the commons and evaluate policies to manage it. (12 marks)</p>","key":[["(a) Explains rivalry and excludability",2],["(a) Private goods with example",2],["(a) Public goods and the free-rider problem, with example",2],["(a) Common resources with example",2],["(b) Explains the tragedy of the commons",3],["(b) WA example (demersal fish, Gnangara groundwater)",2],["(b) Evaluates at least two policies (quotas, ITQs, licences, closures, property rights)",5],["(b) Supported judgement",2]]},{"id":"p3x3","paper":3,"unit":2,"q":"<p>(a) Explain how unemployment is measured in Australia and distinguish between the types of unemployment. (8 marks)</p><p>(b) Discuss the economic and social costs of unemployment and explain why full employment does not mean zero unemployment. (12 marks)</p>","key":[["(a) Labour Force Survey and definitions (employed, unemployed, labour force)",2],["(a) Unemployment rate and participation rate",2],["(a) Explains cyclical, structural, frictional and seasonal unemployment",4],["(b) Economic costs (lost output/GDP gap, tax revenue, welfare spending)",4],["(b) Social costs (health, skills, inequality)",3],["(b) Full employment and the NAIRU explained",3],["(b) Uses Australian data",2]]},{"id":"p3x4","paper":3,"unit":2,"q":"<p>(a) Using a Lorenz curve, explain how income inequality is measured. (8 marks)</p><p>(b) Discuss the causes of income and wealth inequality in Australia and evaluate how the tax-transfer system reduces it. (12 marks)</p>","key":[["(a) Correctly drawn and labelled Lorenz curve with line of equality",3],["(a) Explains quintiles and cumulative shares",2],["(a) Gini coefficient explained with Australian figure",3],["(b) At least three causes of inequality explained",4],["(b) Distinguishes income and wealth inequality with data",2],["(b) Progressive tax, transfers and indirect benefits explained",3],["(b) Evaluation and supported judgement",3]]},{"id":"p4x1","paper":4,"unit":1,"q":"<p>(a) Using diagrams, explain the effects of a price ceiling and a price floor on a market. (10 marks)</p><p>(b) Discuss whether a subsidy is a better way than a price ceiling to help low-income households. (10 marks)</p>","key":[["(a) Price ceiling diagram below equilibrium with shortage and DWL",3],["(a) Explains effects (shortage, black market, rationing)",2],["(a) Price floor diagram above equilibrium with surplus and DWL",3],["(a) Explains effects (surplus, wasted resources)",2],["(b) Explains how a subsidy or cash transfer works",3],["(b) Compares efficiency of each approach",2],["(b) Compares equity/targeting of each approach",2],["(b) Cost to government and supported judgement",3]]},{"id":"p4x2","paper":4,"unit":1,"q":"<p>(a) Distinguish between efficiency and equity, explaining vertical and horizontal equity. (8 marks)</p><p>(b) Discuss the trade-off between efficiency and equity, using examples of government intervention in Australian markets. (12 marks)</p>","key":[["(a) Defines allocative efficiency (total surplus maximised)",2],["(a) Defines equity",1],["(a) Vertical equity explained with example",2],["(a) Horizontal equity explained with example",2],["(a) Distinguishes clearly",1],["(b) Explains the trade-off (bigger pie vs fairer slices)",3],["(b) At least two Australian examples (water pricing, minimum wage, progressive tax, rent controls)",5],["(b) Supported judgement",4]]},{"id":"p4x3","paper":4,"unit":2,"q":"<p>(a) Using the five-sector circular flow model, explain the conditions for equilibrium in the economy. (8 marks)</p><p>(b) Analyse how the COVID-19 pandemic affected the circular flow and evaluate the government’s response. (12 marks)</p>","key":[["(a) Describes the five sectors and the flows between them",3],["(a) Explains leakages and injections",2],["(a) Equilibrium S + T + M = I + G + X",1],["(a) Effect when leakages ≠ injections",2],["(b) Effects on households (saving rose, spending fell)",2],["(b) Effects on firms and the overseas sector",2],["(b) Government injection (JobKeeper, transfers) and the multiplier",3],["(b) Evaluation (debt, inflation, effectiveness) and judgement",5]]},{"id":"p4x4","paper":4,"unit":2,"q":"<p>(a) Outline the main sources of Commonwealth revenue and areas of spending in 2026-27. (8 marks)</p><p>(b) Discuss how the government uses its Budget to achieve its macroeconomic objectives. (12 marks)</p>","key":[["(a) Main revenue sources with shares (income tax, company tax, GST)",3],["(a) Main spending areas with shares (social security, health, education, defence)",3],["(a) Budget outcome (deficit)",2],["(b) Identifies the macroeconomic objectives",2],["(b) Expansionary and contractionary fiscal policy explained",3],["(b) Redistribution through tax and transfers",2],["(b) Limitations and a supported judgement",3],["(b) Uses 2026-27 Budget data",2]]}]}};

/* ---------- scoring ---------- */
function itemsOf(t) {
  const out = [];
  t.di.items.forEach((it, i) => out.push([`${t.id}-di-${i}`, it]));
  t.sa.forEach((g, j) => g.items.forEach((it, i) => out.push([`${t.id}-sa${j}-${i}`, it])));
  return out;
}
function calcEarned(id, it) {
  const c = S.calc[id]; if (!c || !c.checked) return null;
  const ok = it.inputs.filter((inp, k) => { const v = num((c.vals || [])[k]); return v !== null && Math.abs(v - inp.ans) <= inp.tol + 1e-9; }).length;
  return Math.round(it.marks * ok / it.inputs.length);
}
function textEarned(id, it) {
  if (!S.shown[id]) return null;
  const tk = S.ticks[id] || [];
  return it.key.reduce((s, p, k) => s + (tk[k] ? p[1] : 0), 0);
}
function earned(id, it) {
  if (it.t === 'calc') { const c = calcEarned(id, it); if (c !== null) return c; return it.key ? textEarned(id, it) : null; }
  return textEarned(id, it);
}
function topicScore(t) {
  let got = 0, max = 0, done = 0, total = 0;
  t.mcq.forEach((q, i) => { total++; max++; const a = S.mcq[`${t.id}-mcq-${i}`]; if (a !== undefined) { done++; if (a === q.a) got++; } });
  itemsOf(t).forEach(([id, it]) => { total++; max += it.marks; const e = earned(id, it); if (e !== null) { done++; got += e; } });
  return { got, max, done, total, pct: Math.round(100 * got / max) };
}

function paperSel(p) {
  const f = k => BANK[k].filter(q => q.paper === p);
  return { mcq: f('mcq').map(q => q.id), data: f('data').map(q => q.id), extA: f('ext').filter(q => q.unit === 1).map(q => q.id), extB: f('ext').filter(q => q.unit === 2).map(q => q.id) };

function randomSel() {
  const seen = S.seen || {};
  const sh = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = (pool, n) => sh(pool.filter(q => !seen[q.id])).concat(sh(pool.filter(q => seen[q.id]))).slice(0, n).map(q => q.id);
  const quota = { t1: 1, t2: 2, t3: 2, t4: 1, t5: 2, t6: 1, t7: 1, t8: 1, t9: 2, t10: 2, t11: 2, t12: 1, t13: 1, t14: 1 };
  let mcq = []; Object.keys(quota).forEach(t => { mcq = mcq.concat(pick(BANK.mcq.filter(q => q.topic === t), quota[t])); });
  const du = u => BANK.data.filter(q => q.unit === u), xu = u => BANK.ext.filter(q => q.unit === u);

  h += `<div class="timer" id="timer">${marked ? '<span>Exam finished</span>' : `<span class="row" style="gap:10px">${clockText()}</span>`}<span class="row">${marked ? '' : '<button class="btn" data-exam="finish">Finish and mark</button>'}<button class="btn" data-exam="reset">${marked ? 'Start again' : 'Abandon'}</button></span></div>`;
  if (e.confirm) h += `<div class="fb bad">${e.confirm === 'reset' ? 'Clear every exam answer and start again?' : 'Finish now and reveal the answers?'} <span class="row" style="margin-top:8px"><button class="btn primary" data-exam="${e.confirm}-yes">Yes</button><button class="btn" data-exam="cancel">Cancel</button></span></div>`;
  if (marked) {
    const s = examScores();
    if (e.hi !== undefined && S.hist && S.hist[e.hi]) Object.assign(S.hist[e.hi], s);
    h += `<div class="summary"><div><span>Section One</span><b>${s.s1}/20</b></div><div><span>Section Two</span><b>${s.s2}/80</b></div><div><span>Section Three A</span><b>${s.s3a}/20</b></div><div><span>Section Three B</span><b>${s.s3b}/20</b></div><div><span>Weighted result</span><b>${s.pct}%</b></div></div><p class="note">Section Two and Three marks update as you tick the marking keys below.</p>`;
  }
  h += `<div class="sec-head"><h3>Section One: Multiple-choice</h3><span class="score">20 marks · 30 min</span></div>`;
  h += EX.mcq.map((q, i) => mcqHTML(`ex-mcq-${i}`, q, i + 1, marked)).join('');
  h += `<div class="sec-head"><h3>Section Two: Data interpretation</h3><span class="score">80 marks · 90 min</span></div>`;
  EX.data.forEach((q, j) => {
    h += `<div class="stim"><b>${q.label} (20 marks)</b>${q.stim}</div>`;
    h += q.items.map((it, i) => itemHTML(`ex-d${j}-${i}`, it, `(${'abcdefg'[i]})`, mode)).join('');
  });
  const part = (arr, p, title, which) => {
    const c = e[which];
    let s = `<div class="sec-head"><h3>${title}</h3><span class="score">20 marks · 30 min</span></div><div class="choice">${arr.map((q, i) => `<button class="btn" aria-pressed="${c === i}" data-choose="${which}" data-i="${i}">${q.label}</button>`).join('')}</div>`;
    if (c !== undefined && c !== null) {
      const q = arr[c], id = `ex-${p}${c}`, it = { t: 'text', key: q.key, marks: 20, q: '' };
      s += `<div class="stim">${q.q}</div>` + itemHTML(id, Object.assign({}, it, { q: q.label }), '', mode);
    } else s += '<p class="note">Choose one question to answer.</p>';
    return s;
  };
  h += part(EX.extA, 'A', 'Section Three, Part A: Unit 1', 'choiceA');
  h += part(EX.extB, 'B', 'Section Three, Part B: Unit 2', 'choiceB');
  return h;
}

/* ---------- routing ---------- */
function route() { const h = location.hash.slice(1); return byId[h] ? h : (h === 'exam' || h === 'save') ? h : 'home'; }
function render(keepScroll) {
  const r = route();
  const y = window.scrollY;
  buildEX();
  renderNav(r);
  const v = document.getElementById('view');
  v.innerHTML = r === 'home' ? home() : r === 'exam' ? examView() : r === 'save' ? saveView() : topicView(byId[r]);
  if (r === 'save') fillCode();
  if (keepScroll) window.scrollTo(0, y);
  clearInterval(tick);
  if (r === 'exam' && S.exam && S.exam.start && !S.exam.marked) tick = setInterval(() => { const el = document.getElementById('timer'); const span = el && el.querySelector('span'); if (span) span.innerHTML = clockText(); }, 1000);
}
window.addEventListener('hashchange', () => { render(false); window.scrollTo(0, 0); });
document.getElementById('pick').addEventListener('change', e => { location.hash = e.target.value; });

/* ---------- events ---------- */
document.addEventListener('toggle', e => { const el = e.target; if (el && el.dataset && el.dataset.dd) OPEN[el.dataset.dd] = el.open; }, true);
document.addEventListener('click', e => {
  const da = e.target.closest('[data-ddall]');
  if (da) { const [tid, v] = da.dataset.ddall.split(':'); document.querySelectorAll(`details.dd[data-dd^="${tid}-dd-"]`).forEach(el => { el.open = v === '1'; OPEN[el.dataset.dd] = el.open; }); return; }
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.mcq) { if (S.mcq[d.mcq] !== undefined && !d.mcq.startsWith('ex-')) return; if (d.mcq.startsWith('ex-') && S.exam && S.exam.marked) return; S.mcq[d.mcq] = +d.k; save(); render(true); return; }
  if (d.tab) { S.tab[route()] = d.tab; save(); render(true); return; }
  if (d.check) { const c = S.calc[d.check] || { vals: [] }; c.checked = true; S.calc[d.check] = c; save(); render(true); return; }
  if (d.uncheck) { S.calc[d.uncheck].checked = false; save(); render(true); return; }
  if (d.show) { S.shown[d.show] = !S.shown[d.show]; save(); render(true); return; }
  if (d.reset) {
    const t = byId[d.reset]; if (!t) return;
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Tap again to confirm'; b.classList.remove('quiet'); return; }
    t.mcq.forEach((q, i) => delete S.mcq[`${t.id}-mcq-${i}`]);
    itemsOf(t).forEach(([id]) => { delete S.calc[id]; delete S.text[id]; delete S.ticks[id]; delete S.shown[id]; });
    save(); render(true); return;
  }
  if (d.code === 'copy') {
    const el = document.getElementById('code-out'), msg = document.getElementById('copy-msg');
    const fallback = () => { el.focus(); el.select(); msg.textContent = 'Selected. Press Ctrl+C (or Cmd+C) to copy.'; };
    try { navigator.clipboard.writeText(el.value).then(() => { msg.textContent = 'Copied.'; }, fallback); } catch (err) { fallback(); }
    return;
  }
  if (d.code === 'load') {
    const val = document.getElementById('code-in').value;
    readCode(val).then(obj => { pending = obj; codeMsg = ''; render(true); const ta = document.getElementById('code-in'); if (ta) ta.value = val; })
      .catch(err => { pending = null; codeMsg = `<div class="fb bad">${err.message === 'browser' ? 'This browser cannot open that code. Try Chrome, Edge, Safari or Firefox.' : 'That code is not complete. Copy the whole code, starting with E11, and paste it again.'}</div>`; render(true); const ta = document.getElementById('code-in'); if (ta) ta.value = val; });
    return;
  }
  if (d.code === 'load-no') { pending = null; render(true); return; }
  if (d.code === 'load-yes') {
    S = Object.assign({ mcq: {}, calc: {}, text: {}, ticks: {}, shown: {}, tab: {}, exam: null }, pending);
    pending = null; save(); codeMsg = `<div class="fb good">Progress loaded: ${attempted()} attempted.</div>`; render(true); return;
  }
  if (d.choose) { S.exam[d.choose] = +d.i; save(); render(true); return; }
  if (d.exam) {
    const a = d.exam;
    if (a === 'start') { const p = S.pick || nextPaper(); S.exam = { start: Date.now(), paper: p, sel: p === 'R' ? randomSel() : paperSel(p) }; }
    else if (a === 'finish' || a === 'reset') S.exam.confirm = a;
    else if (a === 'cancel') delete S.exam.confirm;
    else if (a === 'finish-yes') { delete S.exam.confirm; S.exam.marked = true; examIds().forEach(([id, it]) => { if (it.t === 'calc') { const c = S.calc[id] || { vals: [] }; c.checked = true; S.calc[id] = c; } }); const sel = S.exam.sel; S.seen = S.seen || {}; [].concat(sel.mcq, sel.data, sel.extA, sel.extB).forEach(id => { S.seen[id] = 1; }); S.hist = S.hist || []; S.exam.hi = S.hist.length; S.hist.push(Object.assign({ paper: S.exam.paper, at: Date.now() }, examScores())); S.pick = null; }
    else if (a === 'reset-yes') {
      EX.mcq.forEach((q, i) => delete S.mcq[`ex-mcq-${i}`]);
      const ids = examIds().map(x => x[0]).concat(['ex-A0', 'ex-A1', 'ex-B0', 'ex-B1']);
      ids.forEach(id => { delete S.calc[id]; delete S.text[id]; delete S.ticks[id]; delete S.shown[id]; });
      S.exam = null;
    }
    save(); render(true); return;
  }
  if (d.paper) { S.pick = d.paper === 'R' ? 'R' : +d.paper; save(); render(true); return;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.tick) { const a = S.ticks[t.dataset.tick] || []; a[+t.dataset.k] = t.checked; S.ticks[t.dataset.tick] = a; save(); render(true); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.text) { S.text[t.dataset.text] = t.value; save(); }
  if (t.dataset.calc) { const c = S.calc[t.dataset.calc] || { vals: [] }; c.vals = c.vals || []; c.vals[+t.dataset.k] = t.value; S.calc[t.dataset.calc] = c; save(); }
});
render(false);
})();
</script>

</body>
