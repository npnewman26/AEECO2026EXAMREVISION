 to the portion above the threshold."],"check":{"q":"You earn $50 000. The 30% rate applies to:","o":["All $50 000","Only the income above $45 000","Only the first $18 200"],"a":1,"why":"Marginal rates apply to each slice."},"src":[["ATO, Tax rates – Australian residents","https://www.ato.gov.au/tax-rates-and-codes/tax-rates-australian-residents"]]},{"title":"Bracket creep and the Stage 3 tax cuts","body":"<p><b>Bracket creep</b> happens when wages rise with inflation, pushing people into higher brackets even though their real income has not grown. Average tax rates rise without any law changing.</p><p>From 1 July 2024, the revised Stage 3 tax cuts lowered the 19% rate to 16% and the 32.5% rate to 30%, and lifted the 37% and 45% thresholds to $135 000 and $190 000. The 16% rate fell to 15% from July 2026, and is due to fall to 14% from July 2027.</p>","fig":"stage3","mistakes":["Saying the tax cuts only helped high earners. The revised version gave the biggest percentage cut to middle incomes."],"check":{"q":"Bracket creep increases:","o":["Real wages","Average tax rates","Transfer payments"],"a":1,"why":"More of a person’s income falls in higher brackets."},"src":[["Treasury, Tax cuts to help Australians with the cost of living","https://treasury.gov.au/tax-cuts"]]},{"title":"Where the money goes","body":"<p>Social security and welfare is the largest spending area: the Age Pension, NDIS, family payments and JobSeeker. Health, education, defence and interest on debt follow. Grants to the states, including all GST revenue, fund schools, hospitals and roads.</p>","fig":"spend","mistakes":["Saying defence is the biggest expense. Welfare is far larger."],"check":{"q":"Which is the Commonwealth’s largest spending function?","o":["Defence","Social security and welfare","Education"],"a":1,"why":"It is about a third of total spending."},"src":[["Australian Government, Budget 2026-27","https://budget.gov.au/"]]},{"title":"Budget objectives and tools","body":"<p>Governments use the Budget to pursue three broad goals: <b>allocation</b> (providing public goods, correcting market failure), <b>distribution</b> (reducing inequality through taxes and transfers) and <b>stabilisation</b> (smoothing the business cycle).</p><ul><li><b>Automatic stabilisers:</b> tax revenue falls and welfare rises in downturns without any decision.</li><li><b>Discretionary changes:</b> deliberate decisions like stimulus payments or tax cuts.</li></ul>","mistakes":["Calling all budget changes discretionary."],"check":{"q":"JobSeeker spending rises automatically in a recession. This is:","o":["A discretionary change","An automatic stabiliser","Monetary policy"],"a":1,"why":"It happens with no new decision."}}]}],"exam":{"mcq":[{"q":"The opportunity cost of the WA Government spending $500 million on a new hospital is:","o":["the $500 million spent.","the next best alternative use of the funds, such as a new school.","the cost of running the hospital each year.","the taxes paid by households."],"a":1,"why":"Opportunity cost is the next best alternative given up."},{"q":"A point outside an economy's PPF represents:","o":["efficient use of all resources.","unemployed resources.","the economy's current output.","a combination that cannot be produced with current resources and technology."],"a":3,"why":"Points beyond the frontier are unattainable."},{"q":"Tea and coffee are substitutes. A rise in the price of tea will, ceteris paribus:","o":["increase the demand for coffee.","decrease the demand for coffee.","increase the supply of coffee.","increase the quantity demanded of tea."],"a":0,"why":"Buyers switch to the substitute."},{"q":"A fall in the price of printers increases demand for ink cartridges. They are:","o":["substitutes.","inferior goods.","complements.","luxuries."],"a":2,"why":"Complements are used together."},{"q":"Floods reduce avocado supply while demand rises. The new equilibrium shows:","o":["a lower price and higher quantity.","a lower price, quantity indeterminate.","a higher price, quantity indeterminate.","a higher price and higher quantity."],"a":2,"why":"Both shifts raise price; their effects on quantity offset."},{"q":"A PED of 1.5 means demand is:","o":["perfectly inelastic.","price inelastic.","unit elastic.","price elastic."],"a":3,"why":"Greater than 1 is elastic."},{"q":"A firm cuts its price by 10% and total revenue rises. Demand is:","o":["price elastic.","price inelastic.","unit elastic.","perfectly inelastic."],"a":0,"why":"Price and revenue moved in opposite directions."},{"q":"Which creates a deadweight loss in an otherwise efficient competitive market?","o":["An increase in demand.","A per-unit tax.","New technology that lowers costs.","The entry of new firms."],"a":1,"why":"A tax pushes output below the efficient level."},{"q":"A minimum price set above equilibrium will cause:","o":["a shortage.","a surplus.","the market to clear.","a fall in quantity supplied."],"a":1,"why":"Quantity supplied exceeds quantity demanded."},{"q":"Which is a source of market power?","o":["Barriers to entry.","A large number of small sellers.","Identical products.","Perfect information."],"a":0,"why":"Barriers keep competitors out."},{"q":"Which is an example of a positive externality?","o":["Traffic congestion.","Second-hand smoke.","Noise from an airport.","Neighbours are protected when a household is vaccinated."],"a":3,"why":"Third parties gain a benefit."},{"q":"Fish stocks in international waters are best classified as a:","o":["public good.","club good.","common resource.","private good."],"a":2,"why":"Rival and non-excludable."},{"q":"Which is a leakage from the circular flow?","o":["Exports.","Imports.","Investment.","Government spending."],"a":1,"why":"Spending on imports leaves the domestic flow."},{"q":"The expenditure approach to GDP is:","o":["C + S + T.","C + I + G + X + M.","I + G + X − S.","C + I + G + (X − M)."],"a":3,"why":"Imports are subtracted."},{"q":"Real GDP per capita will fall when:","o":["population grows faster than real GDP.","nominal GDP rises.","the inflation rate falls.","real GDP grows faster than population."],"a":0,"why":"Output is shared among more people."},{"q":"The RBA watches the trimmed mean because it:","o":["includes only goods.","is published once a year.","removes extreme price changes to show the persistent trend.","is always lower than headline."],"a":2,"why":"It shows underlying inflation."},{"q":"The CPI rises from 110.0 to 114.4. Inflation is:","o":["4.0%.","4.4%.","3.8%.","14.4%."],"a":0,"why":"4.4 ÷ 110 × 100 = 4.0%."},{"q":"The labour force is 15 million and 600 000 are unemployed. The unemployment rate is:","o":["0.6%.","2.5%.","6.0%.","4.0%."],"a":3,"why":"0.6 ÷ 15 × 100 = 4.0%."},{"q":"Which is a lagging indicator?","o":["Building approvals.","The unemployment rate.","Consumer confidence.","Share prices."],"a":1,"why":"Unemployment changes after the economy turns."},{"q":"Which tax is regressive relative to income?","o":["Personal income tax.","Company tax.","The GST.","None of the above."],"a":2,"why":"Low-income households spend a larger share of income."}],"data":[{"label":"Question 21: The market for petrol","stim":"<p><i>In August 2026 fuel prices rose 14.8% in one month, driven by higher world oil prices and the end of temporary fuel excise relief (ABS). A large retailer’s petrol sales fell 3% (hypothetical).</i></p>","items":[{"t":"calc","q":"Calculate the PED for petrol and state whether demand is elastic or inelastic.","marks":2,"inputs":[{"label":"PED","ans":0.2,"tol":0.01}],"work":"PED = 3 ÷ 14.8 = 0.20. Demand is price inelastic."},{"t":"text","q":"Explain two determinants that make the demand for petrol price inelastic.","marks":4,"key":[["First determinant (few substitutes, necessity, habit, little time to adjust)",1],["Applied to petrol",1],["Second determinant",1],["Applied to petrol",1]]},{"t":"text","diagram":true,"q":"Using a diagram, demonstrate the effect of the rise in world oil prices on the petrol market.","marks":5,"key":[["Axes labelled",1],["Supply shifts left as crude oil costs rise",1],["Price rises P1 to P2; quantity falls Q1 to Q2",1],["Curves and equilibria labelled",1],["Refers to the diagram; small fall in Q because demand is inelastic",1]]},{"t":"text","q":"Explain why most of the burden of fuel excise falls on consumers.","marks":4,"key":[["Excise shifts supply up by the tax",1],["Demand for petrol is inelastic",1],["Consumer price rises by most of the tax; quantity falls little",1],["Producers pass most of it on",1]]},{"t":"text","q":"Identify a negative externality of petrol use and explain one policy to correct it.","marks":5,"key":[["Externality identified (pollution, emissions, congestion)",1],["MSC > MPC so the market overproduces",1],["DWL results",1],["Policy recommended",1],["How it corrects the market",1]]}]},{"label":"Question 22: Market efficiency and externalities","stim":"<p><i>Demand P = 150 − Q; private supply P = 30 + Q (Q in thousands). Production causes pollution costing $20 per unit.</i></p>","items":[{"t":"calc","q":"Calculate the market equilibrium price and quantity.","marks":2,"inputs":[{"label":"Price ($)","ans":90,"tol":0},{"label":"Quantity ('000)","ans":60,"tol":0}],"work":"150 − Q = 30 + Q → Q = 60 000; P = $90."},{"t":"calc","q":"Calculate CS and PS at the market equilibrium.","marks":4,"inputs":[{"label":"CS ($)","ans":1800000,"tol":0},{"label":"PS ($)","ans":1800000,"tol":0}],"work":"CS = ½ × 60 000 × $60 = $1 800 000. PS = ½ × 60 000 × $60 = $1 800 000."},{"t":"calc","q":"Calculate the socially optimal price and quantity.","marks":3,"inputs":[{"label":"Price ($)","ans":100,"tol":0},{"label":"Quantity ('000)","ans":50,"tol":0}],"work":"MSC = 50 + Q. 150 − Q = 50 + Q → Q = 50 000; P = $100."},{"t":"calc","q":"Calculate the deadweight loss caused by the externality.","marks":3,"inputs":[{"label":"DWL ($)","ans":100000,"tol":0}],"work":"½ × 10 000 × $20 = $100 000."},{"t":"text","diagram":true,"q":"Using a diagram, explain how a $20 per-unit tax corrects this market failure.","marks":5,"key":[["Diagram with D, MPC, MSC",1],["Tax shifts MPC up to MSC",1],["Output falls to 50 000; price rises to $100",1],["Producers now pay the external cost",1],["DWL removed",1]]},{"t":"text","q":"Outline one limitation of using a tax to correct a negative externality.","marks":3,"key":[["Limitation identified",1],["Explained",1],["Developed with an example or consequence",1]]}]},{"label":"Question 23: Inflation and unemployment in Australia","stim":"<div class=\"tw\"><table><thead><tr><th>Period</th><th>Unemployment (%)</th><th>Headline inflation (%)</th></tr></thead><tbody><tr><td>Dec 2022</td><td>3.5</td><td>7.9</td></tr><tr><td>Jun 2023</td><td>3.5</td><td>6.0</td></tr><tr><td>Jun 2024</td><td>4.1</td><td>3.8</td></tr><tr><td>Jun 2025</td><td>4.3</td><td>1.9</td></tr><tr><td>Jun 2026</td><td>4.4</td><td>3.8</td></tr></tbody></table></div><p><i>In 2026 world oil prices rose sharply. Unemployment reached 4.7% in September 2026 and inflation was 4.0% to August 2026.</i></p>","items":[{"t":"calc","q":"Calculate the change in unemployment (percentage points) from Dec 2022 to Jun 2026.","marks":2,"inputs":[{"label":"Change (pp)","ans":0.9,"tol":0.01}],"work":"4.4 − 3.5 = 0.9 percentage points. Lowest inflation: June 2025 (1.9%)."},{"t":"text","q":"Using a Phillips Curve, describe the relationship from Dec 2022 to Jun 2025.","marks":4,"key":[["Unemployment rose 3.5% → 4.3% while inflation fell 7.9% → 1.9%",1],["Further data reference",1],["Inverse relationship: movement down the Phillips Curve",1],["Higher rates reduced demand",1]]},{"t":"text","q":"Explain why both unemployment and inflation rose in 2026.","marks":4,"key":[["Oil price rise was a supply shock",1],["Raised costs: cost-push inflation",1],["Higher rates and weaker demand raised unemployment",1],["The usual trade-off broke down",1]]},{"t":"calc","q":"The labour force was 15.5 million. Calculate the number unemployed at 4.7%.","marks":2,"inputs":[{"label":"Unemployed (people)","ans":728500,"tol":500}],"work":"0.047 × 15 500 000 = 728 500."},{"t":"text","q":"Explain two economic costs of rising unemployment, including the GDP gap.","marks":4,"key":[["GDP gap: output lost",1],["Explained",1],["Second cost identified",1],["Explained",1]]},{"t":"text","q":"Explain two effects of 4.0% inflation on the Australian economy.","marks":4,"key":[["First effect",1],["Explained",1],["Second effect",1],["Explained",1]]}]},{"label":"Question 24: Economic growth and the role of government","stim":"<p><i>Hypothetical economy ($ billion, real). Real GDP last year was $2605b. Population 27.6 million.</i></p><div class=\"tw\"><table><thead><tr><th>Component</th><th>Value</th></tr></thead><tbody><tr><td>C</td><td>1390</td></tr><tr><td>I</td><td>600</td></tr><tr><td>G</td><td>640</td></tr><tr><td>X</td><td>620</td></tr><tr><td>M</td><td>590</td></tr></tbody></table></div>","items":[{"t":"calc","q":"Calculate GDP using the expenditure approach.","marks":2,"inputs":[{"label":"GDP ($b)","ans":2660,"tol":0}],"work":"1390 + 600 + 640 + (620 − 590) = $2660b."},{"t":"calc","q":"Calculate the rate of economic growth.","marks":2,"inputs":[{"label":"Growth (%)","ans":2.11,"tol":0.02}],"work":"(2660 − 2605) ÷ 2605 × 100 = 2.1%."},{"t":"calc","q":"Calculate real GDP per capita.","marks":2,"inputs":[{"label":"Per capita ($)","ans":96377,"tol":2}],"work":"$2660b ÷ 27.6m = $96 377."},{"t":"text","q":"Using the circular flow, explain the effect of a $20 billion rise in government spending.","marks":4,"key":[["G is an injection",1],["Injections now exceed leakages",1],["Output, income and employment rise through rounds of spending",1],["New higher equilibrium once leakages match",1]]},{"t":"text","q":"Growth is below trend and unemployment rising. Identify the phase and describe two other features.","marks":3,"key":[["Contraction",1],["First feature (falling confidence, easing inflation, falling investment, lower rates)",1],["Second feature",1]]},{"t":"text","diagram":true,"q":"Using a Lorenz curve, explain how progressive tax and transfers affect income distribution.","marks":4,"key":[["Lorenz diagram with line of equality",1],["Progressive tax lowers high incomes",1],["Transfers raise low incomes",1],["Curve moves towards the diagonal; Gini falls",1]]},{"t":"text","q":"Outline one limitation of real GDP per capita as a measure of living standards.","marks":3,"key":[["Limitation identified",1],["Explained",1],["Developed (e.g. averages hide inequality)",1]]}]}],"extA":[{"label":"Question 25","q":"<p>Markets are often described as an efficient way to allocate scarce resources.</p><p>(a) Using a demand and supply diagram, explain how the price mechanism allocates resources and maximises total surplus. (8 marks)</p><p>(b) Discuss two types of market failure, recommending a policy for each. (12 marks)</p>","key":[["(a) Labelled demand and supply diagram",2],["(a) Shortage pushes price up; surplus pushes it down",3],["(a) At equilibrium MB = MC; total surplus maximised",2],["(a) Australian example",1],["(b) Failure 1: cause, effect on efficiency (diagram/DWL), policy evaluated",6],["(b) Failure 2: cause, effect on efficiency, policy evaluated",6]]},{"label":"Question 26","q":"<p>Governments often intervene in markets to help consumers.</p><p>(a) Using a diagram, analyse a rent ceiling set below equilibrium. (8 marks)</p><p>(b) Using a diagram, analyse a per-unit subsidy for electric vehicles. Evaluate which policy better helps consumers. (12 marks)</p>","key":[["(a) Diagram with ceiling below equilibrium",2],["(a) Shortage = Qd − Qs",2],["(a) DWL and further effects (queues, quality, black markets)",3],["(a) Conclusion",1],["(b) Subsidy diagram; price falls, quantity rises, CS and PS rise",4],["(b) Cost to government; DWL unless an external benefit exists",2],["(b) EV emissions benefit: subsidy may correct a positive externality",2],["(b) Comparison and supported judgement",4]]}],"extB":[{"label":"Ques <script>
(() => {
const KEY = 'econ11-revision-v1';
let S = { mcq: {}, calc: {}, text: {}, ticks: {}, shown: {}, tab: {}, exam: null };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const L = 'abcd';
const topics = DATA.topics;
const byId = Object.fromEntries(topics.map(t => [t.id, t]));
const num = v => { const n = parseFloat(String(v).replace(/[$,%\s]/g, '').replace(/[−–]/g, '-')); return isNaN(n) ? null : n; };

/* ---------- save codes ---------- */
const b64 = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64 = str => { str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; const s = atob(str); const out = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i); return out; };
const pipe = async (bytes, stream) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
async function makeCode() {
  const snap = Object.assign({}, S); delete snap.tab;
  const raw = new TextEncoder().encode(JSON.stringify(snap));
  if (typeof CompressionStream === 'function') { try { return 'E11z.' + b64(await pipe(raw, new CompressionStream('deflate-raw'))); } catch (e) {} }
  return 'E11j.' + b64(raw);
}
async function readCode(code) {
  code = String(code).replace(/\s+/g, '');
  const m = code.match(/^E11([zj])\.([A-Za-z0-9_-]+)$/);
  if (!m) throw new Error('shape');
  let bytes = unb64(m[2]);
  if (m[1] === 'z') { if (typeof DecompressionStream !== 'function') throw new Error('browser'); bytes = await pipe(bytes, new DecompressionStream('deflate-raw')); }
  const obj = JSON.parse(new TextDecoder().decode(bytes));
  if (!obj || typeof obj !== 'object' || typeof obj.mcq !== 'object') throw new Error('shape');
  return obj;
}
let pending = null, codeMsg = '';
function attempted() { let n = 0; topics.forEach(t => { n += topicScore(t).done; }); return n + (n === 1 ? ' question' : ' questions'); }
function saveView() {
  return `<header class="pagehead"><div class="eyebrow">Keep your work</div><h1>Save or load progress</h1></header>
  <p class="lead">Your progress saves automatically in this browser. Shared school computers often wipe it when you log out, so copy your save code before you finish and paste it back in next time, on any device.</p>
  <section class="q"><div class="sec-head" style="margin:0"><h3>Your save code</h3><span class="score">${attempted()} attempted</span></div>
  <label for="code-out" hidden>Your save code</label><textarea id="code-out" readonly style="min-height:90px;font-family:var(--mono);font-size:12.5px">Making your code…</textarea>
  <div class="row"><button class="btn primary" data-code="copy">Copy save code</button><span class="note" id="copy-msg"></span></div>
  <p class="note">Paste it somewhere safe: an email to yourself, a note on your phone, or your school OneNote. The code includes your written answers.</p></section>
  <section class="q"><h3>Load a save code</h3>
  <label for="code-in" hidden>Paste a save code</label><textarea id="code-in" placeholder="Paste a code that starts with E11…" style="min-height:90px;font-family:var(--mono);font-size:12.5px"></textarea>
  <div class="row"><button class="btn primary" data-code="load">Load progress</button></div>
  ${pending ? `<div class="fb bad">Loading this code replaces the progress currently in this browser. <span class="row" style="margin-top:8px"><button class="btn primary" data-code="load-yes">Replace my progress</button><button class="btn" data-code="load-no">Cancel</button></span></div>` : ''}
  ${codeMsg}</section>`;
}
async function fillCode() { const el = document.getElementById('code-out'); if (!el) return; el.value = await makeCode(); }

/* ---------- scoring ---------- */
function itemsOf(t) {
  const out = [];
  t.di.items.forEach((it, i) => out.push([`${t.id}-di-${i}`, it]));
  t.sa.forEach((g, j) => g.items.forEach((it, i) => out.push([`${t.id}-sa${j}-${i}`, it])));
  return out;
}
function calcEarned(id, it) {
  const c = S.calc[id]; if (!c || !c.checked) return null;
  const ok = it.inputs.filter((inp, k) => { const v = num((c.vals || [])[k]); return v !== null && Math.abs(v - inp.ans) <= inp.tol + 1e-9; }).length;
  return Math.round(it.marks * ok / it.inputs.length);
}
function textEarned(id, it) {
  if (!S.shown[id]) return null;
  const tk = S.ticks[id] || [];
  return it.key.reduce((s, p, k) => s + (tk[k] ? p[1] : 0), 0);
}
function earned(id, it) {
  if (it.t === 'calc') { const c = calcEarned(id, it); if (c !== null) return c; return it.key ? textEarned(id, it) : null; }
  return textEarned(id, it);
}
function topicScore(t) {
  let got = 0, max = 0, done = 0, total = 0;
  t.mcq.forEach((q, i) => { total++; max++; const a = S.mcq[`${t.id}-mcq-${i}`]; if (a !== undefined) { done++; if (a === q.a) got++; } });
  itemsOf(t).forEach(([id, it]) => { total++; max += it.marks; const e = earned(id, it); if (e !== null) { done++; got += e; } });
  return { got, max, done, total, pct: Math.round(100 * got / max) };
}

/* ---------- nav ---------- */
function renderNav(cur) {
  const link = (href, n, label, pct) => `<a class="navlink" href="#${href}" ${cur === href ? 'aria-current="page"' : ''}><span class="num">${n}</span><span>${esc(label)}</span><span class="pct">${pct}</span></a>`;
  let h = link('home', '◦', 'Overview', '');
  [1, 2].forEach(u => {
    h += `<div class="navgroup"><div>Unit ${u} · ${u === 1 ? 'Microeconomics' : 'Macroeconomics'}</div>`;
    topics.filter(t => t.unit === u).forEach(t => { const s = topicScore(t); h += link(t.id, t.n, t.title, s.done ? s.pct + '%' : ''); });
    h += '</div>';
  });
  h += `<div class="navgroup"><div>Assessment</div>${link('exam', '3h', 'Practice exam', S.exam && S.exam.marked ? 'done' : '')}${link('save', '↺', 'Save or load progress', '')}</div>`;
  document.getElementById('nav').innerHTML = h;
  const pick = document.getElementById('pick');
  pick.innerHTML = `<option value="home">Overview</option>` + topics.map(t => `<option value="${t.id}">${t.n}. ${esc(t.title)}</option>`).join('') + `<option value="exam">Practice exam</option><option value="save">Save or load progress</option>`;
  pick.value = cur;
}

/* ---------- question renderers ---------- */
const OPEN = {};
function mcqHTML(id, q, idx, reveal) {
  const a = S.mcq[id];
  const answered = a !== undefined;
  const show = answered && reveal;
  const opts = q.o.map((o, k) => {
    let cls = '';
    if (show) { if (k === q.a) cls = 'right'; else if (k === a) cls = 'wrong'; }
    else if (answered && k === a) cls = 'chosen';
    const dis = (answered && reveal) ? 'disabled' : '';
    return `<button class="opt ${cls}" data-mcq="${id}" data-k="${k}" ${dis}><span class="l">(${L[k]})</span><span>${o}</span></button>`;
  }).join('');
  let fb = '';
  if (show) fb = a === q.a ? `<div class="fb good"><b>Correct.</b> ${q.why}</div>` : `<div class="fb bad"><b>Not quite.</b> The answer is (${L[q.a]}). ${q.why}</div>`;
  return `<div class="q"><div class="stem"><p><b>${idx}.</b> ${q.q}</p></div><div class="opts">${opts}</div>${fb}</div>`;
}
function itemHTML(id, it, label, mode) {
  const head = `<div class="stem"><p><b>${label}</b> ${it.q}</p><span class="marks">${it.marks} mark${it.marks > 1 ? 's' : ''}</span></div>`;
  const lock = mode === 'exam-open';
  if (it.t === 'calc') {
    const c = S.calc[id] || { vals: [] };
    const checked = c.checked && !lock;
    const ins = it.inputs.map((inp, k) => {
      const v = (c.vals || [])[k] ?? '';
      let cls = '';
      if (checked) { const n = num(v); cls = n !== null && Math.abs(n - inp.ans) <= inp.tol + 1e-9 ? 'ok' : 'no'; }
      return `<label for="${id}-${k}">${esc(inp.label)}<input id="${id}-${k}" class="${cls}" inputmode="decimal" autocomplete="off" data-calc="${id}" data-k="${k}" value="${esc(v)}"></label>`;
    }).join('');
    let fb = '';
    if (checked) {
      const e = calcEarned(id, it);
      fb = `<div class="fb ${e === it.marks ? 'good' : 'bad'}"><b>${e === it.marks ? 'Correct' : 'Check your working'} · ${e}/${it.marks}</b><br>${it.work}</div>`;
    }
    const btn = lock ? '<span class="note">Answers are marked when you finish the exam.</span>' : `<button class="btn primary" data-check="${id}">Check answer</button>${checked ? `<button class="btn quiet" data-uncheck="${id}">Try again</button>` : ''}`;
    return `<div class="q">${head}<div class="calc-row">${ins}</div><div class="row">${btn}</div>${fb}</div>`;
  }
  const val = S.text[id] || '';
  const shown = S.shown[id] && !lock;
  let key = '';
  if (shown) {
    const tk = S.ticks[id] || [];
    const got = textEarned(id, it);
    key = `<div class="key"><div class="note">Tick each point your answer covers.</div>${it.key.map((p, k) => `<label><input type="checkbox" data-tick="${id}" data-k="${k}" ${tk[k] ? 'checked' : ''}><span>${p[0]}</span><span class="m">${p[1]}</span></label>`).join('')}<div class="tot">Your mark: <b>${got}/${it.marks}</b></div></div>`;
  }
  const dnote = it.diagram ? '<div class="note">Draw your diagram on paper first, then describe it and explain it here.</div>' : '';
  const btn = lock ? '' : `<div class="row"><button class="btn ${shown ? '' : 'primary'}" data-show="${id}">${shown ? 'Hide marking key' : 'Mark my answer'}</button></div>`;
  return `<div class="q">${head}${dnote}<label for="${id}-ta" hidden>Your answer</label><textarea id="${id}-ta" data-text="${id}" placeholder="Write your answer…">${esc(val)}</textarea>${btn}${key}</div>`;
}

/* ---------- views ---------- */
function home() {
  const cards = topics.map(t => { const s = topicScore(t); return `<a class="tcard" href="#${t.id}"><span class="num">Unit ${t.unit} · Topic ${t.n}</span><b>${esc(t.title)}</b><div class="bar"><i style="width:${s.pct}%"></i></div><span class="meta">${s.done}/${s.total} questions · ${s.got}/${s.max} marks</span></a>`; }).join('');
  return `<section class="hero"><div class="eyebrow">SCSA Economics ATAR · Year 11 · Units 1 and 2</div><h1>Exam revision</h1><p>Learn each topic, then practise. Multiple-choice and calculation questions are marked instantly. For written answers, write first, then open the marking key and tick the points you covered.</p></section>
  <div class="tw"><table class="examtable"><thead><tr><th>Exam section</th><th>Format</th><th>Weighting</th></tr></thead><tbody>
  <tr><td>One: Multiple-choice</td><td>20 questions · 30 min</td><td>20%</td></tr>
  <tr><td>Two: Data interpretation</td><td>4 questions · 90 min</td><td>50%</td></tr>
  <tr><td>Three: Extended answer</td><td>1 from Unit 1, 1 from Unit 2 · 60 min</td><td>30%</td></tr></tbody></table></div>
  <div class="fb info">Progress saves in this browser. On a shared computer, <a href="#save">copy your save code</a> before you log out.</div>
  <div class="sec-head"><h3>Your topics</h3><span class="score">Progress saves on this device</span></div>
  <div class="grid-cards">${cards}<a class="tcard exam" href="#exam"><span class="num">3 hours + 10 min reading</span><b>Practice exam</b><span class="meta">${S.exam && S.exam.marked ? 'Completed — view results' : 'Timed, Year 12 ATAR format'}</span></a></div>
  ${cmdWords()}
  <footer>Data from the ABS, RBA, ATO and the 2026-27 Budget, current at 27 October 2026. Stimulus marked "hypothetical" is invented for practice.</footer>`;
}
function cmdWords() {
  const w = [['Identify / State','Name the answer. No explanation needed.'],['Define','Give the precise meaning.'],['Calculate','Show formula, working and unit.'],['Outline','Give the main features briefly.'],['Describe','Give characteristics in detail.'],['Explain','Give reasons: link cause and effect.'],['Account for','Explain the causes of a trend in the data.'],['Demonstrate','Show it with a labelled diagram and refer to it.'],['Analyse','Break into parts and show how they relate.'],['Discuss','Points for and against, then a conclusion.'],['Assess / Evaluate','Weigh strengths and weaknesses; make a supported judgement.']];
  return `<div class="sec-head"><h3>Command words</h3></div><div class="tw"><table><thead><tr><th>Word</th><th>What you must do</th></tr></thead><tbody>${w.map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div>`;
}
function ddHTML(t) {
  let h = `<div class="sec-head dd-head"><h3>Deep dives</h3><span class="dd-tools"><button class="btn small" data-ddall="${t.id}:1">Open all</button><button class="btn small" data-ddall="${t.id}:0">Close all</button></span></div><p class="dd-intro">Go further on each key idea: more detail, real Australian data, a case study, common exam mistakes and a quick check. Tap a heading to open it.</p>`;
  t.dd.forEach((x, i) => {
    const id = `${t.id}-dd-${i}`;
    const qa = S.mcq[id];
    const tick = qa === undefined ? '' : (qa === x.check.a ? '<span class="dd-done" title="Check answered correctly">✓</span>' : '<span class="dd-done miss" title="Check attempted">•</span>');
    let b = `<div class="prose">${x.body}</div>`;
    if (x.fig && FIGS[x.fig]) b += `<figure><div class="fig">${FIGS[x.fig]}</div></figure>`;
    if (x.case) b += `<div class="dd-box case"><div class="dd-lab">Australian case study</div><p>${x.case}</p></div>`;
    if (x.mistakes && x.mistakes.length) b += `<div class="dd-box warn"><div class="dd-lab">Common exam mistakes</div><ul>${x.mistakes.map(m => `<li>${m}</li>`).join('')}</ul></div>`;
    if (x.check) b += `<div class="dd-check"><div class="dd-lab">Check your understanding</div>${mcqHTML(id, x.check, '?', true).replace('<b>?.</b> ', '')}</div>`;
    if (x.src && x.src.length) b += `<div class="dd-src"><span class="dd-lab">Sources</span><ul>${x.src.map(([l, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${l}</a></li>`).join('')}</ul></div>`;
    h += `<details class="dd" data-dd="${id}"${OPEN[id] ? ' open' : ''}><summary><span class="dd-n">${t.n}.${i + 1}</span><span class="dd-t">${x.title}</span>${x.fig ? '<span class="dd-ic" title="Includes a diagram">◫</span>' : ''}${tick}<span class="dd-chev" aria-hidden="true"></span></summary><div class="dd-body">${b}</div></details>`;
  });
  return h;
}
function topicView(t) {
  const tab = S.tab[t.id] || 'learn';
  const s = topicScore(t);
  let h = `<header class="pagehead"><div class="eyebrow">Unit ${t.unit} · Topic ${t.n}</div><h1>${esc(t.title)}</h1><p class="lead">${t.lead}</p></header>
  <div class="tabs" role="tablist"><button role="tab" data-tab="learn" aria-selected="${tab === 'learn'}">Learn</button><button role="tab" data-tab="practise" aria-selected="${tab === 'practise'}">Practise <span class="score">${s.done ? s.pct + '%' : ''}</span></button></div>`;
  if (tab === 'learn') {
    h += `<section class="prose"><h4>Key notes</h4>${t.notes}</section>`;
    t.figs.forEach(([k, cap, txt]) => { h += `<figure><div class="fig">${FIGS[k]}</div><figcaption>${cap}</figcaption></figure>${txt ? `<div class="prose">${txt}</div>` : ''}`; });
    h += `<section class="prose worked"><h4>Worked example</h4>${t.worked}</section>`;
    if (t.dd && t.dd.length) h += ddHTML(t);
    h += `<div class="row"><button class="btn primary" data-tab="practise">Practise this topic</button></div>`;
  } else {
    const mc = t.mcq.reduce((n, q, i) => n + (S.mcq[`${t.id}-mcq-${i}`] === q.a ? 1 : 0), 0);
    h += `<div class="sec-head"><h3>Multiple-choice</h3><span class="score">${mc}/5 correct</span></div>`;
    h += t.mcq.map((q, i) => mcqHTML(`${t.id}-mcq-${i}`, q, i + 1, true)).join('');
    h += `<div class="sec-head"><h3>Data interpretation</h3></div><div class="stim">${t.di.stim}</div>`;
    h += t.di.items.map((it, i) => itemHTML(`${t.id}-di-${i}`, it, `(${'abcdefg'[i]})`, 'practice')).join('');
    h += `<div class="sec-head"><h3>Short answer</h3></div>`;
    t.sa.forEach((g, j) => {
      if (g.stim) h += `<div class="stim"><b>${g.label}</b>${g.stim}</div>`;
      h += g.items.map((it, i) => itemHTML(`${t.id}-sa${j}-${i}`, it, g.items.length > 1 ? `${g.stim ? '' : g.label + ' '}(${'abcdef'[i]})` : g.label + '.', 'practice')).join('');
    });
    h += `<div class="sec-head"><span class="score">Topic score: ${s.got}/${s.max} marks · ${s.done}/${s.total} attempted</span><button class="btn quiet" data-reset="${t.id}">Clear my answers for this topic</button></div>`;
  }
  return h;
}

/* ---------- exam ---------- */
const EX = DATA.exam;
const READ = 10 * 60, WORK = 180 * 60;
let tick = null;
function examIds() {
  const ids = [];
  EX.data.forEach((q, j) => q.items.forEach((it, i) => ids.push([`ex-d${j}-${i}`, it])));
  return ids;
}
function examScores() {
  const s1 = EX.mcq.reduce((n, q, i) => n + (S.mcq[`ex-mcq-${i}`] === q.a ? 1 : 0), 0);
  let s2 = 0; examIds().forEach(([id, it]) => { const e = earned(id, it); if (e) s2 += e; });
  const A = S.exam && S.exam.choiceA, B = S.exam && S.exam.choiceB;
  const essay = (arr, c, p) => { if (c === undefined || c === null) return 0; const it = { t: 'text', key: arr[c].key, marks: 20 }; return textEarned(`ex-${p}${c}`, it) || 0; };
  const s3a = essay(EX.extA, A, 'A'), s3b = essay(EX.extB, B, 'B');
  const pct = s1 / 20 * 20 + s2 / 80 * 50 + s3a / 20 * 15 + s3b / 20 * 15;
  return { s1, s2, s3a, s3b, pct: Math.round(pct * 10) / 10 };
}
function fmt(sec) { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); }
function clockText() {
  const e = S.exam; if (!e || !e.start) return '';
  const el = (Date.now() - e.start) / 1000;
  if (el < READ) return `<span>Reading time</span><span class="clock">${fmt(READ - el)}</span>`;
  if (el < READ + WORK) return `<span>Working time left</span><span class="clock">${fmt(READ + WORK - el)}</span>`;
  return `<span>Time is up</span><span class="clock">00:00</span>`;
}
function examView() {
  const e = S.exam;
  let h = `<header class="pagehead"><div class="eyebrow">Year 12 ATAR examination format</div><h1>Practice examination</h1></header>`;
  if (!e || !e.start) {
    return h + `<p class="lead">Ten minutes reading time, then three hours working time. Answers stay hidden until you finish, just like the real exam. Calculations are marked automatically; written answers are self-marked against the key.</p>
    <div class="tw"><table class="examtable"><thead><tr><th>Section</th><th>Questions</th><th>Marks</th><th>Weighting</th></tr></thead><tbody>
    <tr><td>One: Multiple-choice</td><td>20, answer all</td><td>20</td><td>20%</td></tr>
    <tr><td>Two: Data interpretation</td><td>4, answer all</td><td>80</td><td>50%</td></tr>
    <tr><td>Three, Part A (Unit 1)</td><td>1 from 2</td><td>20</td><td>15%</td></tr>
    <tr><td>Three, Part B (Unit 2)</td><td>1 from 2</td><td>20</td><td>15%</td></tr></tbody></table></div>
    <div class="row"><button class="btn primary" data-exam="start">Start the exam</button></div>`;
  }
  const marked = !!e.marked;
  const mode = marked ? 'exam-marked' : 'exam-open';
  h += `<div class="timer" id="timer">${marked ? '<span>Exam finished</span>' : `<span class="row" style="gap:10px">${clockText()}</span>`}<span class="row">${marked ? '' : '<button class="btn" data-exam="finish">Finish and mark</button>'}<button class="btn" data-exam="reset">${marked ? 'Start again' : 'Abandon'}</button></span></div>`;
  if (e.confirm) h += `<div class="fb bad">${e.confirm === 'reset' ? 'Clear every exam answer and start again?' : 'Finish now and reveal the answers?'} <span class="row" style="margin-top:8px"><button class="btn primary" data-exam="${e.confirm}-yes">Yes</button><button class="btn" data-exam="cancel">Cancel</button></span></div>`;
  if (marked) {
    const s = examScores();
    h += `<div class="summary"><div><span>Section One</span><b>${s.s1}/20</b></div><div><span>Section Two</span><b>${s.s2}/80</b></div><div><span>Section Three A</span><b>${s.s3a}/20</b></div><div><span>Section Three B</span><b>${s.s3b}/20</b></div><div><span>Weighted result</span><b>${s.pct}%</b></div></div><p class="note">Section Two and Three marks update as you tick the marking keys below.</p>`;
  }
  h += `<div class="sec-head"><h3>Section One: Multiple-choice</h3><span class="score">20 marks · 30 min</span></div>`;
  h += EX.mcq.map((q, i) => mcqHTML(`ex-mcq-${i}`, q, i + 1, marked)).join('');
  h += `<div class="sec-head"><h3>Section Two: Data interpretation</h3><span class="score">80 marks · 90 min</span></div>`;
  EX.data.forEach((q, j) => {
    h += `<div class="stim"><b>${q.label} (20 marks)</b>${q.stim}</div>`;
    h += q.items.map((it, i) => itemHTML(`ex-d${j}-${i}`, it, `(${'abcdefg'[i]})`, mode)).join('');
  });
  const part = (arr, p, title, which) => {
    const c = e[which];
    let s = `<div class="sec-head"><h3>${title}</h3><span class="score">20 marks · 30 min</span></div><div class="choice">${arr.map((q, i) => `<button class="btn" aria-pressed="${c === i}" data-choose="${which}" data-i="${i}">${q.label}</button>`).join('')}</div>`;
    if (c !== undefined && c !== null) {
      const q = arr[c], id = `ex-${p}${c}`, it = { t: 'text', key: q.key, marks: 20, q: '' };
      s += `<div class="stim">${q.q}</div>` + itemHTML(id, Object.assign({}, it, { q: q.label }), '', mode);
    } else s += '<p class="note">Choose one question to answer.</p>';
    return s;
  };
  h += part(EX.extA, 'A', 'Section Three, Part A: Unit 1', 'choiceA');
  h += part(EX.extB, 'B', 'Section Three, Part B: Unit 2', 'choiceB');
  return h;
}

/* ---------- routing ---------- */
function route() { const h = location.hash.slice(1); return byId[h] ? h : (h === 'exam' || h === 'save') ? h : 'home'; }
function render(keepScroll) {
  const r = route();
  const y = window.scrollY;
  renderNav(r);
  const v = document.getElementById('view');
  v.innerHTML = r === 'home' ? home() : r === 'exam' ? examView() : r === 'save' ? saveView() : topicView(byId[r]);
  if (r === 'save') fillCode();
  if (keepScroll) window.scrollTo(0, y);
  clearInterval(tick);
  if (r === 'exam' && S.exam && S.exam.start && !S.exam.marked) tick = setInterval(() => { const el = document.getElementById('timer'); const span = el && el.querySelector('span'); if (span) span.innerHTML = clockText(); }, 1000);
}
window.addEventListener('hashchange', () => { render(false); window.scrollTo(0, 0); });
document.getElementById('pick').addEventListener('change', e => { location.hash = e.target.value; });

/* ---------- events ---------- */
document.addEventListener('toggle', e => { const el = e.target; if (el && el.dataset && el.dataset.dd) OPEN[el.dataset.dd] = el.open; }, true);
document.addEventListener('click', e => {
  const da = e.target.closest('[data-ddall]');
  if (da) { const [tid, v] = da.dataset.ddall.split(':'); document.querySelectorAll(`details.dd[data-dd^="${tid}-dd-"]`).forEach(el => { el.open = v === '1'; OPEN[el.dataset.dd] = el.open; }); return; }
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.mcq) { if (S.mcq[d.mcq] !== undefined && !d.mcq.startsWith('ex-')) return; if (d.mcq.startsWith('ex-') && S.exam && S.exam.marked) return; S.mcq[d.mcq] = +d.k; save(); render(true); return; }
  if (d.tab) { S.tab[route()] = d.tab; save(); render(true); return; }
  if (d.check) { const c = S.calc[d.check] || { vals: [] }; c.checked = true; S.calc[d.check] = c; save(); render(true); return; }
  if (d.uncheck) { S.calc[d.uncheck].checked = false; save(); render(true); return; }
  if (d.show) { S.shown[d.show] = !S.shown[d.show]; save(); render(true); return; }
  if (d.reset) {
    const t = byId[d.reset]; if (!t) return;
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Tap again to confirm'; b.classList.remove('quiet'); return; }
    t.mcq.forEach((q, i) => delete S.mcq[`${t.id}-mcq-${i}`]);
    itemsOf(t).forEach(([id]) => { delete S.calc[id]; delete S.text[id]; delete S.ticks[id]; delete S.shown[id]; });
    save(); render(true); return;
  }
  if (d.code === 'copy') {
    const el = document.getElementById('code-out'), msg = document.getElementById('copy-msg');
    const fallback = () => { el.focus(); el.select(); msg.textContent = 'Selected. Press Ctrl+C (or Cmd+C) to copy.'; };
    try { navigator.clipboard.writeText(el.value).then(() => { msg.textContent = 'Copied.'; }, fallback); } catch (err) { fallback(); }
    return;
  }
  if (d.code === 'load') {
    const val = document.getElementById('code-in').value;
    readCode(val).then(obj => { pending = obj; codeMsg = ''; render(true); const ta = document.getElementById('code-in'); if (ta) ta.value = val; })
      .catch(err => { pending = null; codeMsg = `<div class="fb bad">${err.message === 'browser' ? 'This browser cannot open that code. Try Chrome, Edge, Safari or Firefox.' : 'That code is not complete. Copy the whole code, starting with E11, and paste it again.'}</div>`; render(true); const ta = document.getElementById('code-in'); if (ta) ta.value = val; });
    return;
  }
  if (d.code === 'load-no') { pending = null; render(true); return; }
  if (d.code === 'load-yes') {
    S = Object.assign({ mcq: {}, calc: {}, text: {}, ticks: {}, shown: {}, tab: {}, exam: null }, pending);
    pending = null; save(); codeMsg = `<div class="fb good">Progress loaded: ${attempted()} attempted.</div>`; render(true); return;
  }
  if (d.choose) { S.exam[d.choose] = +d.i; save(); render(true); return; }
  if (d.exam) {
    const a = d.exam;
    if (a === 'start') S.exam = { start: Date.now() };
    else if (a === 'finish' || a === 'reset') S.exam.confirm = a;
    else if (a === 'cancel') delete S.exam.confirm;
    else if (a === 'finish-yes') { delete S.exam.confirm; S.exam.marked = true; examIds().forEach(([id, it]) => { if (it.t === 'calc') { const c = S.calc[id] || { vals: [] }; c.checked = true; S.calc[id] = c; } }); }
    else if (a === 'reset-yes') {
      EX.mcq.forEach((q, i) => delete S.mcq[`ex-mcq-${i}`]);
      const ids = examIds().map(x => x[0]).concat(['ex-A0', 'ex-A1', 'ex-B0', 'ex-B1']);
      ids.forEach(id => { delete S.calc[id]; delete S.text[id]; delete S.ticks[id]; delete S.shown[id]; });
      S.exam = null;
    }
    save(); render(true); return;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.tick) { const a = S.ticks[t.dataset.tick] || []; a[+t.dataset.k] = t.checked; S.ticks[t.dataset.tick] = a; save(); render(true); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.text) { S.text[t.dataset.text] = t.value; save(); }
  if (t.dataset.calc) { const c = S.calc[t.dataset.calc] || { vals: [] }; c.vals = c.vals || []; c.vals[+t.dataset.k] = t.value; S.calc[t.dataset.calc] = c; save(); }
});
render(false);
})();
</script>

</body>
