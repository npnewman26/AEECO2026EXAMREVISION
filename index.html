ernment provides a good free of charge.","a firm charges more than the cost of production.","consumers switch to a cheaper substitute."],"a":0,"why":"Free riders use a non-excludable good without contributing."},{"q":"Which best illustrates the tragedy of the commons?","o":["A firm charging high prices for a patented drug.","A factory polluting a nearby river.","A street light that all residents use.","Overfishing of a species in open ocean waters."],"a":3,"why":"Ocean fish are rival but non-excludable, so they are overused."},{"q":"Which policy most directly reduces the tragedy of the commons in a fishery?","o":["A subsidy to fishing boat owners.","Individual catch quotas.","A price ceiling on fish.","Removing all fishing licences."],"a":1,"why":"Quotas cap total catch so the stock can recover."},{"q":"A paid video streaming subscription is best classified as a:","o":["public good.","common resource.","club good.","private good."],"a":2,"why":"Non-payers are excluded, but one viewer does not use up the stream for others."}],"di":{"stim":"<p>A commercial fish stock off the WA coast (hypothetical). A catch quota was introduced in 2023.</p><div class=\"tw\"><table><thead><tr><th>Year</th><th>Spawning stock ('000 t)</th><th>Annual catch ('000 t)</th></tr></thead><tbody><tr><td>2019</td><td>120</td><td>18</td></tr><tr><td>2020</td><td>112</td><td>20</td></tr><tr><td>2021</td><td>101</td><td>22</td></tr><tr><td>2022</td><td>88</td><td>23</td></tr><tr><td>2023</td><td>80</td><td>15</td></tr><tr><td>2024</td><td>84</td><td>12</td></tr><tr><td>2025</td><td>90</td><td>12</td></tr></tbody></table></div>","items":[{"t":"text","q":"Describe the trend in spawning stock from 2019 to 2022.","marks":2,"key":[["Stock fell every year, from 120 000 t to 88 000 t",1],["While the catch rose from 18 000 t to 23 000 t",1]]},{"t":"calc","q":"Calculate the percentage change in spawning stock from 2019 to 2022.","marks":2,"inputs":[{"label":"Change (%)","ans":-26.7,"tol":0.15}],"work":"(88 − 120) ÷ 120 × 100 = −26.7%."},{"t":"text","q":"Using rivalry and excludability, explain why the stock declined before 2023.","marks":4,"key":[["Rival: each tonne caught leaves less for others",1],["Non-excludable: fishers cannot easily be kept out",1],["Each fisher gains the full benefit but shares the cost of depletion",1],["Result is overfishing, shown by rising catch and falling stock",1]]},{"t":"text","q":"Evaluate the effectiveness of the 2023 quota, referring to the data.","marks":3,"key":[["Catch cut from 23 000 t to 12 000 t",1],["Stock recovered from 80 000 t to 90 000 t",1],["Judgement: effective so far, but still below 2019 levels and needs enforcement",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","q":"Explain why the free market fails to provide public goods. Use an example.","marks":4,"key":[["Non-excludable, so people free ride",1],["Non-rival",1],["Firms cannot profit, so the good is under-provided",1],["Relevant example",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Perth draws much of its water from underground aquifers. Outline two policies to prevent overuse.","marks":4,"key":[["First policy (licences with limits, water pricing, restrictions, education, tradeable rights)",1],["Explained",1],["Second policy",1],["Explained",1]]}]}],"dd":[{"title":"Rivalry and excludability explained","body":"<p>Test any good with two questions:</p><ul><li><b>Is it rival?</b> If I use it, is there less for you? A pie is rival; a radio broadcast is not.</li><li><b>Is it excludable?</b> Can people who don’t pay be stopped? A concert is excludable; a fireworks display over the river is not.</li></ul><p>Some goods change category. An empty freeway is non-rival, but in peak hour it becomes congested and rival.</p>","fig":"goods","mistakes":["Calling anything the government provides a public good. Hospitals are rival and excludable."],"check":{"q":"A beach on a crowded summer day is best described as:","o":["Non-rival and excludable","Rival and non-excludable","Rival and excludable"],"a":1,"why":"Crowding makes it rival, and anyone can walk on."}},{"title":"The free rider problem","body":"<p>If you cannot be charged for something, why pay? A free rider enjoys a good without contributing. When enough people free ride, a private firm cannot earn enough revenue, even if the good is worth more to society than it costs.</p><p>This is why governments provide public goods such as defence, street lighting, flood mitigation and public health campaigns, funded by taxes that everyone must pay.</p>","mistakes":["Saying free riders are people on welfare. It means anyone who benefits without paying."],"check":{"q":"Taxation helps solve the free rider problem because:","o":["It is voluntary","Everyone is required to contribute","It lowers the price of the good"],"a":1,"why":"Compulsory payment stops free riding."}},{"title":"Case study: WA’s demersal fish","body":"<p>Dhufish and pink snapper are demersal (bottom-dwelling) fish that grow slowly and are prized by recreational fishers. They are a common resource: rival (a fish caught is gone) and hard to exclude people from.</p><p>To help the West Coast stocks recover, the WA Government banned boat-based recreational fishing for demersal scalefish in the West Coast bioregion until spring 2027. Land-based fishing can continue outside spawning closures, and new bag and size limits apply in other regions.</p>","fig":"commons","mistakes":["Saying overfishing is caused by greed. The economic cause is the incentive structure of a shared resource."],"check":{"q":"Why does each fisher catch \"too many\" fish?","o":["They gain the full benefit but share the cost of depletion","Fish are excludable","Fish prices are too low"],"a":0,"why":"That gap between private and shared cost drives overuse."},"src":[["DPIRD, West Coast demersal scalefish: information for recreational fishers","https://www.dpird.wa.gov.au/environment-and-sustainability/sustainable-fisheries/west-coast-demersal-scalefish-resource/west-coast-demersal-scalefish--information-for-recreational-fishers"]]},{"title":"Case study: the Gnangara groundwater system","body":"<p>The Gnangara groundwater system north of Perth supplies about <b>40% of Perth’s drinking water</b>. It also waters parks, sports grounds and market gardens, and supports wetlands. Anyone with a licence or garden bore can draw on it, but use by one person lowers the water table for everyone.</p><p>Declining rainfall since the 1970s has reduced recharge. The 2022 Gnangara groundwater allocation plan cuts how much can be taken, aiming to rebalance the system by 2032. About one in four Perth households use groundwater for their gardens.</p>","mistakes":["Forgetting that environmental users (wetlands, bushland) are also affected."],"check":{"q":"Limiting how much each licence holder may pump is an example of:","o":["A subsidy","A quota","A price ceiling"],"a":1,"why":"It caps the quantity each user can take."},"src":[["WA Government (DWER), Managing Perth’s Gnangara groundwater system","https://wa.gov.au/organisation/department-of-water-and-environmental-regulation/managing-perths-gnangara-groundwater-system"]]},{"title":"Policy tools for common resources","body":"<ul><li><b>Quotas:</b> a total allowable catch or extraction limit.</li><li><b>Individual transferable quotas (ITQs):</b> each fisher owns a share of the catch and can trade it, giving an incentive to protect the stock.</li><li><b>Licences and fees:</b> limit the number of users and raise money for management.</li><li><b>Regulation:</b> bag limits, size limits, closed seasons, sanctuary zones.</li><li><b>Property rights:</b> giving an owner responsibility for the resource.</li></ul>","mistakes":["Recommending a policy for a public good when the question is about a common resource."],"check":{"q":"Why do tradeable quotas encourage conservation?","o":["A healthier stock makes each quota share more valuable","They remove all limits","They lower fish prices"],"a":0,"why":"Owners gain when the resource is protected."}}]},{"id":"t8","unit":2,"n":8,"title":"Introduction to macroeconomics","lead":"Total spending, total output and total income are three views of the same flow. The economy grows when injections exceed leakages.","notes":"<ul><li><b>Macroeconomics</b> examines aggregate output, income, spending, employment and prices.</li><li><b>Total spending = total output = total income.</b></li><li><b>Five sectors:</b> households, firms, financial, government, overseas.</li><li><b>Leakages:</b> savings (S), taxation (T), imports (M). <b>Injections:</b> investment (I), government spending (G), exports (X).</li><li><b>Equilibrium:</b> S + T + M = I + G + X.</li></ul><div class=\"tw\"><table><thead><tr><th>If…</th><th>Economic activity…</th></tr></thead><tbody><tr><td>Injections > leakages</td><td>Rises: output, income and employment increase</td></tr><tr><td>Injections < leakages</td><td>Falls</td></tr><tr><td>Injections = leakages</td><td>Stays at equilibrium</td></tr></tbody></table></div><ul><li><b>GDP:</b> the market value of all final goods and services produced in Australia in a period. Excludes intermediate goods, second-hand sales and transfer payments.</li></ul><p class=\"formula\">GDP = C + I + G + (X − M)</p>","figs":[["flow","Figure 8.1 · Five-sector circular flow of income",""]],"worked":"<p>C = 900, I = 150, G = 200, X = 120, M = 140, S = 130, T = 230 ($ billion).</p><ol><li>GDP = 900 + 150 + 200 + (120 − 140) = <b>$1250 billion</b>.</li><li>Injections = 150 + 200 + 120 = <b>$470 billion</b>.</li><li>Leakages = 130 + 230 + 140 = <b>$500 billion</b>.</li><li>Leakages exceed injections by $30 billion, so activity <b>falls</b> to a new, lower equilibrium.</li></ol>","mcq":[{"q":"In the five-sector circular flow model, which is an injection?","o":["Household saving.","Government spending.","Imports.","Income tax."],"a":1,"why":"Government spending adds to the flow. The others remove income from it."},{"q":"The circular flow is in equilibrium when:","o":["savings equal investment only.","exports equal imports.","government spending equals taxation.","S + T + M = I + G + X."],"a":3,"why":"Equilibrium requires total leakages to equal total injections, not each pair separately."},{"q":"If total leakages exceed total injections, economic activity will:","o":["fall.","rise.","stay the same.","rise, then return to equilibrium."],"a":0,"why":"More is leaving the flow than entering, so spending and output fall."},{"q":"Which transaction is <b>not</b> included in GDP?","o":["A new house built in Perth.","A haircut.","The purchase of a second-hand car.","Iron ore exported to China."],"a":2,"why":"A second-hand car was counted when it was first produced."},{"q":"If exports are $400 billion and imports $450 billion, net exports:","o":["add $50 billion to GDP.","subtract $50 billion from GDP.","add $850 billion to GDP.","have no effect on GDP."],"a":1,"why":"X − M = −$50 billion."}],"di":{"stim":"<div class=\"tw\"><table><thead><tr><th>Flow ($ billion)</th><th>Value</th></tr></thead><tbody><tr><td>Consumption (C)</td><td>1250</td></tr><tr><td>Investment (I)</td><td>410</td></tr><tr><td>Government spending (G)</td><td>560</td></tr><tr><td>Exports (X)</td><td>600</td></tr><tr><td>Imports (M)</td><td>580</td></tr><tr><td>Savings (S)</td><td>300</td></tr><tr><td>Taxation (T)</td><td>690</td></tr></tbody></table></div>","items":[{"t":"calc","q":"Calculate GDP using the expenditure approach.","marks":2,"inputs":[{"label":"GDP ($b)","ans":2240,"tol":0}],"work":"1250 + 410 + 560 + (600 − 580) = $2240 billion."},{"t":"calc","q":"Calculate total injections and total leakages.","marks":3,"inputs":[{"label":"Injections ($b)","ans":1570,"tol":0},{"label":"Leakages ($b)","ans":1570,"tol":0}],"work":"Injections = 410 + 560 + 600 = 1570. Leakages = 300 + 690 + 580 = 1570. They are equal, so the economy is in equilibrium."},{"t":"text","q":"A fall in iron ore prices cuts exports by $60 billion. Explain the effect on economic activity.","marks":3,"key":[["Injections fall to $1510b, below leakages",1],["Spending falls; firms cut output and employment; incomes fall",1],["Activity falls to a lower equilibrium",1]]},{"t":"text","q":"Outline one government action to restore the original level of activity.","marks":2,"key":[["Raise government spending by $60b or cut taxes",1],["Explained as adding injections or reducing leakages",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","q":"Explain the relationship between total spending, total output and total income.","marks":3,"key":[["Spending by one sector is income to another",1],["Firms produce output to meet spending",1],["Producing output pays income to factor owners",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Distinguish between an injection and a leakage. Give an Australian example of each.","marks":4,"key":[["Injection adds spending from outside household income",1],["Example (e.g. iron ore exports)",1],["Leakage removes income from the flow",1],["Example (e.g. saving, imported cars)",1]]}]}],"dd":[{"title":"The circular flow identity","body":"<p>Every dollar spent is a dollar of income for someone else. Your $8 on a burger is the café’s revenue, which becomes wages for the cook, rent for the landlord and profit for the owner. That is why, for the whole economy, <b>total spending = total income = total output</b>.</p><p>This identity is the foundation of GDP measurement. The ABS can measure the economy three ways and, in principle, get the same answer.</p>","fig":"flow","mistakes":["Drawing goods and money flowing the same way. They flow in opposite directions."],"check":{"q":"A household pays $50 000 rent to a landlord. In the circular flow, the landlord receives:","o":["A leakage","Factor income","An injection"],"a":1,"why":"Rent is the return to the factor of production land."},"src":[["RBA, Explainer: Economic Growth","https://www.rba.gov.au/education/resources/explainers/economic-growth.html"]]},{"title":"The five sectors in Australia","body":"<div class=\"tw\"><table><thead><tr><th>Sector</th><th>Role</th><th>Australian example</th></tr></thead><tbody><tr><td>Households</td><td>Supply factors; consume</td><td>About 54% of GDP is household consumption</td></tr><tr><td>Firms</td><td>Hire factors; produce</td><td>BHP, a local bakery</td></tr><tr><td>Financial</td><td>Turn savings into loans</td><td>The big four banks, super funds</td></tr><tr><td>Government</td><td>Taxes, spends, transfers</td><td>Commonwealth, WA Government, local councils</td></tr><tr><td>Overseas</td><td>Buys exports, sells imports</td><td>China buys about a third of our exports</td></tr></tbody></table></div>","mistakes":["Saying super contributions are spending. They are saving, a leakage."],"check":{"q":"Which sector channels household saving into business investment?","o":["Government","Financial","Overseas"],"a":1,"why":"Banks and super funds lend or invest savings."},"src":[["ABS, Australian National Accounts: National Income, Expenditure and Product, June 2026","https://www.abs.gov.au/statistics/economy/national-accounts/australian-national-accounts-national-income-expenditure-and-product/latest-release"]]},{"title":"Leakages, injections and the multiplier","body":"<p><b>Leakages</b> (saving, taxes, imports) take spending out of the flow. <b>Injections</b> (investment, government spending, exports) add spending in. When injections exceed leakages, the economy grows; when leakages exceed injections, it contracts.</p><p>An injection has a bigger final effect than its first round, because each recipient spends part of what they earn. This is the <b>multiplier</b>: k = 1 ÷ (1 − MPC), or 1 ÷ MPW where MPW is the share of extra income that leaks out.</p>","fig":"multiplier","case":"In 2020, payments such as JobKeeper kept income flowing through the economy, so spending fell much less than it otherwise would have.","mistakes":["Using MPC on its own instead of 1 − MPC.","Forgetting that imports and tax are leakages in an open economy."],"check":{"q":"If the MPC is 0.75, the multiplier is:","o":["0.75","1.33","4"],"a":2,"why":"1 ÷ (1 − 0.75) = 4."}},{"title":"The three approaches to GDP","body":"<p>The ABS measures GDP in three ways: by <b>production</b> (value added by each industry), <b>income</b> (wages, profits, rent and interest) and <b>expenditure</b> (C + I + G + X − M). Small statistical differences are averaged.</p>","fig":"gdp3","mistakes":["Counting intermediate goods (flour sold to a bakery) as well as the final good, double counting.","Adding imports instead of subtracting them."],"check":{"q":"In GDP = C + I + G + (X − M), imports are subtracted because:","o":["They are produced overseas","They are a tax","They are saved"],"a":0,"why":"GDP measures output produced in Australia."},"src":[["ABS, Australian System of National Accounts: Concepts, Sources and Methods","https://www.abs.gov.au/statistics/detailed-methodology-information/concepts-sources-methods/australian-system-national-accounts-concepts-sources-and-methods"]]},{"title":"What GDP misses","body":"<ul><li><b>Unpaid work:</b> caring, volunteering and housework are not counted.</li><li><b>The hidden economy:</b> cash jobs and illegal activity.</li><li><b>Environmental costs:</b> pollution and resource depletion are not subtracted.</li><li><b>Leisure:</b> working longer hours raises GDP even if wellbeing falls.</li><li><b>Distribution:</b> GDP says nothing about who gets the income.</li><li><b>Quality:</b> better products at the same price barely register.</li></ul>","mistakes":["Saying higher GDP always means higher living standards."],"check":{"q":"A parent leaves paid work to care for a child full-time. Measured GDP:","o":["Rises","Falls","Is unchanged"],"a":1,"why":"Paid output is lost; unpaid care is not counted."}}]},{"id":"t9","unit":2,"n":9,"title":"Economic growth","lead":"Australia's growth fell to 1.3% in 2024-25, its weakest year outside COVID since the early 1990s, before recovering to 2.4% in 2025-26.","notes":"<p class=\"formula\">Growth (%) = (Real GDP<sub>yr2</sub> − Real GDP<sub>yr1</sub>) ÷ Real GDP<sub>yr1</sub> × 100</p><div class=\"tw\"><table><thead><tr><th>Measure</th><th>What it shows</th></tr></thead><tbody><tr><td>Nominal GDP</td><td>Output at current prices; rises with inflation</td></tr><tr><td>Real GDP</td><td>Output adjusted for inflation (chain volume measure)</td></tr><tr><td>Real GDP per capita</td><td>Real GDP ÷ population; a better guide to living standards</td></tr></tbody></table></div><h4>GDP as a measure of welfare</h4><ul><li>Excludes unpaid housework, caring and volunteering, and the cash economy.</li><li>Ignores income distribution, leisure, environmental damage and resource depletion.</li><li>Counts defensive spending (disaster clean-up) as a gain.</li><li>The Australian Government’s <i>Measuring What Matters</i> framework tracks wellbeing alongside GDP.</li></ul><h4>Determinants</h4><ul><li><i>Supply side:</i> labour quantity and quality, capital investment, natural resources, technology and productivity, enterprise.</li><li><i>Demand side:</i> C, I, G and (X − M).</li></ul><div class=\"tw\"><table><thead><tr><th>Benefits of growth</th><th>Costs of growth</th></tr></thead><tbody><tr><td>Higher material living standards</td><td>Environmental damage, resource depletion</td></tr><tr><td>More jobs</td><td>Inflationary pressure</td></tr><tr><td>Higher tax revenue</td><td>Inequality can widen</td></tr><tr><td>More investment</td><td>Structural unemployment for some</td></tr></tbody></table></div>","figs":[["gdp","Figure 9.1 · ABS, Australian National Accounts (annual growth as reported soon after each year)","<p>Strong in 2021-22 as the economy reopened; slowed sharply in 2023-24 and 2024-25 as higher interest rates and cost-of-living pressures cut spending; recovered to 2.4% in 2025-26, but real GDP per capita rose only 0.8%.</p>"],["apf","Figure 9.2 · Aggregate Production Function","<p>Growth from more inputs (A to B) needs more workers or hours. Growth from productivity (A to C) produces more from the same inputs and is the only lasting way to raise living standards.</p>"]],"worked":"<p>Real GDP rises from $2600b to $2652b; population from 27.0m to 27.4m.</p><ol><li>Growth = (2652 − 2600) ÷ 2600 × 100 = <b>2.0%</b>.</li><li>Per capita yr 1 = <b>$96 296</b>; yr 2 = <b>$96 788</b>.</li><li>Per capita growth = <b>0.51%</b>.</li><li>Most of the extra output was absorbed by population growth.</li></ol>","mcq":[{"q":"Real GDP differs from nominal GDP because real GDP:","o":["includes the value of exports.","is measured per person.","is adjusted for changes in the price level.","excludes government spending."],"a":2,"why":"Real GDP removes the effect of inflation."},{"q":"Real GDP rises 2.4% and population grows 1.6%. Real GDP per capita rises about:","o":["0.8%.","1.6%.","2.4%.","4.0%."],"a":0,"why":"2.4% − 1.6% ≈ 0.8%."},{"q":"Which is a limitation of GDP as a measure of welfare?","o":["It is measured every quarter.","It includes exports of services.","It is adjusted for inflation.","It excludes unpaid household work."],"a":3,"why":"Non-market work adds to wellbeing but is not counted."},{"q":"An upward shift of the APF is caused by:","o":["an increase in the number of workers.","better technology that raises labour productivity.","a rise in the price level.","a fall in the unemployment rate."],"a":1,"why":"More workers move the economy along the APF; productivity shifts it up."},{"q":"Which is a cost of economic growth?","o":["Environmental degradation.","Higher government tax revenue.","Lower unemployment.","Higher material living standards."],"a":0,"why":"The others are benefits."}],"di":{"stim":"<p>Use Figure 9.1 and this statement: <i>In 2025-26, real GDP grew 2.4% while real GDP per capita grew 0.8% (ABS).</i></p>","items":[{"t":"text","q":"Identify the financial year with the weakest growth shown in Figure 9.1.","marks":1,"key":[["2024-25 (1.3%)",1]]},{"t":"text","q":"Describe the trend in Australia's real GDP growth from 2021-22 to 2025-26.","marks":3,"key":[["Fell from 3.6% in 2021-22",1],["To 1.3% in 2024-25, the weakest outside COVID since the early 1990s",1],["Recovered to 2.4% in 2025-26",1]]},{"t":"text","q":"Explain what the gap between real GDP growth and per capita growth in 2025-26 indicates about living standards.","marks":3,"key":[["Population grew about 1.6%",1],["Most extra output was shared among more people",1],["Average material living standards rose only slightly",1]]},{"t":"text","q":"Account for the slowdown in growth in 2023-24 and 2024-25.","marks":3,"key":[["Higher interest rates reduced spending",1],["High inflation cut real incomes",1],["Weak household consumption or investment",1]]},{"t":"text","diagram":true,"q":"Using an APF diagram, demonstrate how higher labour productivity affects growth.","marks":4,"key":[["Axes labelled",1],["APF shifts up from APF1 to APF2",1],["Same inputs now produce more output",1],["Explains higher growth and living standards",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"calc","q":"Nominal GDP rises from $2700b to $2830b while prices rise 3%. Calculate approximate real growth.","marks":3,"inputs":[{"label":"Real growth (%)","ans":1.8,"tol":0.1}],"work":"Nominal growth = (2830 − 2700) ÷ 2700 × 100 = 4.81%. Real ≈ 4.81% − 3.0% ≈ 1.8%."}]},{"label":"Question 2","items":[{"t":"text","q":"Evaluate real GDP as a measure of economic welfare in Australia.","marks":5,"key":[["Strength: consistent, comparable measure of output",1],["Second strength or development",1],["Limitation: non-market activity or distribution",1],["Limitation: environment, leisure or cash economy",1],["Supported judgement",1]]}]}],"dd":[{"title":"Nominal versus real GDP","body":"<p>Nominal GDP is measured in current prices, so it rises when prices rise even if output does not. Real GDP removes inflation by using the prices of a base year. Real GDP is what measures economic growth.</p><p>Quick approximation: real growth ≈ nominal growth − inflation.</p>","mistakes":["Calling nominal GDP growth \"economic growth\"."],"check":{"q":"Nominal GDP grows 6% and prices rise 4%. Real growth is about:","o":["10%","2%","1.5%"],"a":1,"why":"6% − 4% ≈ 2%."},"src":[["RBA, Explainer: Economic Growth","https://www.rba.gov.au/education/resources/explainers/economic-growth.html"]]},{"title":"Per capita GDP and population","body":"<p>Australia’s population grows by around 1.5–2.5% a year, mostly through migration. GDP can grow simply because there are more people working and spending. Dividing GDP by population gives <b>GDP per capita</b>, a better guide to the average person’s living standard.</p>","case":"Real GDP grew about 1.3% in 2024-25 while the population grew faster, so GDP per capita fell (see the per capita recession deep dive in Topic 12).","mistakes":["Assuming GDP growth means each person is better off."],"check":{"q":"GDP grows 2% and the population grows 2.5%. GDP per capita:","o":["Rises","Falls","Stays the same"],"a":1,"why":"Output per person falls by about 0.5%."},"src":[["ABS, Australian National Accounts: National Income, Expenditure and Product, June 2026","https://www.abs.gov.au/statistics/economy/national-accounts/australian-national-accounts-national-income-expenditure-and-product/latest-release"]]},{"title":"Productivity: the engine of living standards","body":"<p>Productivity is output per unit of input. Over the long run, it is the main reason living standards rise. It grows through more capital per worker (capital deepening), better skills, and better ideas and organisation (multifactor productivity).</p><p>The Productivity Commission reports that market-sector multifactor productivity grew 1.6% a year from 1994-95 to 2003-04, after the 1980s and 90s reforms, but averaged only 0.3% a year over the last 20 years.</p>","fig":"prodtree","mistakes":["Confusing productivity with production. More workers raises production, not productivity."],"check":{"q":"Which raises labour productivity?","o":["Hiring more workers with the same equipment","Giving each worker better software","Working longer hours"],"a":1,"why":"Better tools raise output per hour."},"src":[["Productivity Commission, Annual Productivity Bulletin 2025","https://www.pc.gov.au/ongoing/productivity-insights/bulletin-2025"]]},{"title":"Benefits, costs and sustainable growth","body":"<div class=\"tw\"><table><thead><tr><th>Benefits of growth</th><th>Costs of growth</th></tr></thead><tbody><tr><td>Higher incomes and more choice</td><td>Pollution and emissions</td></tr><tr><td>More jobs</td><td>Depletion of resources (water, fish, minerals)</td></tr><tr><td>More tax revenue for services</td><td>Congestion and housing pressure</td></tr><tr><td>Less poverty</td><td>Inequality if gains are unevenly shared</td></tr></tbody></table></div><p><b>Sustainable growth</b> meets today’s needs without reducing the ability of future generations to meet theirs.</p>","mistakes":["Only listing costs or only listing benefits in a \"discuss\" question."],"check":{"q":"Which is an environmental cost of economic growth?","o":["Rising wages","Falling groundwater levels","Higher tax revenue"],"a":1,"why":"Overuse of shared resources harms the environment."}},{"title":"Measuring What Matters","body":"<p>In July 2023, Treasury released <i>Measuring What Matters</i>, Australia’s first national wellbeing framework. It tracks 50 indicators across five themes: <b>healthy, secure, sustainable, cohesive and prosperous</b>. Examples include life expectancy, feeling safe, emissions, trust in others, and income.</p><p>The aim is to look beyond GDP, so that governments see how Australians are actually faring.</p>","mistakes":["Saying it replaces GDP. It sits alongside it."],"check":{"q":"Which theme would \"trust in others\" belong to?","o":["Prosperous","Cohesive","Sustainable"],"a":1,"why":"Trust measures how connected society is."},"src":[["Treasury, Measuring What Matters","https://treasury.gov.au/policy-topics/measuring-what-matters"]]},{"title":"Australia’s growth story, 2021–26","body":"<div class=\"tw\"><table><thead><tr><th>Year</th><th>Real GDP growth</th><th>What happened</th></tr></thead><tbody><tr><td>2021-22</td><td>3.6%</td><td>Rebound from COVID lockdowns</td></tr><tr><td>2022-23</td><td>3.1%</td><td>Strong spending; rate rises begin</td></tr><tr><td>2023-24</td><td>1.5%</td><td>Higher rates and prices squeeze households</td></tr><tr><td>2024-25</td><td>1.3%</td><td>Slowest growth outside COVID in decades</td></tr><tr><td>2025-26</td><td>2.4%</td><td>Recovery as real incomes improve</td></tr></tbody></table></div>","fig":"gdp","mistakes":["Describing a fall in the growth rate as a fall in GDP. GDP still grew."],"check":{"q":"Growth falls from 3.1% to 1.5%. Real GDP:","o":["Fell","Grew more slowly","Stayed constant"],"a":1,"why":"A positive growth rate means GDP is still rising."},"src":[["ABS, Australian National Accounts: National Income, Expenditure and Product, June 2026","https://www.abs.gov.au/statistics/economy/national-accounts/australian-national-accounts-national-income-expenditure-and-product/latest-release"]]}]},{"id":"t10","unit":2,"n":10,"title":"Inflation","lead":"Headline inflation was 4.0% in the year to August 2026, above the RBA's 2–3% target, with trimmed mean inflation at 3.6%.","notes":"<ul><li><b>Measurement:</b> the ABS Consumer Price Index tracks a basket of household goods and services in the eight capitals. A complete CPI is now published monthly.</li></ul><p class=\"formula\">Inflation (%) = (CPI<sub>this year</sub> − CPI<sub>last year</sub>) ÷ CPI<sub>last year</sub> × 100</p><ul><li><b>Headline:</b> change in the all groups CPI.</li><li><b>Underlying:</b> removes volatile or extreme changes. The <b>trimmed mean</b> drops the largest rises and falls. The RBA focuses on underlying inflation.</li><li><b>RBA target:</b> 2–3% on average, aiming for 2.5%.</li></ul><div class=\"tw\"><table><thead><tr><th>Type</th><th>Cause</th><th>Example</th></tr></thead><tbody><tr><td>Demand-pull</td><td>Spending grows faster than capacity</td><td>Strong spending after lockdowns ended</td></tr><tr><td>Cost-push</td><td>Rising costs passed on as prices</td><td>Higher world oil prices</td></tr><tr><td>Expectations</td><td>Expected rises feed wages and prices</td><td>A wage-price spiral</td></tr><tr><td>Imported</td><td>A falling dollar raises import prices</td><td>Imported cars and electronics</td></tr></tbody></table></div><h4>Effects</h4><ul><li>Reduces purchasing power; real wages fall if wages lag prices.</li><li>Redistributes from lenders and savers to borrowers when unexpected.</li><li>Reduces international competitiveness.</li><li>Creates uncertainty that deters investment.</li><li>Bracket creep.</li><li>Leads the RBA to raise interest rates.</li></ul>","figs":[["cpi","Figure 10.1 · ABS, Consumer Price Index, Australia, August 2026","<p>Inflation surged in 2022 with post-COVID demand, supply-chain problems and energy prices. It fell through 2023–24 as rates rose and dipped to 1.9% in June 2025, partly due to electricity rebates. It rose again as rebates ended and the 2026 oil shock lifted fuel prices. The RBA raised the cash rate four times in 2026, to 4.60%.</p>"]],"worked":"<p>The CPI (Sep 2025 = 100) rose from about 99.5 in August 2025 to 103.5 in August 2026.</p><ol><li>Inflation = (103.5 − 99.5) ÷ 99.5 × 100 = <b>4.02%</b>.</li><li>A worker whose wage rose 3.0% saw real wages fall by about 1 percentage point.</li></ol>","mcq":[{"q":"In Australia, the CPI is compiled by:","o":["the Reserve Bank of Australia.","the Australian Bureau of Statistics.","the Treasury.","the Australian Taxation Office."],"a":1,"why":"The ABS collects prices and publishes the CPI."},{"q":"The trimmed mean is best described as:","o":["the change in the price of essentials only.","the headline CPI adjusted for seasons.","the average price change of goods only.","a measure of underlying inflation that removes the largest price rises and falls."],"a":3,"why":"Trimming the extremes shows the persistent trend."},{"q":"Which event is most likely to cause cost-push inflation?","o":["A sharp rise in world oil prices.","A large increase in household spending.","A cut in interest rates.","A rise in government spending."],"a":0,"why":"Oil raises production and transport costs. The others raise demand."},{"q":"Higher-than-expected inflation tends to benefit:","o":["people on fixed incomes.","savers holding cash.","borrowers with fixed nominal debts.","exporters competing overseas."],"a":2,"why":"Debts are repaid in dollars that buy less."},{"q":"The RBA's inflation target is:","o":["0–1% at all times.","below 2% on average.","3–4% every year.","2–3% on average over time."],"a":3,"why":"The RBA targets 2–3%, aiming for the 2.5% midpoint."}],"di":{"stim":"<p>CPI groups, annual change to August 2026 (ABS).</p><div class=\"tw\"><table><thead><tr><th>CPI group</th><th>Annual change (%)</th></tr></thead><tbody><tr><td>Housing</td><td>5.7</td></tr><tr><td>Transport</td><td>5.6</td></tr><tr><td>Alcohol and tobacco</td><td>4.8</td></tr><tr><td>Education</td><td>4.7</td></tr><tr><td>Health</td><td>3.9</td></tr><tr><td>Insurance and financial services</td><td>3.5</td></tr><tr><td>Food and non-alcoholic beverages</td><td>3.0</td></tr><tr><td>Recreation and culture</td><td>2.9</td></tr><tr><td>Clothing and footwear</td><td>2.6</td></tr><tr><td>Communication</td><td>1.6</td></tr><tr><td>Furnishings, household equipment and services</td><td>1.0</td></tr><tr><td><b>All groups CPI</b></td><td><b>4.0</b></td></tr><tr><td><b>Trimmed mean</b></td><td><b>3.6</b></td></tr></tbody></table></div><p><i>Electricity rose 13.2% as rebates ended; fuel rose 13.5% as world oil prices increased.</i></p>","items":[{"t":"text","q":"Identify the two CPI groups with the largest annual price increases.","marks":2,"key":[["Housing (5.7%)",1],["Transport (5.6%)",1]]},{"t":"calc","q":"The CPI rose from 99.5 to 103.5. Calculate the annual inflation rate.","marks":2,"inputs":[{"label":"Inflation (%)","ans":4.02,"tol":0.03}],"work":"(103.5 − 99.5) ÷ 99.5 × 100 = 4.02%."},{"t":"text","q":"Distinguish headline from trimmed mean inflation, and explain why the trimmed mean was lower in August 2026.","marks":3,"key":[["Headline: change in the all groups CPI",1],["Trimmed mean removes the largest rises and falls",1],["The big fuel and electricity rises were trimmed out",1]]},{"t":"text","q":"Explain whether the rise in fuel prices is demand-pull or cost-push inflation.","marks":3,"key":[["Cost-push",1],["Higher oil prices raise production and transport costs",1],["Passed on as higher prices, not caused by excess demand",1]]},{"t":"text","q":"Explain two effects of 4.0% inflation on Australian households.","marks":4,"key":[["First effect identified",1],["Explained",1],["Second effect identified",1],["Explained",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","q":"Using Figure 10.1, describe the trend in headline inflation from September 2022 to August 2026.","marks":3,"key":[["Peak 7.9% in December 2022",1],["Fell to 1.9% by June 2025",1],["Rose to 4.0% in August 2026, above target",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Explain demand-pull inflation, using an Australian example.","marks":3,"key":[["Spending grows faster than productive capacity",1],["Firms raise prices",1],["Example (e.g. 2021–22 reopening with low rates)",1]]}]}],"dd":[{"title":"How the ABS builds the CPI","body":"<p>The CPI tracks the price of a fixed \"basket\" of goods and services bought by households in the eight capital cities. ABS staff and scanner data record prices for about 100 000 items. Each item is <b>weighted</b> by its share of household spending, so a rise in rent matters far more than a rise in the price of matches.</p><p>The weights were last updated in January 2025, using household spending in 2023-24. Housing (21.4%) and food (17.4%) are the largest groups.</p>","fig":"cpiweights","mistakes":["Saying the CPI measures the cost of living for every household. It is an average."],"check":{"q":"Why is the CPI weighted?","o":["So items people spend more on count more","To remove seasonal effects","To include interest rates"],"a":0,"why":"Weights reflect each item’s share of spending."},"src":[["ABS, Annual weight update of the CPI and Living Cost Indexes, Dec 2024","https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/annual-weight-update-cpi-and-living-cost-indexes/dec-2024"]]},{"title":"Headline versus underlying inflation","body":"<p><b>Headline</b> inflation is the change in the whole CPI. It can jump around because of one-off events: a fuel price spike, a cyclone hitting bananas, or government rebates starting or ending. <b>Underlying</b> measures like the <b>trimmed mean</b> remove the biggest rises and falls each period to show the trend. The RBA pays close attention to the trimmed mean.</p>","fig":"cpi","case":"In the year to August 2026, headline CPI was 4.0% and trimmed mean 3.6%. Fuel and electricity, after rebates ended, pushed the headline figure higher.","mistakes":["Using headline and underlying interchangeably."],"check":{"q":"The trimmed mean is useful because it:","o":["Includes every price","Removes extreme price changes","Measures wages"],"a":1,"why":"It strips out volatile items to show the trend."},"src":[["ABS, Consumer Price Index, Australia, August 2026","https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/aug-2026"]]},{"title":"What caused the recent inflation","body":"<p>Economists split inflation into two types:</p><ul><li><b>Demand-pull:</b> spending grows faster than the economy can produce. After COVID, savings, low rates and stimulus boosted demand.</li><li><b>Cost-push:</b> production costs rise. Supply chain disruption in 2021–22, energy prices after the Russia–Ukraine war, and the 2026 oil price shock.</li></ul><p>Inflation peaked at 7.8% in the December quarter 2022. It eased to the target band in 2025, then rose again in 2026 as fuel and electricity costs climbed.</p>","mistakes":["Calling every price rise demand-pull."],"check":{"q":"A rise in oil prices causing transport costs to increase is:","o":["Demand-pull","Cost-push","Imported deflation"],"a":1,"why":"Higher input costs push prices up."},"src":[["RBA, Explainer: Inflation and its Measurement","https://www.rba.gov.au/education/resources/explainers/inflation-and-its-measurement.html"]]},{"title":"Real wages and the WPI","body":"<p>The <b>Wage Price Index (WPI)</b> measures changes in the price of labour for the same jobs. If wages grow more slowly than prices, <b>real wages</b> fall and workers can buy less.</p><p>Real wages fell sharply in 2022–23 as inflation outpaced wage growth. They recovered through 2024–25. In the year to June 2026, the WPI rose 3.2% while the CPI rose faster, so real wages fell again.</p>","fig":"wpicpi","mistakes":["Saying wages fell when only real wages fell."],"check":{"q":"Wages rise 3.2% and prices rise 3.8%. Real wages:","o":["Rise 7.0%","Fall about 0.6%","Rise 0.6%"],"a":1,"why":"3.2% − 3.8% ≈ −0.6%."},"src":[["ABS, Annual wage growth of 3.2% in June quarter 2026","https://abs.gov.au/media-centre/media-releases/annual-wage-growth-32-june-quarter-2026"]]},{"title":"Why the RBA targets 2–3%","body":"<p>The RBA aims to keep inflation between 2 and 3%, aiming for the midpoint of 2.5%. Low, stable inflation helps people plan, protects the value of savings and avoids the hidden \"tax\" of rising prices on people with fixed incomes. Zero inflation is not the goal: a little inflation gives wages and prices room to adjust, and avoids the dangers of deflation.</p><p>The main tool is the <b>cash rate</b>. Higher rates make borrowing more expensive, slowing spending and inflation.</p>","fig":"cashrate","mistakes":["Saying the RBA sets mortgage rates. It sets the cash rate; banks set loan rates."],"check":{"q":"If inflation is well above 3%, the RBA is most likely to:","o":["Cut the cash rate","Raise the cash rate","Print more money"],"a":1,"why":"Higher rates slow spending and reduce inflation."},"src":[["RBA, Monetary Policy Framework","https://www.rba.gov.au/monetary-policy/framework/"],["RBA, Cash Rate Target","https://www.rba.gov.au/statistics/cash-rate/"]]}]},{"id":"t11","unit":2,"n":11,"title":"Unemployment","lead":"Australia's unemployment rate rose to 4.7% in September 2026, up from 3.5% in 2022 and 2023. Underemployment was 6.3% and participation 66.8%.","notes":"<ul><li><b>Unemployed:</b> aged 15+, without paid work, actively looking and available.</li><li><b>Labour force</b> = employed + unemployed.</li><li><b>Underemployed:</b> employed but wanting more hours.</li></ul><p class=\"formula\">Unemployment rate = Unemployed ÷ Labour force × 100 &nbsp;·&nbsp; Participation rate = Labour force ÷ Civilian population 15+ × 100</p><ul><li><b>Full employment:</b> no cyclical unemployment.</li><li><b>NAIRU:</b> the lowest unemployment rate sustainable without rising inflation.</li></ul><div class=\"tw\"><table><thead><tr><th>Type</th><th>Cause</th><th>Example</th></tr></thead><tbody><tr><td>Cyclical</td><td>Not enough spending in a downturn</td><td>Retail layoffs as spending falls</td></tr><tr><td>Structural</td><td>Skills or location mismatch</td><td>Workers displaced by automation</td></tr><tr><td>Frictional</td><td>Short-term, between jobs</td><td>A graduate looking for a first job</td></tr><tr><td>Seasonal</td><td>Varies with the season</td><td>Fruit pickers after harvest</td></tr></tbody></table></div><h4>Effects</h4><ul><li><b>GDP gap:</b> potential output minus actual output; idle labour is output lost forever.</li><li>Lower incomes and spending, deepening a downturn.</li><li>Lower tax revenue, higher welfare payments.</li><li>Lost skills, poorer health, more inequality.</li></ul>","figs":[["unemp","Figure 11.1 · ABS, Labour Force, Australia (seasonally adjusted)","<p>Unemployment fell to 3.5% in 2022–23, its lowest in about 50 years. It has drifted up as higher rates slowed spending; in September 2026 employment fell 39 000. The rise is mainly cyclical.</p>"],["phillips","Figure 11.2 · The Phillips Curve","<p>In the short run there is a trade-off. Australia in 2022 sat near A; rate rises since then moved the economy towards B.</p>"]],"worked":"<p>August 2026: 14 836 600 employed, 722 900 unemployed, participation 67.1%.</p><ol><li>Labour force = <b>15 559 500</b>.</li><li>Unemployment rate = 722 900 ÷ 15 559 500 × 100 = <b>4.6%</b>.</li><li>Civilian population 15+ = 15 559 500 ÷ 0.671 ≈ <b>23.2 million</b>.</li></ol>","mcq":[{"q":"To be counted as unemployed, a person must be aged 15+, without work and:","o":["receiving a government payment.","registered with a job agency.","actively looking for work and available to start.","looking for full-time work only."],"a":2,"why":"The ABS definition depends on looking and availability, not payments."},{"q":"The participation rate is calculated as:","o":["labour force ÷ civilian population 15+ × 100.","employed ÷ labour force × 100.","unemployed ÷ civilian population 15+ × 100.","employed ÷ total population × 100."],"a":0,"why":"Participation measures how much of the working-age population is in the labour force."},{"q":"A bank teller loses their job because customers now bank online. This is:","o":["frictional unemployment.","cyclical unemployment.","seasonal unemployment.","structural unemployment."],"a":3,"why":"Technology has permanently changed the skills employers need."},{"q":"The GDP gap is the difference between:","o":["nominal GDP and real GDP.","potential output and actual output.","exports and imports.","GDP this year and GDP last year."],"a":1,"why":"It measures output lost when resources are idle."},{"q":"The short-run Phillips Curve shows:","o":["a positive relationship between unemployment and inflation.","no relationship between them.","an inverse relationship between unemployment and inflation.","the relationship between output and labour inputs."],"a":2,"why":"Lower unemployment tends to come with higher inflation."}],"di":{"stim":"<p>Use Figure 11.1 and these data for a hypothetical economy.</p><div class=\"tw\"><table><thead><tr><th>Category</th><th>People</th></tr></thead><tbody><tr><td>Civilian population aged 15+</td><td>20 000 000</td></tr><tr><td>Employed</td><td>12 900 000</td></tr><tr><td>Unemployed</td><td>600 000</td></tr><tr><td>Underemployed</td><td>840 000</td></tr></tbody></table></div>","items":[{"t":"calc","q":"Calculate the labour force and the unemployment rate.","marks":3,"inputs":[{"label":"Labour force (millions)","ans":13.5,"tol":0.01},{"label":"Unemployment rate (%)","ans":4.44,"tol":0.05}],"work":"LF = 12.9m + 0.6m = 13.5m. UR = 0.6 ÷ 13.5 × 100 = 4.4%."},{"t":"calc","q":"Calculate the participation rate.","marks":2,"inputs":[{"label":"Participation (%)","ans":67.5,"tol":0.05}],"work":"13.5 ÷ 20 × 100 = 67.5%."},{"t":"text","q":"Using Figure 11.1, describe the trend in Australia's unemployment rate from June 2022 to September 2026.","marks":3,"key":[["Steady at 3.5% to June 2023",1],["Rose gradually to 4.4% by June 2026",1],["Jumped to 4.7% in September 2026",1]]},{"t":"text","q":"Identify the type of unemployment most likely behind the 2026 rise. Explain.","marks":3,"key":[["Cyclical",1],["Slower growth and higher rates reduced the demand for labour",1],["Evidence: employment fell 39 000 in September",1]]},{"t":"text","diagram":true,"q":"Using a Phillips Curve, explain why low unemployment in 2022 coincided with high inflation.","marks":4,"key":[["Phillips Curve drawn with 2022 at low U, high inflation",1],["Diagram labelled",1],["Firms competed for scarce workers, raising wages and costs",1],["Excess demand pushed prices up",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","q":"Distinguish between frictional and cyclical unemployment. Use an example of each.","marks":4,"key":[["Frictional: short-term, between jobs",1],["Example",1],["Cyclical: caused by a downturn in demand",1],["Example",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Explain two economic costs of unemployment, including the GDP gap.","marks":4,"key":[["GDP gap: output lost when labour is idle",1],["Explained",1],["Second cost identified",1],["Explained",1]]}]}],"dd":[{"title":"The Labour Force Survey","body":"<p>Each month the ABS surveys about 26 000 dwellings. You are <b>employed</b> if you worked at least <b>one hour</b> for pay in the reference week. You are <b>unemployed</b> if you had no work, actively looked for work in the last four weeks and were available to start. Everyone else aged 15+ is not in the labour force.</p>","fig":"lfstree","mistakes":["Counting retirees or full-time students not looking for work as unemployed."],"check":{"q":"A student works 2 hours a week at a café. The ABS classifies them as:","o":["Unemployed","Employed","Not in the labour force"],"a":1,"why":"One hour of paid work counts as employed."},"src":[["ABS, Labour Force, Australia methodology","https://www.abs.gov.au/methodologies/labour-force-australia-methodology/latest-release"]]},{"title":"Participation and underutilisation","body":"<p><b>Participation rate</b> = labour force ÷ population aged 15+ × 100. It was 66.8% in September 2026, near record highs.</p><p><b>Underemployment</b> counts workers who want and can work more hours. Add it to unemployment and you get <b>underutilisation</b>: 11.0% in September 2026 (4.7% unemployed + 6.3% underemployed). It gives a fuller picture of spare capacity in the labour market.</p>","fig":"underutil","mistakes":["Using total population instead of the 15+ population."],"check":{"q":"Unemployment is 4.5% and underemployment is 6.0%. Underutilisation is:","o":["1.5%","10.5%","6.0%"],"a":1,"why":"4.5 + 6.0 = 10.5%."},"src":[["ABS, Labour Force, Australia, September 2026","https://www.abs.gov.au/statistics/labour/employment-and-unemployment/labour-force-australia/latest-release"]]},{"title":"Types of unemployment","body":"<div class=\"tw\"><table><thead><tr><th>Type</th><th>Cause</th><th>Example</th></tr></thead><tbody><tr><td>Frictional</td><td>Moving between jobs</td><td>A graduate searching for their first role</td></tr><tr><td>Structural</td><td>Skills or location no longer match jobs</td><td>Car factory workers after manufacturing closed in 2017</td></tr><tr><td>Cyclical</td><td>Weak demand in a downturn</td><td>Job losses in 2020 lockdowns</td></tr><tr><td>Seasonal</td><td>Regular seasonal patterns</td><td>Fruit pickers and ski instructors</td></tr></tbody></table></div>","mistakes":["Confusing structural (long-lasting mismatch) with cyclical (temporary downturn)."],"check":{"q":"Workers lose jobs because self-checkouts replace cashiers. This is mainly:","o":["Frictional","Structural","Cyclical"],"a":1,"why":"Technology has changed the skills needed."},"src":[["RBA, Explainer: Unemployment – Its Measurement and Types","https://www.rba.gov.au/education/resources/explainers/unemployment-its-measurement-and-types.html"]]},{"title":"Full employment and the NAIRU","body":"<p>Full employment does not mean zero unemployment, because frictional and structural unemployment always exist. It is the lowest rate consistent with stable inflation, sometimes called the NAIRU.</p><p>The RBA says full employment \"cannot be observed directly\". Instead of a single number, it looks at many indicators: unemployment, underemployment, job vacancies, wages growth and how hard firms find it to hire.</p>","mistakes":["Giving one exact NAIRU figure as fact."],"check":{"q":"Below the NAIRU, we would expect:","o":["Falling inflation","Rising wages and inflation","Rising unemployment"],"a":1,"why":"A tight labour market pushes wages and prices up."},"src":[["RBA, Statement on Monetary Policy, February 2026 (Box A: full employment)","https://www.rba.gov.au/publications/smp/2026/feb/"]]},{"title":"The GDP gap","body":"<p>The <b>output gap</b> is the difference between actual GDP and potential GDP (what the economy could produce at full employment). A <b>negative</b> gap means spare capacity and higher unemployment. A <b>positive</b> gap means the economy is running hot, pushing inflation up.</p>","fig":"gdpgap","mistakes":["Mixing up the signs of the gap."],"check":{"q":"Actual GDP is above potential. The economy probably has:","o":["Rising unemployment","Inflationary pressure","A recession"],"a":1,"why":"Demand exceeds sustainable capacity."}},{"title":"The Phillips Curve in Australia","body":"<p>The Phillips Curve shows a short-run trade-off: lower unemployment tends to come with higher inflation. Australia’s 2021–26 experience broadly fits. Unemployment fell to about 3.5% in 2022 as inflation surged, then both eased as rate rises slowed the economy.</p><p>The relationship is not fixed: supply shocks can raise inflation without lower unemployment, and inflation expectations can shift the curve.</p>","fig":"phillipsdata","mistakes":["Saying the trade-off holds in the long run."],"check":{"q":"A negative supply shock raises inflation and unemployment together. On a Phillips diagram, this looks like:","o":["A movement along the curve","An outward shift of the curve","No change"],"a":1,"why":"Both variables worsen, so the curve itself shifts."}}]},{"id":"t12","unit":2,"n":12,"title":"The business cycle","lead":"The business cycle is the pattern of expansions and contractions around the long-run trend. Each phase has a recognisable mix of growth, unemployment and inflation.","notes":"<div class=\"tw\"><table><thead><tr><th>Indicator</th><th>Expansion</th><th>Peak</th><th>Contraction</th><th>Trough</th></tr></thead><tbody><tr><td>Real GDP growth</td><td>Rising, above trend</td><td>Highest; starts to slow</td><td>Slowing or negative</td><td>Lowest; starts to recover</td></tr><tr><td>Unemployment</td><td>Falling</td><td>Lowest</td><td>Rising</td><td>Highest</td></tr><tr><td>Inflation</td><td>Rising</td><td>Highest</td><td>Easing</td><td>Lowest</td></tr><tr><td>Interest rates</td><td>Rising</td><td>High</td><td>Falling</td><td>Low</td></tr><tr><td>Confidence</td><td>Rising</td><td>High</td><td>Falling</td><td>Low</td></tr></tbody></table></div><ul><li>A <b>recession</b> is a significant fall in activity; commonly two consecutive quarters of negative real GDP growth.</li><li>Causes: confidence, interest rates, government policy, the world economy, supply shocks.</li></ul><div class=\"tw\"><table><thead><tr><th>Indicator type</th><th>Moves…</th><th>Examples</th></tr></thead><tbody><tr><td>Leading</td><td>Before the economy turns</td><td>Building approvals, confidence, job vacancies, share prices</td></tr><tr><td>Coincident</td><td>With the economy</td><td>Real GDP, retail trade, hours worked</td></tr><tr><td>Lagging</td><td>After the economy turns</td><td>Unemployment rate, inflation, wage growth</td></tr></tbody></table></div><h4>Australia over the last five years</h4><div class=\"tw\"><table><thead><tr><th>Period</th><th>Phase</th><th>Evidence</th></tr></thead><tbody><tr><td>2021-22 to 2022</td><td>Expansion to peak</td><td>Growth 3.6%; unemployment 3.5%; inflation 7.9%</td></tr><tr><td>2023 to mid-2025</td><td>Slowdown</td><td>Growth 1.5% then 1.3%; GDP per capita fell</td></tr><tr><td>2025-26</td><td>Recovery</td><td>Growth 2.4%, led by investment</td></tr><tr><td>2026</td><td>Slowing again</td><td>Oil shock, four rate rises to 4.60%, unemployment 4.7%</td></tr></tbody></table></div>","figs":[["cycle","Figure 12.1 · The business cycle",""]],"worked":"<p><b>Question:</b> In mid-2026, quarterly growth was 0.4%, inflation 3.8% (well above target), the cash rate had risen from 3.60% to 4.35%, and unemployment had risen from 4.3% to 4.4% over the year. Identify the phase.</p><ol><li>Growth is positive but below trend; per capita growth is zero.</li><li>Unemployment is rising and higher rates are slowing demand.</li><li>Inflation is high from a supply shock, not strong demand.</li><li><b>Conclusion:</b> past the peak and moving into a contraction (slowdown), but not a recession.</li></ol>","mcq":[{"q":"In which phase does real GDP growth slow and unemployment begin to rise?","o":["Trough.","Expansion.","Contraction.","Recovery."],"a":2,"why":"Contraction is the downswing after a peak."},{"q":"Which is a leading indicator?","o":["The unemployment rate.","Building approvals.","The inflation rate.","Real GDP."],"a":1,"why":"Approvals today become construction activity months later."},{"q":"A common technical definition of a recession is:","o":["unemployment above 5%.","inflation above the RBA target.","one quarter of falling exports.","two consecutive quarters of negative real GDP growth."],"a":3,"why":"This is the widely used rule of thumb."},{"q":"At the peak, the economy typically has:","o":["low unemployment and rising inflationary pressure.","high unemployment and low inflation.","falling interest rates and low confidence.","negative real GDP growth."],"a":0,"why":"Demand is strongest at the peak, stretching capacity."},{"q":"Unemployment is a lagging indicator because it:","o":["is published monthly.","predicts future activity.","changes after the economy has already turned.","is measured by the RBA."],"a":2,"why":"Firms adjust hiring only after demand has changed."}],"di":{"stim":"<p>Selected indicators for Australia, 2026 (ABS and RBA).</p><div class=\"tw\"><table><thead><tr><th>Indicator</th><th>Earlier</th><th>Latest</th></tr></thead><tbody><tr><td>Real GDP, quarterly growth</td><td>0.3% (Mar qtr)</td><td>0.4% (Jun qtr)</td></tr><tr><td>Real GDP per capita, quarterly</td><td>−0.1% (Mar qtr)</td><td>0.0% (Jun qtr)</td></tr><tr><td>Unemployment rate</td><td>4.4% (Jun)</td><td>4.7% (Sep)</td></tr><tr><td>Headline CPI, annual</td><td>3.8% (Jun)</td><td>4.0% (Aug)</td></tr><tr><td>RBA cash rate target</td><td>3.60% (Jan)</td><td>4.60% (Sep)</td></tr></tbody></table></div>","items":[{"t":"text","q":"From the table, identify one coincident indicator and one lagging indicator.","marks":2,"key":[["Coincident: real GDP growth",1],["Lagging: unemployment rate or CPI",1]]},{"t":"text","q":"Identify the phase of the business cycle in 2026. Justify with the data.","marks":4,"key":[["Contraction or slowdown",1],["Growth weak at 0.3–0.4% a quarter; per capita flat",1],["Unemployment rose from 4.4% to 4.7%",1],["Inflation above target from a supply shock; cash rate raised to 4.60%",1]]},{"t":"text","q":"Explain how the cash rate increases are likely to affect the business cycle.","marks":3,"key":[["Higher rates raise borrowing costs",1],["Consumption and investment fall",1],["Growth slows, deepening the contraction and easing inflation",1]]},{"t":"text","q":"Predict the movement in unemployment over the next 12 months. Justify it.","marks":3,"key":[["Likely to rise",1],["Lagging indicator; rate rises still flowing through",1],["Weak growth means less hiring",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","diagram":true,"q":"Using a business cycle diagram, describe the features of the expansion and contraction phases.","marks":6,"key":[["Accurate diagram",1],["Fully labelled",1],["Expansion: rising growth, falling unemployment",1],["Expansion: rising inflation and confidence",1],["Contraction: slowing growth, rising unemployment",1],["Contraction: easing inflation, falling confidence",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Explain why business confidence is a leading indicator.","marks":3,"key":[["Confidence shapes investment and hiring decisions",1],["These are made before output changes",1],["Surveys capture expectations of future conditions",1]]}]}],"dd":[{"title":"Phases of the business cycle","body":"<p>Economies do not grow smoothly. They move through <b>expansion</b> (growth speeds up, unemployment falls), a <b>peak</b>, <b>contraction</b> (growth slows or turns negative) and a <b>trough</b>. A recession is often defined as two consecutive quarters of falling real GDP.</p>","fig":"cycle","mistakes":["Drawing the trend line inside the cycle as flat. It slopes upward."],"check":{"q":"Which phase usually brings the fastest fall in unemployment?","o":["Contraction","Expansion","Peak"],"a":1,"why":"Firms hire as demand grows."},"src":[["RBA, Explainer: Business Cycles","https://www.rba.gov.au/education/resources/explainers/business-cycles.html"]]},{"title":"Indicators that move first","body":"<p>Economists watch indicators that change <b>before</b> GDP does (leading), at the same time (coincident) or after (lagging).</p>","fig":"indicators","case":"Each month the Westpac-Melbourne Institute Consumer Sentiment index and the NAB Business Survey are closely watched. A sharp fall in either often signals slower spending ahead.","mistakes":["Calling unemployment a leading indicator. It usually lags."],"check":{"q":"Building approvals are a leading indicator because:","o":["They show work that will happen in future","They measure past output","They are released yearly"],"a":0,"why":"Approved projects lead to construction later."},"src":[["Westpac-Melbourne Institute Consumer Sentiment","https://www.westpac.com.au/about-westpac/media/reports/consumer-sentiment/"],["NAB, Monthly Business Survey","https://business.nab.com.au/tag/business-survey"]]},{"title":"Two recessions: 1991 and 2020","body":"<div class=\"tw\"><table><thead><tr><th></th><th>1990–91</th><th>2020</th></tr></thead><tbody><tr><td>Main cause</td><td>Very high interest rates (above 17% for mortgages) to curb inflation</td><td>COVID-19 lockdowns and border closures</td></tr><tr><td>GDP</td><td>Fell over several quarters</td><td>Fell 7.0% in the June quarter 2020</td></tr><tr><td>Peak unemployment</td><td>Above 11% in late 1992</td><td>7.5% in July 2020</td></tr><tr><td>Recovery</td><td>Slow; unemployment high for years</td><td>Fast, helped by JobKeeper and low rates</td></tr></tbody></table></div>","mistakes":["Saying Australia had no recession for 29 years \"because GDP never fell\". It did fall in some single quarters."],"check":{"q":"Why did unemployment recover faster after 2020?","o":["Wage subsidies kept workers attached to jobs","Interest rates were raised","Immigration rose sharply"],"a":0,"why":"JobKeeper kept employer links intact."}},{"title":"The per capita recession, 2023–24","body":"<p>Australia avoided a technical recession after 2022 because total GDP kept growing. But real GDP per person fell for <b>six quarters in a row</b> to the June quarter 2024, the longest run on record. Rising interest rates and prices squeezed households while strong migration kept total GDP positive.</p>","fig":"cashrate","mistakes":["Saying Australia was in a technical recession in 2023."],"check":{"q":"How could GDP grow while GDP per capita fell?","o":["Population grew faster than GDP","Inflation fell","Exports fell"],"a":0,"why":"More people shared slower growth."},"src":[["AICD, Australia’s per capita recession","https://www.aicd.com.au/economic-trends/australia/gdp/per-capita-recession.html"]]}]},{"id":"t13","unit":2,"n":13,"title":"Income distribution","lead":"The Lorenz curve shows how unequal the distribution is; the Gini coefficient sums it up. Australia's Gini for disposable household income was 0.324 in the ABS's 2019-20 survey.","notes":"<div class=\"tw\"><table><thead><tr><th></th><th>Income</th><th>Wealth</th></tr></thead><tbody><tr><td>Definition</td><td>A <b>flow</b> received over a period</td><td>A <b>stock</b> of assets less liabilities at a point in time</td></tr><tr><td>Examples</td><td>Wages, profits, rent, interest, government payments</td><td>Housing, superannuation, shares, savings</td></tr><tr><td>Distribution</td><td>Unequal</td><td>Much more unequal</td></tr></tbody></table></div><ul><li><b>Lorenz curve:</b> cumulative % of households (poorest to richest) against cumulative % of income. The diagonal is perfect equality.</li><li><b>Gini coefficient:</b> 0 (perfect equality) to 1 (one household has everything).</li></ul><p class=\"formula\">Gini = area between equality line and Lorenz curve ÷ total area under the equality line</p><div class=\"tw\"><table><thead><tr><th>Measure</th><th>Gini</th><th>Source</th></tr></thead><tbody><tr><td>Gross household income, 2019-20</td><td>0.436</td><td>ABS Survey of Income and Housing</td></tr><tr><td>Disposable household income, 2019-20</td><td>0.324</td><td>ABS Survey of Income and Housing</td></tr><tr><td>Disposable household income, 2022-23</td><td>0.307</td><td>HILDA, reported by the ABS</td></tr><tr><td>Household net worth, 2022-23</td><td>0.606</td><td>HILDA, reported by the ABS</td></tr></tbody></table></div><p>The gap between gross and disposable Gini shows progressive tax and transfers reduce inequality. Wealth is more unequal because it builds up over a lifetime and earns returns.</p>","figs":[["lorenz","Figure 13.1 · Lorenz curve for a hypothetical economy (quintile shares 7, 12, 17, 23, 41%)",""]],"worked":"<ol><li>The bottom 40% receive <b>19%</b> of income (7% + 12%).</li><li>The top 20% receive 100% − 59% = <b>41%</b>.</li><li>The top 20% receive about <b>5.9 times</b> the bottom 20% (41 ÷ 7).</li><li>With equality the bottom 40% would get 40%; the gap to 19% shows the inequality.</li></ol>","mcq":[{"q":"A Gini coefficient of 0 indicates:","o":["one household receives all income.","moderate inequality.","perfect equality.","zero income growth."],"a":2,"why":"At 0, the Lorenz curve sits on the line of equality."},{"q":"Which statement about wealth is correct?","o":["Wealth is the same as income.","Wealth is measured over a financial year.","Wealth is more equally distributed than income.","Wealth is a stock of assets less liabilities at a point in time."],"a":3,"why":"Wealth is a stock; income is a flow."},{"q":"The further a Lorenz curve is from the line of equality:","o":["the more unequal the distribution.","the more equal the distribution.","the higher the average income.","the lower the Gini coefficient."],"a":0,"why":"A bigger gap means a larger Gini and more inequality."},{"q":"Australia's Gini for disposable income is lower than for gross income mainly because of:","o":["higher interest rates.","economic growth.","progressive income tax and transfer payments.","the GST."],"a":2,"why":"Tax takes more from high incomes; transfers add to low incomes."},{"q":"Which change would move Australia's Lorenz curve closer to the line of equality?","o":["A cut in the top marginal tax rate.","Faster growth in house prices.","A cut in pensions and allowances.","An increase in payments to low-income households."],"a":3,"why":"Raising low incomes narrows the gap."}],"di":{"stim":"<div class=\"tw\"><table><thead><tr><th>Quintile</th><th>Country A (%)</th><th>Country B (%)</th></tr></thead><tbody><tr><td>Lowest 20%</td><td>8</td><td>4</td></tr><tr><td>Second 20%</td><td>13</td><td>9</td></tr><tr><td>Third 20%</td><td>17</td><td>14</td></tr><tr><td>Fourth 20%</td><td>22</td><td>21</td></tr><tr><td>Highest 20%</td><td>40</td><td>52</td></tr><tr><td>Gini</td><td>0.29</td><td>0.43</td></tr></tbody></table></div>","items":[{"t":"calc","q":"Calculate the share of income received by the lowest 40% in each country.","marks":2,"inputs":[{"label":"Country A (%)","ans":21,"tol":0},{"label":"Country B (%)","ans":13,"tol":0}],"work":"A: 8 + 13 = 21%. B: 4 + 9 = 13%."},{"t":"text","q":"Identify which country has the more equal distribution. Justify with two pieces of data.","marks":2,"key":[["Country A",1],["Two data points (lower Gini 0.29 vs 0.43; top 20% gets 40% vs 52%)",1]]},{"t":"text","diagram":true,"q":"Draw and label the Lorenz curves for both countries on one diagram.","marks":4,"key":[["Axes and line of equality",1],["A plotted at 8, 21, 38, 60, 100",1],["B plotted at 4, 13, 27, 48, 100, further from the diagonal",1],["Both curves labelled",1]]},{"t":"text","q":"Explain how Country B's government could use tax and transfers to make income more equal.","marks":3,"key":[["Progressive tax takes a higher share from high incomes",1],["Transfers raise low incomes",1],["Lorenz curve moves towards the diagonal; Gini falls",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","q":"Distinguish between income and wealth, using an example of each.","marks":3,"key":[["Income: a flow over a period, with example",1],["Wealth: a stock at a point in time",1],["Example of wealth",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Explain why wealth is distributed less equally than income in Australia.","marks":3,"key":[["Wealth builds up over a lifetime",1],["Assets earn returns, capital gains, inheritances",1],["High-income households save more and own more property",1]]}]}],"dd":[{"title":"Income versus wealth","body":"<p><b>Income</b> is a flow: money earned over a period (wages, interest, rent, dividends, government payments). <b>Wealth</b> is a stock: the value of assets owned at a point in time (housing, super, shares), minus debts.</p><p>Wealth is much more unequal than income. In 2019-20, the ABS Gini coefficient was about 0.32 for disposable income but 0.61 for household wealth.</p>","mistakes":["Using income and wealth as if they mean the same thing."],"check":{"q":"Which is wealth?","o":["A $900 weekly pay cheque","A house worth $650 000","A pension payment"],"a":1,"why":"An asset owned is a stock of wealth."},"src":[["ABS, Household Income and Wealth, Australia, 2019-20","https://www.abs.gov.au/statistics/economy/finance/household-income-and-wealth-australia/latest-release"]]},{"title":"Equivalised income and quintiles","body":"<p>A family of five on $150 000 is not as well off as a single person on $150 000. <b>Equivalised income</b> adjusts household income for size and makeup, so households can be compared fairly.</p><p>The ABS then ranks all households and divides them into five equal groups: <b>quintiles</b>. Comparing the shares of each quintile shows how evenly income is spread.</p>","mistakes":["Saying the top quintile is the richest 5%. It is the top 20%."],"check":{"q":"A quintile contains what share of households?","o":["5%","20%","25%"],"a":1,"why":"Five equal groups of 20%."}},{"title":"The Lorenz curve and the Gini coefficient","body":"<p>The Lorenz curve plots the cumulative share of income against the cumulative share of households. The further it bows from the line of equality, the more unequal the distribution.</p><p><b>Gini = A ÷ (A + B)</b>, where A is the area between the line of equality and the Lorenz curve, and B is the area under the curve. 0 = perfect equality; 1 = one household has everything.</p>","fig":"ginitrend","mistakes":["Saying a higher Gini means more equality."],"check":{"q":"Gini rises from 0.30 to 0.32. Income inequality has:","o":["Fallen","Risen","Not changed"],"a":1,"why":"A higher Gini means more inequality."},"src":[["Melbourne Institute, HILDA Statistical Report","https://melbourneinstitute.unimelb.edu.au/hilda/publications/hilda-statistical-reports"]]},{"title":"Causes of inequality","body":"<ul><li><b>Education and skills:</b> higher skills usually earn higher wages.</li><li><b>Wealth begets income:</b> assets earn rent, interest and dividends.</li><li><b>Housing:</b> owners have gained from rising prices; renters have not.</li><li><b>Age and life stage:</b> income peaks in middle age.</li><li><b>Location:</b> remote areas have fewer high-paid jobs.</li><li><b>Discrimination and opportunity:</b> unequal access to jobs or education.</li></ul>","mistakes":["Listing causes without explaining how each one changes the distribution."],"check":{"q":"Rising house prices tend to:","o":["Reduce wealth inequality","Increase wealth inequality between owners and renters","Have no effect"],"a":1,"why":"Owners gain wealth; renters do not."}},{"title":"How the tax-transfer system redistributes","body":"<p>Australia’s <b>progressive income tax</b> takes a larger share from higher incomes. <b>Transfer payments</b> (Age Pension, JobSeeker, Family Tax Benefit) are targeted at lower incomes. Public services like Medicare and public schools also help. Together they reduce inequality significantly: in 2019-20 the Gini was about 0.44 before taxes and transfers and 0.32 after.</p>","mistakes":["Saying GST is progressive. It takes a larger share of low incomes."],"check":{"q":"Which is a transfer payment?","o":["Company tax","JobSeeker Payment","GST"],"a":1,"why":"It is paid by government to individuals."},"src":[["ABS, Household Income and Wealth, Australia, 2019-20","https://www.abs.gov.au/statistics/economy/finance/household-income-and-wealth-australia/latest-release"]]},{"title":"Housing and the wealth divide","body":"<p>Housing is the biggest asset most households own. Rapid price growth has made it harder for young people to buy, and the gap between owners and renters has grown. Rent stress (paying more than 30% of income on rent) is most common among lower-income renters.</p>","case":"Perth home values rose strongly from 2023, fuelled by population growth and low supply, so even WA, once seen as affordable, now faces affordability pressures.","mistakes":["Ignoring the link between housing, wealth and intergenerational inequality."],"check":{"q":"A household is in rent stress if rent is more than about:","o":["10% of income","30% of income","60% of income"],"a":1,"why":"30% is the common benchmark."},"src":[["AIHW, Housing affordability","https://www.aihw.gov.au/reports/australias-welfare/housing-affordability"]]}]},{"id":"t14","unit":2,"n":14,"title":"Government in the macroeconomy","lead":"The Commonwealth expects to raise $798.1 billion and spend $833.3 billion in 2026-27. Almost half its revenue comes from individual income tax.","notes":"<div class=\"tw\"><table><thead><tr><th>Spending area, 2026-27</th><th>Share (%)</th></tr></thead><tbody><tr><td>Social security and welfare</td><td>37</td></tr><tr><td>Health</td><td>16</td></tr><tr><td>Education</td><td>7</td></tr><tr><td>Defence</td><td>6</td></tr><tr><td>General public services</td><td>4</td></tr><tr><td>Other</td><td>30</td></tr></tbody></table></div><p>Spending exceeds revenue, so the Budget is in deficit (about $31.5 billion in 2026-27).</p><div class=\"tw\"><table><thead><tr><th>Classification</th><th>Meaning</th><th>Examples</th></tr></thead><tbody><tr><td>Direct</td><td>On income or profit, paid by the earner</td><td>Personal income tax, company tax</td></tr><tr><td>Indirect</td><td>On spending, collected by sellers</td><td>GST, excise</td></tr><tr><td>Progressive</td><td>Average rate rises with income</td><td>Personal income tax</td></tr><tr><td>Regressive</td><td>Larger share from low incomes</td><td>GST, tobacco excise</td></tr><tr><td>Proportional</td><td>Same rate at every income</td><td>Company tax (30%, or 25% base rate entities)</td></tr></tbody></table></div><h4>Resident income tax rates 2026-27 (ATO)</h4><div class=\"tw\"><table><thead><tr><th>Taxable income</th><th>Tax on this income</th></tr></thead><tbody><tr><td>$0 – $18 200</td><td>Nil</td></tr><tr><td>$18 201 – $45 000</td><td>15c for each $1 over $18 200</td></tr><tr><td>$45 001 – $135 000</td><td>$4020 + 30c for each $1 over $45 000</td></tr><tr><td>$135 001 – $190 000</td><td>$31 020 + 37c for each $1 over $135 000</td></tr><tr><td>$190 001 and over</td><td>$51 370 + 45c for each $1 over $190 000</td></tr></tbody></table></div><p>Excludes the 2% Medicare levy and offsets. Average rate = tax ÷ taxable income × 100. Marginal rate = rate on the next dollar.</p><div class=\"tw\"><table><thead><tr><th>Objective</th><th>Meaning</th></tr></thead><tbody><tr><td>Sustainable economic growth</td><td>Steady real GDP growth without inflation or environmental harm</td></tr><tr><td>Price stability</td><td>Inflation within 2–3%</td></tr><tr><td>Full employment</td><td>Unemployment as low as possible without rising inflation</td></tr><tr><td>More equitable income distribution</td><td>Reducing inequality through tax and transfers</td></tr></tbody></table></div><div class=\"tw\"><table><thead><tr><th>Situation</th><th>Demand management response</th></tr></thead><tbody><tr><td>Spending weak, unemployment rising</td><td>Expansionary: raise G, cut taxes; RBA cuts the cash rate</td></tr><tr><td>Spending strong, inflation rising</td><td>Contractionary: cut G, raise taxes; RBA raises the cash rate</td></tr><tr><td>Supply shock raises inflation and unemployment</td><td>A trade-off: fighting one worsens the other; targeted support can help</td></tr></tbody></table></div>","figs":[["budget","Figure 14.1 · Budget 2026-27 revenue composition (Pitcher Partners summary, May 2026)",""]],"worked":"<div class=\"tw\"><table><thead><tr><th>Taxable income</th><th>Tax payable</th><th>Average rate</th><th>Marginal rate</th></tr></thead><tbody><tr><td>$30 000</td><td>(30 000 − 18 200) × 0.15 = <b>$1770</b></td><td><b>5.9%</b></td><td><b>15%</b></td></tr><tr><td>$80 000</td><td>4020 + 35 000 × 0.30 = <b>$14 520</b></td><td><b>18.2%</b></td><td><b>30%</b></td></tr></tbody></table></div><p>The average rate rises with income, so personal income tax is <b>progressive</b>.</p>","mcq":[{"q":"The largest source of Commonwealth revenue is:","o":["individual income tax.","company tax.","the GST.","excise duty."],"a":0,"why":"Individual income tax raises about 48% of revenue."},{"q":"The GST is best described as:","o":["a direct, progressive tax.","a direct, proportional tax on income.","an indirect tax that is regressive relative to income.","a tax on company profits."],"a":2,"why":"It is collected on spending, and low-income households spend more of their income."},{"q":"A tax is progressive when:","o":["everyone pays the same amount.","the average tax rate rises as income rises.","it is collected by businesses.","low-income earners pay a higher share of income."],"a":1,"why":"Progressive means the share of income taken rises with income."},{"q":"A person's marginal tax rate is the:","o":["total tax divided by total income.","rate of GST on their spending.","Medicare levy rate.","rate of tax paid on the next dollar earned."],"a":3,"why":"Total tax ÷ income is the average rate."},{"q":"Which is a macroeconomic objective of the Australian Government?","o":["Maximising company profits.","Balancing the budget every year.","Keeping inflation within the 2–3% target range.","Increasing the exchange rate."],"a":2,"why":"Price stability is one of the four objectives."}],"di":{"stim":"<p>Use the 2026-27 resident tax rates and Figure 14.1.</p>","items":[{"t":"calc","q":"Calculate the income tax payable on $60 000.","marks":2,"inputs":[{"label":"Tax ($)","ans":8520,"tol":0}],"work":"$4020 + ($60 000 − $45 000) × 0.30 = $8520."},{"t":"calc","q":"Calculate the average tax rate on $60 000, and state the marginal rate.","marks":2,"inputs":[{"label":"Average rate (%)","ans":14.2,"tol":0.05},{"label":"Marginal rate (%)","ans":30,"tol":0}],"work":"8520 ÷ 60 000 × 100 = 14.2%. Marginal rate 30%."},{"t":"calc","q":"Calculate the tax payable and average rate on $200 000.","marks":2,"inputs":[{"label":"Tax ($)","ans":55870,"tol":0},{"label":"Average rate (%)","ans":27.9,"tol":0.05}],"work":"$51 370 + $10 000 × 0.45 = $55 870. 55 870 ÷ 200 000 = 27.9%."},{"t":"text","q":"Using your answers, explain why personal income tax is progressive.","marks":2,"key":[["Average rate rises from 14.2% to 27.9% as income rises",1],["That is the definition of a progressive tax",1]]},{"t":"text","q":"Classify each of the three largest revenue sources in Figure 14.1 as direct or indirect.","marks":2,"key":[["Individual income tax and company tax: direct",1],["GST: indirect",1]]},{"t":"text","q":"Explain why the GST is regressive even though everyone pays 10%.","marks":3,"key":[["Same 10% rate for all",1],["Low-income households spend a larger share of their income",1],["So GST takes a larger share of their income",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","q":"Outline the four macroeconomic objectives of the Australian Government.","marks":4,"key":[["Sustainable economic growth",1],["Price stability (2–3%)",1],["Full employment",1],["More equitable distribution of income",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"In 2026 an oil price rise lifted inflation while unemployment rose. Recommend one demand management policy and explain the trade-off.","marks":5,"key":[["Clear recommendation (e.g. keep rates tight, or targeted fiscal support)",1],["How the policy works",1],["Further explanation of the mechanism",1],["Trade-off: fighting inflation raises unemployment",1],["…or supporting jobs risks higher inflation",1]]}]}],"dd":[{"title":"The Budget at a glance","body":"<p>Each year, the Treasurer delivers the Budget, setting out what the Commonwealth expects to collect and spend. The 2026-27 Budget forecast <b>revenue of $798.1 billion</b>, <b>spending of $833.3 billion</b> and a <b>deficit of $31.5 billion</b>. Gross debt was expected to pass $1 trillion.</p>","fig":"budget","mistakes":["Confusing deficit (one year) with debt (accumulated total)."],"check":{"q":"If spending is $833b and revenue is $798b, the budget is in:","o":["Surplus of $35b","Deficit of $35b","Balance"],"a":1,"why":"Spending exceeds revenue."},"src":[["Australian Government, Budget 2026-27","https://budget.gov.au/"]]},{"title":"The main taxes","body":"<div class=\"tw\"><table><thead><tr><th>Tax</th><th>Who pays</th><th>Type</th></tr></thead><tbody><tr><td>Personal income tax</td><td>Individuals on income</td><td>Progressive; the largest source of revenue</td></tr><tr><td>Company tax</td><td>Companies on profit (30%; 25% for small firms)</td><td>Proportional</td></tr><tr><td>GST</td><td>Consumers on most goods and services (10%)</td><td>Regressive in effect; revenue goes to the states</td></tr><tr><td>Excise</td><td>Fuel, alcohol and tobacco</td><td>Regressive in effect</td></tr><tr><td>Payroll tax</td><td>Large employers (state tax)</td><td>Proportional</td></tr></tbody></table></div>","fig":"taxrates","mistakes":["Saying people in a higher bracket pay the higher rate on all their income. It applies only
