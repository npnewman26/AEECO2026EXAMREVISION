<style>
/* Layout: a school study workbook — navy topic index on the left, one topic at a time on the right (Learn / Practise). Colours follow the college: navy, royal blue, sky blue, gold. Collapses to a navy top bar on phones. */
:root {
  --navy: #002855; --royal: #0057b8; --sky: #41b6e6; --gold: #d38a03;
  --paper: #f4f6fa; --card: #ffffff; --ink: #14223a; --muted: #586579; --rule: #dbe1ea; --rule-strong: #b8c2d1;
  --accent: #0057b8; --accent-ink: #ffffff; --accent-soft: #e6eef9; --head: #002855; --eyebrow: #a86c00;
  --side-bg: #002855; --side-ink: #ffffff; --side-muted: #9fb3cf; --side-hover: rgba(255, 255, 255, .08); --side-on: #41b6e6; --side-on-ink: #002855;
  --good: #1f7a4a; --good-soft: #e3f3ea; --bad: #b3402c; --bad-soft: #f9e6e2;
  --fig-axis: #97a3b5; --fig-muted: #c3ccd9; --fig-tint: #edf1f7; --shadow: 0 1px 2px rgba(0, 40, 85, .06), 0 4px 14px rgba(0, 40, 85, .06);
  --display: "EB Garamond", Garamond, "Times New Roman", serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Source Code Pro", ui-monospace, Menlo, monospace;
  --cds-text-primary: var(--ink); --cds-text-secondary: var(--muted); --cds-chart-axis: var(--fig-axis);
  --cds-chart-categorical-1: var(--royal); --cds-chart-muted: var(--fig-muted); --cds-chart-grid: var(--rule);
  --cds-chart-reference: var(--muted); --cds-chart-reference-tint: var(--fig-tint);
  --cds-chart-status-good: var(--good); --cds-chart-status-critical: var(--bad);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0b1626; --card: #112036; --ink: #e6ecf5; --muted: #9aa9bf; --rule: #22344f; --rule-strong: #34496a;
  --accent: #41b6e6; --accent-ink: #00213f; --accent-soft: #15314f; --head: #ffffff; --eyebrow: #e9a93a;
  --side-bg: #061223; --side-muted: #8ea3c2; --side-hover: rgba(255, 255, 255, .06);
  --good: #5cc48b; --good-soft: #143425; --bad: #f08a76; --bad-soft: #3a1e1a;
  --fig-axis: #6b7d97; --fig-muted: #3b4f6c; --fig-tint: #172a44; --shadow: none; --royal: #5aa9ef; color-scheme: dark } }
:root[data-theme="dark"] {

* { box-sizing: border-box }

.prose ul, .prose ol { padding-left: 22px; margin: 8px 0 }

.formula { font-family: var(--mono); font-size: 14.5px; background: var(--accent-soft); border-radius: .3em; padding: 12px 16px; overflow-x: auto; color: var(--ink) }
.tw { overflow-x: auto; margin: 12px 0; background: var(--card); border-radius: 8px; box-shadow: var(--shadow); border: 1px solid var(--rule) }
table { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums }

tr:last-child td { border-bottom: 0 }

figure { margin: 8px 0; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 18px; box-shadow: var(--shadow) }
figure .fig { overflow-x: auto }
figure svg { display: block; width: 100%; min-width: 520px; height: auto }

.opt:hover:not([disabled]) { border-color: var(--sky); background: var(--accent-soft) }

<script>
const DATA = {"topics":[{"id":"t1","unit":1,"n":1,"title":"Introduction to economics","lead":"Scarcity forces choice, and every choice has an opportunity cost. The PPF is the model that shows this.","notes":"<ul><li><b>Economics</b> studies how society allocates scarce resources to satisfy unlimited wants.</li><li><b>Microeconomics</b> studies individual markets, firms and consumers. <b>Macroeconomics</b> studies the whole economy: growth, inflation, unemployment.</li><li><b>The economic problem:</b> wants are unlimited but resources are scarce. Every society must decide what to produce, how to produce it and for whom.</li><li><b>Factors of production:</b> land (rent), labour (wages), capital (interest) and enterprise (profit).</li><li><b>Opportunity cost:</b> the value of the next best alternative forgone when a choice is made.</li><li><b>Economic decision-making:</b> identify the problem, gather information, list alternatives, weigh costs and benefits, decide, then review. At the margin, keep doing an activity while marginal benefit (MB) ≥ marginal cost (MC).</li><li><b>Economic models</b> simplify reality so one relationship can be studied. They assume <i>ceteris paribus</i> (all other things held constant).</li><li><b>Market economy:</b> private ownership of resources, the price mechanism allocates resources, the profit motive, consumer sovereignty, competition and a limited role for government. Australia is a <i>modified</i> (mixed) market economy.</li></ul>","figs":[["ppf","Figure 1.1 · Production Possibility Frontier","<ul><li><b>On the curve (A, B):</b> efficient.</li><li><b>Inside (C):</b> resources unemployed or underused.</li><li><b>Outside (D):</b> unattainable with current resources and technology.</li><li><b>Concave shape:</b> resources are not equally suited to both goods, so opportunity cost rises.</li><li><b>Outward shift:</b> more resources, better technology or higher productivity. This is economic growth.</li></ul>"]],"worked":"<p>A WA farm can produce these combinations of wheat and canola.</p><div class=\"tw\"><table><thead><tr><th>Combination</th><th>Wheat (t)</th><th>Canola (t)</th></tr></thead><tbody><tr><td>A</td><td>0</td><td>100</td></tr><tr><td>B</td><td>20</td><td>95</td></tr><tr><td>C</td><td>40</td><td>85</td></tr><tr><td>D</td><td>60</td><td>65</td></tr><tr><td>E</td><td>80</td><td>35</td></tr><tr><td>F</td><td>100</td><td>0</td></tr></tbody></table></div><p><b>Question:</b> Calculate the opportunity cost of moving from C to D.</p><ol><li>Wheat gained = 60 − 40 = 20 tonnes.</li><li>Canola forgone = 85 − 65 = 20 tonnes.</li><li>Opportunity cost per tonne of wheat = 20 ÷ 20 = <b>1 tonne of canola</b>.</li></ol><p>From A to B each tonne of wheat cost only 0.25 t of canola; from E to F it costs 1.75 t. Rising opportunity cost is why the PPF bows outward.</p>","mcq":[{"q":"Opportunity cost is best defined as:","o":["the money price paid for a good.","the total cost of all alternatives available.","the value of the next best alternative forgone.","the cost of producing one more unit of a good."],"a":2,"why":"Opportunity cost is only the single next best alternative given up, not every alternative or the money price."},{"q":"Which of the following is a macroeconomic issue?","o":["The price of avocados falls after a strong harvest.","Australia's unemployment rate rises over a year.","A café raises the price of coffee.","A mining firm hires 50 more workers."],"a":1,"why":"The national unemployment rate describes the whole economy. The other options are individual markets or firms."},{"q":"A point inside an economy's PPF shows that:","o":["the economy is producing at maximum efficiency.","the combination cannot be produced.","some resources are unemployed or used inefficiently.","opportunity cost is zero for both goods."],"a":2,"why":"Inside the frontier, more of both goods could be made, so some resources are idle or misused."},{"q":"Which of the following would shift Australia's PPF outward?","o":["A fall in the unemployment rate.","An improvement in production technology.","A rise in the price of consumer goods.","A shift of workers from manufacturing to services."],"a":1,"why":"Better technology raises maximum possible output. Lower unemployment moves the economy towards the existing PPF, not beyond it."},{"q":"Which of the following is <b>not</b> a characteristic of a market economy?","o":["Private ownership of resources.","The profit motive.","A central agency sets prices and output.","Consumer sovereignty."],"a":2,"why":"Central planning of prices and output describes a command economy."}],"di":{"stim":"<p>An economy produces two goods using all of its resources.</p><div class=\"tw\"><table><thead><tr><th>Combination</th><th>Solar panels ('000)</th><th>Batteries ('000)</th></tr></thead><tbody><tr><td>V</td><td>0</td><td>60</td></tr><tr><td>W</td><td>10</td><td>56</td></tr><tr><td>X</td><td>20</td><td>48</td></tr><tr><td>Y</td><td>30</td><td>34</td></tr><tr><td>Z</td><td>40</td><td>0</td></tr></tbody></table></div>","items":[{"t":"calc","q":"Calculate the opportunity cost of increasing solar panel output from 10 000 to 20 000 units.","marks":2,"inputs":[{"label":"Batteries forgone per panel","ans":0.8,"tol":0.01}],"work":"Panels rise by 10 000; batteries fall from 56 000 to 48 000 (8000). 8000 ÷ 10 000 = 0.8 batteries per panel."},{"t":"text","q":"Explain why the opportunity cost of solar panels rises as more are produced.","marks":3,"key":[["Resources are not equally suited to producing both goods",1],["As panel output rises, resources better suited to batteries are switched over",1],["So more batteries are given up per extra panel (0.4, 0.8, 1.4, 3.4), giving the PPF a concave shape",1]]},{"t":"text","q":"The economy produces 20 000 panels and 40 000 batteries. Identify where this point lies relative to the PPF and outline what it indicates.","marks":2,"key":[["Inside the PPF (it could make 48 000 batteries at 20 000 panels)",1],["Resources are unemployed or used inefficiently",1]]},{"t":"text","diagram":true,"q":"A breakthrough in battery technology raises battery output but not solar panel production. Using a PPF diagram, demonstrate the effect on the economy.","marks":4,"key":[["Axes labelled",1],["Original PPF drawn",1],["PPF pivots outward on the battery axis; the panel intercept (40 000) stays the same",1],["Explains that more batteries can be made at every level of panel output (economic growth)",1]]}]},"sa":[{"label":"Question 1","stim":"<p>A café owner is deciding how many extra hours to open after 5 pm.</p><div class=\"tw\"><table><thead><tr><th>Extra hour</th><th>Marginal benefit ($)</th><th>Marginal cost ($)</th></tr></thead><tbody><tr><td>1st</td><td>180</td><td>90</td></tr><tr><td>2nd</td><td>150</td><td>110</td></tr><tr><td>3rd</td><td>120</td><td>120</td></tr><tr><td>4th</td><td>90</td><td>140</td></tr></tbody></table></div>","items":[{"t":"calc","q":"How many extra hours should the café open?","marks":3,"inputs":[{"label":"Extra hours","ans":3,"tol":0}],"work":"Hours 1–3 have MB ≥ MC (hour 3: MB = MC = $120). Hour 4 has MC $140 > MB $90, so it would reduce net benefit. Net benefit peaks at $130 after 3 hours.","key":[["States 3 extra hours",1],["For hours 1–3, MB ≥ MC so each adds to net benefit",1],["The 4th hour has MC > MB, so net benefit falls",1]]},{"t":"text","q":"Outline the opportunity cost to the owner of opening for those extra hours.","marks":2,"key":[["Identifies the next best alternative forgone (e.g. leisure time, another business activity)",1],["Explains why it is given up",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Explain two characteristics of a market economy, using an Australian example for each.","marks":4,"key":[["First characteristic explained (private ownership, price mechanism, profit motive, consumer sovereignty, competition)",1],["Australian example for the first",1],["Second characteristic explained",1],["Australian example for the second",1]]}]}],"dd":[{"title":"Scarcity and the three economic questions","body":"<p>Scarcity is not the same as poverty. Even the richest country has limited land, workers, machines and time, but people’s wants keep growing. Because we cannot have everything, every society has to answer three questions:</p><ul><li><b>What to produce?</b> More hospitals or more roads? More iron ore or more tourism?</li><li><b>How to produce?</b> With lots of workers (labour-intensive) or lots of machines (capital-intensive)?</li><li><b>For whom?</b> Who gets the output: whoever can pay, or whoever needs it most?</li></ul><p>In a market economy, prices answer most of these questions. Governments step in where the market answer is unfair or inefficient, such as public schools and Medicare.</p>","case":"WA’s mining boom pulled workers, trucks and engineers into the Pilbara. That answered \"what to produce\" (more iron ore) but made it harder for Perth builders and farmers to find workers. Scarce labour had to be shared between industries.","mistakes":["Saying scarcity means \"a shortage\". A shortage is temporary and caused by price; scarcity is permanent.","Forgetting enterprise as the fourth factor of production."],"check":{"q":"Which question is answered when a farmer chooses robots instead of extra workers?","o":["What to produce","How to produce","For whom to produce"],"a":1,"why":"Choosing the method (capital versus labour) answers \"how\"."},"src":[["SCSA, Economics ATAR Year 11 syllabus (2026)","https://senior-secondary.scsa.wa.edu.au/__data/assets/word_doc/0009/1230678/Economics-ATAR-Year-11-Syllabus-for-teaching-from-2026.DOCX"],["RBA, Explainers for students","https://www.rba.gov.au/education/resources/explainers/"]]},{"title":"Opportunity cost in government budgets","body":"<p>Every dollar a government spends on one thing is a dollar it cannot spend on something else, or return as a tax cut. Economists measure the real cost of a choice as the <b>next best alternative given up</b>, not just the dollar price.</p><p>Opportunity cost also applies to time. The cost of studying tonight is the shift at work you could have done, or the time with friends, whichever you value most.</p>","case":"When the Commonwealth spends more on defence or the NDIS, the opportunity cost might be fewer tax cuts or less spending on schools. Budget papers list these choices each May.","mistakes":["Listing every alternative given up. Opportunity cost is only the single next best one.","Ignoring non-money costs such as time."],"check":{"q":"You choose to work a $120 shift instead of going to the beach (your next best option). The opportunity cost is:","o":["$120","The day at the beach","Nothing, because you earned money"],"a":1,"why":"The opportunity cost of working is the beach day you gave up."},"src":[["Australian Government, Budget 2026-27","https://budget.gov.au/"],["WA Government, State Budget","https://www.ourstatebudget.wa.gov.au/"]]},{"title":"Thinking at the margin","body":"<p>Most decisions are not all-or-nothing. They are about <b>one more</b>: one more hour of study, one more worker, one more hour open. Economists compare the <b>marginal benefit</b> (extra gain) with the <b>marginal cost</b> (extra cost) of that next unit.</p><p>The rule is simple: keep going while MB ≥ MC, and stop when the next unit would cost more than it is worth.</p>","fig":"marginal","case":"Many Perth cafés close mid-afternoon on weekdays. After the lunch rush, the extra revenue from staying open (MB) is often smaller than the cost of staff wages and power (MC).","mistakes":["Comparing total benefit with total cost instead of the extra (marginal) amounts.","Stopping when MB = MC is reached and then adding one more unit."],"check":{"q":"The 5th hour of tutoring brings $40 of benefit and costs $55. A rational tutor should:","o":["Work the 5th hour","Stop after 4 hours","Work extra hours to cover the loss"],"a":1,"why":"MC is greater than MB for the 5th hour, so it lowers net benefit."}},{"title":"Why economists use models","body":"<p>A model is a simplified picture of how part of the economy works, like a map. A map leaves out every tree so you can see the roads; a model leaves out detail so you can see one relationship clearly.</p><p>Models rely on <i>ceteris paribus</i> (other things held constant). When you draw a demand curve, you hold income, tastes and other prices fixed so you can see how price alone affects quantity demanded.</p><ul><li>Good models make clear predictions you can test against data.</li><li>All models are wrong in detail, but useful ones explain the main pattern.</li></ul>","mistakes":["Drawing a diagram without labelled axes, curves and equilibrium points.","Changing two things at once and forgetting to say which one moved first."],"check":{"q":"\"Ceteris paribus\" means:","o":["All else being equal","At equilibrium","In the long run"],"a":0,"why":"It is Latin for \"other things being equal\"."}},{"title":"PPF shapes and what shifts them","body":"<p>A straight-line PPF means opportunity cost is <b>constant</b>: resources are equally good at making both goods. Most real PPFs are <b>bowed out</b> (concave) because resources are specialised. Moving a mine engineer into teaching does not produce a great teacher, so each extra unit of one good costs more of the other.</p><ul><li><b>Outward shift (growth):</b> more workers through migration, more capital through investment, new technology, better skills.</li><li><b>Inward shift:</b> natural disasters, war, a falling population, resource depletion.</li><li><b>Pivot:</b> technology that only affects one good, such as faster battery production.</li></ul>","fig":"ppfshapes","mistakes":["Saying falling unemployment shifts the PPF outward. It moves the economy from inside the PPF towards it.","Drawing a pivot as a parallel shift when only one good is affected."],"check":{"q":"A cyclone destroys roads and ports in the Pilbara. The PPF:","o":["Shifts outward","Shifts inward","Does not move"],"a":1,"why":"Destroyed capital reduces the economy’s productive capacity."}},{"title":"Australia’s modified market economy","body":"<p>Australia is a <b>modified (mixed) market economy</b>. Most resources are privately owned and allocated by prices, but governments modify outcomes where markets fail or produce results society sees as unfair.</p><div class=\"tw\"><table><thead><tr><th>Market features</th><th>Government modifications</th></tr></thead><tbody><tr><td>Private businesses and property</td><td>Public schools, hospitals and roads</td></tr><tr><td>Prices set by demand and supply</td><td>Minimum wage, regulated electricity network prices</td></tr><tr><td>Profit motive</td><td>Taxes to fund services; rules against anti-competitive conduct</td></tr><tr><td>Consumer sovereignty</td><td>Consumer protection laws, product safety rules</td></tr></tbody></table></div>","case":"WA households pay electricity tariffs set by the State Government through Synergy, rather than a fully market price. This is a modification that shields households from price swings.","mistakes":["Calling Australia a \"pure\" market economy.","Listing features without explaining how each allocates resources."],"check":{"q":"Which is a government modification of the market?","o":["A café setting its own prices","A national minimum wage","Shareholders owning a mining company"],"a":1,"why":"A minimum wage overrides the market wage for the lowest-paid workers."},"src":[["SCSA, Economics ATAR Year 11 syllabus (2026)","https://senior-secondary.scsa.wa.edu.au/__data/assets/word_doc/0009/1230678/Economics-ATAR-Year-11-Syllabus-for-teaching-from-2026.DOCX"]]}]},{"id":"t2","unit":1,"n":2,"title":"Demand, supply and equilibrium","lead":"Price changes move you along a curve. Non-price factors shift the curve. Getting this right is worth marks in almost every market question.","notes":"<h4>Demand</h4><ul><li><b>Law of demand:</b> as price rises, quantity demanded falls, ceteris paribus.</li><li><b>Market demand</b> is the sum of all individual demand schedules at each price.</li><li>Own-price change = <b>movement along</b> the curve (change in <i>quantity demanded</i>). Non-price factors <b>shift</b> the curve (change in <i>demand</i>).</li></ul><div class=\"tw\"><table><thead><tr><th>Non-price factor</th><th>Increases demand when…</th></tr></thead><tbody><tr><td>Income</td><td>Income rises (normal good) or falls (inferior good)</td></tr><tr><td>Population</td><td>Population grows</td></tr><tr><td>Tastes and preferences</td><td>The good becomes more popular</td></tr><tr><td>Price of a substitute</td><td>The substitute’s price rises</td></tr><tr><td>Price of a complement</td><td>The complement’s price falls</td></tr><tr><td>Expected future prices</td><td>Buyers expect prices to rise soon</td></tr></tbody></table></div><h4>Supply</h4><ul><li><b>Law of supply:</b> as price rises, quantity supplied rises, ceteris paribus.</li><li><b>Market supply</b> is the sum of all individual supply schedules.</li></ul><div class=\"tw\"><table><thead><tr><th>Non-price factor</th><th>Increases supply when…</th></tr></thead><tbody><tr><td>Costs of production</td><td>Costs fall</td></tr><tr><td>Expected future prices</td><td>Sellers expect prices to fall soon</td></tr><tr><td>Number of suppliers</td><td>More firms enter</td></tr><tr><td>Technology</td><td>Technology improves productivity</td></tr><tr><td>Resource and supply-chain events</td><td>Conditions improve. Droughts, floods, pandemics and port disruptions decrease supply.</td></tr></tbody></table></div><h4>Market equilibrium</h4><ul><li><b>Equilibrium:</b> quantity demanded = quantity supplied. The market clears.</li><li><b>Shortage:</b> price below equilibrium; buyers bid price up.</li><li><b>Surplus:</b> price above equilibrium; sellers cut prices.</li></ul><div class=\"tw\"><table><thead><tr><th>Change</th><th>Equilibrium price</th><th>Equilibrium quantity</th></tr></thead><tbody><tr><td>Demand increases</td><td>Rises</td><td>Rises</td></tr><tr><td>Demand decreases</td><td>Falls</td><td>Falls</td></tr><tr><td>Supply increases</td><td>Falls</td><td>Rises</td></tr><tr><td>Supply decreases</td><td>Rises</td><td>Falls</td></tr><tr><td>Demand and supply both increase</td><td>Indeterminate</td><td>Rises</td></tr><tr><td>Demand increases, supply decreases</td><td>Rises</td><td>Indeterminate</td></tr><tr><td>Demand and supply both decrease</td><td>Indeterminate</td><td>Falls</td></tr><tr><td>Demand decreases, supply increases</td><td>Falls</td><td>Indeterminate</td></tr></tbody></table></div><p>\"Indeterminate\" means the result depends on which shift is larger. Say so in exam answers.</p>","figs":[["ds","Figure 2.1 · Increase in demand","<p>Demand shifts from D1 to D2. At P1 there is now a shortage, so price rises to P2 and quantity supplied extends to Q2.</p>"]],"worked":"<p>The market for avocados in Perth (thousand kg per week):</p><div class=\"tw\"><table><thead><tr><th>Price ($/kg)</th><th>Qd</th><th>Qs</th></tr></thead><tbody><tr><td>2</td><td>80</td><td>30</td></tr><tr><td>3</td><td>70</td><td>45</td></tr><tr><td>4</td><td>60</td><td>60</td></tr><tr><td>5</td><td>50</td><td>75</td></tr><tr><td>6</td><td>40</td><td>90</td></tr></tbody></table></div><p><b>(a)</b> Equilibrium is $4/kg and 60 000 kg. At $3/kg there is a shortage of 70 000 − 45 000 = 25 000 kg, pushing price up.</p><p><b>(b)</b> Demand rises by 15 000 kg at every price. Old demand Qd = 100 − 10P; supply Qs = 15P. New demand Qd = 115 − 10P. Set equal: 115 − 10P = 15P, so <b>P = $4.60</b> and <b>Q = 69 000 kg</b>.</p>","mcq":[{"q":"A fall in the price of petrol, ceteris paribus, will cause in the petrol market:","o":["an increase in demand.","an increase in quantity demanded.","an increase in supply.","an increase in quantity supplied."],"a":1,"why":"An own-price change moves buyers along the demand curve: quantity demanded rises. Quantity supplied would fall."},{"q":"When incomes rise, demand for a good falls. The good is:","o":["an inferior good.","a normal good.","a complement.","a substitute."],"a":0,"why":"An inferior good is one people buy less of as their income rises."},{"q":"Which of the following would decrease the supply of WA wheat?","o":["A new drought-resistant seed variety.","A severe drought in the Wheatbelt.","A rise in the world price of wheat.","More farmers planting wheat."],"a":1,"why":"Drought reduces the resources available, shifting supply left. A higher price changes quantity supplied, not supply."},{"q":"If the market price is below equilibrium:","o":["there is a surplus and price will fall.","quantity supplied exceeds quantity demanded.","the market clears at that price.","there is a shortage and price will rise."],"a":3,"why":"Below equilibrium, quantity demanded exceeds quantity supplied. Buyers compete and price rises."},{"q":"Demand for electric vehicles rises while new battery technology lowers production costs. The new equilibrium will show:","o":["higher price and higher quantity.","lower price and lower quantity.","higher quantity, with the price change indeterminate.","higher price, with the quantity change indeterminate."],"a":2,"why":"Both shifts raise quantity. Demand pushes price up and supply pushes it down, so the price change depends on which shift is larger."}],"di":{"stim":"<p>Rental housing in a growing city (hypothetical data).</p><div class=\"tw\"><table><thead><tr><th>Year</th><th>Median weekly rent ($)</th><th>Vacancy rate (%)</th></tr></thead><tbody><tr><td>2022</td><td>480</td><td>1.0</td></tr><tr><td>2023</td><td>560</td><td>0.7</td></tr><tr><td>2024</td><td>640</td><td>0.6</td></tr><tr><td>2025</td><td>680</td><td>1.4</td></tr></tbody></table></div><p><i>Strong interstate and overseas migration has added to the population. Rising material costs and a shortage of tradespeople have slowed construction of new dwellings.</i></p>","items":[{"t":"text","q":"Describe the trend in median weekly rent from 2022 to 2025.","marks":2,"key":[["Rent rose every year, from $480 to $680",1],["Increases slowed in 2025 ($40 compared with $80 a year before)",1]]},{"t":"calc","q":"Calculate the percentage change in median weekly rent from 2022 to 2025.","marks":2,"inputs":[{"label":"Change (%)","ans":41.7,"tol":0.15}],"work":"(680 − 480) ÷ 480 × 100 = 41.7%"},{"t":"text","q":"Identify one non-price factor affecting demand and one affecting supply in this market.","marks":2,"key":[["Demand: population growth from migration",1],["Supply: rising building costs or a shortage of tradespeople",1]]},{"t":"text","diagram":true,"q":"Using a demand and supply diagram, demonstrate the combined effect of these two factors on equilibrium rent and quantity.","marks":5,"key":[["Axes labelled",1],["Demand shifts right D1 to D2",1],["Supply shifts left S1 to S2",1],["Equilibrium rent rises from P1 to P2",1],["Quantity change indeterminate, depending on the relative size of the shifts",1]]},{"t":"text","q":"Predict the effect on rent if many new apartments are completed in 2026, ceteris paribus. Justify your prediction.","marks":2,"key":[["Rent falls",1],["Supply increases, vacancies rise and landlords compete for tenants",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","q":"Distinguish between a change in quantity demanded and a change in demand. Use an example of each.","marks":4,"key":[["Change in quantity demanded: movement along the curve caused by the good’s own price",1],["Example given",1],["Change in demand: shift of the whole curve caused by a non-price factor",1],["Example given",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Explain the effect on the coffee bean market of a frost that destroys much of Brazil’s crop.","marks":3,"key":[["Supply decreases",1],["Supply shifts left, creating a shortage at the old price",1],["Price rises and quantity falls",1]]},{"t":"text","q":"Explain the effect on the coffee bean market of a major study linking coffee to better health.","marks":3,"key":[["Tastes change, so demand increases",1],["Demand shifts right",1],["Price and quantity both rise",1]]}]}],"dd":[{"title":"Why demand slopes down","body":"<p>The law of demand says people buy less when the price rises. Two effects explain why:</p><ul><li><b>Substitution effect:</b> when avocados rise in price, they become expensive compared with other foods, so people switch to tomatoes or cucumbers.</li><li><b>Income effect:</b> a higher price means your income buys less in total, so you buy less of many things.</li><li><b>Diminishing marginal utility:</b> each extra unit gives less satisfaction, so you will only buy more at a lower price.</li></ul>","mistakes":["Saying \"demand falls\" when price rises. Quantity demanded falls; demand (the whole curve) stays the same."],"check":{"q":"Petrol prices jump, and some people catch the train instead. This is mainly the:","o":["Income effect","Substitution effect","Supply effect"],"a":1,"why":"People switch to a substitute that is now relatively cheaper."}},{"title":"Movements versus shifts","body":"<p>This is the most common source of lost marks in market questions. Ask one question: <b>did the good’s own price change?</b></p><ul><li>Yes → a <b>movement along</b> the curve: a change in quantity demanded (or supplied).</li><li>No, something else changed → a <b>shift</b> of the curve: a change in demand (or supply).</li></ul><p>Use precise words in your answer: \"an extension of quantity demanded\" or \"an increase in demand\", never just \"demand goes up\".</p>","fig":"dmove","mistakes":["Shifting the demand curve when the good’s own price changes.","Shifting both curves when only one factor changed."],"check":{"q":"Netflix raises its price, and more people subscribe to Stan. In the Stan market:","o":["Demand for Stan increases","Quantity demanded of Stan increases","Supply of Stan increases"],"a":0,"why":"The price of a substitute changed, which shifts the whole demand curve for Stan."}},{"title":"Supply shocks and supply chains","body":"<p>A supply shock is a sudden event that changes the cost or availability of production. Recent shocks in Australia include:</p><ul><li><b>COVID-19 (2020–22):</b> factory closures overseas and shipping delays cut the supply of cars, electronics and building materials.</li><li><b>Floods (2022):</b> damaged crops in eastern Australia raised fruit and vegetable prices.</li><li><b>Oil price shock (2026):</b> disruption to global oil supply raised fuel prices. Automotive fuel was up 13.5% in the year to August 2026.</li></ul><p>A negative supply shock shifts supply left, raising price and lowering quantity.</p>","case":"In August 2026, fuel prices rose 14.8% in one month as world oil prices rose and temporary fuel excise relief ended (ABS).","mistakes":["Saying a supply shock shifts demand.","Forgetting to state the effect on both price and quantity."],"check":{"q":"A bird flu outbreak kills millions of laying hens. In the egg market:","o":["Price falls, quantity rises","Price rises, quantity falls","Price and quantity both rise"],"a":1,"why":"Supply shifts left: higher price, lower quantity."},"src":[["ABS, Consumer Price Index, Australia, August 2026","https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/aug-2026"]]},{"title":"Price as a signal","body":"<p>Prices carry information. A rising price tells producers that consumers want more, and gives them an incentive (higher profit) to supply it. It also tells consumers to economise. Economists call this the <b>price mechanism</b>, or Adam Smith’s \"invisible hand\".</p><ul><li><b>Signalling:</b> prices show where resources are wanted.</li><li><b>Incentive:</b> higher prices reward producers who respond.</li><li><b>Rationing:</b> higher prices limit who buys, so goods go to those who value them most.</li></ul>","case":"When Perth rents rose sharply from 2022, the higher price signalled a shortage. It encouraged more investors to build or rent out property, and some tenants to share or move to cheaper suburbs.","mistakes":["Describing the price change without explaining how buyers and sellers respond."],"check":{"q":"Which function of price makes producers want to supply more when price rises?","o":["Rationing","Incentive","Equity"],"a":1,"why":"Higher prices raise potential profit, an incentive to produce more."}},{"title":"Reading simultaneous shifts","body":"<p>When demand and supply both shift, one variable is certain and the other depends on the size of each shift. Always say which is <b>indeterminate</b> and why.</p><div class=\"tw\"><table><thead><tr><th>Demand</th><th>Supply</th><th>Price</th><th>Quantity</th></tr></thead><tbody><tr><td>↑</td><td>↑</td><td>?</td><td>↑</td></tr><tr><td>↑</td><td>↓</td><td>↑</td><td>?</td></tr><tr><td>↓</td><td>↓</td><td>?</td><td>↓</td></tr><tr><td>↓</td><td>↑</td><td>↓</td><td>?</td></tr></tbody></table></div>","fig":"simul","mistakes":["Giving a definite answer for the indeterminate variable without saying which shift is larger."],"check":{"q":"Demand for electric cars rises and battery costs fall. Which is certain?","o":["Price rises","Quantity rises","Price falls"],"a":1,"why":"Both shifts push quantity up; their effects on price offset."}}]},{"id":"t3","unit":1,"n":3,"title":"Elasticity","lead":"Elasticity measures how strongly quantity responds to a change in price. It decides who pays a tax and how a firm should set prices.","notes":"<p class=\"formula\">PED = %ΔQd ÷ %ΔP &nbsp;&nbsp;·&nbsp;&nbsp; PES = %ΔQs ÷ %ΔP</p><ul><li>Percentage change = (new − old) ÷ old × 100. Ignore the minus sign when interpreting PED.</li><li><b>Elastic (&gt; 1)</b>: quantity changes by a larger % than price. <b>Inelastic (&lt; 1)</b>: by a smaller %. <b>Unit elastic</b> = 1. Perfectly elastic = ∞; perfectly inelastic = 0.</li></ul><h4>Total revenue method</h4><div class=\"tw\"><table><thead><tr><th>Price change</th><th>TR rises</th><th>TR falls</th><th>TR unchanged</th></tr></thead><tbody><tr><td>Price rises</td><td>Inelastic</td><td>Elastic</td><td>Unit elastic</td></tr><tr><td>Price falls</td><td>Elastic</td><td>Inelastic</td><td>Unit elastic</td></tr></tbody></table></div><ul><li><b>Determinants of PED:</b> substitutes, necessity or luxury, share of income, time to adjust, habit-forming, how broadly the good is defined.</li><li><b>Determinants of PES:</b> time period, spare capacity, ability to store stock, mobility of factors, production lead time.</li><li><b>Business pricing:</b> inelastic demand → raise price to raise revenue; elastic → cut price.</li><li><b>Tax incidence:</b> the burden falls mostly on the more inelastic side. Governments tax tobacco and fuel because demand is inelastic.</li><li><b>Price discrimination:</b> different prices to different groups for the same good. Needs market power, separable groups with different PEDs and no resale. The inelastic group pays more.</li></ul>","figs":[["tax","Figure 3.1 · Tax incidence with inelastic demand","<p>The tax shifts supply up from S1 to S2. With inelastic demand, the consumer price rises from P1 to Pc, close to the full tax, while producers keep Pp, only a little below P1.</p>"]],"worked":"<p><b>PED:</b> Ticket price rises from $80 to $100; tickets sold fall from 5000 to 4200.</p><ol><li>%ΔP = 25%.</li><li>%ΔQd = −16%.</li><li>PED = 16 ÷ 25 = <b>0.64</b>, so demand is inelastic.</li><li>Check: TR rises from $400 000 to $420 000, confirming inelastic demand.</li></ol><p><b>PES:</b> Wool rises from $10 to $12/kg; supply rises from 1000 to 1100 t. PES = 10% ÷ 20% = <b>0.5</b> (inelastic).</p>","mcq":[{"q":"When the price of a good falls by 10%, quantity demanded rises by 25%. Demand is:","o":["perfectly inelastic.","price inelastic.","unit elastic.","price elastic."],"a":3,"why":"PED = 25 ÷ 10 = 2.5, which is greater than 1."},{"q":"A firm raises its price and its total revenue falls. Demand for its product must be:","o":["price elastic.","price inelastic.","unit elastic.","perfectly inelastic."],"a":0,"why":"When price and total revenue move in opposite directions, demand is elastic."},{"q":"Which good is most likely to have price inelastic demand?","o":["A particular brand of soft drink.","Prescription insulin.","Overseas holidays.","Designer sunglasses."],"a":1,"why":"Insulin is a necessity with no close substitutes."},{"q":"Supply of fresh strawberries is likely to be price inelastic in the short run because:","o":["strawberries have many substitutes.","strawberries are a necessity.","they are perishable and output takes time to increase.","farmers have a large amount of spare capacity."],"a":2,"why":"Perishable goods cannot be stored, and new plants take time to grow."},{"q":"A tax is placed on a good with perfectly inelastic demand. The burden falls:","o":["entirely on consumers.","entirely on producers.","equally on consumers and producers.","entirely on the government."],"a":0,"why":"Consumers buy the same quantity at any price, so producers pass on the full tax."}],"di":{"stim":"<p>A Perth cinema trials new prices (hypothetical data).</p><div class=\"tw\"><table><thead><tr><th>Ticket type</th><th>Old price ($)</th><th>New price ($)</th><th>Weekly sales before</th><th>Weekly sales after</th></tr></thead><tbody><tr><td>Adult, Friday evening</td><td>20</td><td>24</td><td>1500</td><td>1410</td></tr><tr><td>Student, Tuesday afternoon</td><td>14</td><td>10</td><td>300</td><td>540</td></tr></tbody></table></div>","items":[{"t":"calc","q":"Calculate the price elasticity of demand for adult Friday evening tickets.","marks":3,"inputs":[{"label":"PED","ans":0.3,"tol":0.01}],"work":"%ΔP = 20%; %ΔQd = (1410 − 1500) ÷ 1500 = −6%. PED = 6 ÷ 20 = 0.3, so demand is price inelastic."},{"t":"calc","q":"Use the total revenue method for student Tuesday tickets. Calculate TR before and after.","marks":3,"inputs":[{"label":"TR before ($)","ans":4200,"tol":0},{"label":"TR after ($)","ans":5400,"tol":0}],"work":"Before: $14 × 300 = $4200. After: $10 × 540 = $5400. Price fell and TR rose, so demand is price elastic."},{"t":"text","q":"Identify the pricing strategy the cinema is using and outline two conditions needed for it to work.","marks":3,"key":[["Price discrimination",1],["First condition (market power; separable groups; different PEDs; no resale)",1],["Second condition",1]]},{"t":"text","q":"Explain one determinant that could account for the difference in elasticity between the two groups.","marks":2,"key":[["Identifies a determinant (e.g. share of income, availability of substitutes)",1],["Applies it to students versus Friday adults",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","diagram":true,"q":"The Australian Government places an excise on cigarettes. Using a demand and supply diagram, explain why most of the burden falls on consumers.","marks":5,"key":[["Diagram: steep demand, supply shifts up by the excise",1],["Labels Pc, P1, Pp, Q1, Q2",1],["Demand is inelastic: addictive, few substitutes",1],["Consumer price rises by most of the tax; quantity falls only slightly",1],["Producers’ price falls a little, so consumers bear most of the burden",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Explain two determinants of the price elasticity of supply, using the market for iron ore as an example.","marks":4,"key":[["First determinant identified (e.g. time period)",1],["Applied to iron ore (new mines take years)",1],["Second determinant identified (e.g. spare capacity, storage)",1],["Applied to iron ore",1]]}]}],"dd":[{"title":"Calculating PED step by step","body":"<p>Follow four steps and show each one: these are where method marks are awarded.</p><ul><li>1. %Δ price = (new − old) ÷ old × 100</li><li>2. %Δ quantity = (new − old) ÷ old × 100</li><li>3. PED = %ΔQ ÷ %ΔP (ignore the minus sign)</li><li>4. Interpret: above 1 elastic, below 1 inelastic</li></ul><p>Some textbooks use the midpoint (average) method, which gives the same answer whichever way the price moves. If your teacher uses it, the % change uses the average of old and new as the base.</p>","mistakes":["Dividing price change by quantity change (upside down).","Forgetting to interpret the number."],"check":{"q":"Price rises from $10 to $12 and sales fall from 100 to 90. PED is:","o":["0.5","2.0","0.2"],"a":0,"why":"%ΔP = 20%, %ΔQ = −10%; 10 ÷ 20 = 0.5."}},{"title":"What makes demand elastic or inelastic","body":"<div class=\"tw\"><table><thead><tr><th>Determinant</th><th>More elastic when…</th><th>Example</th></tr></thead><tbody><tr><td>Substitutes</td><td>Many close substitutes</td><td>One brand of cola</td></tr><tr><td>Necessity</td><td>It is a luxury</td><td>Overseas holidays</td></tr><tr><td>Share of income</td><td>It takes a large share</td><td>New cars</td></tr><tr><td>Time</td><td>Buyers have time to adjust</td><td>Switching to an EV over years</td></tr><tr><td>Habit</td><td>It is not habit-forming</td><td>Movie tickets</td></tr><tr><td>Definition</td><td>The good is narrowly defined</td><td>\"Woolworths bread\" vs \"food\"</td></tr></tbody></table></div>","fig":"elastic","mistakes":["Listing a determinant without linking it to the good in the question."],"check":{"q":"Demand for \"Shell petrol\" is more elastic than demand for \"petrol\" because:","o":["It is a necessity","It has close substitutes (other brands)","It is a small share of income"],"a":1,"why":"Narrowly defined goods have more substitutes."}},{"title":"PES and the time period","body":"<p>How quickly producers can respond decides how elastic supply is.</p><ul><li><b>Immediate:</b> only stock on hand, so supply is close to perfectly inelastic.</li><li><b>Short run:</b> firms add shifts or overtime but cannot build new factories.</li><li><b>Long run:</b> new firms enter, mines open and farms expand, so supply is most elastic.</li></ul><p>Other determinants: spare capacity, ability to store goods, how easily resources can move between uses, and how long production takes.</p>","fig":"pestime","case":"A new iron ore mine in the Pilbara can take five years or more from approval to first shipment, so iron ore supply is inelastic in the short run even when prices soar.","mistakes":["Confusing determinants of PES with determinants of PED."],"check":{"q":"Supply of Margaret River wine is inelastic in the short run because:","o":["Vines take years to mature","Wine is a luxury","Demand is elastic"],"a":0,"why":"New vineyards take years to produce grapes."}},{"title":"Case study: tobacco excise","body":"<p>Australia has some of the highest tobacco taxes in the world: excise of about $1.40 per cigarette, plus GST. Because demand is inelastic (addictive, few legal substitutes), most of the tax falls on smokers, and early increases raised a lot of revenue while also reducing smoking.</p><p>But very high prices create a black market. Tobacco excise revenue fell from a peak of $16.3 billion in 2019-20 to an expected $7.4 billion in 2025-26, as smokers quit, switched to vapes or bought illegal tobacco.</p>","case":"Daily smoking among Australians aged 14+ fell from almost 20% in 2001 to about 8%, a sign that the price is also changing behaviour over the long run, when demand is more elastic.","mistakes":["Saying the government pays the tax. Consumers and producers share the burden.","Forgetting that elasticity is higher in the long run."],"check":{"q":"Why does a tobacco tax raise revenue reliably in the short run?","o":["Demand is elastic","Demand is inelastic","Supply is perfectly elastic"],"a":1,"why":"Quantity falls only a little, so the tax is collected on most sales."},"src":[["University of Sydney, Tobacco excise revenue has tanked (April 2025)","https://www.sydney.edu.au/news-opinion/news/2025/04/02/tobacco-excise-revenue-has-tanked.html"]]},{"title":"Price discrimination in practice","body":"<p>Price discrimination is charging different prices to different groups for the same product, when the difference is not due to cost. It works when a firm can identify groups with different elasticities and stop resale.</p><ul><li><b>Airlines:</b> higher fares for last-minute business travellers (inelastic) than for leisure travellers who book early (elastic).</li><li><b>Cinemas and transport:</b> student, child and senior concessions.</li><li><b>Electricity:</b> cheaper off-peak rates.</li></ul>","mistakes":["Calling a price difference caused by higher costs (e.g. delivery to remote areas) price discrimination."],"check":{"q":"Which group pays the higher price under price discrimination?","o":["The group with elastic demand","The group with inelastic demand","The group that buys the most"],"a":1,"why":"Inelastic buyers do not cut back much when price rises."}}]},{"id":"t4","unit":1,"n":4,"title":"Market efficiency","lead":"A competitive market at equilibrium maximises total surplus. Pushing output above or below equilibrium creates a deadweight loss.","notes":"<ul><li><b>Perfect competition:</b> many buyers and sellers, identical products, perfect information, free entry and exit.</li><li><b>Consumer surplus (CS):</b> willingness to pay minus price paid. Area below demand, above price.</li><li><b>Producer surplus (PS):</b> price received minus the minimum producers would accept. Area above supply, below price.</li><li><b>Total surplus = CS + PS</b>, maximised at equilibrium (allocative efficiency).</li><li><b>Deadweight loss (DWL):</b> total surplus lost when output is not at equilibrium.</li></ul><div class=\"tw\"><table><thead><tr><th>Intervention</th><th>What happens</th><th>Efficiency</th></tr></thead><tbody><tr><td>Tax</td><td>Supply shifts up; consumers pay more, producers receive less, quantity falls</td><td>DWL from underproduction; government gains revenue</td></tr><tr><td>Subsidy</td><td>Supply shifts down; consumers pay less, producers receive more, quantity rises</td><td>DWL from overproduction; cost to government</td></tr><tr><td>Price ceiling (below eq.)</td><td>Quantity demanded > quantity supplied</td><td>Shortage, DWL, queues, black markets</td></tr><tr><td>Price floor (above eq.)</td><td>Quantity supplied > quantity demanded</td><td>Surplus, DWL</td></tr></tbody></table></div><p class=\"formula\">Area of a triangle = ½ × base × height</p>","figs":[["ceiling","Figure 4.1 · Price ceiling of $40","<p>At $40, firms supply only 20 000 units but consumers want 60 000. The units between 20 000 and 40 000 are lost, and their surplus is the DWL triangle.</p>"]],"worked":"<p>Demand P = 100 − Q, supply P = 20 + Q (Q in thousands).</p><ul><li><b>Equilibrium:</b> Q = 40 000, P = $60.</li><li>CS = ½ × 40 000 × $40 = <b>$800 000</b>; PS = ½ × 40 000 × $40 = <b>$800 000</b>.</li><li><b>Ceiling $40:</b> Qs = 20 000, Qd = 60 000; shortage 40 000. DWL = ½ × 20 000 × ($80 − $40) = <b>$400 000</b>.</li><li><b>Tax $20:</b> (100 − Q) − (20 + Q) = 20 → Q = 30 000; consumers pay $70, producers keep $50. Revenue $600 000; DWL = ½ × 10 000 × $20 = <b>$100 000</b>.</li></ul>","mcq":[{"q":"Consumer surplus is the:","o":["total amount consumers spend on a good.","difference between what consumers are willing to pay and what they pay.","difference between price and the cost of production.","revenue a firm earns above its costs."],"a":1,"why":"Consumer surplus is the extra value buyers get above the price they pay."},{"q":"Total surplus in a competitive market is maximised when:","o":["the government sets a price floor.","price is as low as possible.","the market is at equilibrium.","producer surplus equals zero."],"a":2,"why":"At equilibrium every unit worth more to buyers than it costs to make is traded."},{"q":"A minimum wage set above the equilibrium wage is most likely to cause:","o":["a shortage of labour.","a surplus of labour (unemployment).","no change in employment.","a fall in the wage rate."],"a":1,"why":"A binding price floor makes quantity supplied (workers) exceed quantity demanded."},{"q":"A subsidy paid to producers in an otherwise efficient market will:","o":["reduce quantity and create a deadweight loss.","raise quantity above equilibrium and create a deadweight loss.","raise total surplus with no deadweight loss.","shift demand to the right."],"a":1,"why":"The subsidy shifts supply right, so units are produced that cost more than they are worth to buyers."},{"q":"A deadweight loss represents:","o":["tax revenue collected by the government.","surplus transferred from consumers to producers.","total surplus lost because output is not at the efficient level.","the cost of producing the equilibrium quantity."],"a":2,"why":"DWL is surplus that nobody receives."}],"di":{"stim":"<p>Demand P = 120 − 2Q and supply P = 30 + Q, where P is in dollars and Q in thousands of units.</p>","items":[{"t":"calc","q":"Calculate the equilibrium price and quantity.","marks":2,"inputs":[{"label":"Price ($)","ans":60,"tol":0},{"label":"Quantity ('000)","ans":30,"tol":0}],"work":"120 − 2Q = 30 + Q → Q = 30 (30 000 units), P = $60."},{"t":"calc","q":"Calculate consumer surplus and producer surplus at equilibrium.","marks":4,"inputs":[{"label":"CS ($)","ans":900000,"tol":0},{"label":"PS ($)","ans":450000,"tol":0}],"work":"CS = ½ × 30 000 × ($120 − $60) = $900 000. PS = ½ × 30 000 × ($60 − $30) = $450 000."},{"t":"calc","q":"A price floor of $72 is set. Calculate the resulting surplus (units).","marks":2,"inputs":[{"label":"Surplus (units)","ans":18000,"tol":0}],"work":"Qd: 72 = 120 − 2Q → 24 000. Qs: 72 = 30 + Q → 42 000. Surplus = 18 000 units."},{"t":"calc","q":"Calculate the deadweight loss caused by the price floor.","marks":3,"inputs":[{"label":"DWL ($)","ans":54000,"tol":0}],"work":"Only 24 000 units trade. Supply price at 24 000 = $54. DWL = ½ × (30 000 − 24 000) × ($72 − $54) = $54 000."},{"t":"text","q":"Explain why the price floor is allocatively inefficient.","marks":2,"key":[["Quantity traded falls below equilibrium",1],["Units valued above their cost are not traded, so total surplus is not maximised",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","diagram":true,"q":"Using a demand and supply diagram, demonstrate the effect of a per-unit subsidy on consumer surplus, producer surplus and market efficiency.","marks":6,"key":[["Supply shifts down by the subsidy",1],["Lower consumer price, higher producer price, higher quantity",1],["Diagram fully labelled",1],["CS rises",1],["PS rises",1],["Cost to government exceeds the gains: DWL from overproduction",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"A state government proposes capping rents below the market rent. Explain two likely consequences for the rental market.","marks":4,"key":[["A shortage: quantity demanded exceeds quantity supplied",1],["Explained with reference to the cap",1],["A second consequence (poorer maintenance, landlords exit, black-market payments, DWL)",1],["Second consequence explained",1]]}]}],"dd":[{"title":"Consumer and producer surplus in plain words","body":"<p>If you were willing to pay $15 for a concert ticket but paid $10, you gained $5 of <b>consumer surplus</b>. If the band would have played for $6 a ticket but received $10, they gained $4 of <b>producer surplus</b>. Add these up for every buyer and seller and you get the triangles on the diagram.</p>","fig":"surplus","mistakes":["Swapping the triangles: CS is above price, PS is below.","Forgetting the ½ in the triangle area."],"check":{"q":"A buyer values a game at $90 and pays $70. Consumer surplus is:","o":["$20","$70","$160"],"a":0,"why":"$90 − $70 = $20."}},{"title":"Allocative efficiency","body":"<p>A market is <b>allocatively efficient</b> when it produces the quantity society values most: where the value of the last unit to buyers (marginal benefit) equals the cost of producing it (marginal cost). In a competitive market with no externalities, this is the equilibrium.</p><ul><li>Produce less → units worth more than they cost are lost (DWL).</li><li>Produce more → units cost more than they are worth (DWL).</li></ul>","mistakes":["Confusing efficiency with fairness. An efficient outcome can still be unequal."],"check":{"q":"Total surplus is maximised where:","o":["Price is lowest","MB = MC","Producer surplus is largest"],"a":1,"why":"That is the efficient quantity."}},{"title":"Taxes and subsidies in Australia","body":"<div class=\"tw\"><table><thead><tr><th>Measure</th><th>Effect on the market</th><th>Australian example</th></tr></thead><tbody><tr><td>Excise (tax per unit)</td><td>Price up, quantity down, DWL</td><td>Fuel, alcohol and tobacco excise</td></tr><tr><td>GST (10% of price)</td><td>Prices up across most goods</td><td>Collected by businesses, paid by consumers</td></tr><tr><td>Subsidy</td><td>Price down, quantity up</td><td>Child Care Subsidy, subsidised university places</td></tr><tr><td>Rebate</td><td>Lowers the price paid</td><td>Energy bill rebates (2023–25)</td></tr></tbody></table></div><p>Governments accept some DWL from taxes because they need revenue for services. The aim is to raise it with as little DWL as possible, which is why goods with inelastic demand are often taxed.</p>","case":"When Commonwealth electricity rebates ended, the ABS recorded electricity prices up 13.2% in the year to August 2026. The rebate had been lowering the price households paid, not the cost of supply.","mistakes":["Saying a subsidy has no cost. Taxpayers fund it."],"check":{"q":"Compared with no tax, a per-unit tax on a good with inelastic demand creates:","o":["A large DWL","A small DWL","No change in quantity"],"a":1,"why":"Quantity falls only a little, so little surplus is lost."},"src":[["ABS, Consumer Price Index, Australia, August 2026","https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/aug-2026"]]},{"title":"Rent caps: a price ceiling debate","body":"<p>Rent caps limit how much landlords can charge or how much rents can rise. Supporters say they protect tenants from sharp increases during a housing shortage. Economic theory predicts trade-offs:</p><ul><li>A shortage: more people want rentals than are offered at the capped price.</li><li>Less new supply over time, as investors earn less.</li><li>Poorer maintenance, waiting lists and side payments.</li></ul><p>Most Australian states limit <i>how often</i> rent can rise (for example once a year) rather than capping the level. This softens the trade-offs.</p>","fig":"ceiling","mistakes":["Drawing a ceiling above equilibrium. It only matters (binds) when below.","Forgetting the DWL triangle."],"check":{"q":"A binding rent cap is most likely to cause:","o":["A surplus of rentals","A shortage of rentals","Higher rents"],"a":1,"why":"Quantity demanded exceeds quantity supplied at the capped rent."}},{"title":"The minimum wage as a price floor","body":"<p>The <b>Fair Work Commission</b> reviews minimum wages every year. From 1 July 2026, the national minimum wage rose 4.75% to <b>$26.44 an hour</b> ($1004.90 for a 38-hour week).</p><p>On a diagram, a minimum wage above the market wage is a price floor in the labour market. Theory predicts more people want work than firms want to hire. Real-world studies find that moderate increases have had small effects on jobs, because higher pay can also lift spending, reduce staff turnover and raise productivity.</p>","fig":"minwage","case":"Many Year 11 students work casual jobs paid under junior rates, which are set as a percentage of the adult minimum wage, so they also rose on 1 July 2026.","mistakes":["Saying any minimum wage causes unemployment. It must be above the equilibrium wage to bind."],"check":{"q":"A minimum wage set below the market wage will:","o":["Cause unemployment","Have no effect","Cause a shortage of workers"],"a":1,"why":"A price floor below equilibrium does not bind."},"src":[["Fair Work Ombudsman, Minimum wages increase from 1 July 2026","https://www.fairwork.gov.au/about-us/workplace-laws/annual-wage-review/annual-wage-review-2026"],["Mondaq, Fair Work Commission increases minimum wage rates by 4.75% (June 2026)","https://www.mondaq.com/australia/employee-rights-labour-relations/1796768/fair-work-commission-increases-minimum-wage-rates-by-475"]]}]},{"id":"t5","unit":1,"n":5,"title":"Market failure – market power","lead":"Market failure occurs when markets do not allocate resources efficiently, equitably or sustainably. A firm with market power restricts output below the efficient level.","notes":"<ul><li><b>Imperfect competition:</b> few firms or differentiated products, barriers to entry, imperfect information, price makers. Types: monopolistic competition (cafés), oligopoly (supermarkets, banks), monopoly (some utility networks).</li><li><b>Market power:</b> the ability of a firm to influence its price.</li><li><b>Causes:</b> barriers to entry (economies of scale, high start-up costs, patents and licences, control of a resource, brand loyalty); mergers; collusion; product differentiation and network effects.</li><li><b>Effect:</b> output restricted and price raised; units where MB &gt; MC are not produced, creating a DWL; part of CS is transferred to the firm.</li></ul><div class=\"tw\"><table><thead><tr><th>Policy</th><th>How it works</th><th>Australian example</th></tr></thead><tbody><tr><td>Legislation</td><td>Bans cartels, misuse of market power and anti-competitive mergers</td><td><i>Competition and Consumer Act 2010</i>, enforced by the ACCC</td></tr><tr><td>Regulation</td><td>Oversees prices where competition is not possible</td><td>Price regulation of electricity and gas networks</td></tr><tr><td>Deregulation</td><td>Removes rules restricting entry</td><td>Opening domestic aviation and taxi markets</td></tr><tr><td>Codes of conduct</td><td>Rules for dealings between powerful firms and suppliers</td><td>The Food and Grocery Code</td></tr></tbody></table></div>","figs":[["power","Figure 5.1 · Effect of market power on efficiency","<p>Competitive output is Qc at Pc. A firm with market power restricts output to Qm and charges Pm. The red triangle is surplus lost entirely.</p>"]],"worked":"<p>Demand P = 100 − Q; cost of supply P = 20 + Q (Q in thousands). A dominant firm restricts output to 30 000.</p><ol><li>Competitive: Qc = 40 000, Pc = $60.</li><li>With market power: Pm = 100 − 30 = <b>$70</b>.</li><li>Cost of the last unit at Qm = $50.</li><li>DWL = ½ × 10 000 × ($70 − $50) = <b>$100 000</b>.</li><li>CS transferred to the firm = $10 × 30 000 = <b>$300 000</b>.</li></ol>","mcq":[{"q":"Which of the following is a barrier to entry?","o":["Perfect information.","Identical products.","A patent on a new medicine.","A large number of small sellers."],"a":2,"why":"A patent legally stops other firms from making the product."},{"q":"Compared with perfect competition, a firm with market power will usually:","o":["charge a higher price and produce less.","charge a lower price and produce more.","charge the same price and produce less.","charge a higher price and produce more."],"a":0,"why":"Restricting output lets the firm raise its price."},{"q":"Which body enforces Australia's competition law?","o":["The Reserve Bank of Australia.","The Australian Taxation Office.","The Australian Bureau of Statistics.","The Australian Competition and Consumer Commission."],"a":3,"why":"The ACCC enforces the Competition and Consumer Act."},{"q":"Market power creates a deadweight loss because:","o":["prices fall below the cost of production.","output is restricted below the level where MB = MC.","the government collects revenue from the firm.","consumers buy more than the efficient quantity."],"a":1,"why":"Units that buyers value above their cost are never produced."},{"q":"Deregulation refers to:","o":["the government taking ownership of an industry.","introducing new taxes on large firms.","removing government rules that restrict entry or competition.","fixing the maximum price firms may charge."],"a":2,"why":"Deregulation removes restrictions so new competitors can enter."}],"di":{"stim":"<p>Market shares in a national grocery market (hypothetical).</p><div class=\"tw\"><table><thead><tr><th>Firm</th><th>Share (%)</th></tr></thead><tbody><tr><td>Firm A</td><td>38</td></tr><tr><td>Firm B</td><td>29</td></tr><tr><td>Firm C</td><td>10</td></tr><tr><td>Firm D</td><td>8</td></tr><tr><td>All others</td><td>15</td></tr></tbody></table></div><p><i>Opening a new chain requires large distribution centres, long-term leases on prime sites and contracts with thousands of suppliers.</i></p>","items":[{"t":"calc","q":"Calculate the combined market share of the two largest firms.","marks":1,"inputs":[{"label":"Share (%)","ans":67,"tol":0}],"work":"38% + 29% = 67%."},{"t":"text","q":"Identify the market structure shown. Justify with reference to the data.","marks":2,"key":[["Oligopoly",1],["A few large firms dominate; the top two hold 67%",1]]},{"t":"text","q":"Outline two barriers to entry evident in the stimulus.","marks":2,"key":[["High capital costs for distribution centres",1],["Supplier contracts and leases on prime sites (economies of scale)",1]]},{"t":"text","diagram":true,"q":"Using a diagram, explain how market power in this market could reduce market efficiency.","marks":5,"key":[["Diagram shows competitive outcome (Pc, Qc)",1],["…and market-power outcome (Pm, Qm)",1],["Firms restrict output and raise price",1],["Units where MB > MC are not produced: DWL",1],["Consumer surplus transferred to firms",1]]},{"t":"text","q":"Recommend one government policy to reduce the effects of market power here. Justify it.","marks":3,"key":[["Relevant policy (ACCC enforcement, grocery code, easing entry)",1],["How it works",1],["Justification linked to prices or efficiency",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","q":"Explain two causes of market power, using an Australian example for each.","marks":4,"key":[["First cause explained",1],["Australian example",1],["Second cause explained",1],["Australian example",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Explain how deregulation of an industry can improve market efficiency.","marks":4,"key":[["Deregulation removes barriers to entry",1],["New firms enter; competition increases",1],["Prices fall and output rises towards the efficient level",1],["DWL shrinks; example such as domestic aviation",1]]}]}],"dd":[{"title":"The spectrum of market structures","body":"<p>Markets range from many small competing firms to one firm with no rivals. The fewer the firms and the higher the barriers to entry, the more market power each firm has.</p>","fig":"spectrum","mistakes":["Calling any big firm a monopoly. A market with two or three dominant firms is an oligopoly."],"check":{"q":"Australia’s big four banks are an example of:","o":["Perfect competition","Oligopoly","Monopoly"],"a":1,"why":"A few large firms dominate the market."}},{"title":"Barriers to entry","body":"<ul><li><b>Economies of scale:</b> large firms have lower costs per unit, so newcomers cannot compete on price.</li><li><b>High start-up costs:</b> building a mobile network or a supermarket distribution centre costs billions.</li><li><b>Legal barriers:</b> patents, licences and government-granted rights.</li><li><b>Control of resources:</b> owning the best sites or key supply.</li><li><b>Brand loyalty and network effects:</b> people stay with the platform their friends use.</li></ul>","mistakes":["Listing barriers without saying how each one keeps competitors out."],"check":{"q":"A drug company’s 20-year patent is a:","o":["Natural barrier","Legal barrier","Network effect"],"a":1,"why":"Patent law gives exclusive rights."}},{"title":"Why market power causes a deadweight loss","body":"<p>A firm with market power can raise its price above the competitive level. To do that, it must sell less. Units that buyers value above their cost of production are no longer made, so total surplus shrinks. Part of what is left is moved from consumers to the firm as higher profit.</p>","fig":"power","mistakes":["Saying a firm with market power can charge \"any price it likes\". It is still limited by demand."],"check":{"q":"Compared with competition, market power leads to:","o":["Higher price, higher output","Higher price, lower output","Lower price, lower output"],"a":1,"why":"Output is restricted so price can be raised."}},{"title":"The ACCC and competition law","body":"<p>The <b>Australian Competition and Consumer Commission (ACCC)</b> enforces the <i>Competition and Consumer Act 2010</i>. The Act bans:</p><ul><li><b>Cartels:</b> rivals agreeing to fix prices, share markets or rig bids.</li><li><b>Misuse of market power:</b> conduct by a powerful firm that substantially lessens competition.</li><li><b>Anti-competitive mergers:</b> the ACCC reviews mergers and can oppose them.</li><li><b>Misleading conduct:</b> false claims about prices or products.</li></ul>","mistakes":["Confusing the ACCC (competition) with the RBA (monetary policy) or ASIC (financial markets)."],"check":{"q":"Two petrol stations secretly agree to set the same price. This is:","o":["A merger","A cartel","Price discrimination"],"a":1,"why":"Agreeing with rivals on price is cartel conduct."},"src":[["ACCC, Competition and Consumer Act and the ACCC’s role","https://www.accc.gov.au/about-us/legislation/competition-and-consumer-act-2010"]]},{"title":"Case study: the supermarkets inquiry","body":"<p>In March 2025, the ACCC released the final report of its supermarkets inquiry. It found that Coles and Woolworths, with about 38% and 29% of national grocery sales, form an oligopoly, with Aldi as the main \"hard discounter\" competitor. Barriers to entry are high.</p><p>The ACCC made 20 recommendations, including clearer unit pricing and package-size information to tackle \"shrinkflation\", removing planning barriers for new stores, support for remote community stores, and changes to the Food and Grocery Code to balance supermarkets’ buying power with farmers. The government did not support giving the ACCC power to break up the major chains.</p>","mistakes":["Saying the ACCC found price gouging. It found weak competition, not illegal conduct."],"check":{"q":"Why might removing planning barriers help grocery competition?","o":["It lowers taxes","It makes it easier for new stores to enter","It raises supermarket profits"],"a":1,"why":"Easier entry adds competitors."},"src":[["InDaily (AAP), ACCC supermarket inquiry final report, 21 March 2025","https://www.indailysa.com.au/news/just-in/2025/03/21/accc-supermarket-report"]]},{"title":"Case study: airline deregulation","body":"<p>Until 1990, the \"two-airline policy\" meant only Ansett and Australian Airlines could fly major domestic routes. Fares were regulated and similar. Deregulation removed the barrier to entry. New airlines entered (Compass in 1990, and later Virgin Blue in 2000), fares fell and passenger numbers grew strongly.</p><p>Today the market is again concentrated, which shows that deregulation alone does not guarantee lasting competition.</p>","mistakes":["Assuming deregulation always lowers prices. It works through entry, which may not last."],"check":{"q":"Deregulation improves efficiency mainly by:","o":["Removing barriers so new firms can enter","Setting a maximum price","Taxing the incumbent firm"],"a":0,"why":"More competition pushes price towards cost."}}]},{"id":"t6","unit":1,"n":6,"title":"Market failure – externalities","lead":"When a third party bears a cost or gains a benefit the price ignores, the market produces the wrong quantity.","notes":"<ul><li><b>Externality:</b> a cost or benefit to a third party not reflected in the market price.</li><li>MSC = MPC + external cost. MSB = MPB + external benefit.</li><li>Social optimum: MSB = MSC. The market produces where MPB = MPC.</li></ul><div class=\"tw\"><table><thead><tr><th>Type</th><th>Example</th><th>Result</th></tr></thead><tbody><tr><td>Negative production</td><td>Factory emissions, mine dust</td><td>MSC > MPC: overproduction</td></tr><tr><td>Negative consumption</td><td>Smoking, alcohol misuse</td><td>MPB > MSB: overconsumption</td></tr><tr><td>Positive production</td><td>Research, staff training</td><td>Underproduction</td></tr><tr><td>Positive consumption</td><td>Vaccination, education</td><td>MSB > MPB: underconsumption</td></tr></tbody></table></div><h4>Policy options</h4><ul><li><b>Pigouvian tax</b> equal to the external cost (tobacco excise).</li><li><b>Subsidy</b> equal to the external benefit (university places, free vaccines).</li><li><b>Regulation:</b> limits, standards, bans.</li><li><b>Market-based schemes:</b> tradeable permits or credits (the Safeguard Mechanism).</li><li><b>Information campaigns</b> and <b>government provision</b>.</li></ul>","figs":[["extern","Figure 6.1 · Negative production externality","<p>Firms ignore the external cost and supply along MPC, producing Qm. Units between Q* and Qm cost society more than they are worth to buyers.</p>"]],"worked":"<p>MPB = 100 − Q; MPC = 20 + Q; each unit causes $20 of pollution (Q in thousands).</p><ol><li>Market: Qm = 40 000, Pm = $60.</li><li>MSC = 40 + Q.</li><li>Optimum: Q* = 30 000, P* = $70.</li><li>DWL = ½ × 10 000 × $20 = <b>$100 000</b>.</li><li>A $20 tax shifts MPC to MSC and removes the DWL.</li></ol>","mcq":[{"q":"An externality is best described as:","o":["a cost paid by the producer.","a cost or benefit to a third party not reflected in price.","a tax placed on imports.","the profit earned above normal profit."],"a":1,"why":"Externalities fall on people outside the transaction."},{"q":"A positive consumption externality in vaccinations means the free market will:","o":["overproduce vaccinations.","produce the socially optimal quantity.","underproduce vaccinations.","charge a price above MSB."],"a":2,"why":"People ignore the benefit to others, so they buy too few."},{"q":"Where a negative production externality exists:","o":["MSC is greater than MPC.","MSB is greater than MPB.","MPC is greater than MSC.","MSB equals MSC at the market quantity."],"a":0,"why":"Society bears the private cost plus the external cost."},{"q":"To correct a positive externality, the most appropriate policy is a:","o":["tax equal to the external cost.","price ceiling.","ban on the good.","subsidy equal to the external benefit."],"a":3,"why":"A subsidy raises output towards the social optimum."},{"q":"WA's container deposit scheme pays people to return drink containers. This is:","o":["a policy to correct a negative externality.","a price floor.","a policy to correct market power.","a public good."],"a":0,"why":"It reduces litter, a negative externality of drink consumption."}],"di":{"stim":"<p>A market for a good that causes pollution (hypothetical).</p><div class=\"tw\"><table><thead><tr><th>Quantity ('000)</th><th>MPB ($)</th><th>MPC ($)</th><th>External cost ($)</th></tr></thead><tbody><tr><td>10</td><td>100</td><td>20</td><td>20</td></tr><tr><td>20</td><td>90</td><td>30</td><td>20</td></tr><tr><td>30</td><td>80</td><td>40</td><td>20</td></tr><tr><td>40</td><td>70</td><td>50</td><td>20</td></tr><tr><td>50</td><td>60</td><td>60</td><td>20</td></tr></tbody></table></div>","items":[{"t":"calc","q":"Identify the market equilibrium quantity.","marks":1,"inputs":[{"label":"Quantity ('000)","ans":50,"tol":0}],"work":"MPB = MPC = $60 at 50 000 units."},{"t":"calc","q":"Calculate MSC and identify the socially optimal quantity.","marks":3,"inputs":[{"label":"Optimal quantity ('000)","ans":40,"tol":0}],"work":"MSC = MPC + $20 = $40, $50, $60, $70, $80. MSB = MSC = $70 at 40 000 units."},{"t":"calc","q":"Calculate the deadweight loss caused by the externality.","marks":3,"inputs":[{"label":"DWL ($)","ans":100000,"tol":0}],"work":"½ × (50 000 − 40 000) × $20 = $100 000."},{"t":"text","q":"Explain how a per-unit tax could correct this market failure, and state the size of the tax.","marks":3,"key":[["Tax of $20 per unit",1],["Raises MPC to MSC so firms pay the external cost",1],["Output falls to 40 000 at $70 and the DWL is removed",1]]},{"t":"text","q":"Outline one limitation of using a tax to correct this externality.","marks":2,"key":[["Limitation identified (hard to measure, inelastic demand, regressive, revenue not to victims)",1],["Explained",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","diagram":true,"q":"Using a diagram, explain why the free market underproduces tertiary education.","marks":5,"key":[["MSB above MPB on the diagram",1],["Market quantity below Q*",1],["DWL shown",1],["External benefits (productivity, tax revenue) ignored by individuals",1],["So education is underconsumed",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Evaluate regulation as a policy to reduce carbon emissions from large industrial facilities.","marks":4,"key":[["A strength (certainty of emission levels, simplicity)",1],["A second strength or further detail",1],["A weakness (no incentive beyond limit, monitoring costs, not least-cost)",1],["A supported judgement",1]]}]}],"dd":[{"title":"Private and social costs","body":"<p>A firm decides how much to produce by looking at its <b>private</b> costs: wages, materials, power. Society also bears <b>external</b> costs the firm ignores: pollution, noise, congestion, health effects.</p><p><b>Social cost = private cost + external cost.</b> When external costs exist, the market produces too much. The same logic applies to benefits: social benefit = private benefit + external benefit, and too little is produced.</p>","fig":"extern","mistakes":["Saying the producer pays the external cost. By definition, a third party does."],"check":{"q":"Diesel fumes from trucks harming people near a highway are:","o":["A private cost","An external cost","A fixed cost"],"a":1,"why":"Third parties bear the cost."}},{"title":"The Safeguard Mechanism","body":"<p>Australia’s Safeguard Mechanism covers large industrial facilities emitting more than 100 000 tonnes of greenhouse gases a year, such as mines, LNG plants and smelters. Each has an emissions limit (baseline) that falls by about 4.9% a year to 2030.</p><p>Facilities that beat their baseline earn credits they can sell; those that exceed it must buy credits. This is a <b>market-based</b> scheme: it puts a price on emissions so firms find the cheapest ways to cut them.</p>","case":"Many of WA’s large LNG and mining facilities are covered, so the scheme matters a lot for the WA economy.","mistakes":["Calling it a tax. It is a baseline-and-credit scheme."],"check":{"q":"Why might a credit scheme be more efficient than one fixed rule for all firms?","o":["Firms that can cut cheaply do more of the cutting","It raises more tax","It bans emissions"],"a":0,"why":"Trading lets cuts happen where they cost least."},"src":[["Clean Energy Regulator, Safeguard Mechanism baselines","https://www.cleanenergyregulator.gov.au/schemes/safeguard-mechanism/safeguard-baselines"]]},{"title":"Positive externalities: vaccination and education","body":"<p>When you are vaccinated, you also protect people around you. When you finish school, employers, co-workers and taxpayers all benefit. Because individuals ignore these external benefits, they consume too little.</p><ul><li><b>Vaccination:</b> vaccines on the National Immunisation Program are free.</li><li><b>Education:</b> public schools, and subsidised university places with HECS-HELP loans.</li></ul>","fig":"posext","mistakes":["Drawing MSB below MPB for a positive externality."],"check":{"q":"Free childhood vaccines correct a positive externality by:","o":["Raising the price","Lowering the price to raise uptake","Taxing producers"],"a":1,"why":"A lower price moves consumption towards the social optimum."},"src":[["Australian Government, National Immunisation Program","https://www.health.gov.au/our-work/national-immunisation-program"]]},{"title":"Case study: WA’s Containers for Change","body":"<p>WA’s container deposit scheme started in 2020. You get a <b>10-cent refund</b> for each eligible drink container you return. The refund acts like a small subsidy for returning containers, rewarding behaviour that reduces litter and landfill, both negative externalities of drink consumption.</p><p>According to the scheme, more than five billion containers have been kept out of general waste, and over $22.6 million has gone to schools, charities and community groups that collect containers.</p>","mistakes":["Saying the refund corrects a positive externality of drinking."],"check":{"q":"The 10c refund mainly gives people an incentive to:","o":["Buy more drinks","Return containers instead of littering","Pay more tax"],"a":1,"why":"It rewards the behaviour that reduces the externality."},"src":[["Containers for Change WA, About us","https://www.containersforchange.com.au/wa/about-us"]]},{"title":"Choosing the right policy","body":"<div class=\"tw\"><table><thead><tr><th>Policy</th><th>Strength</th><th>Weakness</th></tr></thead><tbody><tr><td>Tax (Pigouvian)</td><td>Firms choose the cheapest way to cut harm; raises revenue</td><td>External cost is hard to measure; can be regressive</td></tr><tr><td>Subsidy</td><td>Encourages good behaviour</td><td>Costs taxpayers; may go to people who would act anyway</td></tr><tr><td>Regulation</td><td>Certain outcome; simple</td><td>No reward for doing better than the rule; enforcement costs</td></tr><tr><td>Tradeable permits</td><td>Cuts happen where they are cheapest</td><td>Complex to design and monitor</td></tr><tr><td>Education campaign</td><td>Cheap; changes preferences</td><td>Slow and uncertain</td></tr></tbody></table></div>","mistakes":["Recommending a policy without evaluating it. \"Evaluate\" needs strengths, weaknesses and a judgement."],"check":{"q":"Which policy gives the most certain cap on total pollution?","o":["An education campaign","A strict regulation or cap","A small subsidy"],"a":1,"why":"A legal limit fixes the maximum."}}]},{"id":"t7","unit":1,"n":7,"title":"Public goods and common resources","lead":"Rivalry and excludability decide whether a market can provide a good. Public goods are under-provided; common resources are overused.","notes":"<ul><li><b>Rival:</b> one person’s use reduces what is left for others.</li><li><b>Excludable:</b> non-payers can be kept out.</li><li><b>Public good</b> (non-rival, non-excludable): people <b>free ride</b>, firms cannot profit, so the market provides too little or none.</li><li><b>Common resource</b> (rival, non-excludable): each user gains the full benefit of extra use but shares the cost of depletion: the <b>tragedy of the commons</b>.</li></ul><div class=\"tw\"><table><thead><tr><th>Problem</th><th>Policy</th><th>Example</th></tr></thead><tbody><tr><td>Public goods</td><td>Government provision funded by taxes</td><td>Defence, street lighting, flood levees</td></tr><tr><td>Public goods</td><td>Government contracts private firms</td><td>Road construction contracts</td></tr><tr><td>Common resources</td><td>Quotas, incl. transferable quotas</td><td>Commercial fishing catch limits</td></tr><tr><td>Common resources</td><td>Licences, permits and fees</td><td>Groundwater extraction licences</td></tr><tr><td>Common resources</td><td>Regulation</td><td>Bag limits, closed seasons, sanctuary zones</td></tr><tr><td>Common resources</td><td>Property rights</td><td>An owner has a reason to conserve</td></tr></tbody></table></div>","figs":[["goods","Figure 7.1 · Classifying goods by rivalry and excludability",""]],"worked":"<p>A town of 10 000 people values a sea wall at $50 each. It costs $300 000.</p><ol><li>Total benefit = $500 000 &gt; cost, so building it is efficient.</li><li>Non-excludable: it protects every home.</li><li>Non-rival: one home’s protection does not reduce another’s.</li><li>Each person’s $50 is tiny next to the cost, so most free ride and no firm can raise $300 000.</li><li><b>Conclusion:</b> the council should build it, funded from rates or taxes.</li></ol>","mcq":[{"q":"A good that is both non-rival and non-excludable is a:","o":["private good.","club good.","public good.","common resource."],"a":2,"why":"That is the definition of a public good."},{"q":"The free rider problem occurs when:","o":["people benefit from a good without paying for it.","the gov
