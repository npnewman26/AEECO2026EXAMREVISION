ng the growth rate by 70 instead of 70 by the growth rate."],"check":{"q":"At 2.5% growth, real GDP doubles in about…","o":["17.5 years","28 years","70 years"],"a":1,"why":"70 ÷ 2.5 = 28."}}]},{"id":"t10","unit":2,"n":10,"title":"Inflation","lead":"Headline inflation was 4.0% in the year to August 2026, above the RBA's 2–3% target, with trimmed mean inflation at 3.6%.","notes":"<ul><li><b>Measurement:</b> the ABS Consumer Price Index tracks a basket of household goods and services in the eight capitals. A complete CPI is now published monthly.</li></ul><p class=\"formula\">Inflation (%) = (CPI<sub>this year</sub> − CPI<sub>last year</sub>) ÷ CPI<sub>last year</sub> × 100</p><ul><li><b>Headline:</b> change in the all groups CPI.</li><li><b>Underlying:</b> removes volatile or extreme changes. The <b>trimmed mean</b> drops the largest rises and falls. The RBA focuses on underlying inflation.</li><li><b>RBA target:</b> 2–3% on average, aiming for 2.5%.</li></ul><div class=\"tw\"><table><thead><tr><th>Type</th><th>Cause</th><th>Example</th></tr></thead><tbody><tr><td>Demand-pull</td><td>Spending grows faster than capacity</td><td>Strong spending after lockdowns ended</td></tr><tr><td>Cost-push</td><td>Rising costs passed on as prices</td><td>Higher world oil prices</td></tr><tr><td>Expectations</td><td>Expected rises feed wages and prices</td><td>A wage-price spiral</td></tr><tr><td>Imported</td><td>A falling dollar raises import prices</td><td>Imported cars and electronics</td></tr></tbody></table></div><h4>Effects</h4><ul><li>Reduces purchasing power; real wages fall if wages lag prices.</li><li>Redistributes from lenders and savers to borrowers when unexpected.</li><li>Reduces international competitiveness.</li><li>Creates uncertainty that deters investment.</li><li>Bracket creep.</li><li>Leads the RBA to raise interest rates.</li></ul><h5>What inflation is</h5><ul><li>Inflation is a <b>persistent and appreciable rise in the general level of prices</b>, not a one-off rise in a single price.</li><li>The RBA uses monetary policy (the cash rate) to keep inflation in the 2–3% target band. Higher interest rates raise loan repayments, leaving less to spend on other things.</li></ul><h5>The CPI</h5><ul><li>The CPI measures the price of a fixed “basket” bought by households in the eight capital cities, from steak and cars to dental fillings and restaurant meals: 11 groups, 33 subgroups and about 87 expenditure classes.</li><li>Items are <b>weighted</b> by their share of spending. Since 2018 the ABS updates the weights <b>every year</b>. Over the decades, food’s weight has fallen as incomes rose, while restaurant meals and private schooling have risen.</li><li>Since late 2025 the <b>monthly CPI</b> has been the ABS’s main measure. Annual inflation compares the index with the same period a year earlier.</li><li>Limitations: capital cities only; not a true cost-of-living index (people substitute when prices change); hard to adjust for quality, which may overstate inflation. Still vital for pensions, wage cases, contracts and policy.</li></ul><h5>More on causes and consequences</h5><ul><li>Demand-pull is “too much money chasing too few goods”, common in booms: in the 2022–24 recovery inflation peaked at 7.8% with unemployment near 3.5%.</li><li>Cost-push (natural disasters, wars, supply-chain disruptions, taxes) can occur at any stage of the cycle and can lead to <b>stagflation</b>: inflation plus a slowdown. Supply shocks are becoming more common.</li><li>Further consequences: firms substituting capital for labour; harm to low-income earners and people on fixed incomes; a lower <b>real interest rate</b> (nominal rate − inflation); less efficient decisions; and in extreme cases <b>hyperinflation</b> (Zimbabwe, 2008).</li></ul>","figs":[["cpi","Figure 10.1 · ABS, Consumer Price Index, Australia, August 2026","<p>Inflation surged in 2022 with post-COVID demand, supply-chain problems and energy prices. It fell through 2023–24 as rates rose and dipped to 1.9% in June 2025, partly due to electricity rebates. It rose again as rebates ended and the 2026 oil shock lifted fuel prices. The RBA raised the cash rate four times in 2026, to 4.60%.</p>"],["c_inflhist","Twenty years of inflation.",""],["c_dollar","What inflation does to the value of money.",""],["c_cpigroups","Which prices rose most.",""],["c_trimmed","How the trimmed mean works.",""],["c_dpcp","Demand-pull vs cost-push.",""],["c_spiral","The wage–price spiral.",""]],"worked":"<p>The CPI (Sep 2025 = 100) rose from about 99.5 in August 2025 to 103.5 in August 2026.</p><ol><li>Inflation = (103.5 − 99.5) ÷ 99.5 × 100 = <b>4.02%</b>.</li><li>A worker whose wage rose 3.0% saw real wages fall by about 1 percentage point.</li></ol>","mcq":[{"q":"In Australia, the CPI is compiled by:","o":["the Reserve Bank of Australia.","the Australian Bureau of Statistics.","the Treasury.","the Australian Taxation Office."],"a":1,"why":"The ABS collects prices and publishes the CPI."},{"q":"The trimmed mean is best described as:","o":["the change in the price of essentials only.","the headline CPI adjusted for seasons.","the average price change of goods only.","a measure of underlying inflation that removes the largest price rises and falls."],"a":3,"why":"Trimming the extremes shows the persistent trend."},{"q":"Which event is most likely to cause cost-push inflation?","o":["A sharp rise in world oil prices.","A large increase in household spending.","A cut in interest rates.","A rise in government spending."],"a":0,"why":"Oil raises production and transport costs. The others raise demand."},{"q":"Higher-than-expected inflation tends to benefit:","o":["people on fixed incomes.","savers holding cash.","borrowers with fixed nominal debts.","exporters competing overseas."],"a":2,"why":"Debts are repaid in dollars that buy less."},{"q":"The RBA's inflation target is:","o":["0–1% at all times.","below 2% on average.","3–4% every year.","2–3% on average over time."],"a":3,"why":"The RBA targets 2–3%, aiming for the 2.5% midpoint."},{"q":"An oil price shock that raises transport costs across the economy is an example of…","o":["Demand-pull inflation","Cost-push inflation","Deflation","Bracket creep"],"a":1,"why":"Higher input costs push prices up."},{"q":"The trimmed mean removes…","o":["Food and fuel","The top and bottom 15% of price changes","All government charges","Interest rates"],"a":1,"why":"It trims the extremes and averages the middle 70%."}],"di":{"stim":"<p>CPI groups, annual change to August 2026 (ABS).</p><div class=\"tw\"><table><thead><tr><th>CPI group</th><th>Annual change (%)</th></tr></thead><tbody><tr><td>Housing</td><td>5.7</td></tr><tr><td>Transport</td><td>5.6</td></tr><tr><td>Alcohol and tobacco</td><td>4.8</td></tr><tr><td>Education</td><td>4.7</td></tr><tr><td>Health</td><td>3.9</td></tr><tr><td>Insurance and financial services</td><td>3.5</td></tr><tr><td>Food and non-alcoholic beverages</td><td>3.0</td></tr><tr><td>Recreation and culture</td><td>2.9</td></tr><tr><td>Clothing and footwear</td><td>2.6</td></tr><tr><td>Communication</td><td>1.6</td></tr><tr><td>Furnishings, household equipment and services</td><td>1.0</td></tr><tr><td><b>All groups CPI</b></td><td><b>4.0</b></td></tr><tr><td><b>Trimmed mean</b></td><td><b>3.6</b></td></tr></tbody></table></div><p><i>Electricity rose 13.2% as rebates ended; fuel rose 13.5% as world oil prices increased.</i></p>","items":[{"t":"text","q":"Identify the two CPI groups with the largest annual price increases.","marks":2,"key":[["Housing (5.7%)",1],["Transport (5.6%)",1]]},{"t":"calc","q":"The CPI rose from 99.5 to 103.5. Calculate the annual inflation rate.","marks":2,"inputs":[{"label":"Inflation (%)","ans":4.02,"tol":0.03}],"work":"(103.5 − 99.5) ÷ 99.5 × 100 = 4.02%."},{"t":"text","q":"Distinguish headline from trimmed mean inflation, and explain why the trimmed mean was lower in August 2026.","marks":3,"key":[["Headline: change in the all groups CPI",1],["Trimmed mean removes the largest rises and falls",1],["The big fuel and electricity rises were trimmed out",1]]},{"t":"text","q":"Explain whether the rise in fuel prices is demand-pull or cost-push inflation.","marks":3,"key":[["Cost-push",1],["Higher oil prices raise production and transport costs",1],["Passed on as higher prices, not caused by excess demand",1]]},{"t":"text","q":"Explain two effects of 4.0% inflation on Australian households.","marks":4,"key":[["First effect identified",1],["Explained",1],["Second effect identified",1],["Explained",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","q":"Using Figure 10.1, describe the trend in headline inflation from September 2022 to August 2026.","marks":3,"key":[["Peak 7.9% in December 2022",1],["Fell to 1.9% by June 2025",1],["Rose to 4.0% in August 2026, above target",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Explain demand-pull inflation, using an Australian example.","marks":3,"key":[["Spending grows faster than productive capacity",1],["Firms raise prices",1],["Example (e.g. 2021–22 reopening with low rates)",1]]}]},{"label":"Class review","items":[{"t":"calc","q":"The CPI was 126.1 in June 2022 and 133.7 in June 2023. Calculate the inflation rate (1 decimal place).","marks":2,"inputs":[{"label":"Inflation (%)","ans":6,"tol":0.05}],"work":"(133.7 − 126.1) ÷ 126.1 × 100 = 6.0%."},{"t":"text","q":"Distinguish between demand-pull and cost-push inflation, using an Australian example of each.","marks":4,"key":[["Demand-pull: spending exceeds capacity",1],["Example (e.g. 2022 recovery)",1],["Cost-push: higher production costs passed on",1],["Example (e.g. 2026 fuel shock, 2022 energy prices)",1]]},{"t":"text","q":"Outline two limitations of the CPI as a measure of the cost of living.","marks":4,"key":[["First limitation",1],["Explained",1],["Second limitation",1],["Explained",1]]}]}],"dd":[{"title":"How the ABS builds the CPI","body":"<p>The CPI tracks the price of a fixed \"basket\" of goods and services bought by households in the eight capital cities. ABS staff and scanner data record prices for about 100 000 items. Each item is <b>weighted</b> by its share of household spending, so a rise in rent matters far more than a rise in the price of matches.</p><p>The weights were last updated in January 2025, using household spending in 2023-24. Housing (21.4%) and food (17.4%) are the largest groups.</p>","fig":"cpiweights","mistakes":["Saying the CPI measures the cost of living for every household. It is an average."],"check":{"q":"Why is the CPI weighted?","o":["So items people spend more on count more","To remove seasonal effects","To include interest rates"],"a":0,"why":"Weights reflect each item’s share of spending."},"src":[["ABS, Annual weight update of the CPI and Living Cost Indexes, Dec 2024","https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/annual-weight-update-cpi-and-living-cost-indexes/dec-2024"]]},{"title":"Headline versus underlying inflation","body":"<p><b>Headline</b> inflation is the change in the whole CPI. It can jump around because of one-off events: a fuel price spike, a cyclone hitting bananas, or government rebates starting or ending. <b>Underlying</b> measures like the <b>trimmed mean</b> remove the biggest rises and falls each period to show the trend. The RBA pays close attention to the trimmed mean.</p>","fig":"cpi","case":"In the year to August 2026, headline CPI was 4.0% and trimmed mean 3.6%. Fuel and electricity, after rebates ended, pushed the headline figure higher.","mistakes":["Using headline and underlying interchangeably."],"check":{"q":"The trimmed mean is useful because it:","o":["Includes every price","Removes extreme price changes","Measures wages"],"a":1,"why":"It strips out volatile items to show the trend."},"src":[["ABS, Consumer Price Index, Australia, August 2026","https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/aug-2026"]]},{"title":"What caused the recent inflation","body":"<p>Economists split inflation into two types:</p><ul><li><b>Demand-pull:</b> spending grows faster than the economy can produce. After COVID, savings, low rates and stimulus boosted demand.</li><li><b>Cost-push:</b> production costs rise. Supply chain disruption in 2021–22, energy prices after the Russia–Ukraine war, and the 2026 oil price shock.</li></ul><p>Inflation peaked at 7.8% in the December quarter 2022. It eased to the target band in 2025, then rose again in 2026 as fuel and electricity costs climbed.</p>","mistakes":["Calling every price rise demand-pull."],"check":{"q":"A rise in oil prices causing transport costs to increase is:","o":["Demand-pull","Cost-push","Imported deflation"],"a":1,"why":"Higher input costs push prices up."},"src":[["RBA, Explainer: Inflation and its Measurement","https://www.rba.gov.au/education/resources/explainers/inflation-and-its-measurement.html"]]},{"title":"Real wages and the WPI","body":"<p>The <b>Wage Price Index (WPI)</b> measures changes in the price of labour for the same jobs. If wages grow more slowly than prices, <b>real wages</b> fall and workers can buy less.</p><p>Real wages fell sharply in 2022–23 as inflation outpaced wage growth. They recovered through 2024–25. In the year to June 2026, the WPI rose 3.2% while the CPI rose faster, so real wages fell again.</p>","fig":"wpicpi","mistakes":["Saying wages fell when only real wages fell."],"check":{"q":"Wages rise 3.2% and prices rise 3.8%. Real wages:","o":["Rise 7.0%","Fall about 0.6%","Rise 0.6%"],"a":1,"why":"3.2% − 3.8% ≈ −0.6%."},"src":[["ABS, Annual wage growth of 3.2% in June quarter 2026","https://abs.gov.au/media-centre/media-releases/annual-wage-growth-32-june-quarter-2026"]]},{"title":"Why the RBA targets 2–3%","body":"<p>The RBA aims to keep inflation between 2 and 3%, aiming for the midpoint of 2.5%. Low, stable inflation helps people plan, protects the value of savings and avoids the hidden \"tax\" of rising prices on people with fixed incomes. Zero inflation is not the goal: a little inflation gives wages and prices room to adjust, and avoids the dangers of deflation.</p><p>The main tool is the <b>cash rate</b>. Higher rates make borrowing more expensive, slowing spending and inflation.</p>","fig":"cashrate","mistakes":["Saying the RBA sets mortgage rates. It sets the cash rate; banks set loan rates."],"check":{"q":"If inflation is well above 3%, the RBA is most likely to:","o":["Cut the cash rate","Raise the cash rate","Print more money"],"a":1,"why":"Higher rates slow spending and reduce inflation."},"src":[["RBA, Monetary Policy Framework","https://www.rba.gov.au/monetary-policy/framework/"],["RBA, Cash Rate Target","https://www.rba.gov.au/statistics/cash-rate/"]]},{"title":"Worked example: building a price index","body":"<div class=\"tw\"><table><thead><tr><th>Item</th><th>Weight</th><th>Period 1 price</th><th>W × P</th><th>Period 2 price</th><th>W × P</th></tr></thead><tbody><tr><td>Bread</td><td>40</td><td>$3.20</td><td>$128.00</td><td>$3.40</td><td>$136.00</td></tr><tr><td>Fish</td><td>30</td><td>$8.00</td><td>$240.00</td><td>$7.80</td><td>$234.00</td></tr><tr><td>Lettuce</td><td>20</td><td>$1.15</td><td>$23.00</td><td>$1.20</td><td>$24.00</td></tr><tr><td>Chocolate</td><td>10</td><td>$2.50</td><td>$25.00</td><td>$2.80</td><td>$28.00</td></tr><tr><td><b>Total</b></td><td>100</td><td></td><td><b>$416.00</b></td><td></td><td><b>$422.00</b></td></tr></tbody></table></div><p>Index (period 2) = 422 ÷ 416 × 100 = <b>101.4</b>, so inflation = 1.4%. Notice fish fell in price, but bread’s large weight still pushed the index up.</p><p>From real index numbers: the CPI was 126.1 in June 2022 and 133.7 in June 2023, so inflation = (133.7 − 126.1) ÷ 126.1 × 100 = <b>6.0%</b>.</p>","mistakes":["Averaging the price changes without using weights.","Adding up four quarterly rates to get an annual rate. Compare the index with a year earlier instead."],"check":{"q":"An index rises from 140.0 to 144.2. Inflation is…","o":["4.2%","3.0%","2.9%"],"a":1,"why":"(144.2 − 140) ÷ 140 × 100 = 3.0%."},"src":[["ABS, Annual weight update of the CPI","https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/annual-weight-update-cpi-and-living-cost-indexes/dec-2024"],["RBA, Inflation calculator","https://www.rba.gov.au/calculator/"]]},{"title":"Headline vs underlying: the numbers","body":"<div class=\"tw\"><table><thead><tr><th>Year to June</th><th>2020-21</th><th>2021-22</th><th>2022-23</th><th>2023-24</th><th>2024-25</th><th>2025-26</th></tr></thead><tbody><tr><td>Headline CPI</td><td>3.8</td><td>6.1</td><td>6.0</td><td>3.8</td><td>2.1</td><td>3.8</td></tr><tr><td>Trimmed mean</td><td>1.6</td><td>4.9</td><td>5.8</td><td>4.0</td><td>2.7</td><td>3.6</td></tr><tr><td>Weighted median</td><td>1.5</td><td>4.3</td><td>5.5</td><td>4.3</td><td>2.7</td><td>–</td></tr></tbody></table></div><p>The <b>trimmed mean</b> drops the 15% of items with the biggest price falls and the 15% with the biggest rises, then averages the middle 70%. When Cyclone Larry (2006) sent banana prices up about 400%, headline inflation jumped while underlying measures barely moved.</p><p>In 2025-26 headline (3.8%) ran above the trimmed mean (3.6%) because electricity rose 22.4% as rebates ended.</p>","fig":"c_trimmed","mistakes":["Saying underlying inflation “removes” fuel and food permanently. The trimmed items change every period."],"check":{"q":"Why does the RBA focus on underlying inflation?","o":["It is always lower","It shows the trend without one-off shocks","It includes interest rates"],"a":1,"why":"It strips out volatile one-offs."},"src":[["ABS, CPI rose 3.8% in the year to June 2026","https://www.abs.gov.au/media-centre/media-releases/cpi-rose-38-year-june-2026"]]},{"title":"Winners and losers from inflation","body":"<div class=\"tw\"><table><thead><tr><th>Usually lose</th><th>Usually gain or are protected</th></tr></thead><tbody><tr><td>People on fixed incomes and savers</td><td>Borrowers with fixed repayments (if inflation is unexpected)</td></tr><tr><td>Lenders (if interest rates don’t keep up)</td><td>Owners of assets that rise with prices (property)</td></tr><tr><td>Exporters, as Australian prices become less competitive</td><td>Pensioners: payments are indexed to prices twice a year</td></tr><tr><td>Taxpayers through bracket creep</td><td>Workers whose wages rise faster than prices</td></tr></tbody></table></div><p><b>Real interest rate</b> = nominal interest rate − inflation. With a 5% savings rate and 4% inflation, a saver’s real return is only about 1%.</p>","mistakes":["Saying everyone loses from inflation."],"check":{"q":"Savings earn 4.5% and inflation is 3.8%. The real interest rate is about…","o":["8.3%","0.7%","−0.7%"],"a":1,"why":"4.5 − 3.8 = 0.7%."}}]},{"id":"t11","unit":2,"n":11,"title":"Unemployment","lead":"Australia's unemployment rate rose to 4.7% in September 2026, up from 3.5% in 2022 and 2023. Underemployment was 6.3% and participation 66.8%.","notes":"<ul><li><b>Unemployed:</b> aged 15+, without paid work, actively looking and available.</li><li><b>Labour force</b> = employed + unemployed.</li><li><b>Underemployed:</b> employed but wanting more hours.</li></ul><p class=\"formula\">Unemployment rate = Unemployed ÷ Labour force × 100 &nbsp;·&nbsp; Participation rate = Labour force ÷ Civilian population 15+ × 100</p><ul><li><b>Full employment:</b> no cyclical unemployment.</li><li><b>NAIRU:</b> the lowest unemployment rate sustainable without rising inflation.</li></ul><div class=\"tw\"><table><thead><tr><th>Type</th><th>Cause</th><th>Example</th></tr></thead><tbody><tr><td>Cyclical</td><td>Not enough spending in a downturn</td><td>Retail layoffs as spending falls</td></tr><tr><td>Structural</td><td>Skills or location mismatch</td><td>Workers displaced by automation</td></tr><tr><td>Frictional</td><td>Short-term, between jobs</td><td>A graduate looking for a first job</td></tr><tr><td>Seasonal</td><td>Varies with the season</td><td>Fruit pickers after harvest</td></tr></tbody></table></div><h4>Effects</h4><ul><li><b>GDP gap:</b> potential output minus actual output; idle labour is output lost forever.</li><li>Lower incomes and spending, deepening a downturn.</li><li>Lower tax revenue, higher welfare payments.</li><li>Lost skills, poorer health, more inequality.</li></ul>","figs":[["unemp","Figure 11.1 · ABS, Labour Force, Australia (seasonally adjusted)","<p>Unemployment fell to 3.5% in 2022–23, its lowest in about 50 years. It has drifted up as higher rates slowed spending; in September 2026 employment fell 39 000. The rise is mainly cyclical.</p>"],["phillips","Figure 11.2 · The Phillips Curve","<p>In the short run there is a trade-off. Australia in 2022 sat near A; rate rises since then moved the economy towards B.</p>"]],"worked":"<p>August 2026: 14 836 600 employed, 722 900 unemployed, participation 67.1%.</p><ol><li>Labour force = <b>15 559 500</b>.</li><li>Unemployment rate = 722 900 ÷ 15 559 500 × 100 = <b>4.6%</b>.</li><li>Civilian population 15+ = 15 559 500 ÷ 0.671 ≈ <b>23.2 million</b>.</li></ol>","mcq":[{"q":"To be counted as unemployed, a person must be aged 15+, without work and:","o":["receiving a government payment.","registered with a job agency.","actively looking for work and available to start.","looking for full-time work only."],"a":2,"why":"The ABS definition depends on looking and availability, not payments."},{"q":"The participation rate is calculated as:","o":["labour force ÷ civilian population 15+ × 100.","employed ÷ labour force × 100.","unemployed ÷ civilian population 15+ × 100.","employed ÷ total population × 100."],"a":0,"why":"Participation measures how much of the working-age population is in the labour force."},{"q":"A bank teller loses their job because customers now bank online. This is:","o":["frictional unemployment.","cyclical unemployment.","seasonal unemployment.","structural unemployment."],"a":3,"why":"Technology has permanently changed the skills employers need."},{"q":"The GDP gap is the difference between:","o":["nominal GDP and real GDP.","potential output and actual output.","exports and imports.","GDP this year and GDP last year."],"a":1,"why":"It measures output lost when resources are idle."},{"q":"The short-run Phillips Curve shows:","o":["a positive relationship between unemployment and inflation.","no relationship between them.","an inverse relationship between unemployment and inflation.","the relationship between output and labour inputs."],"a":2,"why":"Lower unemployment tends to come with higher inflation."}],"di":{"stim":"<p>Use Figure 11.1 and these data for a hypothetical economy.</p><div class=\"tw\"><table><thead><tr><th>Category</th><th>People</th></tr></thead><tbody><tr><td>Civilian population aged 15+</td><td>20 000 000</td></tr><tr><td>Employed</td><td>12 900 000</td></tr><tr><td>Unemployed</td><td>600 000</td></tr><tr><td>Underemployed</td><td>840 000</td></tr></tbody></table></div>","items":[{"t":"calc","q":"Calculate the labour force and the unemployment rate.","marks":3,"inputs":[{"label":"Labour force (millions)","ans":13.5,"tol":0.01},{"label":"Unemployment rate (%)","ans":4.44,"tol":0.05}],"work":"LF = 12.9m + 0.6m = 13.5m. UR = 0.6 ÷ 13.5 × 100 = 4.4%."},{"t":"calc","q":"Calculate the participation rate.","marks":2,"inputs":[{"label":"Participation (%)","ans":67.5,"tol":0.05}],"work":"13.5 ÷ 20 × 100 = 67.5%."},{"t":"text","q":"Using Figure 11.1, describe the trend in Australia's unemployment rate from June 2022 to September 2026.","marks":3,"key":[["Steady at 3.5% to June 2023",1],["Rose gradually to 4.4% by June 2026",1],["Jumped to 4.7% in September 2026",1]]},{"t":"text","q":"Identify the type of unemployment most likely behind the 2026 rise. Explain.","marks":3,"key":[["Cyclical",1],["Slower growth and higher rates reduced the demand for labour",1],["Evidence: employment fell 39 000 in September",1]]},{"t":"text","diagram":true,"q":"Using a Phillips Curve, explain why low unemployment in 2022 coincided with high inflation.","marks":4,"key":[["Phillips Curve drawn with 2022 at low U, high inflation",1],["Diagram labelled",1],["Firms competed for scarce workers, raising wages and costs",1],["Excess demand pushed prices up",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","q":"Distinguish between frictional and cyclical unemployment. Use an example of each.","marks":4,"key":[["Frictional: short-term, between jobs",1],["Example",1],["Cyclical: caused by a downturn in demand",1],["Example",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Explain two economic costs of unemployment, including the GDP gap.","marks":4,"key":[["GDP gap: output lost when labour is idle",1],["Explained",1],["Second cost identified",1],["Explained",1]]}]}],"dd":[{"title":"The Labour Force Survey","body":"<p>Each month the ABS surveys about 26 000 dwellings. You are <b>employed</b> if you worked at least <b>one hour</b> for pay in the reference week. You are <b>unemployed</b> if you had no work, actively looked for work in the last four weeks and were available to start. Everyone else aged 15+ is not in the labour force.</p>","fig":"lfstree","mistakes":["Counting retirees or full-time students not looking for work as unemployed."],"check":{"q":"A student works 2 hours a week at a café. The ABS classifies them as:","o":["Unemployed","Employed","Not in the labour force"],"a":1,"why":"One hour of paid work counts as employed."},"src":[["ABS, Labour Force, Australia methodology","https://www.abs.gov.au/methodologies/labour-force-australia-methodology/latest-release"]]},{"title":"Participation and underutilisation","body":"<p><b>Participation rate</b> = labour force ÷ population aged 15+ × 100. It was 66.8% in September 2026, near record highs.</p><p><b>Underemployment</b> counts workers who want and can work more hours. Add it to unemployment and you get <b>underutilisation</b>: 11.0% in September 2026 (4.7% unemployed + 6.3% underemployed). It gives a fuller picture of spare capacity in the labour market.</p>","fig":"underutil","mistakes":["Using total population instead of the 15+ population."],"check":{"q":"Unemployment is 4.5% and underemployment is 6.0%. Underutilisation is:","o":["1.5%","10.5%","6.0%"],"a":1,"why":"4.5 + 6.0 = 10.5%."},"src":[["ABS, Labour Force, Australia, September 2026","https://www.abs.gov.au/statistics/labour/employment-and-unemployment/labour-force-australia/latest-release"]]},{"title":"Types of unemployment","body":"<div class=\"tw\"><table><thead><tr><th>Type</th><th>Cause</th><th>Example</th></tr></thead><tbody><tr><td>Frictional</td><td>Moving between jobs</td><td>A graduate searching for their first role</td></tr><tr><td>Structural</td><td>Skills or location no longer match jobs</td><td>Car factory workers after manufacturing closed in 2017</td></tr><tr><td>Cyclical</td><td>Weak demand in a downturn</td><td>Job losses in 2020 lockdowns</td></tr><tr><td>Seasonal</td><td>Regular seasonal patterns</td><td>Fruit pickers and ski instructors</td></tr></tbody></table></div>","mistakes":["Confusing structural (long-lasting mismatch) with cyclical (temporary downturn)."],"check":{"q":"Workers lose jobs because self-checkouts replace cashiers. This is mainly:","o":["Frictional","Structural","Cyclical"],"a":1,"why":"Technology has changed the skills needed."},"src":[["RBA, Explainer: Unemployment – Its Measurement and Types","https://www.rba.gov.au/education/resources/explainers/unemployment-its-measurement-and-types.html"]]},{"title":"Full employment and the NAIRU","body":"<p>Full employment does not mean zero unemployment, because frictional and structural unemployment always exist. It is the lowest rate consistent with stable inflation, sometimes called the NAIRU.</p><p>The RBA says full employment \"cannot be observed directly\". Instead of a single number, it looks at many indicators: unemployment, underemployment, job vacancies, wages growth and how hard firms find it to hire.</p>","mistakes":["Giving one exact NAIRU figure as fact."],"check":{"q":"Below the NAIRU, we would expect:","o":["Falling inflation","Rising wages and inflation","Rising unemployment"],"a":1,"why":"A tight labour market pushes wages and prices up."},"src":[["RBA, Statement on Monetary Policy, February 2026 (Box A: full employment)","https://www.rba.gov.au/publications/smp/2026/feb/"]]},{"title":"The GDP gap","body":"<p>The <b>output gap</b> is the difference between actual GDP and potential GDP (what the economy could produce at full employment). A <b>negative</b> gap means spare capacity and higher unemployment. A <b>positive</b> gap means the economy is running hot, pushing inflation up.</p>","fig":"gdpgap","mistakes":["Mixing up the signs of the gap."],"check":{"q":"Actual GDP is above potential. The economy probably has:","o":["Rising unemployment","Inflationary pressure","A recession"],"a":1,"why":"Demand exceeds sustainable capacity."}},{"title":"The Phillips Curve in Australia","body":"<p>The Phillips Curve shows a short-run trade-off: lower unemployment tends to come with higher inflation. Australia’s 2021–26 experience broadly fits. Unemployment fell to about 3.5% in 2022 as inflation surged, then both eased as rate rises slowed the economy.</p><p>The relationship is not fixed: supply shocks can raise inflation without lower unemployment, and inflation expectations can shift the curve.</p>","fig":"phillipsdata","mistakes":["Saying the trade-off holds in the long run."],"check":{"q":"A negative supply shock raises inflation and unemployment together. On a Phillips diagram, this looks like:","o":["A movement along the curve","An outward shift of the curve","No change"],"a":1,"why":"Both variables worsen, so the curve itself shifts."}}]},{"id":"t12","unit":2,"n":12,"title":"The business cycle","lead":"The business cycle is the pattern of expansions and contractions around the long-run trend. Each phase has a recognisable mix of growth, unemployment and inflation.","notes":"<div class=\"tw\"><table><thead><tr><th>Indicator</th><th>Expansion</th><th>Peak</th><th>Contraction</th><th>Trough</th></tr></thead><tbody><tr><td>Real GDP growth</td><td>Rising, above trend</td><td>Highest; starts to slow</td><td>Slowing or negative</td><td>Lowest; starts to recover</td></tr><tr><td>Unemployment</td><td>Falling</td><td>Lowest</td><td>Rising</td><td>Highest</td></tr><tr><td>Inflation</td><td>Rising</td><td>Highest</td><td>Easing</td><td>Lowest</td></tr><tr><td>Interest rates</td><td>Rising</td><td>High</td><td>Falling</td><td>Low</td></tr><tr><td>Confidence</td><td>Rising</td><td>High</td><td>Falling</td><td>Low</td></tr></tbody></table></div><ul><li>A <b>recession</b> is a significant fall in activity; commonly two consecutive quarters of negative real GDP growth.</li><li>Causes: confidence, interest rates, government policy, the world economy, supply shocks.</li></ul><div class=\"tw\"><table><thead><tr><th>Indicator type</th><th>Moves…</th><th>Examples</th></tr></thead><tbody><tr><td>Leading</td><td>Before the economy turns</td><td>Building approvals, confidence, job vacancies, share prices</td></tr><tr><td>Coincident</td><td>With the economy</td><td>Real GDP, retail trade, hours worked</td></tr><tr><td>Lagging</td><td>After the economy turns</td><td>Unemployment rate, inflation, wage growth</td></tr></tbody></table></div><h4>Australia over the last five years</h4><div class=\"tw\"><table><thead><tr><th>Period</th><th>Phase</th><th>Evidence</th></tr></thead><tbody><tr><td>2021-22 to 2022</td><td>Expansion to peak</td><td>Growth 3.6%; unemployment 3.5%; inflation 7.9%</td></tr><tr><td>2023 to mid-2025</td><td>Slowdown</td><td>Growth 1.5% then 1.3%; GDP per capita fell</td></tr><tr><td>2025-26</td><td>Recovery</td><td>Growth 2.4%, led by investment</td></tr><tr><td>2026</td><td>Slowing again</td><td>Oil shock, four rate rises to 4.60%, unemployment 4.7%</td></tr></tbody></table></div><h5>Features of each phase</h5><div class=\"tw\"><table><thead><tr><th>Phase</th><th>What you would expect to see</th></tr></thead><tbody><tr><td>Boom (peak)</td><td>Fast growth, strong confidence, high spending on durables and luxuries, high profits, little spare capacity, low cyclical unemployment, high participation, rising inflation, imports and borrowing</td></tr><tr><td>Contraction (downswing)</td><td>Sales level off, investment and profits fall, output and income decline; often happens faster than recoveries and is amplified by falling confidence</td></tr><tr><td>Trough</td><td>Activity below potential, high cyclical unemployment, low profits and confidence, prices may fall, saving rises</td></tr><tr><td>Expansion (upswing)</td><td>Firms replace worn-out equipment, investment rises and the multiplier lifts spending, income and output; a gradual process</td></tr></tbody></table></div><ul><li>Real cycles are irregular in length and depth. Expansions usually last much longer than contractions.</li><li>In a boom, governments may use <b>contractionary policy</b> (higher interest rates, lower spending or higher taxes) to keep inflation in check and avoid a “blow-out”.</li><li>Indicators are <b>procyclical</b> (move with the cycle, e.g. retail sales, job vacancies) or <b>countercyclical</b> (move against it, e.g. unemployment, the saving ratio).</li></ul>","figs":[["cycle","Figure 12.1 · The business cycle",""],["c_bcdata","Australia’s cycle, 2020–2026.",""],["c_procyc","Pro- and countercyclical indicators.",""]],"worked":"<p><b>Question:</b> In mid-2026, quarterly growth was 0.4%, inflation 3.8% (well above target), the cash rate had risen from 3.60% to 4.35%, and unemployment had risen from 4.3% to 4.4% over the year. Identify the phase.</p><ol><li>Growth is positive but below trend; per capita growth is zero.</li><li>Unemployment is rising and higher rates are slowing demand.</li><li>Inflation is high from a supply shock, not strong demand.</li><li><b>Conclusion:</b> past the peak and moving into a contraction (slowdown), but not a recession.</li></ol>","mcq":[{"q":"In which phase does real GDP growth slow and unemployment begin to rise?","o":["Trough.","Expansion.","Contraction.","Recovery."],"a":2,"why":"Contraction is the downswing after a peak."},{"q":"Which is a leading indicator?","o":["The unemployment rate.","Building approvals.","The inflation rate.","Real GDP."],"a":1,"why":"Approvals today become construction activity months later."},{"q":"A common technical definition of a recession is:","o":["unemployment above 5%.","inflation above the RBA target.","one quarter of falling exports.","two consecutive quarters of negative real GDP growth."],"a":3,"why":"This is the widely used rule of thumb."},{"q":"At the peak, the economy typically has:","o":["low unemployment and rising inflationary pressure.","high unemployment and low inflation.","falling interest rates and low confidence.","negative real GDP growth."],"a":0,"why":"Demand is strongest at the peak, stretching capacity."},{"q":"Unemployment is a lagging indicator because it:","o":["is published monthly.","predicts future activity.","changes after the economy has already turned.","is measured by the RBA."],"a":2,"why":"Firms adjust hiring only after demand has changed."},{"q":"Which is a countercyclical indicator?","o":["Retail sales","Job vacancies","The unemployment rate","Building approvals"],"a":2,"why":"Unemployment rises when activity falls."}],"di":{"stim":"<p>Selected indicators for Australia, 2026 (ABS and RBA).</p><div class=\"tw\"><table><thead><tr><th>Indicator</th><th>Earlier</th><th>Latest</th></tr></thead><tbody><tr><td>Real GDP, quarterly growth</td><td>0.3% (Mar qtr)</td><td>0.4% (Jun qtr)</td></tr><tr><td>Real GDP per capita, quarterly</td><td>−0.1% (Mar qtr)</td><td>0.0% (Jun qtr)</td></tr><tr><td>Unemployment rate</td><td>4.4% (Jun)</td><td>4.7% (Sep)</td></tr><tr><td>Headline CPI, annual</td><td>3.8% (Jun)</td><td>4.0% (Aug)</td></tr><tr><td>RBA cash rate target</td><td>3.60% (Jan)</td><td>4.60% (Sep)</td></tr></tbody></table></div>","items":[{"t":"text","q":"From the table, identify one coincident indicator and one lagging indicator.","marks":2,"key":[["Coincident: real GDP growth",1],["Lagging: unemployment rate or CPI",1]]},{"t":"text","q":"Identify the phase of the business cycle in 2026. Justify with the data.","marks":4,"key":[["Contraction or slowdown",1],["Growth weak at 0.3–0.4% a quarter; per capita flat",1],["Unemployment rose from 4.4% to 4.7%",1],["Inflation above target from a supply shock; cash rate raised to 4.60%",1]]},{"t":"text","q":"Explain how the cash rate increases are likely to affect the business cycle.","marks":3,"key":[["Higher rates raise borrowing costs",1],["Consumption and investment fall",1],["Growth slows, deepening the contraction and easing inflation",1]]},{"t":"text","q":"Predict the movement in unemployment over the next 12 months. Justify it.","marks":3,"key":[["Likely to rise",1],["Lagging indicator; rate rises still flowing through",1],["Weak growth means less hiring",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","diagram":true,"q":"Using a business cycle diagram, describe the features of the expansion and contraction phases.","marks":6,"key":[["Accurate diagram",1],["Fully labelled",1],["Expansion: rising growth, falling unemployment",1],["Expansion: rising inflation and confidence",1],["Contraction: slowing growth, rising unemployment",1],["Contraction: easing inflation, falling confidence",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Explain why business confidence is a leading indicator.","marks":3,"key":[["Confidence shapes investment and hiring decisions",1],["These are made before output changes",1],["Surveys capture expectations of future conditions",1]]}]},{"label":"Class review","items":[{"t":"text","q":"Describe what happens to unemployment, inflation and business confidence during a boom.","marks":3,"key":[["Unemployment low (little cyclical)",1],["Inflationary pressure high",1],["Confidence high",1]]},{"t":"text","q":"Using data, identify the phase of the Australian business cycle in the June quarter 2020 and justify your answer.","marks":3,"key":[["Recession / trough",1],["GDP fell 5.8% over the year",1],["Unemployment rose to 7.4%",1]]}]}],"dd":[{"title":"Phases of the business cycle","body":"<p>Economies do not grow smoothly. They move through <b>expansion</b> (growth speeds up, unemployment falls), a <b>peak</b>, <b>contraction</b> (growth slows or turns negative) and a <b>trough</b>. A recession is often defined as two consecutive quarters of falling real GDP.</p>","fig":"cycle","mistakes":["Drawing the trend line inside the cycle as flat. It slopes upward."],"check":{"q":"Which phase usually brings the fastest fall in unemployment?","o":["Contraction","Expansion","Peak"],"a":1,"why":"Firms hire as demand grows."},"src":[["RBA, Explainer: Business Cycles","https://www.rba.gov.au/education/resources/explainers/business-cycles.html"]]},{"title":"Indicators that move first","body":"<p>Economists watch indicators that change <b>before</b> GDP does (leading), at the same time (coincident) or after (lagging).</p>","fig":"indicators","case":"Each month the Westpac-Melbourne Institute Consumer Sentiment index and the NAB Business Survey are closely watched. A sharp fall in either often signals slower spending ahead.","mistakes":["Calling unemployment a leading indicator. It usually lags."],"check":{"q":"Building approvals are a leading indicator because:","o":["They show work that will happen in future","They measure past output","They are released yearly"],"a":0,"why":"Approved projects lead to construction later."},"src":[["Westpac-Melbourne Institute Consumer Sentiment","https://www.westpac.com.au/about-westpac/media/reports/consumer-sentiment/"],["NAB, Monthly Business Survey","https://business.nab.com.au/tag/business-survey"]]},{"title":"Two recessions: 1991 and 2020","body":"<div class=\"tw\"><table><thead><tr><th></th><th>1990–91</th><th>2020</th></tr></thead><tbody><tr><td>Main cause</td><td>Very high interest rates (above 17% for mortgages) to curb inflation</td><td>COVID-19 lockdowns and border closures</td></tr><tr><td>GDP</td><td>Fell over several quarters</td><td>Fell 7.0% in the June quarter 2020</td></tr><tr><td>Peak unemployment</td><td>Above 11% in late 1992</td><td>7.5% in July 2020</td></tr><tr><td>Recovery</td><td>Slow; unemployment high for years</td><td>Fast, helped by JobKeeper and low rates</td></tr></tbody></table></div>","mistakes":["Saying Australia had no recession for 29 years \"because GDP never fell\". It did fall in some single quarters."],"check":{"q":"Why did unemployment recover faster after 2020?","o":["Wage subsidies kept workers attached to jobs","Interest rates were raised","Immigration rose sharply"],"a":0,"why":"JobKeeper kept employer links intact."}},{"title":"The per capita recession, 2023–24","body":"<p>Australia avoided a technical recession after 2022 because total GDP kept growing. But real GDP per person fell for <b>six quarters in a row</b> to the June quarter 2024, the longest run on record. Rising interest rates and prices squeezed households while strong migration kept total GDP positive.</p>","fig":"cashrate","mistakes":["Saying Australia was in a technical recession in 2023."],"check":{"q":"How could GDP grow while GDP per capita fell?","o":["Population grew faster than GDP","Inflation fell","Exports fell"],"a":0,"why":"More people shared slower growth."},"src":[["AICD, Australia’s per capita recession","https://www.aicd.com.au/economic-trends/australia/gdp/per-capita-recession.html"]]},{"title":"Reading Australia’s cycle, 2020 to 2026","body":"<div class=\"tw\"><table><thead><tr><th>Quarter</th><th>Real GDP growth (% over year)</th><th>Unemployment (%)</th><th>Phase</th></tr></thead><tbody><tr><td>Jun 2020</td><td>−5.8</td><td>7.4</td><td>Recession</td></tr><tr><td>Jun 2021</td><td>10.3</td><td>5.0</td><td>Recovery</td></tr><tr><td>Jun 2022</td><td>3.8</td><td>3.6</td><td>Expansion (boom)</td></tr><tr><td>Dec 2022</td><td>3.1</td><td>3.5</td><td>Expansion (peak labour market)</td></tr><tr><td>Jun 2024</td><td>0.9</td><td>4.1</td><td>Slowdown</td></tr><tr><td>Jun 2025</td><td>1.8</td><td>4.2</td><td>Slow expansion</td></tr><tr><td>Dec 2025</td><td>2.6</td><td>4.1</td><td>Expansion</td></tr><tr><td>Jun 2026</td><td>2.1</td><td>4.4</td><td>Expansion, slowing</td></tr></tbody></table></div><p>Notice the lags: growth peaked in 2021–22, but unemployment kept falling into late 2022 (a lagging indicator), and inflation peaked at 7.8% in December 2022. In June 2026, GDP grew only 0.4% in the quarter, the same as population growth, so GDP per person was flat.</p>","fig":"c_bcdata","mistakes":["Calling any slowdown a recession. Growth stayed positive from 2021 to 2026."],"check":{"q":"Unemployment kept falling after growth peaked. This shows unemployment is…","o":["A leading indicator","A lagging indicator","Procyclical"],"a":1,"why":"It changes after activity changes."},"src":[["ABS, National Accounts, June 2026","https://www.abs.gov.au/statistics/economy/national-accounts/australian-national-accounts-national-income-expenditure-and-product/latest-release"],["ABS, Labour Force, June 2026","https://www.abs.gov.au/statistics/labour/employment-and-unemployment/labour-force-australia/jun-2026"]]}]},{"id":"t13","unit":2,"n":13,"title":"Income distribution","lead":"The Lorenz curve shows how unequal the distribution is; the Gini coefficient sums it up. Australia's Gini for disposable household income was 0.324 in the ABS's 2019-20 survey.","notes":"<div class=\"tw\"><table><thead><tr><th></th><th>Income</th><th>Wealth</th></tr></thead><tbody><tr><td>Definition</td><td>A <b>flow</b> received over a period</td><td>A <b>stock</b> of assets less liabilities at a point in time</td></tr><tr><td>Examples</td><td>Wages, profits, rent, interest, government payments</td><td>Housing, superannuation, shares, savings</td></tr><tr><td>Distribution</td><td>Unequal</td><td>Much more unequal</td></tr></tbody></table></div><ul><li><b>Lorenz curve:</b> cumulative % of households (poorest to richest) against cumulative % of income. The diagonal is perfect equality.</li><li><b>Gini coefficient:</b> 0 (perfect equality) to 1 (one household has everything).</li></ul><p class=\"formula\">Gini = area between equality line and Lorenz curve ÷ total area under the equality line</p><div class=\"tw\"><table><thead><tr><th>Measure</th><th>Gini</th><th>Source</th></tr></thead><tbody><tr><td>Gross household income, 2019-20</td><td>0.436</td><td>ABS Survey of Income and Housing</td></tr><tr><td>Disposable household income, 2019-20</td><td>0.324</td><td>ABS Survey of Income and Housing</td></tr><tr><td>Disposable household income, 2022-23</td><td>0.307</td><td>HILDA, reported by the ABS</td></tr><tr><td>Household net worth, 2022-23</td><td>0.606</td><td>HILDA, reported by the ABS</td></tr></tbody></table></div><p>The gap between gross and disposable Gini shows progressive tax and transfers reduce inequality. Wealth is more unequal because it builds up over a lifetime and earns returns.</p><h5>Income and wealth</h5><ul><li>A retiree may have low income but high wealth (a paid-off home and super); a young doctor may have high income but little wealth.</li><li>Owner-occupied homes make up about <b>40%</b> of household assets, so housing is central to wealth inequality.</li></ul><div class=\"tw\"><table><thead><tr><th>Measure</th><th>What it includes</th></tr></thead><tbody><tr><td>Private income</td><td>Wages, salaries, business and investment income</td></tr><tr><td>Gross income</td><td>Private income + government transfers (pensions, allowances)</td></tr><tr><td>Disposable income</td><td>Gross income − income tax</td></tr><tr><td>Final income</td><td>Disposable income + indirect benefits (health, education)</td></tr></tbody></table></div><h5>Poverty and living standards</h5><ul><li><b>Absolute poverty</b>: lacking basic needs (food, shelter, water). Very rare in Australia because of the welfare system.</li><li><b>Relative poverty</b>: below the minimum standard of living accepted in a society. About 1 in 8 Australians (13.4% in 2019-20, ACOSS/UNSW).</li><li>Standard of living has an <b>economic</b> side (what people can buy) and a <b>social</b> side (access to public services, community, wellbeing).</li><li>When the cost of living rises, disposable income for discretionary spending is squeezed. Local councils help with free libraries, events and recreation.</li></ul><h5>Drivers and responses</h5><ul><li>Drivers of inequality: education and training; employment conditions (hours, location); personal skills and talents; opportunities available; involuntary factors such as illness, disability or age.</li><li>Responses: progressive income tax; direct transfer payments to the aged, unemployed, sick and disabled, sole parents and families; and indirect benefits (public health, education and housing provided below cost).</li><li>Social security and welfare is the largest Commonwealth spending area: $308.7 billion (37%) in 2026-27.</li></ul>","figs":[["lorenz","Figure 13.1 · Lorenz curve for a hypothetical economy (quintile shares 7, 12, 17, 23, 41%)",""],["c_incladder","From private to final income.",""],["c_quint","Income and wealth by quintile.",""],["c_wellbeing","What determines economic wellbeing.",""],["c_ginicountries","Australia compared with other countries.",""]],"worked":"<ol><li>The bottom 40% receive <b>19%</b> of income (7% + 12%).</li><li>The top 20% receive 100% − 59% = <b>41%</b>.</li><li>The top 20% receive about <b>5.9 times</b> the bottom 20% (41 ÷ 7).</li><li>With equality the bottom 40% would get 40%; the gap to 19% shows the inequality.</li></ol>","mcq":[{"q":"A Gini coefficient of 0 indicates:","o":["one household receives all income.","moderate inequality.","perfect equality.","zero income growth."],"a":2,"why":"At 0, the Lorenz curve sits on the line of equality."},{"q":"Which statement about wealth is correct?","o":["Wealth is the same as income.","Wealth is measured over a financial year.","Wealth is more equally distributed than income.","Wealth is a stock of assets less liabilities at a point in time."],"a":3,"why":"Wealth is a stock; income is a flow."},{"q":"The further a Lorenz curve is from the line of equality:","o":["the more unequal the distribution.","the more equal the distribution.","the higher the average income.","the lower the Gini coefficient."],"a":0,"why":"A bigger gap means a larger Gini and more inequality."},{"q":"Australia's Gini for disposable income is lower than for gross income mainly because of:","o":["higher interest rates.","economic growth.","progressive income tax and transfer payments.","the GST."],"a":2,"why":"Tax takes more from high incomes; transfers add to low incomes."},{"q":"Which change would move Australia's Lorenz curve closer to the line of equality?","o":["A cut in the top marginal tax rate.","Faster growth in house prices.","A cut in pensions and allowances.","An increase in payments to low-income households."],"a":3,"why":"Raising low incomes narrows the gap."},{"q":"Disposable income equals…","o":["Private income + transfers","Gross income − income tax","Final income − indirect benefits","Wealth − debt"],"a":1,"why":"Disposable income is what’s left after tax."},{"q":"Living below the accepted minimum standard of a society is…","o":["Absolute poverty","Relative poverty","Horizontal equity","Underemployment"],"a":1,"why":"Relative poverty is judged against the society’s standard."}],"di":{"stim":"<div class=\"tw\"><table><thead><tr><th>Quintile</th><th>Country A (%)</th><th>Country B (%)</th></tr></thead><tbody><tr><td>Lowest 20%</td><td>8</td><td>4</td></tr><tr><td>Second 20%</td><td>13</td><td>9</td></tr><tr><td>Third 20%</td><td>17</td><td>14</td></tr><tr><td>Fourth 20%</td><td>22</td><td>21</td></tr><tr><td>Highest 20%</td><td>40</td><td>52</td></tr><tr><td>Gini</td><td>0.29</td><td>0.43</td></tr></tbody></table></div>","items":[{"t":"calc","q":"Calculate the share of income received by the lowest 40% in each country.","marks":2,"inputs":[{"label":"Country A (%)","ans":21,"tol":0},{"label":"Country B (%)","ans":13,"tol":0}],"work":"A: 8 + 13 = 21%. B: 4 + 9 = 13%."},{"t":"text","q":"Identify which country has the more equal distribution. Justify with two pieces of data.","marks":2,"key":[["Country A",1],["Two data points (lower Gini 0.29 vs 0.43; top 20% gets 40% vs 52%)",1]]},{"t":"text","diagram":true,"q":"Draw and label the Lorenz curves for both countries on one diagram.","marks":4,"key":[["Axes and line of equality",1],["A plotted at 8, 21, 38, 60, 100",1],["B plotted at 4, 13, 27, 48, 100, further from the diagonal",1],["Both curves labelled",1]]},{"t":"text","q":"Explain how Country B's government could use tax and transfers to make income more equal.","marks":3,"key":[["Progressive tax takes a higher share from high incomes",1],["Transfers raise low incomes",1],["Lorenz curve moves towards the diagonal; Gini falls",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","q":"Distinguish between income and wealth, using an example of each.","marks":3,"key":[["Income: a flow over a period, with example",1],["Wealth: a stock at a point in time",1],["Example of wealth",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Explain why wealth is distributed less equally than income in Australia.","marks":3,"key":[["Wealth builds up over a lifetime",1],["Assets earn returns, capital gains, inheritances",1],["High-income households save more and own more property",1]]}]},{"label":"Class review","items":[{"t":"text","q":"Distinguish between income and wealth, with an example of each.","marks":4,"key":[["Income: a flow over time",1],["Example",1],["Wealth: stock of assets minus debts",1],["Example",1]]},{"t":"text","q":"Explain how the government uses the tax-transfer system to reduce income inequality.","marks":4,"key":[["Progressive income tax takes a larger share from higher incomes",1],["Transfer payments target low-income groups",1],["Indirect benefits (health, education) provided below cost",1],["Effect: lowers the Gini / narrows the gap",1]]}]}],"dd":[{"title":"Income versus wealth","body":"<p><b>Income</b> is a flow: money earned over a period (wages, interest, rent, dividends, government payments). <b>Wealth</b> is a stock: the value of assets owned at a point in time (housing, super, shares), minus debts.</p><p>Wealth is much more unequal than income. In 2019-20, the ABS Gini coefficient was about 0.32 for disposable income but 0.61 for household wealth.</p>","mistakes":["Using income and wealth as if they mean the same thing."],"check":{"q":"Which is wealth?","o":["A $900 weekly pay cheque","A house worth $650 000","A pension payment"],"a":1,"why":"An asset owned is a stock of wealth."},"src":[["ABS, Household Income and Wealth, Australia, 2019-20","https://www.abs.gov.au/statistics/economy/finance/household-income-and-wealth-australia/latest-release"]]},{"title":"Equivalised income and quintiles","body":"<p>A family of five on $150 000 is not as well off as a single person on $150 000. <b>Equivalised income</b> adjusts household income for size and makeup, so households can be compared fairly.</p><p>The ABS then ranks all households and divides them into five equal groups: <b>quintiles</b>. Comparing the shares of each quintile shows how evenly income is spread.</p>","mistakes":["Saying the top quintile is the richest 5%. It is the top 20%."],"check":{"q":"A quintile contains what share of households?","o":["5%","20%","25%"],"a":1,"why":"Five equal groups of 20%."}},{"title":"The Lorenz curve and the Gini coefficient","body":"<p>The Lorenz curve plots the cumulative share of income against the cumulative share of households. The further it bows from the line of equality, the more unequal the distribution.</p><p><b>Gini = A ÷ (A + B)</b>, where A is the area between the line of equality and the Lorenz curve, and B is the area under the curve. 0 = perfect equality; 1 = one household has everything.</p>","fig":"ginitrend","mistakes":["Saying a higher Gini means more equality."],"check":{"q":"Gini rises from 0.30 to 0.32. Income inequality has:","o":["Fallen","Risen","Not changed"],"a":1,"why":"A higher Gini means more inequality."},"src":[["Melbourne Institute, HILDA Statistical Report","https://melbourneinstitute.unimelb.edu.au/hilda/publications/hilda-statistical-reports"]]},{"title":"Causes of inequality","body":"<ul><li><b>Education and skills:</b> higher skills usually earn higher wages.</li><li><b>Wealth begets income:</b> assets earn rent, interest and dividends.</li><li><b>Housing:</b> owners have gained from rising prices; renters have not.</li><li><b>Age and life stage:</b> income peaks in middle age.</li><li><b>Location:</b> remote areas have fewer high-paid jobs.</li><li><b>Discrimination and opportunity:</b> unequal access to jobs or education.</li></ul>","mistakes":["Listing causes without explaining how each one changes the distribution."],"check":{"q":"Rising house prices tend to:","o":["Reduce wealth inequality","Increase wealth inequality between owners and renters","Have no effect"],"a":1,"why":"Owners gain wealth; renters do not."}},{"title":"How the tax-transfer system redistributes","body":"<p>Australia’s <b>progressive income tax</b> takes a larger share from higher incomes. <b>Transfer payments</b> (Age Pension, JobSeeker, Family Tax Benefit) are targeted at lower incomes. Public services like Medicare and public schools also help. Together they reduce inequality significantly: in 2019-20 the Gini was about 0.44 before taxes and transfers and 0.32 after.</p>","mistakes":["Saying GST is progressive. It takes a larger share of low incomes."],"check":{"q":"Which is a transfer payment?","o":["Company tax","JobSeeker Payment","GST"],"a":1,"why":"It is paid by government to individuals."},"src":[["ABS, Household Income and Wealth, Australia, 2019-20","https://www.abs.gov.au/statistics/economy/finance/household-income-and-wealth-australia/latest-release"]]},{"title":"Housing and the wealth divide","body":"<p>Housing is the biggest asset most households own. Rapid price growth has made it harder for young people to buy, and the gap between owners and renters has grown. Rent stress (paying more than 30% of income on rent) is most common among lower-income renters.</p>","case":"Perth home values rose strongly from 2023, fuelled by population growth and low supply, so even WA, once seen as affordable, now faces affordability pressures.","mistakes":["Ignoring the link between housing, wealth and intergenerational inequality."],"check":{"q":"A household is in rent stress if rent is more than about:","o":["10% of income","30% of income","60% of income"],"a":1,"why":"30% is the common benchmark."},"src":[["AIHW, Housing affordability","https://www.aihw.gov.au/reports/australias-welfare/housing-affordability"]]},{"title":"How unequal is Australian wealth?","body":"<p>The ABS Survey of Income and Housing (2019-20) found:</p><ul><li>The highest-wealth 20% of households held <b>62.8%</b> of all household wealth; the lowest 20% held <b>0.7%</b>.</li><li>Average net worth: <b>$3.27 million</b> for the top 20% vs <b>$35 100</b> for the bottom 20%, about 93 times as much.</li><li>Gini coefficients: 0.324 for disposable income, but 0.611 for wealth.</li></ul><p>Wealth builds on itself: assets earn income (rent, dividends) and often rise in value, while people without assets pay rent and struggle to save.</p>","fig":"c_quint","mistakes":["Using income and wealth figures interchangeably."],"check":{"q":"Which is more unequal in Australia?","o":["Income","Wealth","They are equal"],"a":1,"why":"Wealth Gini 0.611 vs income 0.324."},"src":[["ABS, Household Income and Wealth, 2019-20","https://www.abs.gov.au/statistics/economy/finance/household-income-and-wealth-australia/latest-release"],["ABS, Distribution of Household Income, Consumption and Wealth, 2019-20","https://www.abs.gov.au/statistics/economy/national-accounts/australian-national-accounts-distribution-household-income-consumption-and-wealth/2019-20"]]},{"title":"Comparing countries: the Gini","body":"<p>By World Bank estimates, Australia’s Gini (about 0.34) sits in the middle of developed countries: more unequal than Scandinavia (around 0.28) but less unequal than the United States (0.42) and far less than South Africa (0.63).</p><p>Be careful comparing numbers from different sources: the World Bank and the ABS use different methods and years.</p>","fig":"c_ginicountries","mistakes":["Comparing a World Bank Gini with an ABS Gini as if they were the same measure."],"check":{"q":"A country’s Gini falls from 0.40 to 0.35. Inequality has…","o":["Increased","Decreased","Stayed the same"],"a":1,"why":"A lower Gini means a more equal distribution."},"src":[["World Bank, Gini index","https://data.worldbank.org/indicator/SI.POV.GINI"]]}]},{"id":"t14","unit":2,"n":14,"title":"Government in the macroeconomy","lead":"The Commonwealth expects to raise $798.1 billion and spend $833.3 billion in 2026-27. Almost half its revenue comes from individual income tax.","notes":"<div class=\"tw\"><table><thead><tr><th>Spending area, 2026-27</th><th>Share (%)</th></tr></thead><tbody><tr><td>Social security and welfare</td><td>37</td></tr><tr><td>Health</td><td>16</td></tr><tr><td>Education</td><td>7</td></tr><tr><td>Defence</td><td>6</td></tr><tr><td>General public services</td><td>4</td></tr><tr><td>Other</td><td>30</td></tr></tbody></table></div><p>Spending exceeds revenue, so the Budget is in deficit (about $31.5 billion in 2026-27).</p><div class=\"tw\"><table><thead><tr><th>Classification</th><th>Meaning</th><th>Examples</th></tr></thead><tbody><tr><td>Direct</td><td>On income or profit, paid by the earner</td><td>Personal income tax, company tax</td></tr><tr><td>Indirect</td><td>On spending, collected by sellers</td><td>GST, excise</td></tr><tr><td>Progressive</td><td>Average rate rises with income</td><td>Personal income tax</td></tr><tr><td>Regressive</td><td>Larger share from low incomes</td><td>GST, tobacco excise</td></tr><tr><td>Proportional</td><td>Same rate at every income</td><td>Company tax (30%, or 25% base rate entities)</td></tr></tbody></table></div><h4>Resident income tax rates 2026-27 (ATO)</h4><div class=\"tw\"><table><thead><tr><th>Taxable income</th><th>Tax on this income</th></tr></thead><tbody><tr><td>$0 – $18 200</td><td>Nil</td></tr><tr><td>$18 201 – $45 000</td><td>15c for each $1 over $18 200</td></tr><tr><td>$45 001 – $135 000</td><td>$4020 + 30c for each $1 over $45 000</td></tr><tr><td>$135 001 – $190 000</td><td>$31 020 + 37c for each $1 over $135 000</td></tr><tr><td>$190 001 and over</td><td>$51 370 + 45c for each $1 over $190 000</td></tr></tbody></table></div><p>Excludes the 2% Medicare levy and offsets. Average rate = tax ÷ taxable income × 100. Marginal rate = rate on the next dollar.</p><div class=\"tw\"><table><thead><tr><th>Objective</th><th>Meaning</th></tr></thead><tbody><tr><td>Sustainable economic growth</td><td>Steady real GDP growth without inflation or environmental harm</td></tr><tr><td>Price stability</td><td>Inflation within 2–3%</td></tr><tr><td>Full employment</td><td>Unemployment as low as possible without rising inflation</td></tr><tr><td>More equitable income distribution</td><td>Reducing inequality through tax and transfers</td></tr></tbody></table></div><div class=\"tw\"><table><thead><tr><th>Situation</th><th>Demand management response</th></tr></thead><tbody><tr><td>Spending weak, unemployment rising</td><td>Expansionary: raise G, cut taxes; RBA cuts the cash rate</td></tr><tr><td>Spending strong, inflation rising</td><td>Contractionary: cut G, raise taxes; RBA raises the cash rate</td></tr><tr><td>Supply shock raises inflation and unemployment</td><td>A trade-off: fighting one worsens the other; targeted support can help</td></tr></tbody></table></div><h5>Roles of government</h5><ul><li>Australia is a <b>modified market economy</b>: markets allocate most resources, but government intervenes significantly.</li><li>The four economic roles: <b>providing public goods and services</b>; <b>regulating business</b>; <b>reducing income inequality</b>; and <b>stabilising the business cycle</b> (fiscal policy, using spending and taxes).</li><li>The Commonwealth runs fiscal policy and collects most tax. States run hospitals, schools, police and transport but rely on Commonwealth grants (including all GST revenue) for about half their income. Local councils raise most of their own money through rates.</li></ul><h5>Spending</h5><ul><li>Total Commonwealth expenses in 2026-27: <b>$833.3 billion</b>.</li><li>Three types: spending on <b>goods and services</b> (wages, running costs), <b>capital investment</b> (infrastructure), and <b>transfer payments</b> (pensions, allowances). Transfers count as household consumption in GDP when they are spent, not as government spending.</li></ul><h5>Tax concepts</h5><ul><li><b>Impact</b>: who the tax is levied on. <b>Incidence</b>: who bears the burden.</li><li>For direct taxes, impact and incidence fall on the same person; for indirect taxes the seller collects the tax but the buyer bears most of it.</li><li>Company tax is 30%, or 25% for base-rate entities with <b>turnover</b> under $50 million.</li><li>Personal income tax applies to wages, business and trust income, investment income (rent, interest, dividends), taxable payments such as the Age Pension and JobSeeker, and foreign income.</li><li><b>Marginal tax rate</b>: the tax on each extra dollar. A pay rise never leaves you worse off, because only the extra dollars are taxed at the higher rate.</li><li><b>Customs duties (tariffs)</b> are taxes on imports. Most Australian tariffs are now 5% or zero; US tariffs since 2025 have raised trade barriers globally.</li></ul>","figs":[["budget","Figure 14.1 · Budget 2026-27 revenue composition (Pitcher Partners summary, May 2026)",""],["c_gov3","Who does what.",""],["c_budget100","The Budget as $100.",""],["c_spenddetail","Inside social security and health.",""],["c_revenue","Where the revenue comes from.",""],["c_taxtypes","Progressive, proportional and regressive.",""]],"worked":"<div class=\"tw\"><table><thead><tr><th>Taxable income</th><th>Tax payable</th><th>Average rate</th><th>Marginal rate</th></tr></thead><tbody><tr><td>$30 000</td><td>(30 000 − 18 200) × 0.15 = <b>$1770</b></td><td><b>5.9%</b></td><td><b>15%</b></td></tr><tr><td>$80 000</td><td>4020 + 35 000 × 0.30 = <b>$14 520</b></td><td><b>18.2%</b></td><td><b>30%</b></td></tr></tbody></table></div><p>The average rate rises with income, so personal income tax is <b>progressive</b>.</p>","mcq":[{"q":"The largest source of Commonwealth revenue is:","o":["individual income tax.","company tax.","the GST.","excise duty."],"a":0,"why":"Individual income tax raises about 48% of revenue."},{"q":"The GST is best described as:","o":["a direct, progressive tax.","a direct, proportional tax on income.","an indirect tax that is regressive relative to income.","a tax on company profits."],"a":2,"why":"It is collected on spending, and low-income households spend more of their income."},{"q":"A tax is progressive when:","o":["everyone pays the same amount.","the average tax rate rises as income rises.","it is collected by businesses.","low-income earners pay a higher share of income."],"a":1,"why":"Progressive means the share of income taken rises with income."},{"q":"A person's marginal tax rate is the:","o":["total tax divided by total income.","rate of GST on their spending.","Medicare levy rate.","rate of tax paid on the next dollar earned."],"a":3,"why":"Total tax ÷ income is the average rate."},{"q":"Which is a macroeconomic objective of the Australian Government?","o":["Maximising company profits.","Balancing the budget every year.","Keeping inflation within the 2–3% target range.","Increasing the exchange rate."],"a":2,"why":"Price stability is one of the four objectives."},{"q":"Company tax at a flat 30% is an example of…","o":["A progressive tax","A proportional tax","A regressive tax","An indirect tax"],"a":1,"why":"The same rate applies at every level of profit."},{"q":"Which is a transfer payment?","o":["Building a hospital","Teachers’ salaries","The Age Pension","Buying defence equipment"],"a":2,"why":"Money paid to individuals with nothing produced in return."}],"di":{"stim":"<p>Use the 2026-27 resident tax rates and Figure 14.1.</p>","items":[{"t":"calc","q":"Calculate the income tax payable on $60 000.","marks":2,"inputs":[{"label":"Tax ($)","ans":8520,"tol":0}],"work":"$4020 + ($60 000 − $45 000) × 0.30 = $8520."},{"t":"calc","q":"Calculate the average tax rate on $60 000, and state the marginal rate.","marks":2,"inputs":[{"label":"Average rate (%)","ans":14.2,"tol":0.05},{"label":"Marginal rate (%)","ans":30,"tol":0}],"work":"8520 ÷ 60 000 × 100 = 14.2%. Marginal rate 30%."},{"t":"calc","q":"Calculate the tax payable and average rate on $200 000.","marks":2,"inputs":[{"label":"Tax ($)","ans":55870,"tol":0},{"label":"Average rate (%)","ans":27.9,"tol":0.05}],"work":"$51 370 + $10 000 × 0.45 = $55 870. 55 870 ÷ 200 000 = 27.9%."},{"t":"text","q":"Using your answers, explain why personal income tax is progressive.","marks":2,"key":[["Average rate rises from 14.2% to 27.9% as income rises",1],["That is the definition of a progressive tax",1]]},{"t":"text","q":"Classify each of the three largest revenue sources in Figure 14.1 as direct or indirect.","marks":2,"key":[["Individual income tax and company tax: direct",1],["GST: indirect",1]]},{"t":"text","q":"Explain why the GST is regressive even though everyone pays 10%.","marks":3,"key":[["Same 10% rate for all",1],["Low-income households spend a larger share of their income",1],["So GST takes a larger share of their income",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","q":"Outline the four macroeconomic objectives of the Australian Government.","marks":4,"key":[["Sustainable economic growth",1],["Price stability (2–3%)",1],["Full employment",1],["More equitable distribution of income",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"In 2026 an oil price rise lifted inflation while unemployment rose. Recommend one demand management policy and explain the trade-off.","marks":5,"key":[["Clear recommendation (e.g. keep rates tight, or targeted fiscal support)",1],["How the policy works",1],["Further explanation of the mechanism",1],["Trade-off: fighting inflation raises unemployment",1],["…or supporting jobs risks higher inflation",1]]}]},{"label":"Class review","items":[{"t":"text","q":"Identify the five largest Commonwealth spending categories.","marks":3,"key":[["Social security and welfare; health",1],["Education; defence",1],["General public services (or “other purposes”)",1]]},{"t":"text","q":"Distinguish between the impact and incidence of a tax, using GST as an example.","marks":3,"key":[["Impact: who the tax is levied on (the seller)",1],["Incidence: who bears the burden",1],["GST is collected by sellers but paid mostly by consumers",1]]},{"t":"text","q":"Explain why GST is said to be regressive in effect.","marks":2,"key":[["Low-income earners spend a larger share of income",1],["So GST takes a larger % of their income",1]]}]}],"dd":[{"title":"The Budget at a glance","body":"<p>Each year, the Treasurer delivers the Budget, setting out what the Commonwealth expects to collect and spend. The 2026-27 Budget forecast <b>revenue of $798.1 billion</b>, <b>spending of $833.3 billion</b> and a <b>deficit of $31.5 billion</b>. Gross debt was expected to pass $1 trillion.</p>","fig":"budget","mistakes":["Confusing deficit (one year) with debt (accumulated total)."],"check":{"q":"If spending is $833b and revenue is $798b, the budget is in:","o":["Surplus of $35b","Deficit of $35b","Balance"],"a":1,"why":"Spending exceeds revenue."},"src":[["Australian Government, Budget 2026-27","https://budget.gov.au/"]]},{"title":"The main taxes","body":"<div class=\"tw\"><table><thead><tr><th>Tax</th><th>Who pays</th><th>Type</th></tr></thead><tbody><tr><td>Personal income tax</td><td>Individuals on income</td><td>Progressive; the largest source of revenue</td></tr><tr><td>Company tax</td><td>Companies on profit (30%; 25% for small firms)</td><td>Proportional</td></tr><tr><td>GST</td><td>Consumers on most goods and services (10%)</td><td>Regressive in effect; revenue goes to the states</td></tr><tr><td>Excise</td><td>Fuel, alcohol and tobacco</td><td>Regressive in effect</td></tr><tr><td>Payroll tax</td><td>Large employers (state tax)</td><td>Proportional</td></tr></tbody></table></div>","fig":"taxrates","mistakes":["Saying people in a higher bracket pay the higher rate on all their income. It applies only to the portion above the threshold."],"check":{"q":"You earn $50 000. The 30% rate applies to:","o":["All $50 000","Only the income above $45 000","Only the first $18 200"],"a":1,"why":"Marginal rates apply to each slice."},"src":[["ATO, Tax rates – Australian residents","https://www.ato.gov.au/tax-rates-and-codes/tax-rates-australian-residents"]]},{"title":"Bracket creep and the Stage 3 tax cuts","body":"<p><b>Bracket creep</b> happens when wages rise with inflation, pushing people into higher brackets even though their real income has not grown. Average tax rates rise without any law changing.</p><p>From 1 July 2024, the revised Stage 3 tax cuts lowered the 19% rate to 16% and the 32.5% rate to 30%, and lifted the 37% and 45% thresholds to $135 000 and $190 000. The 16% rate fell to 15% from July 2026, and is due to fall to 14% from July 2027.</p>","fig":"stage3","mistakes":["Saying the tax cuts only helped high earners. The revised version gave the biggest percentage cut to middle incomes."],"check":{"q":"Bracket creep increases:","o":["Real wages","Average tax rates","Transfer payments"],"a":1,"why":"More of a person’s income falls in higher brackets."},"src":[["Treasury, Tax cuts to help Australians with the cost of living","https://treasury.gov.au/tax-cuts"]]},{"title":"Where the money goes","body":"<p>Social security and welfare is the largest spending area: the Age Pension, NDIS, family payments and JobSeeker. Health, education, defence and interest on debt follow. Grants to the states, including all GST revenue, fund schools, hospitals and roads.</p>","fig":"spend","mistakes":["Saying defence is the biggest expense. Welfare is far larger."],"check":{"q":"Which is the Commonwealth’s largest spending function?","o":["Defence","Social security and welfare","Education"],"a":1,"why":"It is about a third of total spending."},"src":[["Australian Government, Budget 2026-27","https://budget.gov.au/"]]},{"title":"Budget objectives and tools","body":"<p>Governments use the Budget to pursue three broad goals: <b>allocation</b> (providing public goods, correcting market failure), <b>distribution</b> (reducing inequality through taxes and transfers) and <b>stabilisation</b> (smoothing the business cycle).</p><ul><li><b>Automatic stabilisers:</b> tax revenue falls and welfare rises in downturns without any decision.</li><li><b>Discretionary changes:</b> deliberate decisions like stimulus payments or tax cuts.</li></ul>","mistakes":["Calling all budget changes discretionary."],"check":{"q":"JobSeeker spending rises automatically in a recession. This is:","o":["A discretionary change","An automatic stabiliser","Monetary policy"],"a":1,"why":"It happens with no new decision."}},{"title":"WA and the GST","body":"<p>The Commonwealth collects GST and gives all of it to the states. The Commonwealth Grants Commission recommends how to share it so each state can provide similar services. States with strong revenue of their own, like WA with its mining royalties, would normally get less.</p><p>After WA’s share fell to below 30 cents per dollar of GST collected there, the law was changed in 2018. Since 2024-25 no state receives less than 75% of an equal per-person share. This has greatly benefited WA and remains contentious with other states.</p>","mistakes":["Saying GST is a state tax. It is a Commonwealth tax distributed to the states."],"check":{"q":"Why did WA receive a small GST share before 2018?","o":["It has few people","High mining royalties boosted its own revenue","WA does not pay GST"],"a":1,"why":"Distribution offsets states’ own revenue capacity."},"src":[["Commonwealth Grants Commission, GST distribution","https://www.cgc.gov.au/"]]},{"title":"Inside the 2026-27 Budget","body":"<p>If the Budget were $100, $37.10 would go to social security and welfare, $16.40 to health, $6.90 to education and $6.20 to defence. The biggest single items are assistance to the aged ($115.6b) and to people with disabilities, including the NDIS ($98.1b).</p><p>On the revenue side, 48% comes from individuals’ income tax, 19% from company tax and 13% from GST.</p>","fig":"c_budget100","mistakes":["Saying defence is the largest spending area."],"check":{"q":"Which is larger in 2026-27?","o":["Assistance to the aged","Defence","Education"],"a":0,"why":"$115.6b vs $52.1b and $57.3b."},"src":[["Budget Paper No. 1, Statement 6: Expenses 2026-27","https://budget.gov.au/content/bp1/download/bp1_bs-6.pdf"],["Pitcher Partners, Federal Budget 2026-27 infographic","https://www.pitcher.com.au/insights/pdfs/federal-budget-2026-27-infographic/"]]}]}],"bank":{"mcq":[{"id":"p1m1","paper":1,"topic":"t1","unit":1,"q":"The opportunity cost of the WA Government spending $500 million on a new hospital is:","o":["the $500 million spent.","the next best alternative use of the funds, such as a new school.","the cost of running the hospital each year.","the taxes paid by households."],"a":1,"why":"Opportunity cost is the next best alternative given up."},{"id":"p1m2","paper":1,"topic":"t1","unit":1,"q":"A point outside an economy's PPF represents:","o":["efficient use of all resources.","unemployed resources.","the economy's current output.","a combination that cannot be produced with current resources and technology."],"a":3,"why":"Points beyond the frontier are unattainable."},{"id":"p1m3","paper":1,"topic":"t2","unit":1,"q":"Tea and coffee are substitutes. A rise in the price of tea will, ceteris paribus:","o":["increase the demand for coffee.","decrease the demand for coffee.","increase the supply of coffee.","increase the quantity demanded of tea."],"a":0,"why":"Buyers switch to the substitute."},{"id":"p1m4","paper":1,"topic":"t2","unit":1,"q":"A fall in the price of printers increases demand for ink cartridges. They are:","o":["substitutes.","inferior goods.","complements.","luxuries."],"a":2,"why":"Complements are used together."},{"id":"p1m5","paper":1,"topic":"t2","unit":1,"q":"Floods reduce avocado supply while demand rises. The new equilibrium shows:","o":["a lower price and higher quantity.","a lower price, quantity indeterminate.","a higher price, quantity indeterminate.","a higher price and higher quantity."],"a":2,"why":"Both shifts raise price; their effects on quantity offset."},{"id":"p1m6","paper":1,"topic":"t3","unit":1,"q":"A PED of 1.5 means demand is:","o":["perfectly inelastic.","price inelastic.","unit elastic.","price elastic."],"a":3,"why":"Greater than 1 is elastic."},{"id":"p1m7","paper":1,"topic":"t3","unit":1,"q":"A firm cuts its price by 10% and total revenue rises. Demand is:","o":["price elastic.","price inelastic.","unit elastic.","perfectly inelastic."],"a":0,"why":"Price and revenue moved in opposite directions."},{"id":"p1m8","paper":1,"topic":"t4","unit":1,"q":"Which creates a deadweight loss in an otherwise efficient competitive market?","o":["An increase in demand.","A per-unit tax.","New technology that lowers costs.","The entry of new firms."],"a":1,"why":"A tax pushes output below the efficient level."},{"id":"p1m9","paper":1,"topic":"t4","unit":1,"q":"A minimum price set above equilibrium will cause:","o":["a shortage.","a surplus.","the market to clear.","a fall in quantity supplied."],"a":1,"why":"Quantity supplied exceeds quantity demanded."},{"id":"p1m10","paper":1,"topic":"t5","unit":1,"q":"Which is a source of market power?","o":["Barriers to entry.","A large number of small sellers.","Identical products.","Perfect information."],"a":0,"why":"Barriers keep competitors out."},{"id":"p1m11","paper":1,"topic":"t6","unit":1,"q":"Which is an example of a positive externality?","o":["Traffic congestion.","Second-hand smoke.","Noise from an airport.","Neighbours are protected when a household is vaccinated."],"a":3,"why":"Third parties gain a benefit."},{"id":"p1m12","paper":1,"topic":"t7","unit":1,"q":"Fish stocks in international waters are best classified as a:","o":["public good.","club good.","common resource.","private good."],"a":2,"why":"Rival and non-excludable."},{"id":"p1m13","paper":1,"topic":"t8","unit":2,"q":"Which is a leakage from the circular flow?","o":["Exports.","Imports.","Investment.","Government spending."],"a":1,"why":"Spending on imports leaves the domestic flow."},{"id":"p1m14","paper":1,"topic":"t8","unit":2,"q":"The expenditure approach to GDP is:","o":["C + S + T.","C + I + G + X + M.","I + G + X − S.","C + I + G + (X − M)."],"a":3,"why":"Imports are subtracted."},{"id":"p1m15","paper":1,"topic":"t9","unit":2,"q":"Real GDP per capita will fall when:","o":["population grows faster than real GDP.","nominal GDP rises.","the inflation rate falls.","real GDP grows faster than population."],"a":0,"why":"Output is shared among more people."},{"id":"p1m16","paper":1,"topic":"t10","unit":2,"q":"The RBA watches the trimmed mean because it:","o":["includes only goods.","is published once a year.","removes extreme price changes to show the persistent trend.","is always lower than headline."],"a":2,"why":"It shows underlying inflation."},{"id":"p1m17","paper":1,"topic":"t10","unit":2,"q":"The CPI rises from 110.0 to 114.4. Inflation is:","o":["4
