000 − 24 000) × ($72 − $54) = $54 000."},{"t":"text","q":"Explain why the price floor is allocatively inefficient.","marks":2,"key":[["Quantity traded falls below equilibrium",1],["Units valued above their cost are not traded, so total surplus is not maximised",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","diagram":true,"q":"Using a demand and supply diagram, demonstrate the effect of a per-unit subsidy on consumer surplus, producer surplus and market efficiency.","marks":6,"key":[["Supply shifts down by the subsidy",1],["Lower consumer price, higher producer price, higher quantity",1],["Diagram fully labelled",1],["CS rises",1],["PS rises",1],["Cost to government exceeds the gains: DWL from overproduction",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"A state government proposes capping rents below the market rent. Explain two likely consequences for the rental market.","marks":4,"key":[["A shortage: quantity demanded exceeds quantity supplied",1],["Explained with reference to the cap",1],["A second consequence (poorer maintenance, landlords exit, black-market payments, DWL)",1],["Second consequence explained",1]]}]},{"label":"Class review","items":[{"t":"calc","q":"You are willing to pay $15 for a ticket but pay $11. What is your consumer surplus?","marks":1,"inputs":[{"label":"Consumer surplus ($)","ans":4,"tol":0}],"work":"$15 − $11 = $4."},{"t":"calc","q":"You buy a puppy for $1500 and your consumer surplus is $2500. How much were you willing to pay?","marks":1,"inputs":[{"label":"Willing to pay ($)","ans":4000,"tol":0}],"work":"$1500 + $2500 = $4000."},{"t":"text","q":"Discuss whether price ceilings improve equity.","marks":4,"key":[["Aim: make goods affordable for low-income earners",1],["Causes a shortage, so not everyone can buy",1],["No guarantee low-income people get the good; black markets",1],["Deadweight loss; better tools (transfers) exist, with a judgement",1]]},{"t":"text","q":"Distinguish between vertical and horizontal equity.","marks":2,"key":[["Vertical: different treatment for different circumstances (redistribution)",1],["Horizontal: same treatment / equal opportunity for those alike",1]]}]}],"dd":[{"title":"Consumer and producer surplus in plain words","body":"<p>If you were willing to pay $15 for a concert ticket but paid $10, you gained $5 of <b>consumer surplus</b>. If the band would have played for $6 a ticket but received $10, they gained $4 of <b>producer surplus</b>. Add these up for every buyer and seller and you get the triangles on the diagram.</p>","fig":"surplus","mistakes":["Swapping the triangles: CS is above price, PS is below.","Forgetting the ½ in the triangle area."],"check":{"q":"A buyer values a game at $90 and pays $70. Consumer surplus is:","o":["$20","$70","$160"],"a":0,"why":"$90 − $70 = $20."}},{"title":"Allocative efficiency","body":"<p>A market is <b>allocatively efficient</b> when it produces the quantity society values most: where the value of the last unit to buyers (marginal benefit) equals the cost of producing it (marginal cost). In a competitive market with no externalities, this is the equilibrium.</p><ul><li>Produce less → units worth more than they cost are lost (DWL).</li><li>Produce more → units cost more than they are worth (DWL).</li></ul>","mistakes":["Confusing efficiency with fairness. An efficient outcome can still be unequal."],"check":{"q":"Total surplus is maximised where:","o":["Price is lowest","MB = MC","Producer surplus is largest"],"a":1,"why":"That is the efficient quantity."}},{"title":"Taxes and subsidies in Australia","body":"<div class=\"tw\"><table><thead><tr><th>Measure</th><th>Effect on the market</th><th>Australian example</th></tr></thead><tbody><tr><td>Excise (tax per unit)</td><td>Price up, quantity down, DWL</td><td>Fuel, alcohol and tobacco excise</td></tr><tr><td>GST (10% of price)</td><td>Prices up across most goods</td><td>Collected by businesses, paid by consumers</td></tr><tr><td>Subsidy</td><td>Price down, quantity up</td><td>Child Care Subsidy, subsidised university places</td></tr><tr><td>Rebate</td><td>Lowers the price paid</td><td>Energy bill rebates (2023–25)</td></tr></tbody></table></div><p>Governments accept some DWL from taxes because they need revenue for services. The aim is to raise it with as little DWL as possible, which is why goods with inelastic demand are often taxed.</p>","case":"When Commonwealth electricity rebates ended, the ABS recorded electricity prices up 13.2% in the year to August 2026. The rebate had been lowering the price households paid, not the cost of supply.","mistakes":["Saying a subsidy has no cost. Taxpayers fund it."],"check":{"q":"Compared with no tax, a per-unit tax on a good with inelastic demand creates:","o":["A large DWL","A small DWL","No change in quantity"],"a":1,"why":"Quantity falls only a little, so little surplus is lost."},"src":[["ABS, Consumer Price Index, Australia, August 2026","https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/aug-2026"]]},{"title":"Rent caps: a price ceiling debate","body":"<p>Rent caps limit how much landlords can charge or how much rents can rise. Supporters say they protect tenants from sharp increases during a housing shortage. Economic theory predicts trade-offs:</p><ul><li>A shortage: more people want rentals than are offered at the capped price.</li><li>Less new supply over time, as investors earn less.</li><li>Poorer maintenance, waiting lists and side payments.</li></ul><p>Most Australian states limit <i>how often</i> rent can rise (for example once a year) rather than capping the level. This softens the trade-offs.</p>","fig":"ceiling","mistakes":["Drawing a ceiling above equilibrium. It only matters (binds) when below.","Forgetting the DWL triangle."],"check":{"q":"A binding rent cap is most likely to cause:","o":["A surplus of rentals","A shortage of rentals","Higher rents"],"a":1,"why":"Quantity demanded exceeds quantity supplied at the capped rent."}},{"title":"The minimum wage as a price floor","body":"<p>The <b>Fair Work Commission</b> reviews minimum wages every year. From 1 July 2026, the national minimum wage rose 4.75% to <b>$26.44 an hour</b> ($1004.90 for a 38-hour week).</p><p>On a diagram, a minimum wage above the market wage is a price floor in the labour market. Theory predicts more people want work than firms want to hire. Real-world studies find that moderate increases have had small effects on jobs, because higher pay can also lift spending, reduce staff turnover and raise productivity.</p>","fig":"minwage","case":"Many Year 11 students work casual jobs paid under junior rates, which are set as a percentage of the adult minimum wage, so they also rose on 1 July 2026.","mistakes":["Saying any minimum wage causes unemployment. It must be above the equilibrium wage to bind."],"check":{"q":"A minimum wage set below the market wage will:","o":["Cause unemployment","Have no effect","Cause a shortage of workers"],"a":1,"why":"A price floor below equilibrium does not bind."},"src":[["Fair Work Ombudsman, Minimum wages increase from 1 July 2026","https://www.fairwork.gov.au/about-us/workplace-laws/annual-wage-review/annual-wage-review-2026"],["Mondaq, Fair Work Commission increases minimum wage rates by 4.75% (June 2026)","https://www.mondaq.com/australia/employee-rights-labour-relations/1796768/fair-work-commission-increases-minimum-wage-rates-by-475"]]},{"title":"Case study: taxis, licences and Uber","body":"<p>For decades, state governments capped the number of taxi licences. Supply couldn’t grow with demand, so fares were high, wait times were long and licence values soared. The Productivity Commission criticised these limits as having no sound justification.</p><p>When ride-share services arrived around 2014, they effectively added supply. States then legalised ride-sharing and many paid compensation to licence holders whose licences lost value.</p>","fig":"c_taxi","mistakes":["Saying a restriction makes the market efficient because it is “regulated”."],"check":{"q":"Capping taxi licences most directly causes…","o":["A surplus of rides","Higher fares and a deadweight loss","Lower fares"],"a":1,"why":"Supply is restricted below the efficient quantity."},"src":[["Productivity Commission, Regulation of the taxi industry","https://www.pc.gov.au/research/supporting/taxi-regulation"]]},{"title":"Equity: Perth’s water","body":"<p>Water is essential, so the WA Government sets prices instead of leaving them to the market. Households pay a low price for the first block of water and higher prices for larger amounts (an increasing block tariff). This keeps basic water affordable while discouraging waste.</p><p>A purely efficient market price might be higher and would take a much bigger share of low-income households’ budgets. Here the government chooses equity over pure efficiency.</p>","mistakes":["Assuming the government’s goal is always efficiency."],"check":{"q":"A cheap first block of water mainly promotes…","o":["Allocative efficiency","Vertical equity","Higher water use"],"a":1,"why":"It protects households for whom essentials take a larger share of income."},"src":[["Water Corporation, Water prices and charges","https://www.watercorporation.com.au/Help-and-advice/Bills-and-account/Water-prices-and-charges"]]}]},{"id":"t5","unit":1,"n":5,"title":"Market failure – market power","lead":"Market failure occurs when markets do not allocate resources efficiently, equitably or sustainably. A firm with market power restricts output below the efficient level.","notes":"<ul><li><b>Imperfect competition:</b> few firms or differentiated products, barriers to entry, imperfect information, price makers. Types: monopolistic competition (cafés), oligopoly (supermarkets, banks), monopoly (some utility networks).</li><li><b>Market power:</b> the ability of a firm to influence its price.</li><li><b>Causes:</b> barriers to entry (economies of scale, high start-up costs, patents and licences, control of a resource, brand loyalty); mergers; collusion; product differentiation and network effects.</li><li><b>Effect:</b> output restricted and price raised; units where MB &gt; MC are not produced, creating a DWL; part of CS is transferred to the firm.</li></ul><div class=\"tw\"><table><thead><tr><th>Policy</th><th>How it works</th><th>Australian example</th></tr></thead><tbody><tr><td>Legislation</td><td>Bans cartels, misuse of market power and anti-competitive mergers</td><td><i>Competition and Consumer Act 2010</i>, enforced by the ACCC</td></tr><tr><td>Regulation</td><td>Oversees prices where competition is not possible</td><td>Price regulation of electricity and gas networks</td></tr><tr><td>Deregulation</td><td>Removes rules restricting entry</td><td>Opening domestic aviation and taxi markets</td></tr><tr><td>Codes of conduct</td><td>Rules for dealings between powerful firms and suppliers</td><td>The Food and Grocery Code</td></tr></tbody></table></div><h5>How firms gain market power</h5><ul><li>Control of a scarce resource (mining, forestry); a technological advantage; <b>patents</b> (a standard Australian patent lasts up to <b>20 years</b>); brand proliferation, big advertising budgets and controlling retail outlets.</li><li>Examples of market power in Australia: Water Corporation and Synergy (government-owned), Australia Post (letters), Coles and Woolworths, Qantas and Virgin.</li></ul><h5>Restrictive trade practices</h5><ul><li><b>Horizontal agreements</b> are between firms at the same stage (e.g. two retailers agreeing prices).</li><li><b>Vertical agreements</b> are between firms at different stages (e.g. a manufacturer telling retailers what to charge).</li></ul><div class=\"tw\"><table><thead><tr><th>Practice</th><th>What it means</th></tr></thead><tbody><tr><td>Cartel / price fixing</td><td>Competitors agree on prices instead of competing</td></tr><tr><td>Market sharing</td><td>Rivals divide customers or areas between them</td></tr><tr><td>Bid rigging (collusive tendering)</td><td>Firms agree who will win a tender</td></tr><tr><td>Misuse of market power</td><td>A powerful firm acts to substantially lessen competition</td></tr><tr><td>Resale price maintenance</td><td>A supplier sets the minimum price a retailer may charge</td></tr><tr><td>Exclusive dealing</td><td>A supplier restricts who a business can deal with</td></tr><tr><td>Anti-competitive merger</td><td>A merger that substantially lessens competition</td></tr></tbody></table></div>","figs":[["power","Figure 5.1 · Effect of market power on efficiency","<p>Competitive output is Qc at Pc. A firm with market power restricts output to Qm and charges Pm. The red triangle is surplus lost entirely.</p>"],["c_pricereg","Price regulation of a monopoly.",""]],"worked":"<p>Demand P = 100 − Q; cost of supply P = 20 + Q (Q in thousands). A dominant firm restricts output to 30 000.</p><ol><li>Competitive: Qc = 40 000, Pc = $60.</li><li>With market power: Pm = 100 − 30 = <b>$70</b>.</li><li>Cost of the last unit at Qm = $50.</li><li>DWL = ½ × 10 000 × ($70 − $50) = <b>$100 000</b>.</li><li>CS transferred to the firm = $10 × 30 000 = <b>$300 000</b>.</li></ol>","mcq":[{"q":"Which of the following is a barrier to entry?","o":["Perfect information.","Identical products.","A patent on a new medicine.","A large number of small sellers."],"a":2,"why":"A patent legally stops other firms from making the product."},{"q":"Compared with perfect competition, a firm with market power will usually:","o":["charge a higher price and produce less.","charge a lower price and produce more.","charge the same price and produce less.","charge a higher price and produce more."],"a":0,"why":"Restricting output lets the firm raise its price."},{"q":"Which body enforces Australia's competition law?","o":["The Reserve Bank of Australia.","The Australian Taxation Office.","The Australian Bureau of Statistics.","The Australian Competition and Consumer Commission."],"a":3,"why":"The ACCC enforces the Competition and Consumer Act."},{"q":"Market power creates a deadweight loss because:","o":["prices fall below the cost of production.","output is restricted below the level where MB = MC.","the government collects revenue from the firm.","consumers buy more than the efficient quantity."],"a":1,"why":"Units that buyers value above their cost are never produced."},{"q":"Deregulation refers to:","o":["the government taking ownership of an industry.","introducing new taxes on large firms.","removing government rules that restrict entry or competition.","fixing the maximum price firms may charge."],"a":2,"why":"Deregulation removes restrictions so new competitors can enter."},{"q":"A manufacturer insists that retailers never sell its product below $99. This is…","o":["A horizontal agreement","Resale price maintenance","Market sharing","A merger"],"a":1,"why":"A supplier setting a minimum resale price is RPM, a vertical practice."}],"di":{"stim":"<p>Market shares in a national grocery market (hypothetical).</p><div class=\"tw\"><table><thead><tr><th>Firm</th><th>Share (%)</th></tr></thead><tbody><tr><td>Firm A</td><td>38</td></tr><tr><td>Firm B</td><td>29</td></tr><tr><td>Firm C</td><td>10</td></tr><tr><td>Firm D</td><td>8</td></tr><tr><td>All others</td><td>15</td></tr></tbody></table></div><p><i>Opening a new chain requires large distribution centres, long-term leases on prime sites and contracts with thousands of suppliers.</i></p>","items":[{"t":"calc","q":"Calculate the combined market share of the two largest firms.","marks":1,"inputs":[{"label":"Share (%)","ans":67,"tol":0}],"work":"38% + 29% = 67%."},{"t":"text","q":"Identify the market structure shown. Justify with reference to the data.","marks":2,"key":[["Oligopoly",1],["A few large firms dominate; the top two hold 67%",1]]},{"t":"text","q":"Outline two barriers to entry evident in the stimulus.","marks":2,"key":[["High capital costs for distribution centres",1],["Supplier contracts and leases on prime sites (economies of scale)",1]]},{"t":"text","diagram":true,"q":"Using a diagram, explain how market power in this market could reduce market efficiency.","marks":5,"key":[["Diagram shows competitive outcome (Pc, Qc)",1],["…and market-power outcome (Pm, Qm)",1],["Firms restrict output and raise price",1],["Units where MB > MC are not produced: DWL",1],["Consumer surplus transferred to firms",1]]},{"t":"text","q":"Recommend one government policy to reduce the effects of market power here. Justify it.","marks":3,"key":[["Relevant policy (ACCC enforcement, grocery code, easing entry)",1],["How it works",1],["Justification linked to prices or efficiency",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","q":"Explain two causes of market power, using an Australian example for each.","marks":4,"key":[["First cause explained",1],["Australian example",1],["Second cause explained",1],["Australian example",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Explain how deregulation of an industry can improve market efficiency.","marks":4,"key":[["Deregulation removes barriers to entry",1],["New firms enter; competition increases",1],["Prices fall and output rises towards the efficient level",1],["DWL shrinks; example such as domestic aviation",1]]}]},{"label":"Class review","items":[{"t":"text","q":"Explain two ways a firm can gain market power.","marks":4,"key":[["First way named",1],["Explained as a barrier to entry",1],["Second way named",1],["Explained",1]]},{"t":"text","q":"Explain how price regulation can reduce the deadweight loss of a monopoly.","marks":3,"key":[["Monopoly restricts output, charges above-competitive price",1],["Regulated lower price increases quantity",1],["Moves output closer to efficient level, raising total surplus",1]]}]}],"dd":[{"title":"The spectrum of market structures","body":"<p>Markets range from many small competing firms to one firm with no rivals. The fewer the firms and the higher the barriers to entry, the more market power each firm has.</p>","fig":"spectrum","mistakes":["Calling any big firm a monopoly. A market with two or three dominant firms is an oligopoly."],"check":{"q":"Australia’s big four banks are an example of:","o":["Perfect competition","Oligopoly","Monopoly"],"a":1,"why":"A few large firms dominate the market."}},{"title":"Barriers to entry","body":"<ul><li><b>Economies of scale:</b> large firms have lower costs per unit, so newcomers cannot compete on price.</li><li><b>High start-up costs:</b> building a mobile network or a supermarket distribution centre costs billions.</li><li><b>Legal barriers:</b> patents, licences and government-granted rights.</li><li><b>Control of resources:</b> owning the best sites or key supply.</li><li><b>Brand loyalty and network effects:</b> people stay with the platform their friends use.</li></ul>","mistakes":["Listing barriers without saying how each one keeps competitors out."],"check":{"q":"A drug company’s 20-year patent is a:","o":["Natural barrier","Legal barrier","Network effect"],"a":1,"why":"Patent law gives exclusive rights."}},{"title":"Why market power causes a deadweight loss","body":"<p>A firm with market power can raise its price above the competitive level. To do that, it must sell less. Units that buyers value above their cost of production are no longer made, so total surplus shrinks. Part of what is left is moved from consumers to the firm as higher profit.</p>","fig":"power","mistakes":["Saying a firm with market power can charge \"any price it likes\". It is still limited by demand."],"check":{"q":"Compared with competition, market power leads to:","o":["Higher price, higher output","Higher price, lower output","Lower price, lower output"],"a":1,"why":"Output is restricted so price can be raised."}},{"title":"The ACCC and competition law","body":"<p>The <b>Australian Competition and Consumer Commission (ACCC)</b> enforces the <i>Competition and Consumer Act 2010</i>. The Act bans:</p><ul><li><b>Cartels:</b> rivals agreeing to fix prices, share markets or rig bids.</li><li><b>Misuse of market power:</b> conduct by a powerful firm that substantially lessens competition.</li><li><b>Anti-competitive mergers:</b> the ACCC reviews mergers and can oppose them.</li><li><b>Misleading conduct:</b> false claims about prices or products.</li></ul>","mistakes":["Confusing the ACCC (competition) with the RBA (monetary policy) or ASIC (financial markets)."],"check":{"q":"Two petrol stations secretly agree to set the same price. This is:","o":["A merger","A cartel","Price discrimination"],"a":1,"why":"Agreeing with rivals on price is cartel conduct."},"src":[["ACCC, Competition and Consumer Act and the ACCC’s role","https://www.accc.gov.au/about-us/legislation/competition-and-consumer-act-2010"]]},{"title":"Case study: the supermarkets inquiry","body":"<p>In March 2025, the ACCC released the final report of its supermarkets inquiry. It found that Coles and Woolworths, with about 38% and 29% of national grocery sales, form an oligopoly, with Aldi as the main \"hard discounter\" competitor. Barriers to entry are high.</p><p>The ACCC made 20 recommendations, including clearer unit pricing and package-size information to tackle \"shrinkflation\", removing planning barriers for new stores, support for remote community stores, and changes to the Food and Grocery Code to balance supermarkets’ buying power with farmers. The government did not support giving the ACCC power to break up the major chains.</p>","mistakes":["Saying the ACCC found price gouging. It found weak competition, not illegal conduct."],"check":{"q":"Why might removing planning barriers help grocery competition?","o":["It lowers taxes","It makes it easier for new stores to enter","It raises supermarket profits"],"a":1,"why":"Easier entry adds competitors."},"src":[["InDaily (AAP), ACCC supermarket inquiry final report, 21 March 2025","https://www.indailysa.com.au/news/just-in/2025/03/21/accc-supermarket-report"]]},{"title":"Case study: airline deregulation","body":"<p>Until 1990, the \"two-airline policy\" meant only Ansett and Australian Airlines could fly major domestic routes. Fares were regulated and similar. Deregulation removed the barrier to entry. New airlines entered (Compass in 1990, and later Virgin Blue in 2000), fares fell and passenger numbers grew strongly.</p><p>Today the market is again concentrated, which shows that deregulation alone does not guarantee lasting competition.</p>","mistakes":["Assuming deregulation always lowers prices. It works through entry, which may not last."],"check":{"q":"Deregulation improves efficiency mainly by:","o":["Removing barriers so new firms can enter","Setting a maximum price","Taxing the incumbent firm"],"a":0,"why":"More competition pushes price towards cost."}},{"title":"Case study: patents and Lipitor","body":"<p>Lipitor, a cholesterol drug made by Pfizer, was protected by patent for years and became one of the best-selling medicines ever. While the patent lasted, no one else could sell the same drug, so Pfizer had a monopoly. When the patent expired, generic versions entered and prices fell sharply.</p><p>Patents are a trade-off: monopoly profits reward risky research and development, but consumers pay more while the patent lasts.</p>","mistakes":["Saying patents are always bad. They create an incentive to innovate.","Using 17 years: standard patents last up to 20 years (pharmaceutical patents can be extended)."],"check":{"q":"When a drug’s patent expires, we expect…","o":["Higher prices","Generic competitors and lower prices","No change"],"a":1,"why":"The legal barrier to entry is removed."},"src":[["IP Australia, Patents: how long they last","https://www.ipaustralia.gov.au/patents/understanding-patents/types-of-patents/standard-patent"]]}]},{"id":"t6","unit":1,"n":6,"title":"Market failure – externalities","lead":"When a third party bears a cost or gains a benefit the price ignores, the market produces the wrong quantity.","notes":"<ul><li><b>Externality:</b> a cost or benefit to a third party not reflected in the market price.</li><li>MSC = MPC + external cost. MSB = MPB + external benefit.</li><li>Social optimum: MSB = MSC. The market produces where MPB = MPC.</li></ul><div class=\"tw\"><table><thead><tr><th>Type</th><th>Example</th><th>Result</th></tr></thead><tbody><tr><td>Negative production</td><td>Factory emissions, mine dust</td><td>MSC > MPC: overproduction</td></tr><tr><td>Negative consumption</td><td>Smoking, alcohol misuse</td><td>MPB > MSB: overconsumption</td></tr><tr><td>Positive production</td><td>Research, staff training</td><td>Underproduction</td></tr><tr><td>Positive consumption</td><td>Vaccination, education</td><td>MSB > MPB: underconsumption</td></tr></tbody></table></div><h4>Policy options</h4><ul><li><b>Pigouvian tax</b> equal to the external cost (tobacco excise).</li><li><b>Subsidy</b> equal to the external benefit (university places, free vaccines).</li><li><b>Regulation:</b> limits, standards, bans.</li><li><b>Market-based schemes:</b> tradeable permits or credits (the Safeguard Mechanism).</li><li><b>Information campaigns</b> and <b>government provision</b>.</li></ul><h5>Spillovers in everyday life</h5><ul><li>An externality is an <b>unintended</b> cost or benefit to a <b>third party</b> that the market price ignores.</li><li>Negative: a Sydney–Perth flight costs about the same to the passenger, but nearby residents bear noise and everyone bears emissions; driving to work adds congestion and pollution.</li><li>Positive: gym members are healthier, which helps employers and the health system; university graduates raise productivity for everyone.</li></ul><h5>Merit and demerit goods</h5><ul><li><b>Merit goods</b> are good for the consumer and society, and tend to be underconsumed (education, vaccinations). <b>Demerit goods</b> harm the consumer and society, and tend to be overconsumed (cigarettes, junk food).</li></ul><h5>Why externalities happen, and the fix</h5><ul><li>Often a lack of <b>property rights</b>: nobody owns the atmosphere or the oceans, so nobody is charged for damaging them.</li><li>Governments <b>internalise</b> the externality, forcing the market to count the external cost or benefit.</li></ul>","figs":[["extern","Figure 6.1 · Negative production externality","<p>Firms ignore the external cost and supply along MPC, producing Qm. Units between Q* and Qm cost society more than they are worth to buyers.</p>"],["c_internalise","Tax and subsidy as corrections.",""],["c_carbon","A carbon tax in two markets.",""],["c_temp","The greatest market failure: climate change.",""]],"worked":"<p>MPB = 100 − Q; MPC = 20 + Q; each unit causes $20 of pollution (Q in thousands).</p><ol><li>Market: Qm = 40 000, Pm = $60.</li><li>MSC = 40 + Q.</li><li>Optimum: Q* = 30 000, P* = $70.</li><li>DWL = ½ × 10 000 × $20 = <b>$100 000</b>.</li><li>A $20 tax shifts MPC to MSC and removes the DWL.</li></ol>","mcq":[{"q":"An externality is best described as:","o":["a cost paid by the producer.","a cost or benefit to a third party not reflected in price.","a tax placed on imports.","the profit earned above normal profit."],"a":1,"why":"Externalities fall on people outside the transaction."},{"q":"A positive consumption externality in vaccinations means the free market will:","o":["overproduce vaccinations.","produce the socially optimal quantity.","underproduce vaccinations.","charge a price above MSB."],"a":2,"why":"People ignore the benefit to others, so they buy too few."},{"q":"Where a negative production externality exists:","o":["MSC is greater than MPC.","MSB is greater than MPB.","MPC is greater than MSC.","MSB equals MSC at the market quantity."],"a":0,"why":"Society bears the private cost plus the external cost."},{"q":"To correct a positive externality, the most appropriate policy is a:","o":["tax equal to the external cost.","price ceiling.","ban on the good.","subsidy equal to the external benefit."],"a":3,"why":"A subsidy raises output towards the social optimum."},{"q":"WA's container deposit scheme pays people to return drink containers. This is:","o":["a policy to correct a negative externality.","a price floor.","a policy to correct market power.","a public good."],"a":0,"why":"It reduces litter, a negative externality of drink consumption."},{"q":"Your neighbour keeps a beautiful garden that raises your home’s value. This is…","o":["A negative externality","A positive externality","A demerit good","A public good"],"a":1,"why":"You receive an unintended benefit."},{"q":"A carbon tax will most likely…","o":["Decrease demand for solar energy","Increase demand for alternative energy","Lower the price of coal power","Increase supply of coal power"],"a":1,"why":"Alternative energy becomes relatively cheaper."}],"di":{"stim":"<p>A market for a good that causes pollution (hypothetical).</p><div class=\"tw\"><table><thead><tr><th>Quantity ('000)</th><th>MPB ($)</th><th>MPC ($)</th><th>External cost ($)</th></tr></thead><tbody><tr><td>10</td><td>100</td><td>20</td><td>20</td></tr><tr><td>20</td><td>90</td><td>30</td><td>20</td></tr><tr><td>30</td><td>80</td><td>40</td><td>20</td></tr><tr><td>40</td><td>70</td><td>50</td><td>20</td></tr><tr><td>50</td><td>60</td><td>60</td><td>20</td></tr></tbody></table></div>","items":[{"t":"calc","q":"Identify the market equilibrium quantity.","marks":1,"inputs":[{"label":"Quantity ('000)","ans":50,"tol":0}],"work":"MPB = MPC = $60 at 50 000 units."},{"t":"calc","q":"Calculate MSC and identify the socially optimal quantity.","marks":3,"inputs":[{"label":"Optimal quantity ('000)","ans":40,"tol":0}],"work":"MSC = MPC + $20 = $40, $50, $60, $70, $80. MSB = MSC = $70 at 40 000 units."},{"t":"calc","q":"Calculate the deadweight loss caused by the externality.","marks":3,"inputs":[{"label":"DWL ($)","ans":100000,"tol":0}],"work":"½ × (50 000 − 40 000) × $20 = $100 000."},{"t":"text","q":"Explain how a per-unit tax could correct this market failure, and state the size of the tax.","marks":3,"key":[["Tax of $20 per unit",1],["Raises MPC to MSC so firms pay the external cost",1],["Output falls to 40 000 at $70 and the DWL is removed",1]]},{"t":"text","q":"Outline one limitation of using a tax to correct this externality.","marks":2,"key":[["Limitation identified (hard to measure, inelastic demand, regressive, revenue not to victims)",1],["Explained",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","diagram":true,"q":"Using a diagram, explain why the free market underproduces tertiary education.","marks":5,"key":[["MSB above MPB on the diagram",1],["Market quantity below Q*",1],["DWL shown",1],["External benefits (productivity, tax revenue) ignored by individuals",1],["So education is underconsumed",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Evaluate regulation as a policy to reduce carbon emissions from large industrial facilities.","marks":4,"key":[["A strength (certainty of emission levels, simplicity)",1],["A second strength or further detail",1],["A weakness (no incentive beyond limit, monitoring costs, not least-cost)",1],["A supported judgement",1]]}]},{"label":"Class review","items":[{"t":"text","q":"Explain why a negative externality leads to overproduction. Refer to private and social costs.","marks":4,"key":[["Producer considers only private costs",1],["Social cost = private + external cost",1],["Market output Qe exceeds optimal Qo",1],["Results in deadweight loss",1]]},{"t":"text","q":"Explain how a subsidy can correct a positive consumption externality.","marks":3,"key":[["Subsidy = external benefit",1],["Lowers price consumers pay / shifts private demand to social demand",1],["Consumption rises to the social optimum",1]]}]}],"dd":[{"title":"Private and social costs","body":"<p>A firm decides how much to produce by looking at its <b>private</b> costs: wages, materials, power. Society also bears <b>external</b> costs the firm ignores: pollution, noise, congestion, health effects.</p><p><b>Social cost = private cost + external cost.</b> When external costs exist, the market produces too much. The same logic applies to benefits: social benefit = private benefit + external benefit, and too little is produced.</p>","fig":"extern","mistakes":["Saying the producer pays the external cost. By definition, a third party does."],"check":{"q":"Diesel fumes from trucks harming people near a highway are:","o":["A private cost","An external cost","A fixed cost"],"a":1,"why":"Third parties bear the cost."}},{"title":"The Safeguard Mechanism","body":"<p>Australia’s Safeguard Mechanism covers large industrial facilities emitting more than 100 000 tonnes of greenhouse gases a year, such as mines, LNG plants and smelters. Each has an emissions limit (baseline) that falls by about 4.9% a year to 2030.</p><p>Facilities that beat their baseline earn credits they can sell; those that exceed it must buy credits. This is a <b>market-based</b> scheme: it puts a price on emissions so firms find the cheapest ways to cut them.</p>","case":"Many of WA’s large LNG and mining facilities are covered, so the scheme matters a lot for the WA economy.","mistakes":["Calling it a tax. It is a baseline-and-credit scheme."],"check":{"q":"Why might a credit scheme be more efficient than one fixed rule for all firms?","o":["Firms that can cut cheaply do more of the cutting","It raises more tax","It bans emissions"],"a":0,"why":"Trading lets cuts happen where they cost least."},"src":[["Clean Energy Regulator, Safeguard Mechanism baselines","https://www.cleanenergyregulator.gov.au/schemes/safeguard-mechanism/safeguard-baselines"]]},{"title":"Positive externalities: vaccination and education","body":"<p>When you are vaccinated, you also protect people around you. When you finish school, employers, co-workers and taxpayers all benefit. Because individuals ignore these external benefits, they consume too little.</p><ul><li><b>Vaccination:</b> vaccines on the National Immunisation Program are free.</li><li><b>Education:</b> public schools, and subsidised university places with HECS-HELP loans.</li></ul>","fig":"posext","mistakes":["Drawing MSB below MPB for a positive externality."],"check":{"q":"Free childhood vaccines correct a positive externality by:","o":["Raising the price","Lowering the price to raise uptake","Taxing producers"],"a":1,"why":"A lower price moves consumption towards the social optimum."},"src":[["Australian Government, National Immunisation Program","https://www.health.gov.au/our-work/national-immunisation-program"]]},{"title":"Case study: WA’s Containers for Change","body":"<p>WA’s container deposit scheme started in 2020. You get a <b>10-cent refund</b> for each eligible drink container you return. The refund acts like a small subsidy for returning containers, rewarding behaviour that reduces litter and landfill, both negative externalities of drink consumption.</p><p>According to the scheme, more than five billion containers have been kept out of general waste, and over $22.6 million has gone to schools, charities and community groups that collect containers.</p>","mistakes":["Saying the refund corrects a positive externality of drinking."],"check":{"q":"The 10c refund mainly gives people an incentive to:","o":["Buy more drinks","Return containers instead of littering","Pay more tax"],"a":1,"why":"It rewards the behaviour that reduces the externality."},"src":[["Containers for Change WA, About us","https://www.containersforchange.com.au/wa/about-us"]]},{"title":"Choosing the right policy","body":"<div class=\"tw\"><table><thead><tr><th>Policy</th><th>Strength</th><th>Weakness</th></tr></thead><tbody><tr><td>Tax (Pigouvian)</td><td>Firms choose the cheapest way to cut harm; raises revenue</td><td>External cost is hard to measure; can be regressive</td></tr><tr><td>Subsidy</td><td>Encourages good behaviour</td><td>Costs taxpayers; may go to people who would act anyway</td></tr><tr><td>Regulation</td><td>Certain outcome; simple</td><td>No reward for doing better than the rule; enforcement costs</td></tr><tr><td>Tradeable permits</td><td>Cuts happen where they are cheapest</td><td>Complex to design and monitor</td></tr><tr><td>Education campaign</td><td>Cheap; changes preferences</td><td>Slow and uncertain</td></tr></tbody></table></div>","mistakes":["Recommending a policy without evaluating it. \"Evaluate\" needs strengths, weaknesses and a judgement."],"check":{"q":"Which policy gives the most certain cap on total pollution?","o":["An education campaign","A strict regulation or cap","A small subsidy"],"a":1,"why":"A legal limit fixes the maximum."}},{"title":"Climate change: the greatest market failure","body":"<p>Burning fossil fuels and clearing land release greenhouse gases. The cost (warming, more extreme weather, bushfires) falls on people everywhere, including future generations, so it is a global negative externality.</p><p>Carbon dioxide in the atmosphere is about 50% higher than before industrialisation. NASA’s records show 2024 was the warmest year on record. In Australia, BoM and CSIRO report about 1.5 °C of warming since 1910.</p><p>Responses include carbon pricing, emissions limits such as the Safeguard Mechanism, subsidies for renewables and the Paris Agreement. It is hard because no single country can solve it alone (a free-rider problem).</p>","fig":"c_temp","mistakes":["Treating it as a local externality. It is global and long-term."],"check":{"q":"Why is climate change hard for any one country to fix?","o":["Emissions have no cost","Benefits of cutting emissions are shared by all, so countries free ride","It is a positive externality"],"a":1,"why":"Each country bears its own costs but shares the benefits."},"src":[["NASA GISS, Global temperature (GISTEMP)","https://data.giss.nasa.gov/gistemp/"],["Bureau of Meteorology & CSIRO, State of the Climate","https://www.csiro.au/en/research/environmental-impacts/climate-change/state-of-the-climate"]]}]},{"id":"t7","unit":1,"n":7,"title":"Public goods and common resources","lead":"Rivalry and excludability decide whether a market can provide a good. Public goods are under-provided; common resources are overused.","notes":"<ul><li><b>Rival:</b> one person’s use reduces what is left for others.</li><li><b>Excludable:</b> non-payers can be kept out.</li><li><b>Public good</b> (non-rival, non-excludable): people <b>free ride</b>, firms cannot profit, so the market provides too little or none.</li><li><b>Common resource</b> (rival, non-excludable): each user gains the full benefit of extra use but shares the cost of depletion: the <b>tragedy of the commons</b>.</li></ul><div class=\"tw\"><table><thead><tr><th>Problem</th><th>Policy</th><th>Example</th></tr></thead><tbody><tr><td>Public goods</td><td>Government provision funded by taxes</td><td>Defence, street lighting, flood levees</td></tr><tr><td>Public goods</td><td>Government contracts private firms</td><td>Road construction contracts</td></tr><tr><td>Common resources</td><td>Quotas, incl. transferable quotas</td><td>Commercial fishing catch limits</td></tr><tr><td>Common resources</td><td>Licences, permits and fees</td><td>Groundwater extraction licences</td></tr><tr><td>Common resources</td><td>Regulation</td><td>Bag limits, closed seasons, sanctuary zones</td></tr><tr><td>Common resources</td><td>Property rights</td><td>An owner has a reason to conserve</td></tr></tbody></table></div><h5>Club goods and the classic examples</h5><ul><li><b>Club goods</b> are non-rival but excludable: streaming services, a concert, a gym. Your watching doesn’t stop others, but non-payers are kept out.</li><li>The <b>lighthouse</b> is the textbook public good: one ship using its light doesn’t reduce it for others, and no ship can be stopped from seeing it.</li><li>Private goods (a phone, a laptop) are rival and excludable; common resources (fish, the atmosphere) are rival but non-excludable.</li></ul>","figs":[["goods","Figure 7.1 · Classifying goods by rivalry and excludability",""]],"worked":"<p>A town of 10 000 people values a sea wall at $50 each. It costs $300 000.</p><ol><li>Total benefit = $500 000 &gt; cost, so building it is efficient.</li><li>Non-excludable: it protects every home.</li><li>Non-rival: one home’s protection does not reduce another’s.</li><li>Each person’s $50 is tiny next to the cost, so most free ride and no firm can raise $300 000.</li><li><b>Conclusion:</b> the council should build it, funded from rates or taxes.</li></ol>","mcq":[{"q":"A good that is both non-rival and non-excludable is a:","o":["private good.","club good.","public good.","common resource."],"a":2,"why":"That is the definition of a public good."},{"q":"The free rider problem occurs when:","o":["people benefit from a good without paying for it.","the government provides a good free of charge.","a firm charges more than the cost of production.","consumers switch to a cheaper substitute."],"a":0,"why":"Free riders use a non-excludable good without contributing."},{"q":"Which best illustrates the tragedy of the commons?","o":["A firm charging high prices for a patented drug.","A factory polluting a nearby river.","A street light that all residents use.","Overfishing of a species in open ocean waters."],"a":3,"why":"Ocean fish are rival but non-excludable, so they are overused."},{"q":"Which policy most directly reduces the tragedy of the commons in a fishery?","o":["A subsidy to fishing boat owners.","Individual catch quotas.","A price ceiling on fish.","Removing all fishing licences."],"a":1,"why":"Quotas cap total catch so the stock can recover."},{"q":"A paid video streaming subscription is best classified as a:","o":["public good.","common resource.","club good.","private good."],"a":2,"why":"Non-payers are excluded, but one viewer does not use up the stream for others."},{"q":"A paid streaming service is best described as…","o":["A public good","A club good","A common resource","A private good"],"a":1,"why":"Non-rival but excludable by subscription."}],"di":{"stim":"<p>A commercial fish stock off the WA coast (hypothetical). A catch quota was introduced in 2023.</p><div class=\"tw\"><table><thead><tr><th>Year</th><th>Spawning stock ('000 t)</th><th>Annual catch ('000 t)</th></tr></thead><tbody><tr><td>2019</td><td>120</td><td>18</td></tr><tr><td>2020</td><td>112</td><td>20</td></tr><tr><td>2021</td><td>101</td><td>22</td></tr><tr><td>2022</td><td>88</td><td>23</td></tr><tr><td>2023</td><td>80</td><td>15</td></tr><tr><td>2024</td><td>84</td><td>12</td></tr><tr><td>2025</td><td>90</td><td>12</td></tr></tbody></table></div>","items":[{"t":"text","q":"Describe the trend in spawning stock from 2019 to 2022.","marks":2,"key":[["Stock fell every year, from 120 000 t to 88 000 t",1],["While the catch rose from 18 000 t to 23 000 t",1]]},{"t":"calc","q":"Calculate the percentage change in spawning stock from 2019 to 2022.","marks":2,"inputs":[{"label":"Change (%)","ans":-26.7,"tol":0.15}],"work":"(88 − 120) ÷ 120 × 100 = −26.7%."},{"t":"text","q":"Using rivalry and excludability, explain why the stock declined before 2023.","marks":4,"key":[["Rival: each tonne caught leaves less for others",1],["Non-excludable: fishers cannot easily be kept out",1],["Each fisher gains the full benefit but shares the cost of depletion",1],["Result is overfishing, shown by rising catch and falling stock",1]]},{"t":"text","q":"Evaluate the effectiveness of the 2023 quota, referring to the data.","marks":3,"key":[["Catch cut from 23 000 t to 12 000 t",1],["Stock recovered from 80 000 t to 90 000 t",1],["Judgement: effective so far, but still below 2019 levels and needs enforcement",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","q":"Explain why the free market fails to provide public goods. Use an example.","marks":4,"key":[["Non-excludable, so people free ride",1],["Non-rival",1],["Firms cannot profit, so the good is under-provided",1],["Relevant example",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Perth draws much of its water from underground aquifers. Outline two policies to prevent overuse.","marks":4,"key":[["First policy (licences with limits, water pricing, restrictions, education, tradeable rights)",1],["Explained",1],["Second policy",1],["Explained",1]]}]},{"label":"Class review","items":[{"t":"text","q":"Explain why a lighthouse is often used as an example of a public good.","marks":3,"key":[["Non-rival: one ship using it doesn’t reduce use by others",1],["Non-excludable: can’t stop non-payers seeing it",1],["Free riders mean it won’t be provided privately",1]]}]}],"dd":[{"title":"Rivalry and excludability explained","body":"<p>Test any good with two questions:</p><ul><li><b>Is it rival?</b> If I use it, is there less for you? A pie is rival; a radio broadcast is not.</li><li><b>Is it excludable?</b> Can people who don’t pay be stopped? A concert is excludable; a fireworks display over the river is not.</li></ul><p>Some goods change category. An empty freeway is non-rival, but in peak hour it becomes congested and rival.</p>","fig":"goods","mistakes":["Calling anything the government provides a public good. Hospitals are rival and excludable."],"check":{"q":"A beach on a crowded summer day is best described as:","o":["Non-rival and excludable","Rival and non-excludable","Rival and excludable"],"a":1,"why":"Crowding makes it rival, and anyone can walk on."}},{"title":"The free rider problem","body":"<p>If you cannot be charged for something, why pay? A free rider enjoys a good without contributing. When enough people free ride, a private firm cannot earn enough revenue, even if the good is worth more to society than it costs.</p><p>This is why governments provide public goods such as defence, street lighting, flood mitigation and public health campaigns, funded by taxes that everyone must pay.</p>","mistakes":["Saying free riders are people on welfare. It means anyone who benefits without paying."],"check":{"q":"Taxation helps solve the free rider problem because:","o":["It is voluntary","Everyone is required to contribute","It lowers the price of the good"],"a":1,"why":"Compulsory payment stops free riding."}},{"title":"Case study: WA’s demersal fish","body":"<p>Dhufish and pink snapper are demersal (bottom-dwelling) fish that grow slowly and are prized by recreational fishers. They are a common resource: rival (a fish caught is gone) and hard to exclude people from.</p><p>To help the West Coast stocks recover, the WA Government banned boat-based recreational fishing for demersal scalefish in the West Coast bioregion until spring 2027. Land-based fishing can continue outside spawning closures, and new bag and size limits apply in other regions.</p>","fig":"commons","mistakes":["Saying overfishing is caused by greed. The economic cause is the incentive structure of a shared resource."],"check":{"q":"Why does each fisher catch \"too many\" fish?","o":["They gain the full benefit but share the cost of depletion","Fish are excludable","Fish prices are too low"],"a":0,"why":"That gap between private and shared cost drives overuse."},"src":[["DPIRD, West Coast demersal scalefish: information for recreational fishers","https://www.dpird.wa.gov.au/environment-and-sustainability/sustainable-fisheries/west-coast-demersal-scalefish-resource/west-coast-demersal-scalefish--information-for-recreational-fishers"]]},{"title":"Case study: the Gnangara groundwater system","body":"<p>The Gnangara groundwater system north of Perth supplies about <b>40% of Perth’s drinking water</b>. It also waters parks, sports grounds and market gardens, and supports wetlands. Anyone with a licence or garden bore can draw on it, but use by one person lowers the water table for everyone.</p><p>Declining rainfall since the 1970s has reduced recharge. The 2022 Gnangara groundwater allocation plan cuts how much can be taken, aiming to rebalance the system by 2032. About one in four Perth households use groundwater for their gardens.</p>","mistakes":["Forgetting that environmental users (wetlands, bushland) are also affected."],"check":{"q":"Limiting how much each licence holder may pump is an example of:","o":["A subsidy","A quota","A price ceiling"],"a":1,"why":"It caps the quantity each user can take."},"src":[["WA Government (DWER), Managing Perth’s Gnangara groundwater system","https://wa.gov.au/organisation/department-of-water-and-environmental-regulation/managing-perths-gnangara-groundwater-system"]]},{"title":"Policy tools for common resources","body":"<ul><li><b>Quotas:</b> a total allowable catch or extraction limit.</li><li><b>Individual transferable quotas (ITQs):</b> each fisher owns a share of the catch and can trade it, giving an incentive to protect the stock.</li><li><b>Licences and fees:</b> limit the number of users and raise money for management.</li><li><b>Regulation:</b> bag limits, size limits, closed seasons, sanctuary zones.</li><li><b>Property rights:</b> giving an owner responsibility for the resource.</li></ul>","mistakes":["Recommending a policy for a public good when the question is about a common resource."],"check":{"q":"Why do tradeable quotas encourage conservation?","o":["A healthier stock makes each quota share more valuable","They remove all limits","They lower fish prices"],"a":0,"why":"Owners gain when the resource is protected."}}]},{"id":"t8","unit":2,"n":8,"title":"Introduction to macroeconomics","lead":"Total spending, total output and total income are three views of the same flow. The economy grows when injections exceed leakages.","notes":"<ul><li><b>Macroeconomics</b> examines aggregate output, income, spending, employment and prices.</li><li><b>Total spending = total output = total income.</b></li><li><b>Five sectors:</b> households, firms, financial, government, overseas.</li><li><b>Leakages:</b> savings (S), taxation (T), imports (M). <b>Injections:</b> investment (I), government spending (G), exports (X).</li><li><b>Equilibrium:</b> S + T + M = I + G + X.</li></ul><div class=\"tw\"><table><thead><tr><th>If…</th><th>Economic activity…</th></tr></thead><tbody><tr><td>Injections > leakages</td><td>Rises: output, income and employment increase</td></tr><tr><td>Injections < leakages</td><td>Falls</td></tr><tr><td>Injections = leakages</td><td>Stays at equilibrium</td></tr></tbody></table></div><ul><li><b>GDP:</b> the market value of all final goods and services produced in Australia in a period. Excludes intermediate goods, second-hand sales and transfer payments.</li></ul><p class=\"formula\">GDP = C + I + G + (X − M)</p><h5>Notation</h5><div class=\"tw\"><table><thead><tr><th>Symbol</th><th>Meaning</th><th>Symbol</th><th>Meaning</th></tr></thead><tbody><tr><td>Σ</td><td>the sum of (total)</td><td>S</td><td>saving</td></tr><tr><td>O</td><td>output</td><td>T</td><td>taxation</td></tr><tr><td>Y</td><td>income</td><td>M</td><td>imports</td></tr><tr><td>E (or C)</td><td>expenditure / consumption</td><td>I</td><td>investment</td></tr><tr><td>G</td><td>government spending</td><td>X</td><td>exports</td></tr></tbody></table></div><ul><li>In the simple economy, <b>ΣO = ΣY = ΣE</b>: everything produced earns income, and all income is spent on that output. If this holds, there is no tendency to change.</li><li>In the full model, equilibrium requires total leakages to equal total injections: <b>S + T + M = I + G + X</b>.</li></ul><h5>When sectors don’t balance</h5><ul><li><b>Leakages > injections → income falls</b>; <b>leakages < injections → income rises</b>.</li><li><b>S > I</b>: unsold stock builds up, firms cut production and jobs, so income contracts. <b>S < I</b>: inventories run down, production and hiring rise, income expands.</li><li><b>T > G</b> withdraws more than the government injects (income falls); <b>T < G</b> does the opposite.</li><li><b>M > X</b> sends more spending overseas than comes in (income falls); <b>M < X</b> raises income.</li><li>In reality sectors rarely balance: disequilibrium is the normal state, which is why the economy moves in cycles.</li></ul><div class=\"tw\"><table><thead><tr><th>Leakages (withdrawals)</th><th>Injections</th></tr></thead><tbody><tr><td>Household and business saving</td><td>Household borrowing and business investment</td></tr><tr><td>Household and business taxes</td><td>Government purchases and transfer payments</td></tr><tr><td>Imports</td><td>Exports</td></tr></tbody></table></div>","figs":[["flow","Figure 8.1 · Five-sector circular flow of income",""],["c_flowstages","Adding sectors to the circular flow.",""],["c_eqprocess","The equilibrium process after a rise in investment.",""]],"worked":"<p>C = 900, I = 150, G = 200, X = 120, M = 140, S = 130, T = 230 ($ billion).</p><ol><li>GDP = 900 + 150 + 200 + (120 − 140) = <b>$1250 billion</b>.</li><li>Injections = 150 + 200 + 120 = <b>$470 billion</b>.</li><li>Leakages = 130 + 230 + 140 = <b>$500 billion</b>.</li><li>Leakages exceed injections by $30 billion, so activity <b>falls</b> to a new, lower equilibrium.</li></ol>","mcq":[{"q":"In the five-sector circular flow model, which is an injection?","o":["Household saving.","Government spending.","Imports.","Income tax."],"a":1,"why":"Government spending adds to the flow. The others remove income from it."},{"q":"The circular flow is in equilibrium when:","o":["savings equal investment only.","exports equal imports.","government spending equals taxation.","S + T + M = I + G + X."],"a":3,"why":"Equilibrium requires total leakages to equal total injections, not each pair separately."},{"q":"If total leakages exceed total injections, economic activity will:","o":["fall.","rise.","stay the same.","rise, then return to equilibrium."],"a":0,"why":"More is leaving the flow than entering, so spending and output fall."},{"q":"Which transaction is <b>not</b> included in GDP?","o":["A new house built in Perth.","A haircut.","The purchase of a second-hand car.","Iron ore exported to China."],"a":2,"why":"A second-hand car was counted when it was first produced."},{"q":"If exports are $400 billion and imports $450 billion, net exports:","o":["add $50 billion to GDP.","subtract $50 billion from GDP.","add $850 billion to GDP.","have no effect on GDP."],"a":1,"why":"X − M = −$50 billion."},{"q":"Taxation is $50b and government spending is $70b, other sectors balanced. Income will…","o":["Fall","Rise","Stay the same","Fall then rise"],"a":1,"why":"G > T: the government injects more than it withdraws."}],"di":{"stim":"<div class=\"tw\"><table><thead><tr><th>Flow ($ billion)</th><th>Value</th></tr></thead><tbody><tr><td>Consumption (C)</td><td>1250</td></tr><tr><td>Investment (I)</td><td>410</td></tr><tr><td>Government spending (G)</td><td>560</td></tr><tr><td>Exports (X)</td><td>600</td></tr><tr><td>Imports (M)</td><td>580</td></tr><tr><td>Savings (S)</td><td>300</td></tr><tr><td>Taxation (T)</td><td>690</td></tr></tbody></table></div>","items":[{"t":"calc","q":"Calculate GDP using the expenditure approach.","marks":2,"inputs":[{"label":"GDP ($b)","ans":2240,"tol":0}],"work":"1250 + 410 + 560 + (600 − 580) = $2240 billion."},{"t":"calc","q":"Calculate total injections and total leakages.","marks":3,"inputs":[{"label":"Injections ($b)","ans":1570,"tol":0},{"label":"Leakages ($b)","ans":1570,"tol":0}],"work":"Injections = 410 + 560 + 600 = 1570. Leakages = 300 + 690 + 580 = 1570. They are equal, so the economy is in equilibrium."},{"t":"text","q":"A fall in iron ore prices cuts exports by $60 billion. Explain the effect on economic activity.","marks":3,"key":[["Injections fall to $1510b, below leakages",1],["Spending falls; firms cut output and employment; incomes fall",1],["Activity falls to a lower equilibrium",1]]},{"t":"text","q":"Outline one government action to restore the original level of activity.","marks":2,"key":[["Raise government spending by $60b or cut taxes",1],["Explained as adding injections or reducing leakages",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"text","q":"Explain the relationship between total spending, total output and total income.","marks":3,"key":[["Spending by one sector is income to another",1],["Firms produce output to meet spending",1],["Producing output pays income to factor owners",1]]}]},{"label":"Question 2","items":[{"t":"text","q":"Distinguish between an injection and a leakage. Give an Australian example of each.","marks":4,"key":[["Injection adds spending from outside household income",1],["Example (e.g. iron ore exports)",1],["Leakage removes income from the flow",1],["Example (e.g. saving, imported cars)",1]]}]},{"label":"Class review","items":[{"t":"calc","q":"Households spend 80% of any extra income. Investment rises by $200m. Calculate (i) the multiplier and (ii) the eventual rise in income.","marks":2,"inputs":[{"label":"(i) multiplier","ans":5,"tol":0},{"label":"(ii) rise in income ($m)","ans":1000,"tol":0}],"work":"k = 1 ÷ (1 − 0.8) = 5. ΔY = 5 × $200m = $1000m."},{"t":"text","q":"Explain what happens to the level of income when saving is greater than investment.","marks":3,"key":[["Leakage exceeds injection",1],["Unsold inventories build up; firms cut production",1],["Fewer resources hired, so income and spending fall",1]]}]}],"dd":[{"title":"The circular flow identity","body":"<p>Every dollar spent is a dollar of income for someone else. Your $8 on a burger is the café’s revenue, which becomes wages for the cook, rent for the landlord and profit for the owner. That is why, for the whole economy, <b>total spending = total income = total output</b>.</p><p>This identity is the foundation of GDP measurement. The ABS can measure the economy three ways and, in principle, get the same answer.</p>","fig":"flow","mistakes":["Drawing goods and money flowing the same way. They flow in opposite directions."],"check":{"q":"A household pays $50 000 rent to a landlord. In the circular flow, the landlord receives:","o":["A leakage","Factor income","An injection"],"a":1,"why":"Rent is the return to the factor of production land."},"src":[["RBA, Explainer: Economic Growth","https://www.rba.gov.au/education/resources/explainers/economic-growth.html"]]},{"title":"The five sectors in Australia","body":"<div class=\"tw\"><table><thead><tr><th>Sector</th><th>Role</th><th>Australian example</th></tr></thead><tbody><tr><td>Households</td><td>Supply factors; consume</td><td>About 54% of GDP is household consumption</td></tr><tr><td>Firms</td><td>Hire factors; produce</td><td>BHP, a local bakery</td></tr><tr><td>Financial</td><td>Turn savings into loans</td><td>The big four banks, super funds</td></tr><tr><td>Government</td><td>Taxes, spends, transfers</td><td>Commonwealth, WA Government, local councils</td></tr><tr><td>Overseas</td><td>Buys exports, sells imports</td><td>China buys about a third of our exports</td></tr></tbody></table></div>","mistakes":["Saying super contributions are spending. They are saving, a leakage."],"check":{"q":"Which sector channels household saving into business investment?","o":["Government","Financial","Overseas"],"a":1,"why":"Banks and super funds lend or invest savings."},"src":[["ABS, Australian National Accounts: National Income, Expenditure and Product, June 2026","https://www.abs.gov.au/statistics/economy/national-accounts/australian-national-accounts-national-income-expenditure-and-product/latest-release"]]},{"title":"Leakages, injections and the multiplier","body":"<p><b>Leakages</b> (saving, taxes, imports) take spending out of the flow. <b>Injections</b> (investment, government spending, exports) add spending in. When injections exceed leakages, the economy grows; when leakages exceed injections, it contracts.</p><p>An injection has a bigger final effect than its first round, because each recipient spends part of what they earn. This is the <b>multiplier</b>: k = 1 ÷ (1 − MPC), or 1 ÷ MPW where MPW is the share of extra income that leaks out.</p>","fig":"multiplier","case":"In 2020, payments such as JobKeeper kept income flowing through the economy, so spending fell much less than it otherwise would have.","mistakes":["Using MPC on its own instead of 1 − MPC.","Forgetting that imports and tax are leakages in an open economy."],"check":{"q":"If the MPC is 0.75, the multiplier is:","o":["0.75","1.33","4"],"a":2,"why":"1 ÷ (1 − 0.75) = 4."}},{"title":"The three approaches to GDP","body":"<p>The ABS measures GDP in three ways: by <b>production</b> (value added by each industry), <b>income</b> (wages, profits, rent and interest) and <b>expenditure</b> (C + I + G + X − M). Small statistical differences are averaged.</p>","fig":"gdp3","mistakes":["Counting intermediate goods (flour sold to a bakery) as well as the final good, double counting.","Adding imports instead of subtracting them."],"check":{"q":"In GDP = C + I + G + (X − M), imports are subtracted because:","o":["They are produced overseas","They are a tax","They are saved"],"a":0,"why":"GDP measures output produced in Australia."},"src":[["ABS, Australian System of National Accounts: Concepts, Sources and Methods","https://www.abs.gov.au/statistics/detailed-methodology-information/concepts-sources-methods/australian-system-national-accounts-concepts-sources-and-methods"]]},{"title":"What GDP misses","body":"<ul><li><b>Unpaid work:</b> caring, volunteering and housework are not counted.</li><li><b>The hidden economy:</b> cash jobs and illegal activity.</li><li><b>Environmental costs:</b> pollution and resource depletion are not subtracted.</li><li><b>Leisure:</b> working longer hours raises GDP even if wellbeing falls.</li><li><b>Distribution:</b> GDP says nothing about who gets the income.</li><li><b>Quality:</b> better products at the same price barely register.</li></ul>","mistakes":["Saying higher GDP always means higher living standards."],"check":{"q":"A parent leaves paid work to care for a child full-time. Measured GDP:","o":["Rises","Falls","Is unchanged"],"a":1,"why":"Paid output is lost; unpaid care is not counted."}},{"title":"Worked example: the equilibrium process","body":"<p>Start in equilibrium with income Y = 2000. Households spend 80% (C = 1600) and save 20% (S = 400), which equals investment (I = 400).</p><p>Firms raise investment to 600. Injections now exceed leakages by 200, so income grows. Each round, 80% of the extra income is spent and 20% saved: Y goes 2000 → 2200 → 2360 → 2488 → … until saving rises to 600 again.</p><p>New equilibrium: Y = 3000. A 200 rise in investment raised income by 1000, so the multiplier is 1000 ÷ 200 = <b>5</b> = 1 ÷ (1 − 0.8).</p>","fig":"c_eqprocess","mistakes":["Thinking income stops rising after one round.","Forgetting that saving rises as income rises until S = I again."],"check":{"q":"If MPC = 0.75 and investment rises by 100, equilibrium income rises by…","o":["75","133","400"],"a":2,"why":"Multiplier = 1 ÷ 0.25 = 4; 4 × 100 = 400."}},{"title":"COVID-19 and the circular flow","body":"<p>In 2020 lockdowns and border closures hit every sector at once:</p><ul><li><b>Households</b>: spending collapsed and saving jumped. The household saving ratio rose above 20%, a record.</li><li><b>Firms</b>: sales and investment fell; many stood workers down.</li><li><b>Government</b>: a huge injection. JobKeeper wage subsidies alone cost about $89 billion, plus extra welfare payments.</li><li><b>Overseas</b>: international tourism and student arrivals stopped; trade was disrupted.</li></ul><p>Leakages (saving) rose while private injections fell, so government spending was used to stop income falling further.</p>","mistakes":["Saying the government sector caused the recession. Its spending cushioned it."],"check":{"q":"In 2020, the jump in household saving was…","o":["An injection that raised income","A leakage that reduced spending","Not part of the circular flow"],"a":1,"why":"Saving is a leakage from the spending stream."},"src":[["ANAO, Administration of the JobKeeper scheme","https://www.anao.gov.au/work/performance-audit/administration-the-jobkeeper-scheme"]]}]},{"id":"t9","unit":2,"n":9,"title":"Economic growth","lead":"Australia's growth fell to 1.3% in 2024-25, its weakest year outside COVID since the early 1990s, before recovering to 2.4% in 2025-26.","notes":"<p class=\"formula\">Growth (%) = (Real GDP<sub>yr2</sub> − Real GDP<sub>yr1</sub>) ÷ Real GDP<sub>yr1</sub> × 100</p><div class=\"tw\"><table><thead><tr><th>Measure</th><th>What it shows</th></tr></thead><tbody><tr><td>Nominal GDP</td><td>Output at current prices; rises with inflation</td></tr><tr><td>Real GDP</td><td>Output adjusted for inflation (chain volume measure)</td></tr><tr><td>Real GDP per capita</td><td>Real GDP ÷ population; a better guide to living standards</td></tr></tbody></table></div><h4>GDP as a measure of welfare</h4><ul><li>Excludes unpaid housework, caring and volunteering, and the cash economy.</li><li>Ignores income distribution, leisure, environmental damage and resource depletion.</li><li>Counts defensive spending (disaster clean-up) as a gain.</li><li>The Australian Government’s <i>Measuring What Matters</i> framework tracks wellbeing alongside GDP.</li></ul><h4>Determinants</h4><ul><li><i>Supply side:</i> labour quantity and quality, capital investment, natural resources, technology and productivity, enterprise.</li><li><i>Demand side:</i> C, I, G and (X − M).</li></ul><div class=\"tw\"><table><thead><tr><th>Benefits of growth</th><th>Costs of growth</th></tr></thead><tbody><tr><td>Higher material living standards</td><td>Environmental damage, resource depletion</td></tr><tr><td>More jobs</td><td>Inflationary pressure</td></tr><tr><td>Higher tax revenue</td><td>Inequality can widen</td></tr><tr><td>More investment</td><td>Structural unemployment for some</td></tr></tbody></table></div><h5>Macroeconomic objectives</h5><div class=\"tw\"><table><thead><tr><th>Objective</th><th>Benchmark</th></tr></thead><tbody><tr><td>Price stability</td><td>Inflation of 2–3% a year (RBA target)</td></tr><tr><td>Full employment</td><td>The lowest unemployment rate consistent with stable inflation (no fixed number; the RBA judges it)</td></tr><tr><td>Sustainable economic growth</td><td>Roughly 2.5–3% a year in real GDP over the long run</td></tr></tbody></table></div><ul><li>% change in GDP = (GDP<sub>year 2</sub> − GDP<sub>year 1</sub>) ÷ GDP<sub>year 1</sub> × 100.</li><li><b>Real GDP per capita</b> (real GDP ÷ population) is the best simple guide to average living standards.</li></ul><h5>Is GDP still worth using?</h5><ul><li>GDP also understates gains in working conditions since WWII (safety, parental leave) and misses the gig and cash economy.</li><li>It remains the “least-worst” measure: easy to calculate, consistent over time and closely linked to most wellbeing measures. Alternatives include the HDI, the OECD Better Life Index and the World Happiness Report.</li></ul><h5>What drives growth</h5><ul><li><b>Efficiency</b>: technical (combining resources productively), allocative (resources where they are valued most), dynamic (adapting over time).</li><li>Population and labour force growth; capital per worker; technology and R&D; human capital (skills and experience); natural resources (central to WA’s growth); capacity to change; willingness to trade (comparative advantage).</li><li><b>Capital widening</b>: capital grows in line with the workforce. <b>Capital deepening</b>: capital per worker rises, lifting productivity.</li><li><b>Labour productivity</b> = real GDP ÷ hours worked. Multifactor productivity measures how well labour and capital are used together.</li></ul><h5>Sustainable growth</h5><ul><li>Growth needs to outpace population and workforce growth to lift living standards, but growth that is too fast can pull in imports and add to inflation and interest rates.</li><li>The goal is <b>sustainable</b> growth that balances economic and community needs, e.g. the environmental costs of a megacity compared with Perth.</li></ul>","figs":[["gdp","Figure 9.1 · ABS, Australian National Accounts (annual growth as reported soon after each year)","<p>Strong in 2021-22 as the economy reopened; slowed sharply in 2023-24 and 2024-25 as higher interest rates and cost-of-living pressures cut spending; recovered to 2.4% in 2025-26, but real GDP per capita rose only 0.8%.</p>"],["apf","Figure 9.2 · Aggregate Production Function","<p>Growth from more inputs (A to B) needs more workers or hours. Growth from productivity (A to C) produces more from the same inputs and is the only lasting way to raise living standards.</p>"],["c_ozland","Nominal vs real GDP in Ozland.",""],["c_capital","Capital widening and deepening.",""],["c_rule70","Why growth rates compound.",""],["c_hdi","A broader measure of progress.",""]],"worked":"<p>Real GDP rises from $2600b to $2652b; population from 27.0m to 27.4m.</p><ol><li>Growth = (2652 − 2600) ÷ 2600 × 100 = <b>2.0%</b>.</li><li>Per capita yr 1 = <b>$96 296</b>; yr 2 = <b>$96 788</b>.</li><li>Per capita growth = <b>0.51%</b>.</li><li>Most of the extra output was absorbed by population growth.</li></ol>","mcq":[{"q":"Real GDP differs from nominal GDP because real GDP:","o":["includes the value of exports.","is measured per person.","is adjusted for changes in the price level.","excludes government spending."],"a":2,"why":"Real GDP removes the effect of inflation."},{"q":"Real GDP rises 2.4% and population grows 1.6%. Real GDP per capita rises about:","o":["0.8%.","1.6%.","2.4%.","4.0%."],"a":0,"why":"2.4% − 1.6% ≈ 0.8%."},{"q":"Which is a limitation of GDP as a measure of welfare?","o":["It is measured every quarter.","It includes exports of services.","It is adjusted for inflation.","It excludes unpaid household work."],"a":3,"why":"Non-market work adds to wellbeing but is not counted."},{"q":"An upward shift of the APF is caused by:","o":["an increase in the number of workers.","better technology that raises labour productivity.","a rise in the price level.","a fall in the unemployment rate."],"a":1,"why":"More workers move the economy along the APF; productivity shifts it up."},{"q":"Which is a cost of economic growth?","o":["Environmental degradation.","Higher government tax revenue.","Lower unemployment.","Higher material living standards."],"a":0,"why":"The others are benefits."},{"q":"Real GDP rises from $600b to $630b. The growth rate is…","o":["3%","5%","30%","4.8%"],"a":1,"why":"(630 − 600) ÷ 600 × 100 = 5%."},{"q":"Giving each worker more and better equipment is called…","o":["Capital widening","Capital deepening","Allocative efficiency","Depreciation"],"a":1,"why":"Capital per worker rises."}],"di":{"stim":"<p>Use Figure 9.1 and this statement: <i>In 2025-26, real GDP grew 2.4% while real GDP per capita grew 0.8% (ABS).</i></p>","items":[{"t":"text","q":"Identify the financial year with the weakest growth shown in Figure 9.1.","marks":1,"key":[["2024-25 (1.3%)",1]]},{"t":"text","q":"Describe the trend in Australia's real GDP growth from 2021-22 to 2025-26.","marks":3,"key":[["Fell from 3.6% in 2021-22",1],["To 1.3% in 2024-25, the weakest outside COVID since the early 1990s",1],["Recovered to 2.4% in 2025-26",1]]},{"t":"text","q":"Explain what the gap between real GDP growth and per capita growth in 2025-26 indicates about living standards.","marks":3,"key":[["Population grew about 1.6%",1],["Most extra output was shared among more people",1],["Average material living standards rose only slightly",1]]},{"t":"text","q":"Account for the slowdown in growth in 2023-24 and 2024-25.","marks":3,"key":[["Higher interest rates reduced spending",1],["High inflation cut real incomes",1],["Weak household consumption or investment",1]]},{"t":"text","diagram":true,"q":"Using an APF diagram, demonstrate how higher labour productivity affects growth.","marks":4,"key":[["Axes labelled",1],["APF shifts up from APF1 to APF2",1],["Same inputs now produce more output",1],["Explains higher growth and living standards",1]]}]},"sa":[{"label":"Question 1","items":[{"t":"calc","q":"Nominal GDP rises from $2700b to $2830b while prices rise 3%. Calculate approximate real growth.","marks":3,"inputs":[{"label":"Real growth (%)","ans":1.8,"tol":0.1}],"work":"Nominal growth = (2830 − 2700) ÷ 2700 × 100 = 4.81%. Real ≈ 4.81% − 3.0% ≈ 1.8%."}]},{"label":"Question 2","items":[{"t":"text","q":"Evaluate real GDP as a measure of economic welfare in Australia.","marks":5,"key":[["Strength: consistent, comparable measure of output",1],["Second strength or development",1],["Limitation: non-market activity or distribution",1],["Limitation: environment, leisure or cash economy",1],["Supported judgement",1]]}]},{"label":"Class review","items":[{"t":"calc","q":"Real GDP grew from $650.4b to $664.2b. Calculate the growth rate (to 1 decimal place).","marks":2,"inputs":[{"label":"Growth (%)","ans":2.1,"tol":0.05}],"work":"(664.2 − 650.4) ÷ 650.4 × 100 = 2.1%."},{"t":"text","q":"Outline two limitations of GDP as a measure of living standards.","marks":4,"key":[["First limitation named",1],["Explained",1],["Second limitation named",1],["Explained",1]]},{"t":"text","q":"Distinguish between capital widening and capital deepening.","marks":2,"key":[["Widening: capital grows in proportion to the workforce",1],["Deepening: capital per worker increases",1]]}]}],"dd":[{"title":"Nominal versus real GDP","body":"<p>Nominal GDP is measured in current prices, so it rises when prices rise even if output does not. Real GDP removes inflation by using the prices of a base year. Real GDP is what measures economic growth.</p><p>Quick approximation: real growth ≈ nominal growth − inflation.</p>","mistakes":["Calling nominal GDP growth \"economic growth\"."],"check":{"q":"Nominal GDP grows 6% and prices rise 4%. Real growth is about:","o":["10%","2%","1.5%"],"a":1,"why":"6% − 4% ≈ 2%."},"src":[["RBA, Explainer: Economic Growth","https://www.rba.gov.au/education/resources/explainers/economic-growth.html"]]},{"title":"Per capita GDP and population","body":"<p>Australia’s population grows by around 1.5–2.5% a year, mostly through migration. GDP can grow simply because there are more people working and spending. Dividing GDP by population gives <b>GDP per capita</b>, a better guide to the average person’s living standard.</p>","case":"Real GDP grew about 1.3% in 2024-25 while the population grew faster, so GDP per capita fell (see the per capita recession deep dive in Topic 12).","mistakes":["Assuming GDP growth means each person is better off."],"check":{"q":"GDP grows 2% and the population grows 2.5%. GDP per capita:","o":["Rises","Falls","Stays the same"],"a":1,"why":"Output per person falls by about 0.5%."},"src":[["ABS, Australian National Accounts: National Income, Expenditure and Product, June 2026","https://www.abs.gov.au/statistics/economy/national-accounts/australian-national-accounts-national-income-expenditure-and-product/latest-release"]]},{"title":"Productivity: the engine of living standards","body":"<p>Productivity is output per unit of input. Over the long run, it is the main reason living standards rise. It grows through more capital per worker (capital deepening), better skills, and better ideas and organisation (multifactor productivity).</p><p>The Productivity Commission reports that market-sector multifactor productivity grew 1.6% a year from 1994-95 to 2003-04, after the 1980s and 90s reforms, but averaged only 0.3% a year over the last 20 years.</p>","fig":"prodtree","mistakes":["Confusing productivity with production. More workers raises production, not productivity."],"check":{"q":"Which raises labour productivity?","o":["Hiring more workers with the same equipment","Giving each worker better software","Working longer hours"],"a":1,"why":"Better tools raise output per hour."},"src":[["Productivity Commission, Annual Productivity Bulletin 2025","https://www.pc.gov.au/ongoing/productivity-insights/bulletin-2025"]]},{"title":"Benefits, costs and sustainable growth","body":"<div class=\"tw\"><table><thead><tr><th>Benefits of growth</th><th>Costs of growth</th></tr></thead><tbody><tr><td>Higher incomes and more choice</td><td>Pollution and emissions</td></tr><tr><td>More jobs</td><td>Depletion of resources (water, fish, minerals)</td></tr><tr><td>More tax revenue for services</td><td>Congestion and housing pressure</td></tr><tr><td>Less poverty</td><td>Inequality if gains are unevenly shared</td></tr></tbody></table></div><p><b>Sustainable growth</b> meets today’s needs without reducing the ability of future generations to meet theirs.</p>","mistakes":["Only listing costs or only listing benefits in a \"discuss\" question."],"check":{"q":"Which is an environmental cost of economic growth?","o":["Rising wages","Falling groundwater levels","Higher tax revenue"],"a":1,"why":"Overuse of shared resources harms the environment."}},{"title":"Measuring What Matters","body":"<p>In July 2023, Treasury released <i>Measuring What Matters</i>, Australia’s first national wellbeing framework. It tracks 50 indicators across five themes: <b>healthy, secure, sustainable, cohesive and prosperous</b>. Examples include life expectancy, feeling safe, emissions, trust in others, and income.</p><p>The aim is to look beyond GDP, so that governments see how Australians are actually faring.</p>","mistakes":["Saying it replaces GDP. It sits alongside it."],"check":{"q":"Which theme would \"trust in others\" belong to?","o":["Prosperous","Cohesive","Sustainable"],"a":1,"why":"Trust measures how connected society is."},"src":[["Treasury, Measuring What Matters","https://treasury.gov.au/policy-topics/measuring-what-matters"]]},{"title":"Australia’s growth story, 2021–26","body":"<div class=\"tw\"><table><thead><tr><th>Year</th><th>Real GDP growth</th><th>What happened</th></tr></thead><tbody><tr><td>2021-22</td><td>3.6%</td><td>Rebound from COVID lockdowns</td></tr><tr><td>2022-23</td><td>3.1%</td><td>Strong spending; rate rises begin</td></tr><tr><td>2023-24</td><td>1.5%</td><td>Higher rates and prices squeeze households</td></tr><tr><td>2024-25</td><td>1.3%</td><td>Slowest growth outside COVID in decades</td></tr><tr><td>2025-26</td><td>2.4%</td><td>Recovery as real incomes improve</td></tr></tbody></table></div>","fig":"gdp","mistakes":["Describing a fall in the growth rate as a fall in GDP. GDP still grew."],"check":{"q":"Growth falls from 3.1% to 1.5%. Real GDP:","o":["Fell","Grew more slowly","Stayed constant"],"a":1,"why":"A positive growth rate means GDP is still rising."},"src":[["ABS, Australian National Accounts: National Income, Expenditure and Product, June 2026","https://www.abs.gov.au/statistics/economy/national-accounts/australian-national-accounts-national-income-expenditure-and-product/latest-release"]]},{"title":"Worked example: real vs nominal GDP in Ozland","body":"<div class=\"tw\"><table><thead><tr><th></th><th>Pizzas (Q × P)</th><th>Surfboards (Q × P)</th><th>Nominal GDP</th><th>Real GDP (Year 1 prices)</th></tr></thead><tbody><tr><td>Year 1</td><td>2000 × $10</td><td>100 × $800</td><td>$100 000</td><td>$100 000</td></tr><tr><td>Year 2</td><td>2100 × $10</td><td>105 × $800</td><td>$105 000</td><td>$105 000</td></tr><tr><td>Year 3</td><td>2100 × $11</td><td>105 × $815</td><td>$108 675</td><td>$105 000</td></tr></tbody></table></div><p>From Year 2 to Year 3, nominal GDP grew 3.5% but real GDP did not grow at all: only prices changed. Economic growth means growth in <b>real</b> output.</p>","fig":"c_ozland","mistakes":["Calling a rise in nominal GDP “economic growth”."],"check":{"q":"Nominal GDP rises but real GDP is unchanged. What happened?","o":["Output rose","Only prices rose","Population fell"],"a":1,"why":"Real GDP removes price changes."}},{"title":"The rule of 70","body":"<p>To estimate how long it takes something growing at a steady rate to double, divide 70 by the growth rate. At 2% a year, real GDP doubles in about 35 years; at 3.5%, about 20 years.</p><p>This shows why small differences in growth matter: over a working life, an economy growing at 3% ends up far richer than one growing at 1.5%.</p>","fig":"c_rule70","mistakes":["Dividi
